  }

  /* 블록 → 마크다운 본문 줄들. h 는 소제목 단계(2 = "##").
     기록 한 편을 그대로 뽑을 때와, 여러 편을 한 권으로 엮을 때 같이 쓴다. */
  // base: 사진·첨부의 상대경로 앞에 붙일 폴더 (엮어내기에서 쓴다).
  // 한 편짜리 .md 는 자료와 같은 폴더에 있으므로 base 없이 파일 이름만 쓴다.
  function blocksToMarkdown(n, h, base) {
    var hh = new Array((h || 2) + 1).join("#");
    var pre = base || "";
    var L = [];
    (n.blocks || []).forEach(function (b) {
      if (b.kind === "text") {
        if (b.text && b.text.trim()) { L.push(b.text.trim()); L.push(""); }
      } else if (b.kind === "heading") {
        if (b.text && b.text.trim()) { L.push(hh + " " + b.text.trim()); L.push(""); }
      } else if (b.kind === "quote") {
        if (b.text && b.text.trim()) {
          /* 출처 갈래는 옵시디언 «콜아웃» 첫 줄로 남긴다 · [!ai]- 는 옵시디언에서도 접혀서 열린다 */
          var co = quoteCallout(b);
          if (co) L.push("> " + co);
          b.text.trim().split("\n").forEach(function (line) { L.push("> " + line); });
          L.push("");
        }
      } else if (b.kind === "todo") {
        /* 마크다운의 «할 일» 표기 그대로 · 옵시디언·깃허브·노션이 다 알아본다 */
        var any = false;
        (b.items || []).forEach(function (it) {
          if (!it.t || !it.t.trim()) return;
          any = true;
          L.push("- [" + (it.done ? "x" : " ") + "] " + it.t.trim());
        });
        if (any) L.push("");
      } else if (b.kind === "list") {
        var any2 = false, num = [0, 0, 0];
        (b.items || []).forEach(function (it) {
          if (!it.t || !it.t.trim()) return;
          any2 = true;
          var d = Math.max(0, Math.min(2, it.d || 0));
          var pad = new Array(d * 2 + 1).join(" ");
          if (b.ordered) {
            num[d]++; for (var q = d + 1; q < 3; q++) num[q] = 0;
            L.push(pad + num[d] + ". " + it.t.trim());
          } else {
            L.push(pad + "- " + it.t.trim());
          }
        });
        if (any2) L.push("");
      } else if (b.kind === "table") {
        /* 파이프 표 · 깃허브·옵시디언이 다 알아본다.
           칸 안의 | 는 \\| 로 막아야 표가 거기서 갈라지지 않는다. */
        var cells = function (a) {
          return "| " + a.map(function (c) {
            return String(c == null ? "" : c).replace(/\|/g, "\\|").replace(/\n/g, " ").trim();
          }).join(" | ") + " |";
        };
        var hd = (b.head || []);
        var body2 = (b.rows || []).filter(function (r) {
          return r.some(function (c) { return c && String(c).trim(); });
        });
        if (hd.length && (hd.some(function (h) { return h && h.trim(); }) || body2.length)) {
          L.push(cells(hd));
          L.push("|" + hd.map(function () { return " --- "; }).join("|") + "|");
          body2.forEach(function (r) { L.push(cells(r)); });
          L.push("");
        }
      } else if (b.kind === "fold") {
        // 마크다운에 접이식은 없다 · <details> 를 그대로 쓴다 (마크다운은 HTML 을 품는다)
        if ((b.title && b.title.trim()) || (b.text && b.text.trim())) {
          L.push("<details" + (b.open ? " open" : "") + ">");
          L.push("<summary>" + (b.title || "펼쳐 보기").trim() + "</summary>");
          L.push("");
          if (b.text && b.text.trim()) { L.push(b.text.trim()); L.push(""); }
          L.push("</details>");
          L.push("");
        }
      } else if (b.kind === "code") {
        if (b.text && b.text.trim()) {
          /* 코드 안에 ``` 이 들어 있으면 울타리가 거기서 끊긴다. 그럴 땐 울타리를 늘린다. */
          var fence = "```";
          while (b.text.indexOf(fence) >= 0) fence += "`";
          L.push(fence + (b.lang || ""));
          L.push(b.text.replace(/\s+$/, ""));
          L.push(fence);
          L.push("");
        }
      } else if (b.kind === "divider") {
        L.push("---"); L.push("");
      } else if (b.kind === "image") {
        L.push("![" + (b.caption || b.original || "") + "](" + pre + mediaPath(b) + ")");
        if (b.caption) L.push("*" + b.caption + "*");
        if (b.fileId) L.push("<!-- drive: " + driveLink(b.fileId) + " -->");
        L.push("");
      } else if (b.kind === "file") {
        var line = "📎 [" + (b.caption || b.name || b.original) + "](" + (b.fileId ? driveLink(b.fileId) : pre + mediaPath(b)) + ")";
        if (b.original && b.name && b.original !== b.name) line += " <!-- 원본: " + b.original + " -->";
        L.push(line); L.push("");
      } else if (b.kind === "link") {
        if (b.url) { L.push("🔗 [" + (b.label || b.url) + "](" + b.url + ")"); L.push(""); }
      } else if (b.kind === "embed") {
        // 마크다운은 HTML 을 그대로 품는다 (옵시디언에서도 보임)
        if (b.code && b.code.trim()) { L.push(b.code.trim()); L.push(""); }
      }
    });
    return L;
  }

  function buildMarkdown(n) {
    var media = (n.blocks || []).filter(function (b) { return b.kind === "image" || b.kind === "file"; });
    var links = (n.blocks || []).filter(function (b) { return b.kind === "link"; });
    var L = [];
    L.push("---");
    L.push("id: " + n.id);
    L.push("type: " + typeOf(n.type).label);
    L.push("title: " + yq(n.title));
    // 파일명이 "{날짜}_{유형}_{제목}.md" 라서, 별칭이 없으면 옵시디언이 [[제목]] 을 못 찾습니다
    L.push("aliases: [" + [n.title, n.id].filter(Boolean).map(yq).join(", ") + "]");
    L.push("tags: [" + (n.tags || []).map(yq).join(", ") + "]");
    L.push("created: " + isoDate(n.createdAt));
    L.push("updated: " + isoDate(n.updatedAt));
    if (links.length) {
      L.push("links:");
      links.forEach(function (b) { L.push("  - url: " + yq(b.url)); L.push("    label: " + yq(b.label || "")); });
    }
    if (media.length) {
      L.push("attachments:");
      media.forEach(function (b) {
        L.push("  - file: " + yq(b.name || ""));
        L.push("    original: " + yq(b.original || ""));
        L.push("    mime: " + yq(b.mime || ""));
        if (b.fileId) L.push("    driveId: " + yq(b.fileId));
      });
    }
    L.push("---");
    L.push("");
    L.push("# " + (n.title || "(제목 없음)"));
    L.push("");

    blocksToMarkdown(n, 2).forEach(function (line) { L.push(line); });

    // 관계망에서 이어준 연결 · 옵시디언에서도 링크로 읽힌다
    var rels = (n.relations || []).map(function (r) {
      var t = null;
      entries.forEach(function (x) { if (x.id === r.to) t = x; });
      return t ? { title: t.title, label: r.label || "" } : null;
    }).filter(Boolean);
    if (rels.length) {
      L.push("## 연결"); L.push("");
      rels.forEach(function (r) { L.push("- [[" + r.title + "]]" + (r.label ? " · " + r.label : "")); });
      L.push("");
    }
    return L.join("\n").replace(/\n{3,}/g, "\n\n");
  }

  /* ---------- 사람이 읽기 좋은 형식 (구글 문서 / HTML) ---------- */
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  // 사람이 읽는 문서에서는 [[제목]] 대괄호를 벗겨 준다
  function plainLinks(s) {
    return String(s == null ? "" : s).replace(/\[\[([^\[\]|]+?)(?:\|([^\[\]]*?))?\]\]/g, function (m, a, b) {
      return (b && b.trim()) ? b.trim() : a.trim();
    });
  }
  /* 블록 → HTML 조각들. h 는 소제목 단계(2 = h2). 한 편 뽑기와 엮어내기에서 같이 쓴다. */
  function blocksToHtml(n, h) {
    var hn = "h" + (h || 2);
    var H = [];
    (n.blocks || []).forEach(function (b) {
      if (b.kind === "text") {
        plainLinks(b.text).split(/\n{2,}/).forEach(function (para) {
          if (para.trim()) H.push("<p>" + esc(para).replace(/\n/g, "<br />") + "</p>");
        });
      } else if (b.kind === "heading") {
        if (b.text) H.push("<" + hn + ">" + esc(plainLinks(b.text)) + "</" + hn + ">");
      } else if (b.kind === "quote") {
        if (b.text) {
          var qi = esc(plainLinks(b.text)).replace(/\n/g, "<br />");
          var qr = QUOTE_ROLES[b.role || ""];
          if (b.role === "ai") {
            H.push('<details><summary>🤖 AI 답변' + (b.src ? " · " + esc(b.src) : "") + '</summary><blockquote><p>' + qi + "</p></blockquote></details>");
          } else {
            H.push('<blockquote>' + (b.role && qr ? '<p><b>' + qr.icon + " " + qr.label + (b.src ? " · " + esc(b.src) : "") + '</b></p>' : "") + '<p>' + qi + "</p></blockquote>");
          }
        }
      } else if (b.kind === "todo") {
        /* ⚠️ 새 갈래를 만들면 «내보내는 길» 세 곳에도 마저 적어야 한다
           (마크다운 blocksToMarkdown · HTML 여기 · 웹 공유 buildSharePacket).
           안 적으면 표가 든 수업 계획을 보냈는데 받는 쪽에는 표가 통째로 없다. */
        var lis = (b.items || []).filter(function (it) { return it.t && it.t.trim(); });
        if (lis.length) {
          H.push('<ul style="list-style:none;padding-left:0">' + lis.map(function (it) {
            return '<li>' + (it.done ? "☑" : "☐") + " " +
              (it.done ? "<s>" + esc(plainLinks(it.t)) + "</s>" : esc(plainLinks(it.t))) + "</li>";
          }).join("") + "</ul>");
        }
      } else if (b.kind === "list") {
        var li2 = (b.items || []).filter(function (it) { return it.t && it.t.trim(); });
        if (li2.length) {
          var tag = b.ordered ? "ol" : "ul";
          H.push("<" + tag + ">" + li2.map(function (it) {
            var pad = (it.d || 0) ? ' style="margin-left:' + ((it.d || 0) * 18) + 'px"' : "";
            return "<li" + pad + ">" + esc(plainLinks(it.t)) + "</li>";
          }).join("") + "</" + tag + ">");
        }
      } else if (b.kind === "code") {
        if (b.text && b.text.trim()) H.push("<pre><code>" + esc(b.text) + "</code></pre>");
      } else if (b.kind === "table") {
        var rows2 = (b.rows || []).filter(function (r) {
          return (r || []).some(function (c) { return c && String(c).trim(); });
        });
        var hasHead = (b.head || []).some(function (x) { return x && x.trim(); });
        if (hasHead || rows2.length) {
          var T = ['<table border="1" cellpadding="6" cellspacing="0" style="border-collapse:collapse">'];
          if (hasHead) T.push("<tr>" + (b.head || []).map(function (x) { return "<th>" + esc(plainLinks(x || "")) + "</th>"; }).join("") + "</tr>");
          rows2.forEach(function (r) {
            T.push("<tr>" + r.map(function (c) { return "<td>" + esc(plainLinks(c || "")) + "</td>"; }).join("") + "</tr>");
          });
          T.push("</table>");
          H.push(T.join(""));
        }
      } else if (b.kind === "fold") {
        if ((b.title && b.title.trim()) || (b.text && b.text.trim())) {
          H.push("<details" + (b.open ? " open" : "") + "><summary>" +
            esc(plainLinks(b.title || "펼쳐 보기")) + "</summary><p>" +
            esc(plainLinks(b.text || "")).replace(/\n/g, "<br />") + "</p></details>");
        }
      } else if (b.kind === "divider") {
        H.push("<hr />");
      } else if (b.kind === "image") {
        var cap = b.caption || b.original || "";
        if (b.fileId) {
          H.push('<p><a href="' + driveLink(b.fileId) + '">🖼️ ' + esc(cap || b.name) + "</a></p>");
        } else {
          H.push("<p>🖼️ " + esc(cap || b.name || "") + "</p>");
        }
      } else if (b.kind === "file") {
        var nm = b.caption || b.name || b.original;
        H.push('<p>📎 ' + (b.fileId ? '<a href="' + driveLink(b.fileId) + '">' + esc(nm) + "</a>" : esc(nm)) + "</p>");
      } else if (b.kind === "link") {
        if (b.url) H.push('<p>🔗 <a href="' + esc(b.url) + '">' + esc(b.label || b.url) + "</a></p>");
      } else if (b.kind === "embed") {
        if (b.code && b.code.trim()) H.push(b.code.trim());
      }
    });
    return H;
  }

  function buildHtml(n) {
    var t = typeOf(n.type);
    var H = [];
    H.push('<h1>' + esc(n.title || "(제목 없음)") + '</h1>');
    var meta = [t.icon + " " + t.label, formatDate(n.createdAt)];
    if ((n.tags || []).length) meta.push(n.tags.map(function (x) { return "#" + x; }).join(" "));
    H.push('<p><i>' + esc(meta.join("  ·  ")) + '</i></p>');
    H.push("<hr />");

    blocksToHtml(n, 2).forEach(function (x) { H.push(x); });

    var rels = (n.relations || []).map(function (r) {
      var tt = null;
      entries.forEach(function (x) { if (x.id === r.to) tt = x; });
      return tt ? { title: tt.title, label: r.label || "" } : null;
    }).filter(Boolean);
    if (rels.length) {
      H.push("<h2>연결</h2><ul>");
      rels.forEach(function (r) { H.push("<li>" + esc(r.title) + (r.label ? " · " + esc(r.label) : "") + "</li>"); });
      H.push("</ul>");
    }
    return htmlPage(esc(n.title || "(제목 없음)"), H.join("\n"));
  }
  // 브라우저로 바로 열어 읽을 수 있게 서식을 입힌 한 장짜리 HTML

     뽑아낸 자료만 파란 업무 문서로 나와, 같은 데서 나온 것으로 안 보인다.
     여기 값은 view.html 의 것과 «같은 팔레트» 다. 한쪽을 고치면 저쪽도 맞춰야 한다. */
  var EXPORT_TOKENS = [
    ":root{--ink:#1c2333;--soft:#5b6479;--line:#e3e7ef;--brand:#3f5bd9;--bg:#f6f7fb;--panel:#fff;--radius:14px;--bw:1px;",

    '[data-theme="play"]{--radius:18px;--bw:3.5px;--font-title:"Jua",var(--font-body)}',

  // 구글 문서로 변환 저장 (mimeType 은 문서, 올리는 본문은 HTML)

  /* =========================================================

  function slimBlock(b) {
    var o = { id: b.id, kind: b.kind };
    if (b.kind === "text" || b.kind === "heading" || b.kind === "quote") o.text = b.text || "";
    if (b.kind === "quote") { o.role = b.role || ""; o.src = b.src || ""; }   // 누가 말한 것인지
    if (b.kind === "todo") o.items = (b.items || []).map(function (it) { return { t: it.t || "", done: !!it.done }; });
    if (b.kind === "list") { o.ordered = !!b.ordered; o.items = (b.items || []).map(function (it) { return { t: it.t || "", d: it.d || 0 }; }); }
    if (b.kind === "code") { o.lang = b.lang || ""; o.text = b.text || ""; }
    if (b.kind === "table") {
      o.head = (b.head || []).map(function (x) { return x || ""; });
      o.rows = (b.rows || []).map(function (r) { return (r || []).map(function (x) { return x || ""; }); });
    }
    if (b.kind === "fold") { o.title = b.title || ""; o.text = b.text || ""; o.open = !!b.open; }
    if (b.kind === "link") { o.url = b.url || ""; o.label = b.label || ""; }
    if (b.kind === "embed") { o.code = b.code || ""; o.height = b.height || 360; }
    if (b.kind === "image" || b.kind === "file") {
      o.original = b.original || ""; o.mime = b.mime || ""; o.size = b.size || 0;
      o.name = b.name || ""; o.caption = b.caption || ""; o.fileId = b.fileId || null;
    }
    return o;
  }

      relations: (n.relations || []).map(function (r) { return { to: r.to, label: r.label || "" }; }),
      pinned: !!n.pinned,

      trashed: !!n.trashed, trashedAt: n.trashedAt || 0,

  /* ---- 옛 이름(PKEMS-…)으로 남아 있는 파일 이어받기 ----
     새로 만들지 않는다. 이미 있는 파일의 «이름만» 바꾼다.
     파일 ID 가 그대로라 안에 든 것은 한 글자도 안 움직인다.
     이름 바꾸기가 실패해도 그 파일을 그대로 쓴다. 기록을 못 보는 일은 없어야 한다. */
  function renameFile(id, name) {
    return driveJson("https://www.googleapis.com/drive/v3/files/" + id + "?fields=id&supportsAllDrives=true", {
      method: "PATCH", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: name })
    }).catch(function () { return null; });
  }
  // 옛 이름은 여러 개일 수 있다(PEER → PKEMS 순). 최근 것부터 찾는다.
  function findOrInherit(newName, oldNames) {
    return findInFolder(newName, folder.id).then(function (id) {
      if (id) return id;
      return (oldNames || []).reduce(function (chain, old) {
        return chain.then(function (found) {
          if (found) return found;
          return findInFolder(old, folder.id).then(function (oldId) {
            if (!oldId) return null;
            console.info("옛 이름 " + old + " 을 " + newName + " 으로 이어받습니다.");
            return renameFile(oldId, newName).then(function () { return oldId; });
          });
        });
      }, Promise.resolve(null));
    });
  }

  function findIndexFile() {
    if (indexFileId) return Promise.resolve(indexFileId);
    return findOrInherit(INDEX_NAME, OLD_INDEX_NAMES).then(function (id) { indexFileId = id; return id; });
  }
  /* ---- 조각 나누기에 쓰는 것들 ---- */
  function shardName(i) { return SHARD_PREFIX + ("0" + i.toString(16)).slice(-2) + ".json"; }
  // 짧고 빠른 지문(FNV-1a). 암호가 아니라 «바뀌었나» 만 본다
  function fnv(s) {
    var h = 0x811c9dc5;
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = (h + ((h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24))) >>> 0;
    }
    return h >>> 0;
  }
  /* 어느 조각에 넣을지는 «기록 아이디» 로만 정한다.
     그래야 글을 고쳐도 조각을 옮겨 다니지 않고, 그 조각 하나만 다시 올리면 된다. */
  function shardOf(id, n) { return fnv(String(id)) % n; }
  /* 조각 한 덩이의 글자. 들어온 차례가 달라도 «같은 글자» 가 나와야
     지문을 견줘 «안 바뀐 조각» 을 건너뛸 수 있다. 그래서 여기서 한 번 줄을 세운다. */
  function shardBody(i, n, arr) {
    arr = arr.slice().sort(function (a, b) {
      return (b.createdAt || 0) - (a.createdAt || 0) || (a.id < b.id ? -1 : a.id > b.id ? 1 : 0);
    });
    return JSON.stringify({ version: 4, app: "PKOS", n: i, of: n, entries: arr });
  }
  // 지금 기록을 조각별 글자로 만든다. 한 조각이라도 너무 크면 조각 수를 두 배로 늘려 다시 짠다
  function buildShards() {
    var slims = entries.map(slim), n = shardCount, strs;
    for (;;) {
      var parts = [], i;
      for (i = 0; i < n; i++) parts.push([]);
      slims.forEach(function (e) { parts[shardOf(e.id, n)].push(e); });
      strs = parts.map(function (p, k) { return shardBody(k, n, p); });
      var tooBig = strs.some(function (s) { return s.length > SHARD_MAX; });
      if (!tooBig || n >= SHARD_CAP) break;
      n *= 2;
    }
    if (n !== shardCount) { shardCount = n; shardSig = {}; }   // 다시 나눴으면 전부 새로 올린다
    return strs;
  }
  // 조각 하나를 올린다. 파일 ID 를 모르면 이름으로 먼저 찾는다(색인이 지워졌다 되살아난 경우)
  function putShard(i, body) {
    var p = shardIds[i] ? Promise.resolve(shardIds[i]) : findInFolder(shardName(i), folder.id);
    return p.then(function (id) {
      return uploadFile(shardName(i), "application/json", body, false, id || null, folder.id);
    }).then(function (r) { if (r && r.id) shardIds[i] = r.id; });
  }

  function saveIndex() {
    /* ⚠️ 색인을 다 못 읽은 채로 저장하면, 못 읽은 조각의 기록이 통째로 사라진다.
       읽기가 반쪽이었으면 아무것도 쓰지 않는다. */
    if (indexIncomplete) {
      toast("색인을 다 읽지 못해 저장하지 않았습니다. 기록은 그대로 있습니다.");
      toast2("새로고침한 뒤 다시 연결해 주세요.");
      return Promise.resolve();
    }
    pruneTombs();

    // 작을 때는 나누지 않는다. 옛 버전으로 열어도 그대로 보이게
    if (!sharded) {
      var flat = JSON.stringify({ version: 3, app: "PKOS", entries: entries.map(slim), deleted: tombstones });
      if (flat.length <= SHARD_MAX) {
        return findIndexFile().then(function (id) {
          return uploadFile(INDEX_NAME, "application/json", flat, false, id, folder.id);
        }).then(function (r) { if (r && r.id) indexFileId = r.id; });
      }
      sharded = true;   // 여기서부터는 조각으로 간다
    }

    var strs = buildShards();
    /* 바뀐 조각만 올린다. 빈 조각은 파일부터 만들지 않는다. 
       기록이 몇 편일 때 빈 파일 수십 개가 폴더에 널리면 안 된다. */
    var jobs = [];
    strs.forEach(function (s, i) {
      var sig = fnv(s);
      if (shardIds[i] && shardSig[i] === sig) return;
      if (!shardIds[i] && s.indexOf('"entries":[]') >= 0) return;
      jobs.push({ i: i, body: s, sig: sig });
    });

    return jobs.reduce(function (chain, j) {
      // 조각을 «먼저» 다 올리고 목차를 나중에 올린다. 중간에 끊겨도 목차는 옛것이라 짝이 안 어긋난다
      return chain.then(function () { return putShard(j.i, j.body).then(function () { shardSig[j.i] = j.sig; }); });
    }, Promise.resolve()).then(function () {
      var man = {
        version: 4, app: "PKOS", shardCount: shardCount, count: entries.length,
        shards: strs.map(function (s, i) { return { n: i, id: shardIds[i] || null, bytes: s.length }; })
                    .filter(function (x) { return x.id; }),
        deleted: tombstones
      };
      return findIndexFile().then(function (id) {
        return uploadFile(INDEX_NAME, "application/json", JSON.stringify(man, null, 2), false, id, folder.id);
      }).then(function (r) { if (r && r.id) indexFileId = r.id; });
    });
  }

  function readMedia(id) {
    return driveFetch("https://www.googleapis.com/drive/v3/files/" + id + "?alt=media&supportsAllDrives=true")
      .then(function (r) { return r.json(); });
  }
  /* 목차(PKOS-index.json)를 보고 조각을 다 읽는다.
     하나라도 못 읽으면 «반쪽» 이라고 표시하고 저장을 막는다. */
  function loadSharded(man) {
    shardCount = man.shardCount || 1;
    shardIds = {}; shardSig = {};
    var out = [];
    return (man.shards || []).reduce(function (chain, s) {
      return chain.then(function () {
        var p = s.id ? Promise.resolve(s.id) : findInFolder(shardName(s.n), folder.id);
        return p.then(function (id) {
          if (!id) throw new Error(shardName(s.n) + " 을 찾지 못했습니다");
          return readMedia(id).then(function (j) {
            shardIds[s.n] = id;
            ((j && j.entries) || []).forEach(function (e) { out.push(e); });
          });
        });
      });
    }, Promise.resolve()).then(function () {
      // 다음 저장에서 «안 바뀐 조각» 을 건너뛸 수 있게, 읽어 온 그대로의 지문을 재어 둔다
      var parts = [], i;
      for (i = 0; i < shardCount; i++) parts.push([]);
      out.forEach(function (e) { parts[shardOf(e.id, shardCount)].push(e); });
      parts.forEach(function (p, k) { shardSig[k] = fnv(shardBody(k, shardCount, p)); });
      return { entries: migrate(out), deleted: man.deleted || [] };
    }).catch(function (e) {
      console.warn("색인 조각 읽기 실패", e);
      indexIncomplete = true;
      toast("색인 조각을 다 읽지 못했습니다. 덮어쓰지 않습니다.");
      toast2("새로고침한 뒤 다시 연결해 주세요.");
      return { entries: [], deleted: man.deleted || [] };
    });
  }
  /* 옛 버전으로 한 번 저장하면 목차가 «통째로 든 색인» 으로 덮여 쓰인다.
     그래도 조각 파일은 폴더에 그대로 남아 있으므로, 이름으로 찾아 함께 읽어 준다.
     이 한 겹이 없으면 «기기 하나가 옛 버전» 인 것만으로 십삼 년치가 안 보이게 된다. */
  function readStrayShards(base) {
    if (strayChecked) return Promise.resolve(base);   // 연결마다 한 번이면 된다
    strayChecked = true;
    /* 옛 이름(TRACE-index-…)으로 남은 조각도 함께 찾는다 · 이름이 바뀌었다고 조각이 안 보이면 안 된다 */
    var q = "(name contains '" + qEsc(SHARD_PREFIX) + "' or name contains 'TRACE-index-') and '" + folder.id + "' in parents and trashed=false";
    return driveJson("https://www.googleapis.com/drive/v3/files?q=" + encodeURIComponent(q) +
      "&fields=files(id,name)&pageSize=1000&supportsAllDrives=true&includeItemsFromAllDrives=true")
      .then(function (j) {
        var files = (j.files || []).filter(function (f) { return /^(PKOS|TRACE)-index-[0-9a-f]{2}\.json$/.test(f.name); });
        if (!files.length) return base;
        console.info("옛 형식 색인 옆에 조각 " + files.length + "개가 남아 있어 함께 읽습니다.");
        var map = {};
        base.entries.forEach(function (e) { map[e.id] = e; });
        return files.reduce(function (chain, f) {
          return chain.then(function () {
            return readMedia(f.id).then(function (js) {
              ((js && js.entries) || []).forEach(function (e) {
                var cur = map[e.id];
                if (!cur || (e.updatedAt || 0) > (cur.updatedAt || 0)) map[e.id] = e;
              });
            });
          });
        }, Promise.resolve()).then(function () {
          base.entries = migrate(Object.keys(map).map(function (k) { return map[k]; }));
          return base;
        });
      })
      .catch(function () { return base; });
  }
  // 원격 색인을 { entries, deleted } 로 읽는다 (구버전은 deleted 가 없음)
  function loadIndex() {
    indexIncomplete = false;
    return findIndexFile().then(function (id) {
      if (!id) { sharded = false; shardCount = 1; shardIds = {}; shardSig = {}; return { entries: [], deleted: [] }; }
      return readMedia(id)
        .then(function (j) {
          if (j && j.shards) { sharded = true; return loadSharded(j); }
          // 옛 형식 · 색인 하나에 다 들어 있다
          sharded = false; shardCount = 1; shardIds = {}; shardSig = {};
          return readStrayShards({ entries: migrate((j && j.entries) || []), deleted: (j && j.deleted) || [] });
        })
        .catch(function (e) {
          /* 예전에는 여기서 조용히 «빈 색인» 을 돌려주었다.
             그러면 곧바로 이어지는 저장이 드라이브의 색인을 «이 기기에 있는 것만» 으로 덮어썼다.
             신호가 잠깐 끊긴 것만으로 십삼 년치가 날아갈 수 있는 자리였다. */
          console.warn("색인 읽기 실패", e);
          indexIncomplete = true;
          toast("색인을 읽지 못했습니다. 기록을 덮어쓰지 않습니다.");
          return { entries: [], deleted: [] };
        });
    });
  }
  function addTomb(id) {
    tombstones = tombstones.filter(function (t) { return t.id !== id; });
    tombstones.push({ id: id, at: Date.now() });
  }
  function mergeTombs(remote) {
    var map = {};
    tombstones.concat(remote || []).forEach(function (t) {
      if (!t || !t.id) return;
      if (!map[t.id] || (t.at || 0) > map[t.id].at) map[t.id] = { id: t.id, at: t.at || 0 };
    });
    tombstones = Object.keys(map).map(function (k) { return map[k]; });
    return tombstones;
  }
  function pruneTombs() {
    var cut = Date.now() - TOMB_KEEP_DAYS * 86400000;
    tombstones = tombstones.filter(function (t) { return (t.at || 0) > cut; });
  }
  function saveSettingsRemote() {
    if (!connected || !folder.id) return Promise.resolve();
    var content = JSON.stringify(settings, null, 2);
    var p = settingsFileId ? Promise.resolve(settingsFileId) : findOrInherit(SETTINGS_NAME, OLD_SETTINGS_NAMES);
    return p.then(function (id) {
      settingsFileId = id;
      return uploadFile(SETTINGS_NAME, "application/json", content, false, id, folder.id);
    }).then(function (r) { if (r && r.id) settingsFileId = r.id; }).catch(function () {});
  }
  function loadSettingsRemote() {
    return findOrInherit(SETTINGS_NAME, OLD_SETTINGS_NAMES).then(function (id) {
      if (!id) return null;
      settingsFileId = id;
      return driveFetch("https://www.googleapis.com/drive/v3/files/" + id + "?alt=media&supportsAllDrives=true")
        .then(function (r) { return r.json(); }).catch(function () { return null; });
    }).catch(function () { return null; });
  }
  function mergeEntries(local, remote) {
    var map = {};
    (remote || []).forEach(function (n) { map[n.id] = n; });
    (local || []).forEach(function (n) {
      var r = map[n.id];
      if (!r || (n.updatedAt || 0) >= (r.updatedAt || 0)) map[n.id] = n;
    });
    // 다른 기기에서 지운 기록은 되살아나지 않게 한다
    tombstones.forEach(function (t) {
      var n = map[t.id];
      if (n && (n.updatedAt || 0) <= (t.at || 0)) delete map[t.id];
    });
    var arr = Object.keys(map).map(function (k) { return map[k]; });
    arr.sort(function (a, b) { return (b.createdAt || 0) - (a.createdAt || 0); });
    return arr;
  }
  // 원격 색인을 받아 로컬과 합친다 (삭제 기록 포함)
  function absorbIndex(remote) {
    mergeTombs(remote.deleted);
    entries = mergeEntries(entries, remote.entries);
    return entries;
  }

  function syncPending() {
    if (!connected || !folder.id) return Promise.resolve();

    // 손볼 게 있는 기록만 추린다
    var todo = entries.filter(function (n) {
      /* ⚠️ 휴지통에 든 것은 «올리지» 않는다. 버렸는데 그 글이 드라이브에 다시 쓰이면
         버린 뜻이 없어진다. 버렸다는 사실 자체는 색인(saveIndex)이 실어 나른다.
         아직 한 번도 안 올라간 기록도 마찬가지다 · 버린 것을 새로 올릴 이유가 없다. */
      if (n.trashed) return false;
      if (n._dirty || !n.mdId) return true;
      return (n.blocks || []).some(function (b) {
        if (b.kind !== "image" && b.kind !== "file") return false;
        if (!b.fileId && b.blob) return true;
        return !!(b._remask && b.blob);          // 가려서 새로 덮어써야 하는 사진
      });
    });
    if (!todo.length) return Promise.resolve();

    var total = todo.length + 1, done = 0;
    function tick() { done++; progress(Math.round(done / total * 100)); }

    return todo.reduce(function (chain, n) {
      return chain.then(function () {
        var t;
        return resolveTargets(n)
          .then(function (target) {
            t = target;
            /* 이미 드라이브에 있는 파일을 옮기는 것은 «사람이 시켰을 때» 만 한다.
               설정 → 「기존 파일도 새 방식으로 옮기기」 가 그 자리다 (n._relocate).
               ⚠️ 예전에는 «폴더가 새로 생겼으면» (t.created) 도 같이 옮겼다. 그런데 가져온 기록은
                  제 폴더가 없어서, 한 번 고치는 것만으로 폴더가 새로 생기고 십삼 년 동안 있던
                  자리에서 원본이 딸려 나왔다. 자리는 드라이브가 정한다. 앱은 새로 만드는 것만 정한다. */
            if (!n._relocate) return;
            var oldFolder = (settings.folderMode !== "perEntry") ? n.folderId : null;
            delete n._relocate;
            return relocateEntryFiles(n, t).then(function () {
              if (oldFolder) { trashFile(oldFolder); n.folderId = null; n.folderName = null; }
            });
          })
          .then(function () {
            // 대기 중인 첨부 업로드
            var pending = (n.blocks || []).filter(function (b) {
              return (b.kind === "image" || b.kind === "file") && !b.fileId && b.blob;
            });
            return pending.reduce(function (p, b) {
              return p.then(function () {
                // 진행률은 «큰 파일만» 이 아니라 항상 보여 준다.
                // 폰에서는 1MB 짜리도 몇십 초가 걸리는데, 아무 표시가 없으면 멈춘 줄 안다.
                var label = b.name.length > 14 ? b.name.slice(0, 14) + "…" : b.name;
                setSyncPill("↑ " + label + " 0%", true);
                return uploadAttachment(b, t.file, function (f) {
                  if (f < 0) { setSyncPill("↑ " + label + " 연결을 기다리는 중…", true); return; }
                  setSyncPill("↑ " + label + " " + Math.round(f * 100) + "%", true);
                })
                  .then(function (r) {
                    b.fileId = r.id; delete b.blob; dropPreview(b.id);
                    n._dirty = true; idbDel(b.id);
                  })
                  .catch(function (e) {
                    console.warn("첨부 업로드 실패", b.name, e);
                    toast("「" + b.name + "」 업로드 실패: " + errText(e));
                    toast2("이 기록은 «⏳ 업로드 대기» 로 남습니다. [동기화] 를 다시 누르면 재시도합니다.");
                  });
              });
            }, Promise.resolve());
          })
          .then(function () {
            /* 가려서 다시 올려야 하는 사진 · 같은 파일에 덮어쓴다.
               파일 아이디가 그대로라 색인도 글 속 링크도 어긋나지 않는다. */
            var remask = (n.blocks || []).filter(function (b) { return b._remask && b.blob && b.fileId; });
            return remask.reduce(function (p, b) {
              return p.then(function () {
                var label = b.name && b.name.length > 14 ? b.name.slice(0, 14) + "…" : (b.name || "사진");
                setSyncPill("🔲 " + label + " 다시 올리는 중 0%", true);
                return uploadBlob(b.name, b.mime || "image/jpeg", b.blob, t.file, b.fileId, function (f) {
                  if (f < 0) { setSyncPill("🔲 " + label + " 연결을 기다리는 중…", true); return; }
                  setSyncPill("🔲 " + label + " " + Math.round(f * 100) + "%", true);
                })
                  .then(function () {
                    delete b._remask; delete b.blob; dropPreview(b.id);
                    idbDel(b.id); n._dirty = true;
                  })
                  .catch(function (e) {
                    console.warn("가린 사진 덮어쓰기 실패", b.name, e);
                    toast("「" + (b.name || "사진") + "」" + josa(b.name || "사진", "을", "를") + " 다시 올리지 못했습니다: " + errText(e));
                    toast2("드라이브에는 아직 «가리기 전» 사진이 있습니다. [동기화] 를 다시 눌러 주세요.");
                  });
              });
            }, Promise.resolve());
          })
          .then(function () {
            if (!n._dirty && n.mdId) return;
            var want = mdName(n);
            var pre = n.mdId ? Promise.resolve(want) : uniqueName(want, t.md);
            return pre.then(function (finalName) {
              /* 이름도 자리와 같은 규칙이다 · 앱이 만든 파일은 앱이 이름을 정하고,
                 밖에서 온 파일(srcId)은 사람이 정한다. 밖에서 온 것의 이름을 바꾸는 길은
                 「📛 밖에서 넣은 파일 이름 정리」 하나뿐이다. 거기서는 사람이 보고 시킨다.
                 앱이 만든 파일이라도, 규칙이 내놓는 이름이 «지난번에 앱이 붙인 이름» 과 같으면
                 손대지 않는다. 사람이 드라이브에서 고쳐 둔 이름을 저장 한 번에 되돌리지 않으려는 것이다. */
              var keepName = !!(n.mdId && (n.srcId || (n.mdName && finalName === n.mdName)));
              return uploadFile(keepName ? null : finalName, "text/markdown", buildMarkdown(n), false, n.mdId || null, t.md)
                // 이름을 안 바꿨으면 mdName 도 그대로 둔다. 여기가 «드라이브에 있는 이름» 이어야 한다
                .then(function (r) { n.mdId = r.id; if (!keepName) n.mdName = finalName; });
            }).then(function () {
              // 사람이 읽기 좋은 사본도 함께
              var extra = [];
              if (settings.alsoGdoc) extra.push(saveAsGoogleDoc(n, t.md));
              if (settings.alsoHtml) extra.push(saveAsHtml(n, t.md));
              return Promise.all(extra);
            })
              // 태그가 여럿이면 나머지 태그 폴더에 바로가기를 놓는다
              .then(function () { return syncTagShortcuts(n); })
              .then(function () { delete n._dirty; });
          })
          .catch(function (e) { console.warn("저장 실패", n.title, e); })
          .then(tick);
      });
    }, Promise.resolve())
      .then(function () { return saveIndex(); })
      .then(function () { tick(); saveLocal(); render(); })

  /* ---------- 종이 위 자판 ---------- */
  function onPaperKey(e) {
    if (e.target !== paper && e.target.closest && e.target.closest(".atom, .qlabel")) return;   // 덩어리 안 입력칸은 각자

    if (slashOpen() && slashKey(e)) return;
    var key = e.key;
    if ((e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey) {
      var k = String(key).toLowerCase();
      if (k === "b") { e.preventDefault(); fmt("b"); return; }
      if (k === "i") { e.preventDefault(); fmt("i"); return; }
    }
    if (key === "Escape") { hideWikiPop(); hideSlash(); return; }
    if (key === "Tab") {
      var li = caretPara();
      if (li && li.tagName === "LI" && !li.classList.contains("ti")) {
        e.preventDefault();

    if (key === "Enter" && !e.shiftKey && !e.ctrlKey && !e.metaKey) {
      var s = window.getSelection(); if (!s.rangeCount) return;
      var r = s.getRangeAt(0);

      if (selAtom && !r.collapsed) {                       // 덩어리를 골라 둔 채 Enter · 그 아래에 새 줄
        e.preventDefault();
        var np = newPara(); paper.insertBefore(np, selAtom.nextSibling); placeCaret(np, false);
        return;
      }
      var para = caretPara(); if (!para) return;
      var top = caretTop();
      if (/^H[1-4]$/.test(para.tagName)) { e.preventDefault(); splitTo(para, "p"); return; }
      if (para.tagName === "LI" && para.classList.contains("ti")) {
        e.preventDefault();

        if (!para.textContent.trim()) {                    // 빈 줄에서 Enter → 할 일 밖으로
          var p2 = newPara();
          ul.parentNode.insertBefore(p2, ul.nextSibling);
          para.remove();
          if (!ul.querySelector("li")) ul.remove();
          placeCaret(p2, false); touchDraft();
          return;
        }
        var cut = r.cloneRange(); cut.setEndAfter(para);
        var frag = cut.extractContents();
        var restLi = frag.firstElementChild;
        var nl = todoLi("", false);
        if (restLi) Array.prototype.slice.call(restLi.childNodes).forEach(function (c) {
          if (c.classList && c.classList.contains("tchk")) return;
          nl.appendChild(c);
        });
        if (!nl.textContent.trim()) { Array.prototype.slice.call(nl.childNodes).forEach(function (c) { if (!(c.classList && c.classList.contains("tchk"))) c.remove(); }); nl.appendChild(el("br")); }
        if (!para.querySelector("br") && !para.textContent.trim()) para.appendChild(el("br"));

        if (!para.textContent.trim() && para === body.lastElementChild && body.children.length > 1) {

  function normalizePaper() {
    if (!paper) return;

      if (n.nodeType === 3) {

    });

  }

  function initPaper() {

    paper.addEventListener("blur", function () {

    });

      });

      var hl = $("btnHl"), pal = $("hlPal");
      if (hl && pal) {

  }

  /* =========================================================
     되돌리기 · 다시 하기 (Ctrl+Z · Ctrl+Shift+Z)
     ---------------------------------------------------------
     ⚠️ 브라우저가 스스로 해 주는 되돌리기는 «사람이 친 글자» 만 센다. 사진·녹음·손 메모·
        표처럼 우리가 코드로 넣은 덩어리는 그 셈에 안 들어간다. 그래서 사진을 넣고 Ctrl+Z 를

       · 새 기록을 열거나 편집으로 불러오면 그때까지의 기록은 버린다 (다른 문서다)

  var histPast = [], histFuture = [], histBase = null, histTimer = null, histBusy = false;
  var HIST_MAX = 80;

  }
  /* 같은 상태인지 · 덩어리는 id 로, 글은 글자로 견준다.
     blob 같은 것은 JSON 으로 못 찍으므로 견주는 데 쓰지 않는다. */
  function histKey(list) {
    if (!list) return "";
    return list.map(function (b) {
      var o = { k: b.kind, id: b.id };
      ["text", "title", "src", "role", "name", "url", "html", "ordered", "level", "fileId", "mime"].forEach(function (f) {
        if (b[f] != null) o[f] = b[f];
      });
      if (Array.isArray(b.items)) o.i = b.items.map(function (it) { return [it.t, it.done ? 1 : 0, it.d || 0]; });
      if (Array.isArray(b.head)) o.h = b.head;

  function histReset() {

  }
  function histCommit() {
    if (histBusy || !paper) return;
    if (histTimer) { clearTimeout(histTimer); histTimer = null; }
    var now = histSnap();
    if (!histBase) { histBase = now; syncUndoBtns(); return; }
    if (histKey(now) === histKey(histBase)) return;
    histPast.push(histBase);
    if (histPast.length > HIST_MAX) histPast.shift();
    histBase = now;
    histFuture = [];
    syncUndoBtns();
  }
  // 글자를 치는 중 · 손이 멈추면 한 장 찍는다

  }
  function undoPaper() {

    if (!histPast.length) { toast("더 되돌릴 것이 없습니다."); return; }
    histFuture.push(histBase);
    histBase = histPast.pop();

  }
  function redoPaper() {

  function syncUndoBtns() {

  }

  function renderBlocks() {
    if (!paper) initPaper();

  /* ---------- 사진 넣는 방법 고르기 (PC / 모바일 공통 입구) ---------- */

  // 고른 이미지 파일 → (자르기 화면) → 사진 블록
  var MAX_EDGE = 2400; // 휴대폰 고화질 사진을 자르기 전에 적당히 줄인다
  function imageFileToCanvas(file) {
    return new Promise(function (res, rej) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        var w = img.naturalWidth, h = img.naturalHeight;
        var s = Math.min(1, MAX_EDGE / Math.max(w, h));
        var c = document.createElement("canvas");
        c.width = Math.max(1, Math.round(w * s));
        c.height = Math.max(1, Math.round(h * s));
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        res(c);
      };
      img.onerror = function () { URL.revokeObjectURL(url); rej(new Error("이미지를 열 수 없습니다.")); };
      img.src = url;
    });
  }
  /* ---------- 웹캠으로 바로 찍기 (PC) ---------- */
  function openWebcam() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      toast("이 브라우저에서는 웹캠을 쓸 수 없습니다.");

    }

    navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false })

        showCam(s);

        else if (n === "NotFoundError") toast("연결된 카메라를 찾지 못했습니다.");
        else toast("카메라를 열 수 없습니다: " + (e && e.message ? e.message : e));
      });

    function stop() {
      alive = false;
      if (stream) stream.getTracks().forEach(function (t) { t.stop(); });
      stream = null;
    }

    function showCam(s) {
      closeModal();
      var bg = el("div", "modal-bg");
      var m = el("div", "card modal"); m.style.maxWidth = "720px";
      var head = el("div", "mhead");
      head.appendChild(el("h3", null, "📷 웹캠으로 찍기"));
      head.appendChild(el("span", "spacer"));
      var x = el("button", "btn sm ghost", "✕"); x.addEventListener("click", closeModal);
      head.appendChild(x);
      m.appendChild(head);

      var body = el("div", "mbody"); body.style.textAlign = "center";
      var v = document.createElement("video");
      v.autoplay = true; v.playsInline = true; v.muted = true;

      body.appendChild(el("p", "crophint", "화면에 담기면 «찍기» 를 누르세요."));
      m.appendChild(body);

      var foot = el("div", "mfoot");
      foot.appendChild(el("span", "spacer"));
      var cancel = el("button", "btn", "취소");
      cancel.addEventListener("click", closeModal);
      var shoot = el("button", "btn primary", "📷 찍기");
      shoot.addEventListener("click", function () {
        var w = v.videoWidth, h = v.videoHeight;
        if (!w || !h) { toast("아직 화면이 준비되지 않았습니다. 잠시 후 다시 눌러 주세요."); return; }
        var c = document.createElement("canvas");
        c.width = w; c.height = h;
        c.getContext("2d").drawImage(v, 0, 0, w, h);
        stop();
        openCropModal(c, "웹캠_" + dateStamp() + "_" + timeStamp() + ".png");
      });
      foot.appendChild(cancel); foot.appendChild(shoot);
      m.appendChild(foot);

      bg.appendChild(m);
      bg.addEventListener("click", function (e) { if (e.target === bg) closeModal(); });
      $("modalHost").appendChild(bg);
      modalEl = bg;
      modalCleanup = stop;
    }
  }

  /* ---------- 클립보드에서 바로 붙여넣기 (창 공유 없이) ---------- */
  function pasteFromClipboard() {
    if (!navigator.clipboard || !navigator.clipboard.read) {
      toast("이 브라우저는 버튼으로 붙여넣기를 지원하지 않습니다. 글 칸을 누르고 Ctrl+V 를 눌러 주세요.");
      return;
    }
    navigator.clipboard.read().then(function (items) {
      var files = [], jobs = [];
      items.forEach(function (it) {
        var type = it.types.filter(function (t) { return /^image\//.test(t); })[0];
        if (!type) return;
        jobs.push(it.getType(type).then(function (blob) {
          var ext = "." + (type.split("/")[1] || "png").replace("jpeg", "jpg");
          files.push(new File([blob], "붙여넣기_" + dateStamp() + "_" + timeStamp() + ext, { type: type }));
        }));
      });
      return Promise.all(jobs).then(function () {
        if (!files.length) { toast("클립보드에 이미지가 없습니다. 먼저 Win+Shift+S(맥 ⌘⇧4)로 캡처하세요."); return; }
        acceptFiles(files);
      });
    }).catch(function (e) {
      if (e && e.name === "NotAllowedError") toast("클립보드 읽기 권한이 필요합니다. 주소창 아이콘에서 허용하거나, 글 칸에서 Ctrl+V 를 쓰세요.");
      else toast("클립보드를 읽지 못했습니다. 글 칸에서 Ctrl+V 를 써 주세요.");
    });
  }

  // 카메라 촬영 · 누를 때만 입력칸을 만들고 바로 없앤다
  function pickFromCamera() {
    var inp = document.createElement("input");
    inp.type = "file";
    inp.accept = "image/*";
    inp.setAttribute("capture", "environment");
    inp.style.display = "none";
    document.body.appendChild(inp);
    inp.addEventListener("change", function () {
      var f = inp.files && inp.files[0];
      setTimeout(function () { if (inp.parentNode) inp.parentNode.removeChild(inp); }, 0);
      handlePickedImage(f);
    });
    inp.click();
  }

  function handlePickedImage(file) {
    if (!file) return;
    if (skipCrop) { acceptFiles([file]); return; }
    imageFileToCanvas(file)
      .then(function (c) { openCropModal(c, file.name); })
      .catch(function (e) { toast(e.message); });
  }

  /* ---------- 화면 캡처 (데스크톱) ---------- */
  function startCapture() { openCaptureSheet(); }

  function startScreenCapture() {
    if (!captureSupported()) {
      toast("이 브라우저·환경은 화면 캡처를 지원하지 않습니다. Win+Shift+S(맥은 ⌘⇧4)로 캡처한 뒤 글 칸에 Ctrl+V 로 붙여넣으세요.");
      return;
    }
    var askedAt = Date.now();
    navigator.mediaDevices.getDisplayMedia({ video: true, audio: false })
      .then(function (stream) {
        var v = document.createElement("video");
        v.srcObject = stream; v.muted = true; v.playsInline = true;
        return v.play().then(function () {
          // 첫 프레임이 실제로 그려질 때까지 잠깐 기다린다
          return new Promise(function (res) { setTimeout(function () { res(v); }, 300); });
        });
      })
      .then(function (v) {
        var w = v.videoWidth, h = v.videoHeight;
        var c = document.createElement("canvas");
        c.width = w; c.height = h;
        c.getContext("2d").drawImage(v, 0, 0, w, h);
        try { v.srcObject.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {}
        if (!w || !h) { toast("캡처된 화면이 없습니다. 다시 시도해 주세요."); return; }
        openCropModal(c);
      })
      .catch(function (e) {
        var name = (e && e.name) || "";
        // 선택창이 뜰 새도 없이 거절됐다면 사용자가 취소한 게 아니라 브라우저가 막은 것이다
        var blocked = (Date.now() - askedAt) < 600;
        if ((name === "NotAllowedError" || name === "AbortError") && !blocked) return; // 사용자가 취소
        if (name === "NotAllowedError" || name === "NotSupportedError" || name === "AbortError") {
          toast("이 창에서는 화면 캡처가 막혀 있습니다. 크롬 등 일반 브라우저에서 열면 됩니다. (또는 Win+Shift+S 로 캡처 후 글 칸에 Ctrl+V)");
          return;
        }
        toast("화면 캡처 실패: " + (e && e.message ? e.message : e));
      });
  }

  // 캔버스를 PNG(너무 크면 JPEG) Blob 으로
  function canvasToAttachment(canvas, srcName) {
    var base = srcName
      ? safeName(stemOf(srcName), 40) + "_잘라냄"
      : "화면캡처_" + dateStamp() + "_" + timeStamp();
    return new Promise(function (res) {
      canvas.toBlob(function (png) {
        function done(blob, ext) {
          res({ original: base + ext, mime: blob.type, size: blob.size, blob: blob });
        }
        if (png && png.size > 6 * 1024 * 1024) {
          canvas.toBlob(function (jpg) { done(jpg || png, jpg ? ".jpg" : ".png"); }, "image/jpeg", 0.88);
        } else if (png) {
          done(png, ".png");
        } else {
          canvas.toBlob(function (jpg) { done(jpg, ".jpg"); }, "image/jpeg", 0.9);
        }
      }, "image/png");
    });
  }

  /* ---------- 🎙️ 녹음 · 받아쓰기 ----------
     소리는 MediaRecorder 로 담고, 받아쓰기는 브라우저에 딸린 음성인식을 쓴다.
     둘 다 «따로 키를 받을 것도, 돈 낼 것도» 없다.

     ⚠️ 솔직하게 적어 둔다. 이 화면을 열어 둔 동안에만 녹음된다.
        다른 앱으로 넘어가거나 화면이 꺼지면 브라우저가 마이크를 놓는다.
        «켜 두면 알아서» 는 웹앱으로는 안 되는 일이다. 그래서 화면이 꺼지지
        않게 붙잡아 두고, 끊기면 숨기지 않고 화면에 알린다. */
  function pickAudioType() {
    var candidates = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/aac", "audio/ogg"];
    for (var i = 0; i < candidates.length; i++) {
      if (window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(candidates[i])) {
        return candidates[i];
      }
    }
    return "";
  }
  function speechCtor() {
    return window.SpeechRecognition || window.webkitSpeechRecognition || null;
  }
  function mmss(sec) {
    var m = Math.floor(sec / 60), s = Math.floor(sec % 60);
    return m + ":" + (s < 10 ? "0" : "") + s;
  }

  function openVoiceModal() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
      toast("이 브라우저는 녹음을 지원하지 않습니다.");
      return;
    }
    closeModal();

    var stream = null, rec = null, chunks = [], started = 0, timer = null;
    var recog = null, wantRecog = !!speechCtor(), recogOn = false;
    var finalText = "", interim = "";
    var audioBlob = null, audioType = pickAudioType();
    var pickedName = "";    // 밖에서 불러온 파일이면 그 이름을 그대로 쓴다
    var state = "idle";     // idle · recording · playing(파일을 틀어 놓고 받아 적는 중) · done

    var bg = el("div", "modal-bg");
    var m = el("div", "card modal"); m.style.maxWidth = "640px";

    var head = el("div", "mhead");
    head.appendChild(el("h3", null, "🎙️ 녹음 · 받아쓰기"));
    head.appendChild(el("span", "spacer"));
    var x = el("button", "btn sm ghost", "✕");
    x.addEventListener("click", function () { stopAll(); closeModal(); });
    head.appendChild(x);
    m.appendChild(head);

    var body = el("div", "mbody"); body.style.textAlign = "center";

    var clock = el("div", "voiceclock", "0:00");
    body.appendChild(clock);
    var meterWrap = el("div", "voicemeter");
    var meterBar = el("div", "voicebar");
    meterWrap.appendChild(meterBar);
    body.appendChild(meterWrap);

    /* ⚠️ 여기에 설명을 적지 말 것. 무엇을 하는 창인지는 아래 단추가 말해 준다.
       이 줄은 «지금 무슨 일이 일어나는가» 만 띄운다 (녹음 중·못 들었다·안 되는 것). */
    var warn = el("p", "crophint");
    warn.style.color = "var(--brand)";
    warn.textContent = wantRecog ? "" : "이 브라우저는 받아쓰기가 안 됩니다. 소리만 담깁니다.";
    body.appendChild(warn);

    /* 제목과 내용을 갈라 놓는다.
       제목은 «파일 이름» 이 되고, 받아 적은 글은 «본문» 이 된다. 둘을 섞으면 파일명이 문장이 된다. */
    var titleField = el("div", "field");
    titleField.style.textAlign = "left";   // 시계 때문에 창이 가운데 정렬이라, 적는 칸은 되돌려 놓는다
    titleField.appendChild(el("label", null, "제목"));
    var tin = el("input", "inp");
    tin.placeholder = "예: 8월 협의회";
    titleField.appendChild(tin);
    body.appendChild(titleField);

    var scriptField = el("div", "field");
    scriptField.style.textAlign = "left";
    scriptField.appendChild(el("label", null, "받아 적은 글"));
    var ta = el("textarea", "inp");
    ta.rows = 7;
    ta.placeholder = wantRecog ? "말하면 여기에 쌓입니다." : "여기에 직접 적어도 됩니다.";
    ta.addEventListener("input", function () { finalText = ta.value; interim = ""; });
    scriptField.appendChild(ta);
    body.appendChild(scriptField);

    var player = el("audio");
    player.controls = true;
    player.style.width = "100%";
    player.style.display = "none";
    fixAudioDuration(player);
    body.appendChild(player);
    m.appendChild(body);

    var foot = el("div", "mfoot");
    var status = el("span", "desc"); status.style.margin = "0";
    foot.appendChild(status);
    foot.appendChild(el("span", "spacer"));
    var again = el("button", "btn", "다시 녹음");
    again.style.display = "none";
    again.addEventListener("click", function () {
      audioBlob = null; pickedName = ""; player.style.display = "none";
      finalText = ""; interim = ""; ta.value = "";
      state = "idle"; sync(); start();
    });
    var mainBtn = el("button", "btn primary", "● 녹음 시작");
    mainBtn.addEventListener("click", function () {
      if (state === "idle") start();
      else if (state === "recording") stopAll();
    });
    var put = el("button", "btn primary", "이 녹음 넣기");
    put.style.display = "none";
    put.addEventListener("click", commit);

    /* ---- 밖에서 녹음해 온 파일 불러오기 ----
       폰 녹음기·회의 녹음기로 담아 온 것이 대부분이다. 그것도 여기서 받아 적을 수 있어야
       «녹음 = 이 창» 이 된다. 안 그러면 파일은 파일대로 따로 붙이게 된다. */
    var pick = el("input"); pick.type = "file"; pick.accept = "audio/*"; pick.className = "hidden";
    var pickBtn = el("button", "btn", "📂 녹음 파일 불러오기");
    pickBtn.addEventListener("click", function () { pick.click(); });
    pick.addEventListener("change", function () {
      var f = pick.files && pick.files[0];
      pick.value = "";
      if (!f) return;
      if (f.size > MAX_FILE_MB * 1024 * 1024) {
        toast("「" + f.name + "」" + josa(f.name, "은", "는") + " " + MAX_FILE_MB + "MB 를 넘습니다.");
        return;
      }
      stopAll();
      audioBlob = f;
      pickedName = f.name;
      finalText = ""; interim = ""; ta.value = "";
      player.src = URL.createObjectURL(f);
      player.style.display = "";
      status.textContent = "불러옴: " + f.name + " · " + humanSize(f.size);
      state = "done"; sync();
      toast2(wantRecog ? "«🔊 틀어 놓고 받아 적기» 를 누르면 글로 옮겨 적어요."
                       : "받아쓰기는 크롬에서 됩니다.");
    });

    /* ---- 파일을 틀어 놓고 받아 적기 ----
       ⚠️ 브라우저 음성인식은 «마이크» 만 듣는다. 파일을 직접 먹일 길이 없다.
          그래서 스피커로 틀고 마이크가 그것을 듣게 한다. 그래서 두 가지가 중요하다. 
          ① 이어폰을 끼면 마이크가 못 듣는다 ② 반향 제거를 꺼야 한다.
          반향 제거(echoCancellation)는 «스피커에서 나온 소리를 지우는» 기능이라,
          켜 두면 정확히 우리가 들려주려는 소리만 지워 버린다. */
    var play = el("button", "btn", "🔊 틀어 놓고 받아 적기");
    play.style.display = "none";
    play.addEventListener("click", function () {
      if (state === "playing") { player.pause(); return; }   // onpause 에서 정리한다
      if (!wantRecog) { toast("받아쓰기는 크롬에서 됩니다."); return; }
      warn.textContent = "🔊 소리를 틀어 마이크가 듣습니다. 이어폰은 빼 주세요.";
      status.textContent = "마이크를 여는 중…";
      navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
      }).then(function (s) {
        stream = s;
        state = "playing"; sync();
        status.textContent = "틀어 놓고 받아 적는 중…";
        keepAwake();
        listenLevel(s);
        startRecog();
        player.currentTime = 0;
        player.play().catch(function (e) {
          toast("소리를 틀지 못했습니다: " + errText(e));
          endPlay();
        });
      }).catch(function (e) {
        status.textContent = "";
        toast("마이크를 쓸 수 없습니다: " + errText(e));
        toast2("브라우저 주소창 옆 자물쇠에서 마이크를 «허용» 으로 바꿔 주세요.");
      });
    });
    function endPlay() {
      if (state !== "playing") return;
      try { player.pause(); } catch (e) {}
      if (recog) { try { recog.onend = null; recog.stop(); } catch (e) {} recog = null; recogOn = false; }
      if (stream) { stream.getTracks().forEach(function (t) { try { t.stop(); } catch (e) {} }); stream = null; }
      if (audioCtx) { try { audioCtx.close(); } catch (e) {} audioCtx = null; }
      if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
      meterBar.style.width = "0";
      releaseAwake();
      state = "done"; sync();
      var got = (ta.value || "").trim();
      status.textContent = got ? "받아 적었습니다. " + got.length + "자" : "받아 적힌 것이 없습니다";
      if (!got) warn.textContent = "한 글자도 못 들었어요. 이어폰을 뺐는지, 소리가 켜져 있는지 봐 주세요.";
      else warn.textContent = "";
    }
    player.addEventListener("ended", endPlay);
    player.addEventListener("pause", function () { if (state === "playing") endPlay(); });

    foot.appendChild(pick);
    foot.appendChild(pickBtn); foot.appendChild(again); foot.appendChild(play);
    foot.appendChild(mainBtn); foot.appendChild(put);
    m.appendChild(foot);

    bg.appendChild(m);
    $("modalHost").appendChild(bg);
    modalEl = bg;
    modalCleanup = function () { stopAll(); };

    function sync() {
      var busy = state === "recording" || state === "playing";
      mainBtn.style.display = (state === "done" || state === "playing") ? "none" : "";
      mainBtn.textContent = state === "recording" ? "■ 멈추기" : "● 녹음 시작";
      mainBtn.className = state === "recording" ? "btn danger" : "btn primary";
      pickBtn.style.display = busy ? "none" : "";
      again.style.display = state === "done" ? "" : "none";
      put.style.display = state === "done" ? "" : "none";
      // 파일을 불러왔거나 방금 녹음했으면 «틀어 놓고 받아 적기» 를 쓸 수 있다
      play.style.display = (state === "done" && audioBlob) || state === "playing" ? "" : "none";
      play.textContent = state === "playing" ? "■ 그만 듣기" : "🔊 틀어 놓고 받아 적기";
      play.className = state === "playing" ? "btn danger" : "btn";
      meterWrap.style.opacity = busy ? "1" : ".25";
    }

    function tick() {
      clock.textContent = mmss((Date.now() - started) / 1000);
    }

    function start() {
      status.textContent = "마이크를 여는 중…";
      navigator.mediaDevices.getUserMedia({ audio: true }).then(function (s) {
        stream = s;
        chunks = [];
        var opt = audioType ? { mimeType: audioType } : undefined;
        try { rec = new MediaRecorder(s, opt); }
        catch (e) { rec = new MediaRecorder(s); }
        rec.ondataavailable = function (e) { if (e.data && e.data.size) chunks.push(e.data); };
        rec.onstop = function () {
          audioBlob = new Blob(chunks, { type: rec.mimeType || audioType || "audio/webm" });
          player.src = URL.createObjectURL(audioBlob);
          player.style.display = "";
          status.textContent = "녹음 " + mmss((Date.now() - started) / 1000) + " · " + humanSize(audioBlob.size);
          state = "done"; sync();
        };
        rec.start(1000);          // 1초씩 끊어 담는다. 중간에 끊겨도 담긴 데까진 남는다.
        started = Date.now();
        timer = setInterval(tick, 250);
        state = "recording"; sync();
        status.textContent = "녹음 중";
        warn.textContent = "이 창을 열어 둔 동안에만 녹음돼요.";
        keepAwake();
        listenLevel(s);
        if (wantRecog) startRecog();
      }).catch(function (e) {
        status.textContent = "";
        toast("마이크를 쓸 수 없습니다: " + errText(e));
        toast2("브라우저 주소창 옆 자물쇠에서 마이크를 «허용» 으로 바꿔 주세요.");
      });
    }

    /* 소리 크기 막대 · «지금 녹음되고 있다» 를 눈으로 보여 준다.
       숫자가 안 움직이면 마이크가 죽은 것이라 바로 알 수 있다. */
    var audioCtx = null, rafId = 0;
    function listenLevel(s) {
      try {
        var AC = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AC();
        var src = audioCtx.createMediaStreamSource(s);
        var an = audioCtx.createAnalyser();
        an.fftSize = 512;
        src.connect(an);
        var buf = new Uint8Array(an.frequencyBinCount);
        (function loop() {
          if (state !== "recording" && state !== "playing") return;   // 파일을 틀 때도 움직인다
          an.getByteTimeDomainData(buf);
          var peak = 0;
          for (var i = 0; i < buf.length; i++) peak = Math.max(peak, Math.abs(buf[i] - 128));
          meterBar.style.width = Math.min(100, peak / 64 * 100) + "%";
          rafId = requestAnimationFrame(loop);
        })();
      } catch (e) { /* 막대가 없어도 녹음은 된다 */ }
    }

    /* 브라우저 음성인식은 조용하면 저절로 멈춘다. 멈추면 곧바로 다시 켠다. */
    function startRecog() {
      var Ctor = speechCtor();
      if (!Ctor) return;
      try { recog = new Ctor(); } catch (e) { return; }
      recog.lang = "ko-KR";
      recog.continuous = true;
      recog.interimResults = true;
      recog.onresult = function (ev) {
        interim = "";
        for (var i = ev.resultIndex; i < ev.results.length; i++) {
          var t = ev.results[i][0].transcript;
          if (ev.results[i].isFinal) finalText += (finalText && !/\s$/.test(finalText) ? " " : "") + t.trim();
          else interim += t;
        }
        ta.value = finalText + (interim ? (finalText ? " " : "") + interim : "");
        ta.scrollTop = ta.scrollHeight;
      };
      recog.onerror = function (ev) {
        if (ev.error === "not-allowed" || ev.error === "service-not-allowed") {
          wantRecog = false;
          note.textContent = "받아쓰기 권한이 없어 소리만 저장합니다.";
        }
      };
      recog.onend = function () {
        recogOn = false;
        if (state === "recording" && wantRecog) {
          setTimeout(function () { if (state === "recording" || state === "playing") { try { recog.start(); recogOn = true; } catch (e) {} } }, 250);
        }
      };
      try { recog.start(); recogOn = true; } catch (e) {}
    }

    function stopAll() {
      if (timer) { clearInterval(timer); timer = null; }
      if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
      if (recog) { try { recog.onend = null; recog.stop(); } catch (e) {} recog = null; recogOn = false; }
      if (rec && rec.state !== "inactive") { try { rec.stop(); } catch (e) {} }
      if (stream) { stream.getTracks().forEach(function (t) { try { t.stop(); } catch (e) {} }); stream = null; }
      if (audioCtx) { try { audioCtx.close(); } catch (e) {} audioCtx = null; }
      // 파일을 틀어 놓고 받아 적는 중이었으면 소리부터 멈춘다
      if (state === "playing") { try { player.pause(); } catch (e) {} state = "done"; }
      if (state === "recording") { releaseAwake(); }
      meterBar.style.width = "0";
    }

    // 다른 앱으로 넘어가 브라우저가 마이크를 놓았을 수 있다. 숨기지 말고 알려 준다.
    var onHide = function () {
      if (document.visibilityState === "hidden" && state === "recording") {
        warn.textContent = "화면을 벗어났어요. 그 사이 소리가 빠졌을 수 있습니다.";
      }
    };
    document.addEventListener("visibilitychange", onHide);
    var prevCleanup = modalCleanup;
    modalCleanup = function () {
      document.removeEventListener("visibilitychange", onHide);
      if (prevCleanup) prevCleanup();
    };

    function commit() {
      var text = ta.value.trim();
      var made = [];
      if (audioBlob) {
        var ext = /mp4|aac/.test(audioBlob.type) ? ".m4a" : (/ogg/.test(audioBlob.type) ? ".ogg" : ".webm");
        made.push(newBlock("file", {
          // 밖에서 불러온 파일은 «그 이름» 을 지킨다. 찾을 때 그 이름으로 찾기 때문이다.
          original: pickedName || ("녹음_" + dateStamp() + "_" + timeStamp() + ext),
          mime: audioBlob.type || "audio/webm",
          size: audioBlob.size,
          blob: audioBlob,
          /* ⚠️ 받아 적은 글을 여기(자료 제목)에 넣으면 안 된다.
             자료 제목은 «파일 이름» 에 그대로 들어가서, 말한 문장이 통째로 파일명이 된다.
             («2026-08-21_부기_협의회_아직 교사가 안 다듬어져서 요거 다듬어지고…_02.webm»)
             제목은 사람이 짧게 적는 것이고, 말한 내용은 아래 글 블록이 맡는다. */
          caption: safeName(tin.value, 40)
        }));
      }
      if (text) made.push(newBlock("text", { text: text }));
      if (!made.length) { toast("담긴 것이 없습니다."); return; }
      insertBlocks(made);
      stopAll();
      closeModal();
      toast("녹음" + (text ? "과 받아 적은 글" : "") + "을 넣었습니다.");
      if (audioBlob && !tin.value.trim()) toast2("녹음 덩어리의 «제목» 칸에 적으면 파일 이름이 됩니다.");
    }

    sync();
  }

  /* ---------- ✍️ 손 메모 · 손으로 쓰고 그린 것을 그대로 담는다 ----------
     칠판 앞에서, 회의 중에, 책 옆에서 · 자판을 두드리기 어려운 자리를 위한 것.
     획을 «점의 목록» 으로 들고 있다가 매번 다시 그린다. 되돌리기가 공짜가 되고,
     화면을 돌리거나 창 크기가 바뀌어도 그림이 뭉개지지 않는다. */
  function openDrawModal() {
    closeModal();
    var strokes = [];          // [{ color, size, eraser, pts:[{x,y,p}] }]
    var current = null;
    var pen = { color: "#1b2130", size: 3, eraser: false };
    // 저장되는 실제 크기. 폰처럼 세로로 긴 화면에서는 종이도 세로로 세운다.
    var portrait = window.innerHeight > window.innerWidth;
    var PAPER = portrait ? { w: 1100, h: 1600 } : { w: 1600, h: 1100 };

    var bg = el("div", "modal-bg");
    var m = el("div", "card modal"); m.style.maxWidth = "min(1040px, 97vw)";

    var head = el("div", "mhead");
    head.appendChild(el("h3", null, "✍️ 손 메모"));
    head.appendChild(el("span", "spacer"));
    var x = el("button", "btn sm ghost", "✕"); x.addEventListener("click", closeModal);
    head.appendChild(x);
    m.appendChild(head);

    var body = el("div", "mbody"); body.style.textAlign = "center";

    var tools = el("div", "modebar");
    function toolBtn(label, on, fn) {
      var b = el("button", "btn sm" + (on ? " primary" : ""), label);
      b.addEventListener("click", function () { fn(); syncTools(); });
      tools.appendChild(b);
      return b;
    }
    var COLORS = [["검정", "#1b2130"], ["빨강", "#d92d20"], ["파랑", "#2f5fd6"]];
    var SIZES = [["가늘게", 2], ["보통", 3.5], ["굵게", 7]];
    var colorBtns = COLORS.map(function (c) {
      return toolBtn(c[0], false, function () { pen.color = c[1]; pen.eraser = false; });
    });
    var sizeBtns = SIZES.map(function (s) {
      return toolBtn(s[0], false, function () { pen.size = s[1]; });
    });
    var eraserBtn = toolBtn("지우개", false, function () { pen.eraser = !pen.eraser; });
    body.appendChild(tools);

    var wrap = el("div", "drawwrap");
    var cv = el("canvas", "drawpad");
    wrap.appendChild(cv);
    body.appendChild(wrap);
    m.appendChild(body);

    var foot = el("div", "mfoot");
    var undo = el("button", "btn", "↩ 한 획 되돌리기");
    undo.addEventListener("click", function () { strokes.pop(); redraw(); syncTools(); });
    var clear = el("button", "btn", "전부 지우기");
    clear.addEventListener("click", function () { strokes = []; redraw(); syncTools(); });
    var save = el("button", "btn primary", "이 메모 넣기");
    save.addEventListener("click", commit);
    foot.appendChild(undo); foot.appendChild(clear);
    foot.appendChild(el("span", "spacer"));
    foot.appendChild(save);
    m.appendChild(foot);

    bg.appendChild(m);
    bg.addEventListener("click", function (e) { if (e.target === bg) closeModal(); });
    $("modalHost").appendChild(bg);
    modalEl = bg;

    function syncTools() {
      colorBtns.forEach(function (b, i) {
        b.className = "btn sm" + (!pen.eraser && pen.color === COLORS[i][1] ? " primary" : "");
      });
      sizeBtns.forEach(function (b, i) {
        b.className = "btn sm" + (pen.size === SIZES[i][1] ? " primary" : "");
      });
      eraserBtn.className = "btn sm" + (pen.eraser ? " primary" : "");
      undo.disabled = !strokes.length;
      clear.disabled = !strokes.length;
      save.disabled = !strokes.length;
    }

    /* 화면에 보이는 크기와 저장되는 크기는 다르다.
       그리는 좌표는 항상 «저장되는 크기» 기준으로 바꿔 둔다. */
    function fit() {
      var maxW = wrap.getBoundingClientRect().width;
      var maxH = Math.max(240, window.innerHeight * 0.52);   // 화면을 넘어가면 스크롤이 생겨 그리기 불편하다
      var w = Math.min(maxW, maxH * PAPER.w / PAPER.h);
      var h = w * PAPER.h / PAPER.w;
      var dpr = Math.min(2, window.devicePixelRatio || 1);
      cv.style.width = Math.round(w) + "px";
      cv.style.height = Math.round(h) + "px";
      cv.width = Math.round(w * dpr);
      cv.height = Math.round(h * dpr);
      redraw();
    }
    function toPaper(e) {
      var r = cv.getBoundingClientRect();
      return {
        x: (e.clientX - r.left) / r.width * PAPER.w,
        y: (e.clientY - r.top) / r.height * PAPER.h,
        p: (e.pressure && e.pressure > 0 && e.pointerType === "pen") ? e.pressure : 0.5
      };
    }
    function drawStroke(ctx, s, scale) {
      if (!s.pts.length) return;
      ctx.lineCap = "round"; ctx.lineJoin = "round";
      ctx.strokeStyle = s.eraser ? "#ffffff" : s.color;
      for (var i = 1; i < s.pts.length; i++) {
        var a = s.pts[i - 1], b2 = s.pts[i];
        ctx.beginPath();
        ctx.lineWidth = s.size * scale * (s.eraser ? 6 : (0.6 + b2.p));
        ctx.moveTo(a.x * scale, a.y * scale);
        ctx.lineTo(b2.x * scale, b2.y * scale);
        ctx.stroke();
      }
      if (s.pts.length === 1) {   // 점 하나만 찍은 것도 남긴다
        var q = s.pts[0];
        ctx.fillStyle = s.eraser ? "#ffffff" : s.color;
        ctx.beginPath();
        ctx.arc(q.x * scale, q.y * scale, s.size * scale * (s.eraser ? 3 : 0.6), 0, Math.PI * 2);
        ctx.fill();
      }
    }
    function paintAll(ctx, w, h) {
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, w, h);
      var scale = w / PAPER.w;
      strokes.forEach(function (s) { drawStroke(ctx, s, scale); });
      if (current) drawStroke(ctx, current, scale);
    }
    function redraw() { paintAll(cv.getContext("2d"), cv.width, cv.height); }

    cv.addEventListener("pointerdown", function (e) {
      e.preventDefault();
      cv.setPointerCapture(e.pointerId);
      current = { color: pen.color, size: pen.size, eraser: pen.eraser, pts: [toPaper(e)] };
      redraw();
    });
    cv.addEventListener("pointermove", function (e) {
      if (!current) return;
      e.preventDefault();
      var p = toPaper(e), last = current.pts[current.pts.length - 1];
      // 너무 촘촘한 점은 버린다 (긴 메모에서 획이 수천 개가 되는 것을 막는다)
      if (Math.abs(p.x - last.x) + Math.abs(p.y - last.y) < 1.2) return;
      current.pts.push(p);
      redraw();
    });
    function endStroke(e) {
      if (!current) return;
      if (e && e.pointerId != null) { try { cv.releasePointerCapture(e.pointerId); } catch (err) {} }
      strokes.push(current); current = null;
      redraw(); syncTools();
    }
    cv.addEventListener("pointerup", endStroke);
    cv.addEventListener("pointercancel", endStroke);
    cv.addEventListener("pointerleave", function (e) { if (current) endStroke(e); });

    function commit() {
      if (!strokes.length) return;
      var out = document.createElement("canvas");
      out.width = PAPER.w; out.height = PAPER.h;
      paintAll(out.getContext("2d"), PAPER.w, PAPER.h);
      canvasToAttachment(out, null).then(function (att) {
        // 드라이브에서 한눈에 알아보게 이름을 «손메모» 로 바꿔 준다
        att.original = "손메모_" + dateStamp() + "_" + timeStamp() + (/\.jpg$/.test(att.original) ? ".jpg" : ".png");
        insertBlocks([newBlock("image", att)]);
        closeModal();
        toast("손 메모를 넣었습니다. (" + humanSize(att.size) + ")");
      });
    }

    setTimeout(function () { fit(); syncTools(); }, 0);
    var refit = function () { fit(); };
    window.addEventListener("resize", refit);
    modalCleanup = function () { window.removeEventListener("resize", refit); };
  }

  /* ---------- 🔲 사진 가리기 (여러 장 한 번에) ----------
     드래그로 네모를 그리는 것보다, 얼굴 위를 «톡» 누르는 편이 훨씬 빠르다.
     그래서 원 도장이다. 크기를 고르고 누르면 그 자리에 동그랗게 뭉갠다.
     쓸어 넘기면 줄줄이 찍히니 뒷줄 아이들도 한 번에 지운다.

     찍은 자리를 «목록» 으로만 들고 있다가 매번 원본에서 다시 그린다.
     그래서 되돌리기가 공짜고, 여러 번 찍어도 화질이 상하지 않는다. */

  /* 모자이크 «칸» 크기.
     div 가 클수록 칸이 잘아진다(곱다). 곱게 갈수록 보기에 곱지만,
     너무 고우면 원래 얼굴이 되살아 보이므로 사람이 고르게 둔다. */
  var GRAINS = [
    { label: "곱게", div: 11, min: 3 },
    { label: "보통", div: 7,  min: 4 },
    { label: "굵게", div: 4,  min: 6 }
  ];
  function grainOf() {
    var i = settings.maskGrain;
    return GRAINS[(typeof i === "number" && GRAINS[i]) ? i : 1];
  }

  // 원 하나를 뭉갠다. 원 밖은 건드리지 않는다.
  function pixelateCircle(ctx, src, cx, cy, r) {
    var g = grainOf();
    var cell = Math.max(g.min, Math.round(r / g.div));
    /* ⚠️ 네모를 «잘라내야» 한다. 왼쪽·위쪽으로 넘칠 때 시작점만 0 으로 밀면
       엉뚱한 자리의 그림을 떠다가 원 안에 붙이게 된다 (가장자리 얼굴이 안 지워진다). */
    var x = Math.max(0, Math.floor(cx - r)), y = Math.max(0, Math.floor(cy - r));
    var x2 = Math.min(src.width, Math.ceil(cx + r)), y2 = Math.min(src.height, Math.ceil(cy + r));
    var w = x2 - x, h = y2 - y;
    if (w <= 0 || h <= 0) return;
    var tw = Math.max(1, Math.round(w / cell)), th = Math.max(1, Math.round(h / cell));
    var t = document.createElement("canvas");
    t.width = tw; t.height = th;
    var tc = t.getContext("2d");
    tc.imageSmoothingEnabled = false;
    tc.drawImage(src, x, y, w, h, 0, 0, tw, th);
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.clip();
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(t, 0, 0, tw, th, x, y, w, h);
    ctx.restore();
    ctx.imageSmoothingEnabled = true;
  }

  function loadBlockImage(b) {
    return new Promise(function (res, rej) {
      var url = previewUrl(b);
      var im = new Image();
      im.onload = function () { res(im); };
      im.onerror = function () { rej(new Error("사진을 열지 못했습니다")); };
      if (url) { im.src = url; return; }
      if (!b.fileId) { rej(new Error("사진이 없습니다")); return; }
      // 드라이브에 올라간 사진은 받아 와서 고친다 (같은 파일에 덮어쓴다)
      driveFetch("https://www.googleapis.com/drive/v3/files/" + b.fileId + "?alt=media&supportsAllDrives=true")
        .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.blob(); })
        .then(function (blob) { im.src = URL.createObjectURL(blob); })
        .catch(rej);
    });
  }

    var foot = el("div", "mfoot");

    var prev = el("button", "btn", "← 이전");

    next.addEventListener("click", function () { go(idx + 1); });

    foot.appendChild(el("span", "spacer"));
    foot.appendChild(prev); foot.appendChild(next); foot.appendChild(done);
    m.appendChild(foot);

    bg.appendChild(m);
    $("modalHost").appendChild(bg);
    modalEl = bg;

    function cur() { return work[photos[idx].id]; }
    function edited() {
      return photos.filter(function (b) { return work[b.id] && work[b.id].stamps.length; });
    }
    function confirmDrop() {
      if (!edited().length) return true;
      return window.confirm("가린 것이 아직 반영되지 않았습니다. 그냥 닫을까요?");
    }

    function syncSizes() {
      sizeBtns.forEach(function (b, i) { b.className = "btn sm" + (i === sizeStep ? " primary" : ""); });
      ghost.style.display = "none";
    }
    function drawStrip() {
      strip.innerHTML = "";
      photos.forEach(function (b, i) {
        var cell = el("button", "maskthumb" + (i === idx ? " on" : ""));
        var im = el("img");
        var pv = previewUrl(b);
        if (pv) im.src = pv; else if (b.fileId) loadDriveImage(b.fileId, im);
        cell.appendChild(im);
        var w = work[b.id];
        if (w && w.stamps.length) {

          cell.appendChild(chk);

        cell.addEventListener("click", function () { go(i); });

      var w = cur();
      undo.disabled = !w || !w.stamps.length;

      prev.disabled = idx === 0;
      next.disabled = idx === photos.length - 1;
      var n = edited().length;
      done.textContent = n ? "다 됐습니다 (" + n + "장)" : "닫기";

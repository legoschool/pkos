    function radius() {
      var im = cur() && cur().img;
      if (!im) return 40;
      return Math.max(8, Math.round(Math.max(im.naturalWidth, im.naturalHeight) * SIZES[sizeStep].k));
    }
    function redraw() {
      var w = cur();
      if (!w || !w.img) return;
      var im = w.img;
      cv.width = im.naturalWidth; cv.height = im.naturalHeight;
      var ctx = cv.getContext("2d");
      ctx.drawImage(im, 0, 0);
      w.stamps.forEach(function (s) { pixelateCircle(ctx, im, s.x, s.y, s.r); });
    }

    function go(i) {
      if (i < 0 || i >= photos.length) return;
      idx = i;
      var b = photos[idx];
      if (work[b.id] && work[b.id].img) { redraw(); syncAll(); return; }
      hint.textContent = "사진을 여는 중…";
      loadBlockImage(b).then(function (im) {
        work[b.id] = work[b.id] || { stamps: [] };
        work[b.id].img = im;
        hint.textContent = "가릴 자리를 누르면 그 부분이 동그랗게 가려집니다. 손가락으로 문지르면 이어서 가려집니다.";
        redraw(); syncAll();
      }).catch(function (e) {
        hint.textContent = "";
        toast("이 사진을 열지 못했습니다: " + errText(e));
      });
    }

    /* 화면 좌표 → 사진 좌표 */
    function toImage(ev) {
      var r = cv.getBoundingClientRect();
      return {
        x: (ev.clientX - r.left) / r.width * cv.width,
        y: (ev.clientY - r.top) / r.height * cv.height,
        scale: r.width / cv.width
      };
    }
    var painting = false, lastAt = null;
    function stamp(ev) {
      var w = cur();
      if (!w || !w.img) return;
      var p = toImage(ev), r = radius();
      // 쓸어 넘길 때 도장이 너무 겹쳐 쌓이지 않게 반지름의 절반쯤 간격을 둔다
      if (lastAt && Math.hypot(p.x - lastAt.x, p.y - lastAt.y) < r * 0.5) return;
      lastAt = { x: p.x, y: p.y };
      w.stamps.push({ x: p.x, y: p.y, r: r });
      var ctx = cv.getContext("2d");
      pixelateCircle(ctx, w.img, p.x, p.y, r);      // 방금 찍은 것만 덧그린다 (전체를 다시 그리면 느리다)
      syncAll();
    }
    cv.addEventListener("pointerdown", function (e) {
      e.preventDefault();
      try { cv.setPointerCapture(e.pointerId); } catch (err) {}
      painting = true; lastAt = null; stamp(e);
    });
    cv.addEventListener("pointermove", function (e) {
      var p = toImage(e), r = radius() * p.scale;
      ghost.style.display = "block";
      ghost.style.width = ghost.style.height = (r * 2) + "px";
      ghost.style.left = (e.clientX - stage.getBoundingClientRect().left - r) + "px";
      ghost.style.top = (e.clientY - stage.getBoundingClientRect().top - r) + "px";
      if (painting) { e.preventDefault(); stamp(e); }
    });
    cv.addEventListener("pointerleave", function () { ghost.style.display = "none"; });
    function stop(e) {
      if (!painting) return;
      painting = false; lastAt = null;
      if (e && e.pointerId != null) { try { cv.releasePointerCapture(e.pointerId); } catch (err) {} }
    }
    cv.addEventListener("pointerup", stop);
    cv.addEventListener("pointercancel", stop);

    /* 고친 사진을 블록에 되돌려 넣는다.
       이미 드라이브에 올라간 사진이면 «같은 파일에 덮어쓰기» 로 표시해 둔다.
       파일 아이디가 그대로라 색인이 어긋나지 않는다. */
    function commit() {
      var list = edited();
      if (!list.length) { closeModal(); return; }
      done.disabled = true; done.textContent = "바꾸는 중…";
      list.reduce(function (chain, b) {
        return chain.then(function () {
          var w = work[b.id];
          var out = document.createElement("canvas");
          out.width = w.img.naturalWidth; out.height = w.img.naturalHeight;
          var ctx = out.getContext("2d");
          ctx.drawImage(w.img, 0, 0);
          w.stamps.forEach(function (s) { pixelateCircle(ctx, w.img, s.x, s.y, s.r); });
          return new Promise(function (res) {
            var type = (b.mime === "image/png") ? "image/png" : "image/jpeg";
            out.toBlob(function (blob) {
              if (blob) {
                dropPreview(b.id);
                b.blob = blob;
                b.size = blob.size;
                b.mime = blob.type || type;
                if (b.fileId) b._remask = true;      // 같은 파일에 덮어쓸 것
                idbPut(b.id, blob);
              }
              res();
            }, type, type === "image/jpeg" ? 0.92 : undefined);
          });
        });
      }, Promise.resolve()).then(function () {
        list.forEach(function (b) { refreshAtom(b.id); });   // 가린 사진만 다시 그린다 · 종이는 그대로
        touchDraft();
        closeModal();
        var already = list.filter(function (b) { return b._remask; }).length;
        toast(list.length + "장을 가렸습니다." + (already ? " 저장하면 드라이브 사진도 바뀝니다." : ""));
      });
    }

    syncSizes();
    go(0);
  }

  // 사진이 있으면 «사진 가리기» 줄을 보여 준다
  function syncMaskBar() {
    var bar = $("maskBar");
    if (!bar) return;
    var n = 0;
    if (paper) Array.prototype.forEach.call(paper.querySelectorAll('.atom[data-kind="image"]'), function (f) {
      var b = atomStore[f.getAttribute("data-bid")];
      if (b && (b.blob || b.fileId)) n++;
    });
    bar.classList.toggle("hidden", !n);
    if (n) {
      $("maskBarHint").textContent = "사진 " + n + "장 · 얼굴·이름표를 한 번에 지울 수 있습니다.";
    }
  }

  /* 이미 넣어 둔 사진을 다시 열어 가리기.
     ⚠️ 전에는 «아직 안 올라간 사진» 만 다뤘다. 그런데 사고가 나는 자리는 정반대다. 
     이미 올라간 사진에서 학생 얼굴을 뒤늦게 발견했을 때다. 공유 관문이 「편집 → 가리기 로
     지우세요」 라고 일러 주는데, 정작 거기 가면 «가릴 수 없습니다» 가 떴다.
     이제는 드라이브에서 받아 와 고치고, 같은 파일에 덮어쓴다 (파일 ID 가 그대로라 색인이 안 어긋난다). */
  function openMaskForBlock(b) {
    if (!previewUrl(b) && !b.fileId) { toast("사진을 찾지 못했습니다."); return; }
    if (!previewUrl(b)) toast("드라이브에서 사진을 받아 오는 중…");
    loadBlockImage(b).then(function (im) {
      var c = document.createElement("canvas");
      c.width = im.naturalWidth; c.height = im.naturalHeight;
      c.getContext("2d").drawImage(im, 0, 0);
      // 여러 번 가려도 이름에 «_잘라냄» 이 겹겹이 붙지 않게 한 번만 남긴다
      openCropModal(c, String(b.original || "").replace(/(_잘라냄)+(\.[^.]+)?$/, "$2"), b);
    }).catch(function (e) {
      toast("사진을 열지 못했습니다: " + errText(e));
      if (b.fileId && !accessToken) toast2("구글 로그인이 풀렸습니다. [동기화] 를 눌러 다시 연결해 주세요.");
    });
  }

  function openCropModal(canvas, srcName, replaceBlock) {
    closeModal();
    var full = canvas;
    /* 모자이크는 «원본을 그대로 두고 가린 자리 목록만» 들고 있다가 매번 다시 그린다.
       그래야 되돌리기가 공짜다. 지운 자리는 원본에서 지워지므로 올라가는 파일에는 남지 않는다. */
    var orig = document.createElement("canvas");
    orig.width = full.width; orig.height = full.height;
    orig.getContext("2d").drawImage(full, 0, 0);
    var mosaics = [];
    var mode = replaceBlock ? "mask" : "crop";   // "crop" 또는 "mask"
    var bg = el("div", "modal-bg");
    var m = el("div", "card modal"); m.style.maxWidth = "min(960px, 96vw)";

    var head = el("div", "mhead");
    head.appendChild(el("h3", null, "📸 캡처 영역 고르기"));
    head.appendChild(el("span", "spacer"));
    var x = el("button", "btn sm ghost", "✕"); x.addEventListener("click", closeModal);
    head.appendChild(x);
    m.appendChild(head);

    var body = el("div", "mbody"); body.style.textAlign = "center";

    /* --- 하는 일 고르기: 자르기 / 가리기 --- */
    var modeBar = el("div", "modebar");
    var bCrop = el("button", "btn sm primary", "✂️ 자르기");
    var bMask = el("button", "btn sm", "🔲 모자이크로 가리기");
    modeBar.appendChild(bCrop); modeBar.appendChild(bMask);
    body.appendChild(modeBar);

    var wrap = el("div", "cropwrap");
    var img = el("img");
    img.src = full.toDataURL("image/png");
    img.draggable = false;
    var sel = el("div", "cropsel"); sel.style.display = "none";
    var sizeTag = el("div", "cropsize"); sel.appendChild(sizeTag);
    wrap.appendChild(img); wrap.appendChild(sel);
    body.appendChild(wrap);
    var hint = el("p", "crophint", "");
    body.appendChild(hint);
    m.appendChild(body);

    var foot = el("div", "mfoot");
    var info = el("span", "desc"); info.style.margin = "0";
    info.textContent = full.width + " × " + full.height + " px";
    foot.appendChild(info);
    foot.appendChild(el("span", "spacer"));
    var again = el("button", "btn", srcName ? "다시 고르기" : "다시 찍기");
    again.addEventListener("click", function () { closeModal(); setTimeout(openCaptureSheet, 200); });
    var whole = el("button", "btn", "전체 사용");
    whole.addEventListener("click", function () { useRegion(0, 0, full.width, full.height); });
    var undo = el("button", "btn", "↩ 마지막 가린 것 되돌리기");
    undo.style.display = "none";
    undo.addEventListener("click", function () { mosaics.pop(); repaint(); syncMode(); });
    var useSel = el("button", "btn primary", "선택 영역 사용");
    useSel.disabled = true;
    foot.appendChild(again); foot.appendChild(undo); foot.appendChild(whole); foot.appendChild(useSel);
    m.appendChild(foot);

    /* --- 모자이크 --- */
    function paintMosaic(ctx, r) {
      // 잘게 줄였다가 매끄럽게 하지 않고 다시 키우면 «네모칸» 이 된다
      // 칸이 잘면 원래 그림이 비쳐 보인다. 얼굴·이름표를 가리는 것이 목적이라 굵게 잡는다.
      var cell = Math.max(6, Math.round(Math.max(r.w, r.h) / 10));
      var tw = Math.max(1, Math.round(r.w / cell)), th = Math.max(1, Math.round(r.h / cell));
      var t = document.createElement("canvas");
      t.width = tw; t.height = th;
      var tc = t.getContext("2d");
      tc.imageSmoothingEnabled = false;
      tc.drawImage(orig, r.x, r.y, r.w, r.h, 0, 0, tw, th);
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(t, 0, 0, tw, th, r.x, r.y, r.w, r.h);
      ctx.imageSmoothingEnabled = true;
    }
    function repaint() {
      var ctx = full.getContext("2d");
      ctx.clearRect(0, 0, full.width, full.height);
      ctx.drawImage(orig, 0, 0);
      mosaics.forEach(function (r) { paintMosaic(ctx, r); });
      img.src = full.toDataURL("image/png");
      rect = null; paintSel();
    }
    function syncMode() {
      var masking = mode === "mask";
      bCrop.className = masking ? "btn sm" : "btn sm primary";
      bMask.className = masking ? "btn sm primary" : "btn sm";
      undo.style.display = (masking && mosaics.length) ? "" : "none";
      useSel.textContent = masking ? "이 부분 가리기" : "선택 영역 사용";
      whole.textContent = masking ? "가린 채로 전체 사용" : "전체 사용";
      head.firstChild.textContent = masking ? "🔲 가릴 곳 고르기" : "📸 캡처 영역 고르기";
      hint.textContent = masking
        ? "얼굴·이름표처럼 가릴 곳을 드래그한 뒤 «이 부분 가리기» 를 누르세요. 여러 곳을 이어서 가릴 수 있습니다. 가린 것은 올라가는 사진 자체에서 지워집니다."
        : "이미지 위에서 드래그해 저장할 영역을 고르세요. 그냥 전체를 쓰려면 «전체 사용»을 누르면 됩니다.";
      paintSel();
    }
    bCrop.addEventListener("click", function () { mode = "crop"; syncMode(); });
    bMask.addEventListener("click", function () { mode = "mask"; syncMode(); });

    bg.appendChild(m);
    bg.addEventListener("click", function (e) { if (e.target === bg) closeModal(); });
    $("modalHost").appendChild(bg);
    modalEl = bg;

    /* --- 드래그로 영역 선택 --- */
    var start = null, rect = null;
    function pos(e) {
      var r = img.getBoundingClientRect();
      var p = (e.touches && e.touches[0]) ? e.touches[0] : e;
      return {
        x: Math.max(0, Math.min(r.width, p.clientX - r.left)),
        y: Math.max(0, Math.min(r.height, p.clientY - r.top))
      };
    }
    function paintSel() {
      if (!rect) { sel.style.display = "none"; useSel.disabled = true; return; }
      sel.style.display = "block";
      sel.style.left = rect.x + "px"; sel.style.top = rect.y + "px";
      sel.style.width = rect.w + "px"; sel.style.height = rect.h + "px";
      var s = full.width / img.clientWidth;
      sizeTag.textContent = Math.round(rect.w * s) + " × " + Math.round(rect.h * s) + " px";
      useSel.disabled = rect.w < 8 || rect.h < 8;
    }
    function down(e) {
      e.preventDefault();
      start = pos(e); rect = { x: start.x, y: start.y, w: 0, h: 0 }; paintSel();
      window.addEventListener("mousemove", move);
      window.addEventListener("mouseup", up);
      window.addEventListener("touchmove", move, { passive: false });
      window.addEventListener("touchend", up);
    }
    function move(e) {
      if (!start) return;
      e.preventDefault();
      var p = pos(e);
      rect = { x: Math.min(start.x, p.x), y: Math.min(start.y, p.y), w: Math.abs(p.x - start.x), h: Math.abs(p.y - start.y) };
      paintSel();
    }
    function up() {
      start = null;
      window.removeEventListener("mousemove", move);
      window.removeEventListener("mouseup", up);
      window.removeEventListener("touchmove", move);
      window.removeEventListener("touchend", up);
    }
    wrap.addEventListener("mousedown", down);
    wrap.addEventListener("touchstart", down, { passive: false });

    useSel.addEventListener("click", function () {
      if (!rect) return;
      var s = full.width / img.clientWidth;
      var r = { x: Math.round(rect.x * s), y: Math.round(rect.y * s), w: Math.round(rect.w * s), h: Math.round(rect.h * s) };
      if (mode === "mask") {
        mosaics.push(r); repaint(); syncMode();
        toast("가렸습니다. 더 가릴 곳이 있으면 이어서 드래그하세요.");
        return;
      }
      useRegion(r.x, r.y, r.w, r.h);
    });
    syncMode();

    function useRegion(sx, sy, sw, sh) {
      sw = Math.max(1, Math.min(sw, full.width - sx));
      sh = Math.max(1, Math.min(sh, full.height - sy));
      var c = document.createElement("canvas");
      c.width = sw; c.height = sh;
      c.getContext("2d").drawImage(full, sx, sy, sw, sh, 0, 0, sw, sh);
      canvasToAttachment(c, srcName).then(function (att) {
        if (replaceBlock) {
          // 같은 자리에 그대로 갈아 끼운다. 캡션·순서는 건드리지 않는다.
          var wasUp = !!replaceBlock.fileId;
          dropPreview(replaceBlock.id);
          // 드라이브에 이미 있는 사진이면 «파일 이름» 은 그대로 둔다. 이름이 바뀌면 링크가 어긋난다.
          if (!wasUp) replaceBlock.original = att.original;
          replaceBlock.mime = att.mime;
          replaceBlock.size = att.size;
          replaceBlock.blob = att.blob;
          if (wasUp) replaceBlock._remask = true;   // 같은 파일에 덮어쓸 것
          idbPut(replaceBlock.id, att.blob);
          refreshAtom(replaceBlock.id);
          touchDraft();
          closeModal();
          toast("가린 사진으로 바꿨습니다. (" + humanSize(att.size) + ")");
          if (wasUp) toast2("저장하면 드라이브의 사진도 가린 것으로 바뀝니다.");
          return;
        }
        insertBlocks([newBlock("image", att)]);
        closeModal();
        toast("캡처 " + sw + "×" + sh + " 를 추가했습니다. (" + humanSize(att.size) + ")");
      });
    }
  }

  /* ---------- [[ 입력하면 뜨는 기록 고르기 ---------- */
  var wikiState = { field: null, start: -1, items: [], sel: 0 };

  function hideWikiPop() {
    $("wikiPop").classList.add("hidden");
    wikiState.field = null;
  }
  // 커서 바로 앞에 아직 닫히지 않은 "[[" 가 있는지
  function activeWikiQuery(field) {
    var v = field.value.slice(0, field.selectionStart);
    var i = v.lastIndexOf("[[");
    if (i < 0) return null;
    var after = v.slice(i + 2);
    if (after.indexOf("]]") >= 0 || after.indexOf("\n") >= 0 || after.length > 40) return null;
    return { start: i, q: after };
  }
  function paintWikiPop() {
    var pop = $("wikiPop");
    pop.innerHTML = "";
    pop.appendChild(el("div", "cap", "기록 고르기 · ↑↓ 이동, Enter 넣기, Esc 닫기"));
    wikiState.items.forEach(function (it, i) {
      var b = el("button", "wp" + (i === wikiState.sel ? " on" : ""));
      b.type = "button";
      b.appendChild(document.createTextNode(it.label));
      b.appendChild(el("small", null, it.sub));
      b.addEventListener("mousedown", function (e) { e.preventDefault(); applyWikiPick(i); });
      pop.appendChild(b);
    });
    pop.classList.remove("hidden");
    var r = wikiState.rect || wikiState.field.getBoundingClientRect();   // 종이에서는 커서 자리
    var top = r.bottom + window.scrollY + 4;
    var left = r.left + window.scrollX;
    pop.style.top = top + "px";
    pop.style.left = Math.min(left, window.innerWidth - 260) + "px";
    pop.style.width = Math.min(r.width, 340) + "px";
  }
  function updateWikiPop(field) {
    var a = activeWikiQuery(field);
    if (!a) { hideWikiPop(); return; }
    var q = normTitle(a.q);
    var items = entries
      .filter(function (n) { return n.id !== editingId && n.title; })
      .filter(function (n) { return !q || normTitle(n.title).indexOf(q) >= 0; })
      .slice(0, 8)
      .map(function (n) { return { label: n.title, sub: typeOf(n.type).icon + " " + typeOf(n.type).label + " · " + formatDate(n.createdAt) }; });
    if (a.q.trim()) items.push({ label: a.q.trim(), sub: "＋ 이 제목으로 새 기록 연결하기", isNew: true });
    if (!items.length) { hideWikiPop(); return; }
    wikiState = { field: field, start: a.start, items: items, sel: 0 };
    paintWikiPop();
  }
  function applyWikiPick(i) {
    var st = wikiState;
    if (!st.field || !st.items[i]) return;
    var f = st.field, title = st.items[i].label;
    if (st.paper) { applyWikiPaper(title); return; }   // 종이 위에서는 글자 노드를 잘라 넣는다
    var before = f.value.slice(0, st.start);
    var after = f.value.slice(f.selectionStart);
    var insert = "[[" + title + "]]";
    f.value = before + insert + after;
    var caret = before.length + insert.length;
    f.setSelectionRange(caret, caret);
    f.dispatchEvent(new Event("input", { bubbles: true }));
    hideWikiPop();
    f.focus();
  }
  function wikiKeydown(e) {
    var pop = $("wikiPop");
    if (pop.classList.contains("hidden") || !wikiState.field) return;
    if (e.key === "ArrowDown") { e.preventDefault(); wikiState.sel = (wikiState.sel + 1) % wikiState.items.length; paintWikiPop(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); wikiState.sel = (wikiState.sel - 1 + wikiState.items.length) % wikiState.items.length; paintWikiPop(); }
    else if ((e.key === "Enter" && !e.ctrlKey && !e.metaKey) || e.key === "Tab") {
      e.preventDefault(); e.stopPropagation(); applyWikiPick(wikiState.sel);
    }
    else if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); hideWikiPop(); }
  }
  // 글·소제목·인용 칸에 자동완성을 붙인다
  function attachWiki(field) {
    field.addEventListener("input", function () { updateWikiPop(field); });
    field.addEventListener("keydown", wikiKeydown);
    field.addEventListener("click", function () { updateWikiPop(field); });
    field.addEventListener("blur", function () { setTimeout(function () { if (wikiState.field === field) hideWikiPop(); }, 120); });
  }

  function handlePaste(e, afterBlock) {
    var items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    var files = [];
    for (var i = 0; i < items.length; i++) {
      if (items[i].kind === "file") { var f = items[i].getAsFile(); if (f) files.push(f); }
    }
    if (!files.length) return;
    e.preventDefault();
    acceptFiles(files, afterBlock);
  }

  // 첨부는 Blob 그대로 들고 있는다 (base64 문자열로 부풀리지 않음)
  var objUrls = {};
  function previewUrl(b) {
    if (objUrls[b.id]) return objUrls[b.id];
    if (!(b.blob instanceof Blob)) { if (b.blob) delete b.blob; return null; }
    try { objUrls[b.id] = URL.createObjectURL(b.blob); } catch (e) { return null; }
    return objUrls[b.id];
  }
  function dropPreview(id) {
    if (objUrls[id]) { try { URL.revokeObjectURL(objUrls[id]); } catch (e) {} delete objUrls[id]; }
  }

  /* ⚠️ 브라우저로 녹음한 소리(webm)에는 «얼마나 긴지» 가 안 적혀 있다.
     MediaRecorder 가 그렇게 만든다. 그래서 재생기가 「Infinity:NaN」 을 띄우고,
     막대를 끌어 옮길 수도 없어 **소리가 잘린 것처럼** 보인다. 파일이 상한 것이 아니다.
     맨 끝으로 한 번 보내면 브라우저가 길이를 세어 준다. 세고 나면 제자리로 돌려놓는다. */
  function fixAudioDuration(a) {
    function tryFix() {
      if (a.duration !== Infinity && !isNaN(a.duration)) return;
      var back = function () {
        a.removeEventListener("timeupdate", back);
        a.currentTime = 0;
      };
      a.addEventListener("timeupdate", back);
      try { a.currentTime = 1e101; } catch (e) { a.removeEventListener("timeupdate", back); }
    }
    a.addEventListener("loadedmetadata", tryFix);
    if (a.readyState > 0) tryFix();
  }

  function acceptFiles(fileList, afterBlock) {
    var files = Array.prototype.slice.call(fileList || []);
    if (!files.length) return Promise.resolve();
    var made = [];
    files.forEach(function (f) {
      if (f.size > MAX_FILE_MB * 1024 * 1024) {
        toast("「" + f.name + "」" + josa(f.name, "은", "는") + " " + MAX_FILE_MB + "MB 를 넘어 건너뜁니다. (" + humanSize(f.size) + ")");
        if (/^video\//.test(f.type || "")) {
          toast2("긴 영상은 유튜브에 «일부공개» 로 올리고 «코드 삽입» 에 주소를 넣는 편이 낫습니다.");
        }
        return;
      }
      var mime = f.type || "application/octet-stream";
      made.push(newBlock(/^image\//.test(mime) ? "image" : "file", {
        original: f.name || "file", mime: mime, size: f.size, blob: f
      }));
    });
    if (!made.length) return Promise.resolve();
    insertBlocks(made, afterBlock);    // 커서 자리에 · 글 사이에 그대로 박힌다
    toast(made.length + "개를 넣었습니다.");
    return Promise.resolve();
  }

  /* =========================================================
     8-9. 임시저장 · 쓰다가 창이 꺼져도 그대로 남는다
     ========================================================= */
  var draftDirty = false, draftRestored = false;
  function touchDraft() { draftDirty = true; }

  function draftHasContent() {
    return !!($("title").value.trim() || $("tags").value.trim() || hasContent());
  }
  var lastDraftBody = null;
  function saveDraft() {
    if (!draftHasContent()) { clearDraft(true); return; }
    var body = {
      editingId: editingId,
      type: currentType,
      title: $("title").value,
      tags: $("tags").value,
      inbox: !!($("inboxChk") && $("inboxChk").checked),
      blocks: syncFromPaper().map(function (b) { var c = cloneBlock(b); delete c.blob; return c; })
    };
    var json = JSON.stringify(body);
    if (json === lastDraftBody) return;   // 바뀐 게 없으면 그냥 둔다
    lastDraftBody = json;
    var payload = body;
    payload.savedAt = Date.now();
    try { localStorage.setItem(LS.draft, JSON.stringify(payload)); } catch (e) {}
    // 아직 안 올린 파일 본문은 IndexedDB 에 (기록과 같은 방식)
    blocks.forEach(function (b) {
      if ((b.kind === "image" || b.kind === "file") && !b.fileId && b.blob) idbPut(b.id, b.blob);
    });
    showDraftBar(payload.savedAt);
  }
  function clearDraft(silent) {
    var d = safeParse(localStorage.getItem(LS.draft));
    localStorage.removeItem(LS.draft);
    // 저장되지 않고 버려진 임시 파일 정리
    if (d && d.blocks) {
      var keep = {};
      entries.forEach(function (n) { (n.blocks || []).forEach(function (b) { keep[b.id] = 1; }); });
      d.blocks.forEach(function (b) { if (!keep[b.id]) idbDel(b.id); });
    }
    draftDirty = false;
    lastDraftBody = null;
    if (!silent) toast("임시 보관한 내용을 지웠습니다.");
    hideDraftBar();
  }
  function restoreDraft() {
    var d = safeParse(localStorage.getItem(LS.draft));
    if (!d || !d.blocks) return false;
    var hasText = (d.title || "").trim() || (d.tags || "").trim() ||
      d.blocks.some(function (b) { return b.text || b.url || b.name; });
    if (!hasText) { localStorage.removeItem(LS.draft); return false; }

    editingId = d.editingId || null;
    currentType = d.type || currentType;
    $("title").value = d.title || "";
    $("tags").value = d.tags || "";
    if ($("inboxChk")) $("inboxChk").checked = !!d.inbox;
    blocks = d.blocks.map(cloneBlock);
    if (editingId) {
      $("composerTitle").textContent = "✏️ 기록 편집 (이어 쓰는 중)";
      $("btnSave").textContent = "수정 저장";
      $("btnCancelEdit").classList.remove("hidden");
      syncDeleteBtn();
    }
    renderTypeChips(); renderBlocks(); histReset();
    // 파일 본문 되살리기
    idbAll().then(function (map) {
      var changed = false;
      blocks.forEach(function (b) {
        if ((b.kind === "image" || b.kind === "file") && (!b.fileId || b._remask) && !b.blob && map[b.id] instanceof Blob) {
          b.blob = map[b.id]; changed = true;
        }
      });
      if (changed) blocks.forEach(function (b) { if (b.blob && isAtomKind(b.kind)) refreshAtom(b.id); });
    });
    draftRestored = true;
    lastDraftBody = null;
    showDraftBar(d.savedAt, true);
    toast("쓰다 만 내용을 되살렸습니다. 이어서 쓰시면 됩니다.");
    return true;
  }

  function showDraftBar(at, restored) {
    var bar = $("draftBar");
    bar.innerHTML = "";
    var t = at ? formatDate(at) : "";
    var txt = el("span", "grow", restored
      ? "⏳ 쓰다 만 내용을 되살렸습니다" + (t ? " (" + t + " 저장)" : "") + " · 이어서 쓰시면 됩니다."
      : "⏳ 임시 보관 중" + (t ? " · " + t : ""));
    bar.appendChild(txt);
    var b2 = el("button", "btn sm", "새로 쓰기");
    b2.title = "지금 쓰던 내용을 버리고 빈 화면으로";
    b2.addEventListener("click", function () {
      if (draftHasContent() && !window.confirm("쓰던 내용을 버리고 새로 시작할까요?")) return;
      clearDraft();
      resetComposer();
    });
    bar.appendChild(b2);
    bar.classList.remove("hidden");
  }
  function hideDraftBar() { $("draftBar").classList.add("hidden"); }

  // 1.5초마다, 그리고 탭을 벗어나거나 닫을 때 저장
  setInterval(function () { if (draftDirty) { draftDirty = false; saveDraft(); } }, 1500);
  window.addEventListener("beforeunload", function () { if (draftDirty) saveDraft(); });
  document.addEventListener("visibilitychange", function () { if (document.hidden && draftDirty) saveDraft(); });
  window.addEventListener("pagehide", function () { if (draftDirty) saveDraft(); });

  /* =========================================================
     9. 저장 / 편집
     ========================================================= */
  function resetComposer() {
    editingId = null;
    currentType = settings.types[0] ? settings.types[0].key : "";
    $("title").value = ""; $("tags").value = "";
    if ($("inboxChk")) $("inboxChk").checked = false;
    blocks = [];
    renderTypeChips(); renderBlocks(); histReset();
    $("composerTitle").textContent = "✍️ 새 기록";
    $("btnSave").textContent = "기록 저장";
    $("btnCancelEdit").classList.add("hidden");
    syncDeleteBtn();
    renderDeskLine();   // 자리는 그대로 · 이어서 같은 폴더에 한 편 더 쓰는 것이 보통이다
  }

  function loadIntoComposer(n) {
    editingId = n.id;
    currentType = n.type;
    $("title").value = n.title || "";
    $("tags").value = (n.tags || []).join(", ");
    if ($("inboxChk")) $("inboxChk").checked = !!n.inbox;
    blocks = (n.blocks || []).map(cloneBlock);
    renderTypeChips(); renderBlocks(); histReset();
    $("composerTitle").textContent = "✏️ 기록 편집";
    $("btnSave").textContent = "수정 저장";
    $("btnCancelEdit").classList.remove("hidden");
    syncDeleteBtn();
    // 고치러 왔는데 작성칸이 접혀 있으면 아무 데도 못 쓴다
    composerFolded = false;
    applyComposerFold();
    renderDeskLine();
    render();                       // 목록에서 «지금 보고 있는 줄» 표시를 옮긴다
    if (!scrollEditorTop()) window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function hasContent() {
    syncFromPaper();
    return blocks.some(function (b) {
      if (b.kind === "image" || b.kind === "file") return true;
      if (b.kind === "link") return !!b.url;
      if (b.kind === "embed") return !!(b.code && b.code.trim());
      if (b.kind === "todo" || b.kind === "list") return hasLine(b);
      if (b.kind === "table") return hasCell(b);
      if (b.kind === "fold") return !!((b.title && b.title.trim()) || (b.text && b.text.trim()));
      if (b.kind === "divider") return false;
      return !!(b.text && b.text.trim());
    });
  }
  /* 줄이 여럿인 블록은 «한 줄이라도 글자가 있으면» 내용이 있는 것이다 */
  function hasLine(b) {
    return (b.items || []).some(function (it) { return it.t && it.t.trim(); });
  }
  /* 표는 «머리든 칸이든 글자가 하나라도» 있으면 내용이 있는 것이다 */
  function hasCell(b) {
    var any = (b.head || []).some(function (h) { return h && h.trim(); });
    return any || (b.rows || []).some(function (r) {
      return (r || []).some(function (c) { return c && String(c).trim(); });
    });
  }

  function saveEntry() {
    var title = $("title").value.trim();
    if (!title && !hasContent()) { toast("제목이나 내용을 입력해 주세요."); return; }

    var now = Date.now(), n;
    if (editingId) {
      n = entries.filter(function (x) { return x.id === editingId; })[0];
      if (!n) { resetComposer(); return; }
      var keep = {}, keepIds = {};
      blocks.forEach(function (b) { if (b.fileId) keep[b.fileId] = 1; keepIds[b.id] = 1; });
      (n.blocks || []).forEach(function (b) {
        // ⚠️ 폴더에서 끌어온 원본은 «빼도» 버리지 않는다. 내가 만든 파일이 아니다.
        if (b.fileId && !keep[b.fileId] && b.fileId !== n.srcId) trashFile(b.fileId);
        if (!b.fileId && !keepIds[b.id]) idbDel(b.id);   // 빠진 대기 첨부 정리
      });
    } else {
      n = { id: uid("k_"), createdAt: now };
      /* 새 기록에만 자리를 찍는다. 고쳐 쓰는 기록은 제 자리에 그대로 둔다 ·
         「부기」에 쓴 글이 나중에 「수업」을 보다가 고쳤다고 옮겨 가면 안 된다. */
      if (desk) {
        n.deskId = desk.id || null;
        n.deskName = desk.name || "";
        n.deskPath = (desk.path || []).slice();
      }
      entries.unshift(n);
    }

    n.type = currentType;
    n.title = title || "(제목 없음)";
    n.tags = cleanTags($("tags").value);
    n.inbox = !!($("inboxChk") && $("inboxChk").checked);
    n.updatedAt = now;
    n._dirty = true;

    // 빈 블록 제거 + 링크 정규화 + 첨부 최종 이름 확정
    var order = 0;
    n.blocks = blocks.filter(function (b) {
      if (b.kind === "divider") return true;
      if (b.kind === "image" || b.kind === "file") return true;
      if (b.kind === "link") return !!(b.url && b.url.trim());
      if (b.kind === "embed") return !!(b.code && b.code.trim());
      if (b.kind === "todo" || b.kind === "list") return hasLine(b);
      if (b.kind === "table") return hasCell(b);
      if (b.kind === "fold") return !!((b.title && b.title.trim()) || (b.text && b.text.trim()));
      return !!(b.text && b.text.trim());
    }).map(function (b) {
      var c = cloneBlock(b);
      // 빈 줄은 저장할 때 걷어낸다 · Enter 를 눌러 두고 안 채운 줄이 그대로 남으면 안 된다
      if (c.kind === "todo" || c.kind === "list") {
        c.items = (c.items || []).filter(function (it) { return it.t && it.t.trim(); })
          .map(function (it) { it.t = it.t.trim(); return it; });
      }
      if (c.kind === "link" && !/^(https?:|mailto:)/i.test(c.url)) c.url = "https://" + c.url.replace(/^\/+/, "");
      if (c.kind === "image" || c.kind === "file") {
        order++;
        if (!c.name) c.name = attachName(n, order, c.original || "file", c);
      }
      return c;
    });

    saveLocal();
    localStorage.removeItem(LS.draft);   // 진짜 저장됐으니 임시본은 지운다
    draftDirty = false; lastDraftBody = null;
    hideDraftBar();
    resetComposer();
    render();
    toast(connected ? "저장했습니다. 드라이브에 올리는 중…" : "이 기기에 저장했습니다. (드라이브 미연결)");
    if (connected) syncPending();
  }

  /* ---- 삭제는 두 걸음이다 ----
     ⚠️ 예전에는 한 번에 지웠다. 드라이브 파일까지 같이. 잘못 눌렀을 때 되돌릴 길이
        「드라이브 휴지통을 직접 뒤지기」 뿐이었다. 십삼 년치를 담는 도구에서
        되돌릴 수 없는 단추가 카드마다 늘 나와 있으면 안 된다.
     이제 한 번 누르면 «휴지통» 에 들어간다. 드라이브는 아직 그대로다.
     휴지통에서 다시 한 번 눌러야 진짜로 지운다. */
  function removeEntry(id) {
    var n = entries.filter(function (x) { return x.id === id; })[0];
    if (!n) return;
    n.trashed = true;
    n.trashedAt = Date.now();
    n.updatedAt = Date.now();
    n._dirty = true;
    if (editingId === id) resetComposer();
    saveLocal(); render();
    if (connected) saveIndex().catch(function () {});
    toast2("휴지통에서 되돌릴 수 있습니다.");
    var nm = safeName(n.title || "", 20);
    toast("「" + nm + "」" + josa(nm, "을", "를") + " 휴지통으로 보냈습니다.");
  }
  /* 작성칸의 «🗑️ 삭제» · 고치는 중일 때만 선다.
     ⚠️ 지우는 길이 카드의 ⋯ 안에만 있었다. 고치러 들어온 사람은 그 카드를 안 보고 있어서
        「삭제 기능이 없다」 가 됐다. 지금 열어 둔 그 기록을 바로 지울 수 있어야 한다. */
  function syncDeleteBtn() {
    var b = $("btnDeleteEntry");
    if (!b) return;
    b.classList.toggle("hidden", !editingId);
  }
  function deleteEditing() {
    if (!editingId) return;
    var n = entries.filter(function (x) { return x.id === editingId; })[0];
    if (!n) return;
    var id = n.id, imported = !!n.srcId;
    /* 두 갈래를 한 창에서 고르게 한다 · 「휴지통으로」 와 「파일까지 지우기」.
       무엇이 지워지는지 먼저 적고, 되돌릴 수 있는 쪽을 기본 단추로 둔다. */
    confirmModal("「" + (n.title || "제목 없음") + "」" + josa(n.title || "제목 없음", "을", "를") + " 지울까요?",
      "휴지통으로 보내면 나중에 되돌릴 수 있습니다.\n드라이브의 파일도 그대로 남습니다.\n\n바로 다 지우려면 아래 «완전히 삭제» 를 누르세요." +
      (!connected ? "\n드라이브에 연결되어 있지 않아 이 기기에서만 지워집니다." : imported ? "\n\n이 기록은 폴더에서 끌어온 것이라, 완전히 삭제해도 드라이브의 원본 파일은 그대로 남습니다." : "\n\n완전히 삭제하면 드라이브의 .md 파일과 첨부 자료도 함께 휴지통으로 이동합니다."),
      function () { removeEntry(id); },
      "🗑️ 휴지통으로",
      null,
      { label: "🗑️ 완전히 삭제", danger: true, run: function () { purgeEntry(id); } });
  }

  function restoreEntry(id) {
    var n = entries.filter(function (x) { return x.id === id; })[0];
    if (!n) return;
    delete n.trashed; delete n.trashedAt;
    n.updatedAt = Date.now(); n._dirty = true;
    saveLocal(); render();
    if (connected) saveIndex().catch(function () {});
    toast("되돌렸습니다.");
  }
  function purgeEntry(id) {
    var n = entries.filter(function (x) { return x.id === id; })[0];
    if (!n) return;
    /* 폴더에서 끌어온 자료(srcId)는 «원래부터 있던 남의 파일» 이다.
       목록에서 빼는 것과 파일을 버리는 것은 전혀 다른 일이라, 여기서는 목록에서만 뺀다.
       ⚠️ 이걸 안 가르면 십삼 년치를 훑어 온 사람이 한 편 지웠을 때 원본이 사라진다. */
    var imported = !!n.srcId;
    confirmModal("완전히 삭제할까요?",
      "「" + (n.title || "") + "」" + "\n\n이건 되돌릴 수 없습니다." + (!connected
        ? "\n이 기기에서 삭제됩니다."
        : imported
          ? "\n목록에서만 뺍니다. 폴더에서 끌어온 것이라 드라이브의 원본 파일은 그대로 남습니다."
          : "\n드라이브의 .md 파일과 첨부 자료도 함께 휴지통으로 이동합니다."),
      function () {
        purgeNow(id);
        saveLocal(); render();
        if (connected) saveIndex().catch(function () {});
        toast("완전히 삭제했습니다.");
      });
  }
  /* 진짜로 지우는 한 편 · 한 편씩 지울 때와 «휴지통 비우기» 가 같은 길을 쓴다.
     ⚠️ 여기만 드라이브 파일을 건드린다. 이 한 곳에 모아 두어야, 나중에 지우기를
        또 만들었을 때 «어디는 파일을 지우고 어디는 안 지우는» 일이 안 생긴다. */
  function purgeNow(id) {
    var n = entries.filter(function (x) { return x.id === id; })[0];
    if (!n) return;
    var imported = !!n.srcId;
    if (connected && !imported) {
      if (n.folderId) {
        trashFile(n.folderId);        // 기록 폴더째로 (안의 파일도 함께)
      } else {
        trashFile(n.mdId);
        (n.blocks || []).forEach(function (b) { if (b.fileId) trashFile(b.fileId); });
      }
    }
    // 다른 기록이 걸어둔 연결도 정리
    entries.forEach(function (x) {
      if (!x.relations) return;
      var before = x.relations.length;
      x.relations = x.relations.filter(function (r) { return r.to !== id; });
      if (x.relations.length !== before) { x.updatedAt = Date.now(); x._dirty = true; }
    });
    (n.blocks || []).forEach(function (b) { if (!b.fileId) idbDel(b.id); });
    addTomb(id);
    entries = entries.filter(function (x) { return x.id !== id; });
    if (editingId === id) resetComposer();
  }

  /* =========================================================
     10. 목록 렌더
     ========================================================= */
  /* 썸네일은 «화면에 들어올 때» 불러온다.
     예전에는 카드당 6장까지만 불러와서, 사진이 많으면 나머지가 빈 칸으로 남았다. */
  var lazyObs = null;
  function lazyDriveImage(fileId, imgEl) {
    if (!fileId) return;
    if (imgUrlCache[fileId]) { imgEl.src = imgUrlCache[fileId]; return; }
    if (typeof IntersectionObserver === "undefined") { loadDriveImage(fileId, imgEl); return; }
    if (!lazyObs) {
      lazyObs = new IntersectionObserver(function (rows) {
        rows.forEach(function (row) {
          if (!row.isIntersecting) return;
          lazyObs.unobserve(row.target);
          loadDriveImage(row.target.getAttribute("data-fid"), row.target);
        });
      }, { rootMargin: "300px" });
    }
    imgEl.setAttribute("data-fid", fileId);
    lazyObs.observe(imgEl);
  }

  // onFail · 못 불러왔을 때 알려 준다 (빈 칸만 남기지 않도록)
  function loadDriveImage(fileId, imgEl, onFail) {
    if (!fileId) { if (onFail) onFail("사진 정보가 없습니다"); return; }
    if (imgUrlCache[fileId]) { imgEl.src = imgUrlCache[fileId]; return; }
    if (!accessToken) { if (onFail) onFail("구글 로그인이 풀렸습니다. [동기화] 를 눌러 다시 로그인하세요."); return; }
    driveFetch("https://www.googleapis.com/drive/v3/files/" + fileId + "?alt=media&supportsAllDrives=true")
      .then(function (r) { return r.ok ? r.blob() : null; })
      .then(function (b) {
        if (!b) { if (onFail) onFail("드라이브에서 사진을 받지 못했습니다"); return; }
        var u = URL.createObjectURL(b);
        imgUrlCache[fileId] = u;
        imgEl.src = u;
      }).catch(function () { if (onFail) onFail("사진을 불러오지 못했습니다"); });
  }

  /* ---------- 사진 슬라이드로 크게 보기 ---------- */
  function openLightbox(shots, startAt) {
    if (!shots.length) return;
    var i = Math.max(0, Math.min(startAt || 0, shots.length - 1));
    var box = el("div", "lightbox");

    var top = el("div", "lb-top");
    var count = el("span", "lb-count");
    top.appendChild(count);
    top.appendChild(el("span", "spacer"));
    var openBtn = el("a", "lb-btn", "드라이브에서 열기");
    openBtn.target = "_blank"; openBtn.rel = "noopener noreferrer";
    openBtn.style.textDecoration = "none";
    top.appendChild(openBtn);
    var closeBtn = el("button", "lb-btn", "✕ 닫기");
    top.appendChild(closeBtn);
    box.appendChild(top);

    var stage = el("div", "lb-stage");
    var img = el("img");
    var fail = el("div", "lb-fail");
    fail.style.display = "none";
    fail.style.whiteSpace = "pre-line";
    var prev = el("button", "lb-nav prev", "‹");
    var next = el("button", "lb-nav next", "›");
    stage.appendChild(prev); stage.appendChild(img); stage.appendChild(fail); stage.appendChild(next);
    box.appendChild(stage);

    var cap = el("div", "lb-cap");
    box.appendChild(cap);
    var strip = el("div", "lb-strip");
    box.appendChild(strip);

    shots.forEach(function (s, k) {
      var th = el("img");
      th.addEventListener("click", function () { i = k; show(); });
      strip.appendChild(th);
      if (s.url) th.src = s.url;
      else if (s.fileId) loadDriveImage(s.fileId, th);
    });

    function show() {
      var s = shots[i];
      count.textContent = (i + 1) + " / " + shots.length;
      cap.textContent = [s.caption, s.name].filter(Boolean).join("  ·  ");
      prev.disabled = i === 0;
      next.disabled = i === shots.length - 1;
      img.removeAttribute("src");
      fail.style.display = "none";
      img.style.display = "";
      function showFail(why) {
        img.style.display = "none";
        fail.style.display = "";
        fail.textContent = "🖼️ " + why + "\n오른쪽 위 «드라이브에서 열기» 로는 볼 수 있습니다.";
      }
      if (s.url) img.src = s.url;
      else if (s.fileId) loadDriveImage(s.fileId, img, showFail);
      else showFail("아직 드라이브에 올라가지 않은 사진입니다");
      if (s.fileId) { openBtn.href = driveLink(s.fileId); openBtn.style.display = ""; }
      else openBtn.style.display = "none";
      Array.prototype.forEach.call(strip.children, function (t, k) { t.className = (k === i ? "on" : ""); });
      var on = strip.children[i];
      if (on && on.scrollIntoView) on.scrollIntoView({ block: "nearest", inline: "center" });
    }
    function go(d) { var j = i + d; if (j >= 0 && j < shots.length) { i = j; show(); } }
    function close() {
      document.removeEventListener("keydown", key);
      box.remove();
    }
    function key(e) {
      if (e.key === "ArrowRight") { e.preventDefault(); go(1); }
      else if (e.key === "ArrowLeft") { e.preventDefault(); go(-1); }
      else if (e.key === "Escape") { e.preventDefault(); close(); }
    }
    prev.addEventListener("click", function () { go(-1); });
    next.addEventListener("click", function () { go(1); });
    closeBtn.addEventListener("click", close);
    // 사진을 눌러서 열었으면, 사진을 다시 눌러 닫는다 (빈 곳을 눌러도 닫힘)
    box.addEventListener("click", function (e) {
      if (e.target === box || e.target === stage || e.target === img) close();
    });
    img.style.cursor = "zoom-out";
    img.title = "누르면 닫힙니다";
    document.addEventListener("keydown", key);

    // 손가락으로 넘기기
    var sx = null;
    stage.addEventListener("touchstart", function (e) { sx = e.touches[0].clientX; }, { passive: true });
    stage.addEventListener("touchend", function (e) {
      if (sx == null) return;
      var dx = e.changedTouches[0].clientX - sx;
      if (Math.abs(dx) > 45) go(dx < 0 ? 1 : -1);
      sx = null;
    });

    document.body.appendChild(box);
    show();
  }
  // 한 기록 안의 사진들을 슬라이드 목록으로
  function shotsOf(n) {
    return (n.blocks || []).filter(function (b) {
      return b.kind === "image";
    }).map(function (b) {
      return { url: previewUrl(b), fileId: b.fileId, caption: b.caption || "", name: b.name || b.original || "" };
    });
  }

  function renderTypeChips() {
    var host = $("typeChips");
    host.innerHTML = "";
    settings.types.forEach(function (t) {
      var b = paintType(el("button", "chip" + (t.key === currentType ? " on" : ""), t.icon + " " + t.label), t.key);
      b.type = "button";
      b.addEventListener("click", function () { currentType = t.key; renderTypeChips(); refreshAtomNames(); });
      host.appendChild(b);
    });
    var add = el("button", "chip", "＋ 유형 만들기");
    add.type = "button";
    add.addEventListener("click", function () { openSettings("types"); });
    host.appendChild(add);
  }

  var tagsExpanded = false;
  var TAGS_SHOWN = 12;
  var tagQuery = "", tagFindFocus = false;   // 펴 놓고 태그를 찾을 때 쓰는 칸

  function renderFilters() {
    var host = $("typeFilters");
    host.innerHTML = "";
    var all = el("button", "chip" + (filterType === "all" ? " on" : ""), "전체 " + liveEntries().length);
    all.type = "button";
    all.addEventListener("click", function () { filterType = "all"; render(); });
    host.appendChild(all);
    var pinCount = entries.filter(function (n) { return n.pinned; }).length;
    if (pinCount || filterPinned) {
      var pb = el("button", "chip" + (filterPinned ? " on" : ""), "📌 고정 " + pinCount);
      pb.type = "button";
      pb.addEventListener("click", function () { filterPinned = !filterPinned; render(); });
      host.appendChild(pb);
    }
    settings.types.forEach(function (t) {
      var c = entries.filter(function (n) { return n.type === t.key; }).length;
      if (!c && filterType !== t.key) return;
      var b = paintType(el("button", "chip" + (filterType === t.key ? " on" : ""), t.icon + " " + t.label + " " + c), t.key);
      b.type = "button";
      b.addEventListener("click", function () { filterType = t.key; render(); });
      host.appendChild(b);
    });
    renderTagFilters();
  }

  // 태그로 좁혀 보기 · 유형 안에서 다시 추리는 용도.
  // 태그를 여러 개 고르면 «그 태그를 모두 가진» 기록만 남는다.
  function renderTagFilters() {
    var host = $("tagFilters");
    host.innerHTML = "";

    /* 지금 보고 있는 것들의 태그만 센다 (없는 태그를 보여 줘야 소용없다).
       ⚠️ 유형·검색만 보고 폴더(filterPath)·고정은 안 봤다. 그래서 「부기」 폴더를
          보고 있는데 칩은 «전체 기준» 숫자를 말했다. 거르개는 다 같이 걸려야 한다.
       한 기록에 같은 태그가 두 번 들어 있어도 한 번만 센다. */
    var count = {}, last = {};
    entries.forEach(function (n) {
      if (n.trashed) return;                 // 버린 것은 세지 않는다
      if (filterPinned && !n.pinned) return;
      if (filterType !== "all" && n.type !== filterType) return;
      if (filterPath.length && !underPath(n, filterPath)) return;
      if (searchQ && entryText(n).indexOf(searchQ.toLowerCase()) < 0) return;
      var seen = {};
      (n.tags || []).forEach(function (t) {
        if (!t || seen[t]) return;
        seen[t] = 1;
        count[t] = (count[t] || 0) + 1;
        var at = n.updatedAt || n.createdAt || 0;
        at = typeof at === "number" ? at : (Date.parse(at) || 0);
        if (at > (last[t] || 0)) last[t] = at;      // 이 태그를 «마지막으로 쓴 때»
      });
    });
    // 고른 태그는 셈에서 빠져도 자리를 지킨다
    filterTags.forEach(function (t) { if (!(t in count)) count[t] = 0; });

    /* ⚠️ 예전에는 «많이 쓴 순» 하나로만 세우고 열두 개에서 잘랐다.
       그러면 방금 만든 태그는 언제나 하나짜리라 맨 뒤로 밀려 「더 보기」 뒤에 숨는다.
       새 태그를 붙인 «바로 그때» 가 그 태그를 가장 찾고 싶은 때인데 말이다.
       («배움» 이라고 넣었는데 안 뜬다는 이야기가 실제로 그것이었다.)
       그래서 최근에 쓴 태그를 앞줄에 세운다. 자주 쓰는 태그는 어차피 최근에도 쓴다. */
    var FRESH = 14 * 24 * 3600 * 1000;   // 최근 두 주
    var now = Date.now();
    var names = Object.keys(count).sort(function (a, b) {
      var fa = (now - (last[a] || 0)) < FRESH ? 1 : 0;
      var fb = (now - (last[b] || 0)) < FRESH ? 1 : 0;
      if (fa !== fb) return fb - fa;                       // 최근에 쓴 것이 앞
      if (fa) return (last[b] || 0) - (last[a] || 0);      // 최근끼리는 더 최근이 앞
      if (count[b] !== count[a]) return count[b] - count[a];
      return a.localeCompare(b, "ko");
    });
    if (!names.length) { host.style.display = "none"; return; }
    host.style.display = "";

    host.appendChild(el("span", "flabel", "🏷 태그"));

    /* 펴 놓고도 태그가 스무 개를 넘으면 눈으로 훑는 것이 «찾기» 가 아니게 된다.
       그때는 고르는 것이 아니라 찾는 것이 맞다. 한 칸을 열어 준다. */
    if (tagsExpanded && names.length > 20) {
      var find = el("input", "inp tagfind");
      find.type = "search";
      find.placeholder = "태그 찾기";
      find.value = tagQuery;
      find.addEventListener("input", function () { tagQuery = this.value; renderTagFilters(); });
      host.appendChild(find);
      setTimeout(function () { var f = host.querySelector(".tagfind"); if (f && tagFindFocus) f.focus(); }, 0);
      find.addEventListener("focus", function () { tagFindFocus = true; });
    }
    var q = tagsExpanded ? tagQuery.trim().toLowerCase() : "";
    var pool = q ? names.filter(function (t) { return t.toLowerCase().indexOf(q) >= 0; }) : names;
    var shown = tagsExpanded ? pool : pool.slice(0, TAGS_SHOWN);
    if (tagsExpanded && q && !shown.length) {
      host.appendChild(el("span", "flabel", "「" + tagQuery.trim() + "」" + josa(tagQuery.trim(), "이", "가") + " 든 태그가 없습니다"));
    }
    shown.forEach(function (t) {
      var on = filterTags.indexOf(t) >= 0;
      var b = el("button", "chip tagchip" + (on ? " on" : ""), "#" + t + " " + count[t]);
      b.type = "button";
      b.addEventListener("click", function () {
        if (on) filterTags = filterTags.filter(function (x) { return x !== t; });
        else filterTags = filterTags.concat([t]);
        render();
      });
      host.appendChild(b);
    });

    if (names.length > TAGS_SHOWN) {
      var more = el("button", "chip ghostchip",
        tagsExpanded ? "접기 ▲" : "더 보기 +" + (names.length - TAGS_SHOWN));
      more.type = "button";
      more.addEventListener("click", function () {
        tagsExpanded = !tagsExpanded;
        if (!tagsExpanded) { tagQuery = ""; tagFindFocus = false; }
        renderTagFilters();
      });
      host.appendChild(more);
    }

    // 지금 어느 폴더 아래를 보고 있는지 눈에 보여야 한다. 안 보이면 «기록이 없어졌다» 고 여긴다.
    if (filterPath.length) {
      var pc = el("button", "chip on", "📁 " + filterPath.join(" / ") + " 아래");
      pc.type = "button";
      pc.title = "이 폴더로 좁혀 보는 것을 풉니다";
      pc.addEventListener("click", function () { filterPath = []; render(); });
      host.appendChild(pc);
    }
    if (filterTags.length || filterType !== "all" || searchQ || filterPinned || filterPath.length || smartView) {
      var clear = el("button", "chip clearchip", "✕ 필터 지우기");
      clear.type = "button";
      clear.addEventListener("click", function () {
        filterTags = []; filterType = "all"; searchQ = ""; filterPinned = false; filterPath = []; smartView = ""; $("search").value = "";
        render();
      });
      host.appendChild(clear);
    }
  }

  /* 휴지통에 든 것은 «없는 것» 처럼 군다 · 세는 자리도, 나무도, 목록도 다 이 자를 쓴다 */
  function liveEntries() {
    return entries.filter(function (n) { return !n.trashed; });
  }
  /* 미정리함 · 급히 남긴 것. 태그가 없거나 «나중에 정리» 로 둔 기록.
     분류 안 했다고 저장을 막지 않는다 · 대신 여기 모아 두고 나중에 손본다. */
  function isInbox(n) { return !!n.inbox || !(n.tags || []).length; }
  function hasOpenTodo(n) {
    return (n.blocks || []).some(function (b) {
      return b.kind === "todo" && (b.items || []).some(function (it) { return it.t && !it.done; });
    });
  }
  function entryText(n) {
    return [n.title, (n.tags || []).join(" ")].concat((n.blocks || []).map(function (b) {
      // 할 일·목록의 줄도 검색에 걸려야 한다 · 거기 적은 것도 내가 쓴 글이다
      var lines = (b.items || []).map(function (it) { return it.t || ""; }).join(" ");
      var cells = (b.head || []).join(" ") + " " + (b.rows || []).map(function (r) { return (r || []).join(" "); }).join(" ");
      return [b.text, b.title, b.url, b.label, b.caption, b.name, b.original, lines, cells.trim()].filter(Boolean).join(" ");
    })).join(" ").toLowerCase();
  }
  function matches(n) {
    /* 휴지통은 «따로 보는 자리» 다. 평소 목록에는 절대 섞이지 않는다 */
    if (smartView === "trash") return !!n.trashed;
    if (n.trashed) return false;
    if (smartView === "todo" && !hasOpenTodo(n)) return false;
    if (smartView === "untagged" && (n.tags || []).length) return false;
    if (smartView === "inbox" && !isInbox(n)) return false;
    if (filterPinned && !n.pinned) return false;
    if (filterType !== "all" && n.type !== filterType) return false;
    /* 폴더 길은 «앞에서부터» 같아야 한다. 2019/3학년 을 고르면 2019/4학년 은 빠진다.
       ⚠️ 반드시 crumbsOf 로 잰다. 나무도, 길찾기 줄도 그것으로 서기 때문이다.
          예전에는 여기서만 srcPath 를 바로 봤다. 그러면 «폴더에서 끌어온 기록» 만 걸리고
          앱이 만든 기록은 하나도 안 걸린다 — 태그·월별 방식은 srcPath 가 아예 비어 있다.
          그래서 왼쪽에서 「평가」를 눌러도 목록이 텅 비었고, 누른 사람에게는
          «폴더 구조는 보기만 하는 칸» 으로 보였다. 재는 자가 그리는 자와 달랐던 것이다. */
    if (filterPath.length && !underPath(n, filterPath)) return false;
    if (filterTags.length) {
      var mine = n.tags || [];
      for (var i = 0; i < filterTags.length; i++) {
        if (mine.indexOf(filterTags[i]) < 0) return false;
      }
    }
    if (!searchQ) return true;
    return entryText(n).indexOf(searchQ.toLowerCase()) >= 0;
  }

  /* 삽입 코드는 격리된 틀(sandbox iframe) 안에서 보여 준다.
     allow-same-origin 을 주지 않아, 코드가 이 앱의 데이터나 로그인 정보에 손댈 수 없다. */
  function embedFrame(b, still) {
    var f = el("iframe", "embedframe");
    f.setAttribute("sandbox", "allow-scripts allow-popups allow-popups-to-escape-sandbox allow-presentation allow-forms");
    f.setAttribute("referrerpolicy", "no-referrer");
    f.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; picture-in-picture; fullscreen";
    f.setAttribute("allowfullscreen", "");
    /* 카드 안(still)에서는 굴림을 아예 없앤다 · 막대가 뜨는 것부터가 «또 굴려야 하나» 다.
       scrolling="no" 는 옛 브라우저용, overflow:hidden 은 요즘 것용. 둘 다 적어 둔다. */
    if (still) f.setAttribute("scrolling", "no");
    f.srcdoc = "<!doctype html><meta charset='utf-8'>" +
      "<style>html,body{margin:0;padding:0;background:transparent;font-family:system-ui,sans-serif}" +
      (still ? "html,body{overflow:hidden!important}" : "") +
      "iframe,img,video{max-width:100%;border:0}*{box-sizing:border-box}</style>" +
      (b.code || "");
    // 아래 모서리를 끌어 높이를 바꿀 수 있는 상자에 담아 준다 (카드에서는 못 끈다)
    var box = el("div", still ? "embedbox still" : "embedbox");
    box.style.height = ((b.height || 360) + (still ? 0 : 15)) + "px";
    box.appendChild(f);
    return box;
  }

  function isVideo(b) { return /^video\//.test(b.mime || ""); }
  function isAudio(b) { return /^audio\//.test(b.mime || ""); }

  // 드라이브에 올라간 영상은 구글 미리보기 틀로 재생 (통째로 내려받지 않음)
  function drivePlayer(b) {
    var wrap = el("div");
    var btn = el("button", "playbtn");
    btn.appendChild(el("span", "pi", isAudio(b) ? "🎵" : "▶"));
    var t = el("span");
    t.appendChild(document.createTextNode(b.caption || b.name || b.original || "재생"));
    t.appendChild(el("small", null, humanSize(b.size) + " · 눌러서 재생"));
    btn.appendChild(t);
    btn.addEventListener("click", function () {
      var f = el("iframe", "driveframe");
      f.src = "https://drive.google.com/file/d/" + b.fileId + "/preview";
      f.allow = "autoplay";
      f.setAttribute("allowfullscreen", "");
      if (isAudio(b)) f.style.aspectRatio = "auto", f.style.height = "70px";
      wrap.innerHTML = "";
      wrap.appendChild(f);
    });
    wrap.appendChild(btn);
    return wrap;
  }

  /* 링크 미리보기 · 서버 없이 할 수 있는 만큼만.
     다른 사이트의 제목·대표 이미지는 브라우저 보안(CORS)때문에 가져올 수 없어서,
     사이트 아이콘 + 주소로 보여 주고, 유튜브만 실제 미리보기 그림을 붙인다. */
  function ytId(u) {
    var m = /(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{6,})/.exec(u || "");
    return m ? m[1] : null;
  }
  function linkCard(b) {
    var url = b.url || "";
    var site = hostOf(url);
    var a = el("a", "linkcard");
    a.href = url; a.target = "_blank"; a.rel = "noopener noreferrer";
    a.title = url;

    var ico = el("img", "lc-ico");
    ico.alt = ""; ico.loading = "lazy";
    if (site) ico.src = "https://www.google.com/s2/favicons?sz=64&domain=" + encodeURIComponent(site);
    ico.addEventListener("error", function () { ico.remove(); });
    a.appendChild(ico);

    var yt = ytId(url);
    var body = el("div", "lc-body");
    body.appendChild(el("div", "lc-title", b.label || (yt ? "유튜브 영상" : site) || url));
    body.appendChild(el("div", "lc-host", url.replace(/^https?:\/\//, "")));
    a.appendChild(body);

    if (yt) {
      var th = el("img", "lc-thumb");
      th.alt = ""; th.loading = "lazy";
      th.src = "https://i.ytimg.com/vi/" + yt + "/mqdefault.jpg";
      th.addEventListener("error", function () { th.remove(); });
      a.appendChild(th);
    }
    return a;
  }

  // 기록 보드(카드)에서는 사진·산출물·삽입 코드를 맨 위로 올린다
  function isMediaGroup(g) {
    if (g.kind === "images") return true;
    var k = g.block && g.block.kind;
    return k === "file" || k === "embed";
  }

  /* 읽는 쪽의 인용 · 출처 갈래가 보인다. AI 답변은 접혀서 열린다 ·
     읽다가 AI 가 한 말을 내 생각으로 착각하는 것이 가장 흔한 사고라서다. */
  function quoteView(b) {
    var role = QUOTE_ROLES[b.role || ""] || QUOTE_ROLES[""];
    if (b.role === "ai") {
      var d = el("details", "aibox");
      d.appendChild(el("summary", null, "🤖 AI 답변" + (b.src ? " · " + b.src : "") + " · 눌러서 펼치기"));
      var bd = el("blockquote", "rai"); appendRichText(bd, b.text); d.appendChild(bd);
      return d;
    }
    var q = el("blockquote", b.role ? "r" + b.role : null);
    if (b.role) q.appendChild(el("span", "qtag", role.icon + " " + role.label + (b.src ? " · " + b.src : "")));
    appendRichText(q, b.text);
    return q;
  }
  function quoteCallout(b) {
    var r = b.role || "";
    if (!r || !QUOTE_ROLES[r]) return "";
    var type = r === "ai" ? "ai" : (r === "source" ? "quote" : "note");
    return "[!" + type + "]" + (r === "ai" ? "-" : "") + " " + QUOTE_ROLES[r].icon + " " + QUOTE_ROLES[r].label + (b.src ? " · " + b.src : "");
  }

  function renderContent(n, host, opts) {
    opts = opts || {};
    /* ⚠️ mediaFirst 는 «보드(카드)에서 그리는 중» 이라는 뜻이다. 카드에서는 삽입 페이지를 멈춰 둔다.
       ⚠️ 이 줄은 반드시 그리기 «전» 에 있어야 한다. 아래 renderOne 옆에 두었더니
          var 라 이름만 먼저 서고 값은 다 그린 «뒤» 에 들어가, 늘 undefined 로 그렸다.
          오류도 안 났다 · 그래서 «고쳤는데 화면이 그대로» 로 한참 헤맸다. */
    var stillEmbed = !!opts.mediaFirst;
    var shots = shotsOf(n);
    var seenImages = 0;
    var blocks = n.blocks || [];

    // 연달아 놓인 사진은 슬라이드 묶음으로 보여 준다
    var groups = [], run = null;
    blocks.forEach(function (b) {
      if (b.kind === "image") {
        if (!run) { run = { kind: "images", items: [], start: seenImages }; groups.push(run); }
        run.items.push(b);
        seenImages++;
      } else { run = null; groups.push({ kind: "one", block: b }); }
    });

    // 순서를 바꿔도 사진 번호가 어긋나지 않도록, 시작 번호는 위에서 미리 매겨 두었다
    if (opts.mediaFirst) {
      groups = groups.filter(isMediaGroup).concat(groups.filter(function (g) { return !isMediaGroup(g); }));
    }

    groups.forEach(function (g) {
      // 사진은 어디서나 작은 썸네일로. 누르면 크게 본다 (접기 버튼 없음)
      if (g.kind === "images") {
        var count = g.items.length;
        var startAt = g.start;
        var gal = el("div", "gallery");
        var SHOWN = 8;
        g.items.slice(0, SHOWN).forEach(function (b, k) {
          var at = startAt + k;
          var bt = el("button");
          bt.type = "button";
          bt.title = (b.caption || b.name || b.original || "사진") + " · 눌러서 크게 보기";
          var im = el("img");
          im.loading = "lazy";
          im.alt = b.caption || b.original || "";
          var u = previewUrl(b);
          if (u) im.src = u;
          else if (b.fileId) lazyDriveImage(b.fileId, im);
          bt.appendChild(im);
          if (k === SHOWN - 1 && count > SHOWN) {
            bt.appendChild(el("span", "more", "+" + (count - SHOWN)));
          }
          bt.addEventListener("click", function () { openLightbox(shots, at); });
          gal.appendChild(bt);
        });
        host.appendChild(gal);
        host.appendChild(el("div", "galcap",
          "🖼️ 사진 " + count + "장 · 누르면 크게 볼 수 있습니다"));
        return;
      }
      renderOne(g.block, -1, host);
    });

    // where · 이 블록을 붙일 자리. 사진은 접기 상자 안에, 나머지는 본문에 바로 붙는다
    function renderOne(b, shotAt, where) {
      var host = where;
      if (b.kind === "text") {
        var p = el("p"); appendRichText(p, b.text); host.appendChild(p);
      } else if (b.kind === "heading") {
        var h = el("h4"); appendRichText(h, b.text); host.appendChild(h);
      } else if (b.kind === "quote") {
        host.appendChild(quoteView(b));
      } else if (b.kind === "todo") {
        /* 업노트에서 가장 몸에 붙는 것이 이것이다 · 목록에서 «바로» 체크된다.
           읽다가 한 일이 생각나면 그 자리에서 누른다. 편집으로 들어갔다 나오지 않는다.
           ⚠️ 누른 즉시 드라이브까지 올라가야 한다. 안 그러면 다른 기기에서 안 눌린 채로 있다. */
        var ul = el("ul", "todolist");
        var cntLi = null;
        function paintCount() {
          if (!cntLi) return;
          var live = (n.blocks || []).filter(function (x) { return x.id === b.id; })[0] || b;
          var items = live.items || [];
          var dn = items.filter(function (it) { return it.done; }).length;
          cntLi.textContent = dn + " / " + items.length + " 함";
          cntLi.classList.toggle("alldone", items.length > 0 && dn === items.length);
        }
        (b.items || []).forEach(function (it, i) {
          var li = el("li", it.done ? "done" : null);
          var cb = el("input"); cb.type = "checkbox"; cb.checked = !!it.done;
          cb.title = "한 일로 표시하거나 되돌립니다";
          cb.addEventListener("click", function (e) { e.stopPropagation(); });
          cb.addEventListener("change", function () {
            var live = (n.blocks || []).filter(function (x) { return x.id === b.id; })[0];
            var tgt = live && live.items && live.items[i];
            if (!tgt) return;
            tgt.done = cb.checked;
            li.classList.toggle("done", cb.checked);
            paintCount();                    // 숫자도 같이 따라와야 «반영됐다» 가 보인다
            n.updatedAt = Date.now(); n._dirty = true;
            saveLocal();
            if (connected) syncPending();
          });
          li.appendChild(cb);
          var sp = el("span", "t"); appendRichText(sp, it.t); li.appendChild(sp);
          ul.appendChild(li);
        });
        if ((b.items || []).length) {
          cntLi = el("li", "todocount");
          ul.appendChild(cntLi);
          paintCount();
        }
        host.appendChild(ul);

      } else if (b.kind === "list") {
        var listEl = el(b.ordered ? "ol" : "ul", "bullets");
        (b.items || []).forEach(function (it) {
          if (!it.t) return;
          var li = el("li", "d" + Math.max(0, Math.min(2, it.d || 0)));
          appendRichText(li, it.t);
          listEl.appendChild(li);
        });
        if (listEl.children.length) host.appendChild(listEl);

      } else if (b.kind === "table") {
        var tbox = el("div", "tscroll");
        var tt = el("table", "shown");
        var head = (b.head || []).filter(function (h) { return h != null; });
        if (head.some(function (h) { return h && h.trim(); })) {
          var thr = el("tr");
          head.forEach(function (h) { var th = el("th"); appendRichText(th, h); thr.appendChild(th); });
          tt.appendChild(thr);
        }
        (b.rows || []).forEach(function (r) {
          if (!r.some(function (c) { return c && String(c).trim(); })) return;   // 빈 줄은 안 그린다
          var tr = el("tr");
          r.forEach(function (c) { var td = el("td"); appendRichText(td, c); tr.appendChild(td); });
          tt.appendChild(tr);
        });
        if (tt.children.length) { tbox.appendChild(tt); host.appendChild(tbox); }

      } else if (b.kind === "fold") {
        var det = el("details", "foldbox");
        if (b.open) det.open = true;
        var sm = el("summary");
        appendRichText(sm, b.title || "펼쳐 보기");
        det.appendChild(sm);
        var fb = el("div", "foldbody");
        appendRichText(fb, b.text || "");
        det.appendChild(fb);
        host.appendChild(det);

      } else if (b.kind === "code") {
        var pre = el("pre", "codeblock");
        var codeEl = el("code", null, b.text || "");
        pre.appendChild(codeEl);
        if (b.lang) {
          var lg = el("span", "codelang", b.lang);
          pre.appendChild(lg);
        }
        host.appendChild(pre);

      } else if (b.kind === "divider") {
        host.appendChild(el("hr"));
      } else if (b.kind === "image") {
        var fig = el("figure");
        var img = el("img");
        img.alt = b.caption || b.original || "";
        img.loading = "lazy";
        img.style.cursor = "zoom-in";
        var pvu = previewUrl(b);
        if (pvu) img.src = pvu;
        else if (b.fileId) lazyDriveImage(b.fileId, img);
        img.addEventListener("click", function () { openLightbox(shots, shotAt < 0 ? 0 : shotAt); });
        fig.appendChild(img);
        var capText = (b.caption || "") + (b.name ? (b.caption ? " · " : "") + b.name : "");
        if (capText) fig.appendChild(el("figcaption", null, capText));
        host.appendChild(fig);

      } else if (b.kind === "file" && (isVideo(b) || isAudio(b))) {
        // 영상·소리는 바로 재생할 수 있게
        var pv = previewUrl(b);
        if (pv) {
          var media = el(isVideo(b) ? "video" : "audio");
          media.src = pv;
          media.controls = true;
          media.preload = "metadata";
          var wm = el("div");
          wm.appendChild(media);
          var cp = (b.caption || b.name || b.original) + " · " + humanSize(b.size) + " · 업로드 대기";
          wm.appendChild(el("figcaption", null, cp));
          host.appendChild(wm);
        } else if (b.fileId) {
          host.appendChild(drivePlayer(b));
        }

      } else if (b.kind === "file") {
        var fileText = fileIcon(b.mime, b.name) + " " + (b.caption || b.name || b.original) +
          (b.fileId ? "" : " · 업로드 대기");
        var a = el("a", "fileline", fileText);
        a.title = fileText;                              // 이름이 길어 잘렸을 때를 위해
        if (b.fileId) { a.href = driveLink(b.fileId); a.target = "_blank"; a.rel = "noopener noreferrer"; }
        else a.href = "javascript:void(0)";
        var w1 = el("div"); w1.appendChild(a); host.appendChild(w1);

      } else if (b.kind === "link") {
        host.appendChild(linkCard(b));

      } else if (b.kind === "embed") {
        if (b.code && b.code.trim()) {
          host.appendChild(embedFrame(b, stillEmbed));
          /* 좁은 칸(가운데 목록)에서는 이 한 줄이 삽입한 페이지를 대신한다.
             넓은 자리에서는 무늬가 이 줄을 숨기고 진짜 페이지를 그대로 보여 준다. */
          if (stillEmbed) host.appendChild(el("div", "embedline", "▶ 삽입한 페이지 · 눌러서 펼쳐 봅니다"));
          else host.appendChild(el("div", "embedhint", "↕ 아래 모서리를 끌면 높이를 바꿀 수 있습니다"));
        }
      }
    }
  }

  /* ---------------------------------------------------------
     전체 보기 · 한 편을 통째로, 종이처럼 읽는 화면
     여기서 인쇄(PDF)·구글 문서·HTML·.md·폴더로 모두 이어진다
     --------------------------------------------------------- */
  /* ---------- 🔗 링크로 공유 ---------- */
  function ensureDoc(n) {
    if (n.docId) return Promise.resolve(n.docId);
    return resolveTargets(n)
      .then(function (t) { return saveAsGoogleDoc(n, t.md); })
      .then(function () {
        if (!n.docId) throw new Error("구글 문서를 만들지 못했습니다. 설정 → 파일 이름 에서 «구글 문서» 를 켜 보세요.");
        return n.docId;
      });
  }
  /* 이 기록에 붙은 사진들 (공유 전에 눈으로 확인시키려고 쓴다) */
  function entryPhotos(n) {
    return (n.blocks || []).filter(function (b) {
      return b.kind === "image" && (b.fileId || b.blob);
    });
  }
  /* 폴더째 공유해도 «남의 기록» 이 딸려가지 않는가.
     기록마다 폴더 하나일 때만 그 폴더가 이 기록만의 것이다. */
  function canShareFolder(n) {
    if (settings.folderMode !== "perEntry") {
      return { ok: false, why: "지금은 여러 기록이 한 폴더에 같이 있습니다 (정리 방식 «" +
        folderModeLabel(settings.folderMode) +
        "»). 폴더를 열면 다른 기록까지 보이므로 막아 두었습니다. 설정 → 저장 위치에서 «기록마다 폴더 하나» 로 바꾸면 됩니다." };
    }
    if (!n.folderId) {
      return { ok: false, why: "이 기록은 아직 자기 폴더가 없습니다. 「기록 저장」을 한 번 더 누르면 폴더가 생깁니다." };
    }
    return { ok: true };
  }

  function openShareModal(n, after) {
    if (!connected || !folder.id) { toast("드라이브에 연결한 뒤에 공유할 수 있습니다."); return; }
    if (!n.mdId) { toast("먼저 «기록 저장» 을 눌러 드라이브에 올린 뒤 공유할 수 있습니다."); return; }
    closeModal();

    var photos = entryPhotos(n);
    var checked = !photos.length;          // 사진이 없으면 확인 관문도 없다
    var folderCheck = canShareFolder(n);

    var bg = el("div", "modal-bg");
    var m = el("div", "card modal"); m.style.maxWidth = "600px";

    var head = el("div", "mhead");
    head.appendChild(el("h3", null, "🔗 링크로 공유"));
    head.appendChild(el("span", "spacer"));
    var x = el("button", "btn sm ghost", "✕"); x.addEventListener("click", closeModal);
    head.appendChild(x);
    m.appendChild(head);

    var body = el("div", "mbody");
    var foot = el("div", "mfoot");
    foot.appendChild(el("span", "spacer"));
    var close = el("button", "btn", "닫기");
    close.addEventListener("click", closeModal);
    foot.appendChild(close);
    m.appendChild(body); m.appendChild(foot);

    /* 공유를 켜고 끄는 한 칸. 글 하나용과 폴더용이 같은 모양이다. */
    function shareRow(opt) {
      var f = el("div", "field");
      f.appendChild(el("label", null, opt.title));
      f.appendChild(el("div", "desc", opt.desc));

      if (!opt.allowed) {
        var no = el("p", "crophint");
        no.textContent = "⚠️ " + opt.blockedWhy;
        f.appendChild(no);
        body.appendChild(f);
        return;
      }

      var url = opt.getUrl();
      if (url) {
        var inp = el("input", "inp"); inp.value = url; inp.readOnly = true;
        inp.addEventListener("focus", function () { inp.select(); });
        f.appendChild(inp);
        var row = el("div", "row"); row.style.marginTop = "6px";
        var cp = el("button", "btn sm primary", "📋 복사");
        cp.addEventListener("click", function () {
          copyText(url).then(function () { toast("링크를 복사했습니다."); })
            .catch(function () { toast("복사가 안 됩니다. 위 칸을 눌러 직접 복사해 주세요."); });
        });
        var op = el("a", "btn sm", "열어 보기");
        op.href = url; op.target = "_blank"; op.rel = "noopener noreferrer"; op.style.textDecoration = "none";
        var off = el("button", "btn sm danger", "공유 끄기");
        off.addEventListener("click", function () {
          /* 끄는 길이 하나뿐이 아닌 줄(구글 문서 게시)은 먼저 묻는다.
             ⚠️ 끄고 나서 하는 말도 줄마다 다르다. 「이제 링크로는 열리지 않습니다」 는
                구글 캐시가 남는 자리에서는 거짓말이 된다. 그래서 stop 이 할 말을 돌려준다. */
          var ask = opt.confirmStop ? opt.confirmStop() : Promise.resolve({ go: true });
          ask.then(function (a) {
            if (!a || !a.go) return;
            off.disabled = true; off.textContent = "끄는 중…";
            opt.stop(a.arg).then(function (msg) {
              opt.setUrl(null);
              n.updatedAt = new Date().toISOString();
              saveLocal(); if (connected) saveIndex();
              toast(msg || "공유를 껐습니다. 이제 링크로는 열리지 않습니다.");
              if (after) after();
              draw();
            }).catch(function (e) {
              off.disabled = false; off.textContent = "공유 끄기";
              toast("끄지 못했습니다: " + errText(e));
            });
          });
        });
        /* ⚠️ 주소에 담아 보내는 길은 «누른 그 순간의 사진» 이다.
           뒤에 기록을 고치거나 모양을 바꿔도 이미 만든 링크는 옛것 그대로다.
           그걸 말해 주지 않으면 «고쳤는데 왜 그대로냐» 가 된다. */
        if (opt.stale && opt.stale()) {
          var warn = el("p", "crophint");
          warn.style.color = "var(--brand)";
          warn.textContent = "⚠️ 이 링크를 만든 뒤에 기록이나 모양이 바뀌었습니다. 받는 사람은 아직 옛 쪽을 봅니다.";
          f.appendChild(warn);
          var again = el("button", "btn sm", "🔄 링크 다시 만들기");
          again.addEventListener("click", function () {
            again.disabled = true; again.textContent = "만드는 중…";
            opt.start().then(function (u) {
              opt.setUrl(u);
              if (opt.stamp) opt.stamp();
              n.updatedAt = new Date().toISOString();
              saveLocal(); if (connected) saveIndex();
              toast("링크를 새로 만들었습니다. 이 주소를 다시 보내 주세요.");
              if (after) after();
              draw();
            }).catch(function (e) {
              again.disabled = false; again.textContent = "🔄 링크 다시 만들기";
              toast("다시 만들지 못했습니다: " + errText(e));
            });
          });
          row.appendChild(again);
        }
        row.appendChild(cp); row.appendChild(op); row.appendChild(off);
        f.appendChild(row);
      } else {
        var go = el("button", "btn primary", opt.button);
        go.disabled = !checked;
        if (!checked) go.title = "먼저 아래에서 사진을 확인해 주세요";
        go.addEventListener("click", function () {
          go.disabled = true; go.textContent = "만드는 중…";
          opt.start().then(function (madeUrl) {
            opt.setUrl(madeUrl);
            n.updatedAt = new Date().toISOString();
            saveLocal(); if (connected) saveIndex();
            if (after) after();
            draw();

  /* =========================================================
     10-2. 엮어내기 · 고른 기록들을 한 권으로 묶어 내려받기

  function downloadText(filename, mime, text) {
    var blob = new Blob([text], { type: mime + ";charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1500);
  }

  // 고른 기록에서 연결(글 속 [[링크]] · 관계망 · 백링크)을 따라 한 단계 넓힌다
  function widenByLinks(ids, depth) {
    var have = {}, order = [];
    ids.forEach(function (id) { if (!have[id]) { have[id] = 1; order.push(id); } });
    var byId = {};
    entries.forEach(function (n) { byId[n.id] = n; });
    for (var d = 0; d < (depth || 1); d++) {
      var wave = order.slice();
      wave.forEach(function (id) {
        var n = byId[id];
        if (!n) return;
        outLinks(n).forEach(function (l) { if (l.to && !have[l.to]) { have[l.to] = 1; order.push(l.to); } });
        backLinks(n).forEach(function (b) { if (!have[b.entry.id]) { have[b.entry.id] = 1; order.push(b.entry.id); } });
      });
    }
    return order.map(function (id) { return byId[id]; }).filter(Boolean);
  }

  function sortForBook(list, how) {
    var arr = list.slice();
    if (how === "old") arr.sort(function (a, b) { return (a.createdAt || "") < (b.createdAt || "") ? -1 : 1; });
    else if (how === "new") arr.sort(function (a, b) { return (a.createdAt || "") > (b.createdAt || "") ? -1 : 1; });
    else if (how === "title") arr.sort(function (a, b) { return String(a.title || "").localeCompare(String(b.title || ""), "ko"); });
    return arr;
  }

  // 저장된 시각은 UTC 라, 날짜만 뽑을 때는 «보는 사람 기준»으로 바꿔야 하루가 어긋나지 않는다
  function localDay(ts) {
    var d = new Date(ts);
    if (isNaN(d.getTime())) return "";
    return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
  }

  function bookRange(list) {
    var ds = list.map(function (n) { return localDay(n.createdAt); }).filter(Boolean).sort();
    if (!ds.length) return "";
    return ds[0] === ds[ds.length - 1] ? ds[0] : (ds[0] + " ~ " + ds[ds.length - 1]);
  }

  // 제목을 앵커(#링크)로 · 한글도 그대로 쓰되 공백만 -
  function anchorOf(i, title) {
    return "ch" + i + "-" + String(title || "").trim().toLowerCase().replace(/[^\w가-힣]+/g, "-").replace(/^-|-$/g, "").slice(0, 40);
  }

  function compileMarkdown(list, o) {
    var L = [];
    L.push("# " + (o.title || "기록 모음"));
    L.push("");
    var sub = ["기록 " + list.length + "편"];
    var range = bookRange(list); if (range) sub.push(range);
    sub.push("PKOS 로 엮음 · " + dateStamp());
    L.push("> " + sub.join(" · "));
    L.push("");

    if (o.toc) {
      L.push("## 목차");
      L.push("");
      list.forEach(function (n, i) {
        var t = typeOf(n.type);
        L.push((i + 1) + ". [" + (n.title || "(제목 없음)") + "](#" + anchorOf(i + 1, n.title) + ")"

     앱이 세운 나무와 드라이브의 진짜 폴더가 «같은 것» 이라는 걸 확인할 길이 없었다.
     여기서 바로 열어 보면 안다. 폴더 ID 를 이미 아는 줄은 바로 열리고,
     이름길만 아는 줄은 뿌리부터 한 칸씩 내려가 찾는다 (없으면 만들지 않는다 ·
     보러 가는 길에서 폴더가 새로 생기면 그게 더 나쁘다).
     ========================================================= */
  function driveFolderUrl(id) { return "https://drive.google.com/drive/folders/" + id; }
  /* 이름길로 진짜 폴더를 «찾기만» 한다 · 못 찾으면 null */
  function findFolderIdByPath(path) {
    if (!folder.id) return Promise.resolve(null);
    if (!path.length) return Promise.resolve(folder.id);
    return path.reduce(function (chain, nm) {
      return chain.then(function (pid) {
        if (!pid) return null;
        return findInFolder(safeName(nm, 60), pid);
      });
    }, Promise.resolve(folder.id)).catch(function () { return null; });
  }
  /* 새 탭은 «누른 그 순간» 에 열어야 막히지 않는다.
     ⚠️ 폴더를 찾아온 뒤에 열면 브라우저가 «내가 안 누른 창» 으로 보고 막는다.
        그래서 빈 탭을 먼저 띄우고, 주소는 찾은 뒤에 넣는다. */
  function openDriveFolder(path, fid) {
    if (!connected) { toast("드라이브에 연결한 뒤에 열 수 있습니다."); return; }
    if (fid) { window.open(driveFolderUrl(fid), "_blank", "noopener"); return; }
    var w = window.open("", "_blank");
    findFolderIdByPath(path).then(function (id) {
      if (!id) {
        if (w) w.close();
        toast("드라이브에서 이 폴더를 못 찾았습니다.");
        toast2("아직 저장된 기록이 없어 폴더가 안 만들어졌을 수 있습니다.");
        return;
      }
      if (w) w.location = driveFolderUrl(id);
      else window.open(driveFolderUrl(id), "_blank", "noopener");
    });
  }
  function folderMenuItems(label, path, fid, count) {
    var here = path.length ? path.join(" / ") : (folder.name || "내 폴더");
    var mine = entries.filter(function (n) { return !n.trashed && underPath(n, path); });
    var items = [

  /* =========================================================
     의견 받기 · 질문 · 개선 의견 · 오류
     ---------------------------------------------------------
     쓰다가 막힌 자리에서 바로 적어 보낸다. 보낸 것은 만든 사람의 구글 시트 한 장에 쌓인다.
     이 앱은 서버가 없으므로, 받는 자리는 «구글 앱스 스크립트 웹 앱» 하나다.
       · 주소는 설정 → 의견 받기 에 넣는다 (이 기기에 저장 · 아래 FEEDBACK_URL 이 기본값)
       · 보내기는 no-cors 로 던진다 · 답을 못 읽으므로 «던져졌다» 까지만 안다
       · 못 보낸 것은 이 기기에 남겨 두었다가 다음에 열 때 다시 보낸다
     ⚠️ 기록 내용은 절대 딸려 보내지 않는다. 사람이 적은 글과 화면 정보만 간다.
     ========================================================= */
  /* 배포한 앱스 스크립트 웹 앱 주소 · 이 사본을 쓰는 모든 사람의 의견이 여기로 간다.
     ⚠️ 코드를 고쳐 «새 배포» 를 하면 주소가 바뀔 수 있다. 바뀌면 여기도 같이 고친다.
     기기마다 다른 자리로 보내고 싶으면 설정 → 💬 의견 받기 에서 덮어쓴다. */
  var FEEDBACK_URL = "https://script.google.com/macros/s/AKfycbyM9sXaHOhaCSj1AsYmdhI8sURPHiyfRYkJpA8AVFYHIU8LVmQz4zIo_ZtyScBAH3I2/exec";
  var FEEDBACK_SHEET = "https://docs.google.com/spreadsheets/d/1VXvf_7Ki80cmeXeJjplX6ITA0v8n5a-0YK4yTpXGkM0/edit";
  var FB_KINDS = ["질문", "개선 의견", "오류"];

  function fbUrl() {
    try { return (localStorage.getItem("pkos.feedbackUrl.v1") || FEEDBACK_URL || "").trim(); }
    catch (e) { return FEEDBACK_URL; }
  }
  function fbSetUrl(u) {
    try {
      if (u) localStorage.setItem("pkos.feedbackUrl.v1", String(u).trim());
      else localStorage.removeItem("pkos.feedbackUrl.v1");
    } catch (e) {}
  }
  /* 이 기기를 가리키는 이름 없는 번호 하나.
     같은 사람이 이어서 보낸 것을 묶어 보려는 것뿐이다 · 누구인지는 담지 않는다. */
  function fbClientId() {
    var k = "pkos.clientId.v1", v = null;
    try { v = localStorage.getItem(k); } catch (e) {}
    if (!v) {
      v = "c" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
      try { localStorage.setItem(k, v); } catch (e) {}
    }
    return v;
  }
  function fbLog() { return safeParse(localStorage.getItem("pkos.feedbackLog.v1")) || []; }
  function fbLogSave(list) {
    try { localStorage.setItem("pkos.feedbackLog.v1", JSON.stringify(list.slice(-40))); } catch (e) {}
  }
  /* 지금 무엇을 보고 있었나 · 「어느 화면에서 그랬는지」 가 없으면 고칠 자리를 못 찾는다 */
  function fbWhere() {
    var w = [];
    /* ⚠️ 의견 창도 «뜬 창» 이다. 보내는 순간에 세면 어느 기록에나 「설정·창 열림」 이 붙어서,
       정작 어디서 막혔는지를 못 읽는다 · 의견 창 자신은 빼고 센다. */
    var lays = Array.prototype.filter.call(document.querySelectorAll(".modal-bg"), function (b) {
      return !b.getAttribute("data-fb");
    });
    if (lays.length) w.push("설정·창 열림");
    if (viewerEl) w.push("전체 보기");
    if (!composerFolded) w.push(editingId ? "기록 편집" : "새 기록 쓰기");
    if (smartView) w.push("목록 · " + smartView);
    if (filterPath && filterPath.length) w.push("폴더 · " + filterPath.join("/"));
    if (document.body.classList.contains("focusing")) w.push("집중 모드");
    return w.join(" · ") || "목록";
  }
  function fbContext() {
    return {
      /* ⚠️ 창이 화면에 안 떠 있는 순간에는 innerWidth 가 0 으로 나온다. 시트에 «0x0» 이
         찍히면 「어느 크기에서 그랬는지」 를 못 읽는다 · 그때는 화면 해상도로 대신한다. */
      screen: (window.innerWidth || (window.screen && window.screen.width) || 0) + "x" +
              (window.innerHeight || (window.screen && window.screen.height) || 0) +
              (window.devicePixelRatio ? " @" + window.devicePixelRatio + "x" : ""),
      ua: navigator.userAgent || "",
      lang: navigator.language || "",
      built: document.lastModified || "",
      connected: connected ? "연결됨" : "연결 안 됨",
      entries: (typeof entries !== "undefined" && entries) ? entries.length : 0,
      where: fbWhere()
    };
  }
  /* 보내기 · 두 걸음이다.
     ① 먼저 답을 읽을 수 있는 길(cors)로 던진다. 앱스 스크립트 웹 앱은 답에
        허용 표시를 붙여 주므로 보통 이쪽이 된다 · «시트에 들어갔다» 를 진짜로 확인한다.
     ② 브라우저가 답 읽기를 막으면 그때만 던지기만 하는 길(no-cors)로 간다.
     ⚠️ 예전에는 처음부터 no-cors 한 길이었다. 그러면 주소를 아무렇게나 적어도
        «보냈습니다» 가 떴다 · 답을 못 읽으니 404 인지 성공인지 가릴 수가 없었다.
        서버가 «없다» 고 또렷이 답한 것은 실패로 친다 · 다시 던져 봐야 소용없다. */
  function fbPost(payload) {
    var url = fbUrl();
    if (!url) return Promise.reject(new Error("보내는 자리가 아직 정해지지 않았습니다."));
    var body = JSON.stringify(payload);
    var head = { "Content-Type": "text/plain;charset=utf-8" };   // 미리 묻는 절차를 안 부르는 형식
    return fetch(url, { method: "POST", mode: "cors", redirect: "follow", headers: head, body: body })
      .then(function (r) {
        if (!r.ok) { var e = new Error("HTTP " + r.status); e.http = true; throw e; }
        return r.text().then(function (t) {
          var j = null;
          try { j = JSON.parse(t); } catch (err) {}
          if (j && j.ok === false) { var e2 = new Error(j.error || "받는 쪽이 거절했습니다"); e2.http = true; throw e2; }
          return true;                       // 확인됨
        });
      })
      .catch(function (err) {
        if (err && err.http) throw err;      // 받는 쪽이 또렷이 «안 된다» 고 한 것
        return fetch(url, { method: "POST", mode: "no-cors", headers: head, body: body })
          .then(function () { return "unverified"; });
      });
  }
  function fbQueue() { return safeParse(localStorage.getItem("pkos.feedbackQ.v1")) || []; }
  function fbQueueSave(list) {
    try { localStorage.setItem("pkos.feedbackQ.v1", JSON.stringify(list.slice(-20))); } catch (e) {}
  }
  function fbFlush() {
    var q = fbQueue();
    if (!q.length || !fbUrl() || !navigator.onLine) return;
    var one = q[0];
    fbPost(one).then(function () {
      var rest = fbQueue().filter(function (x) { return x.id !== one.id; });
      fbQueueSave(rest);
      var log = fbLog().map(function (r) { return r.id === one.id ? (r.pending = false, r) : r; });
      fbLogSave(log);
      if (rest.length) setTimeout(fbFlush, 800);
    }).catch(function () {});
  }

          toast2("이 브라우저가 답을 못 읽게 막았습니다. 안 왔으면 다시 한 번 보내 주세요.");

      b.addEventListener("contextmenu", function (e) {

    if (treeOpen) {
    /* ⚠️ 뿌리 줄에 hasKids 를 false 로 못 박아 두었다. 그래서 아래에 폴더가 열둘이나

    var rootHasKids = root.order.length > 0;

  /* ---- 양식으로 시작하기 ----

  function fillTplText(s) {
    var d = new Date();
    var wd = ["일", "월", "화", "수", "목", "금", "토"][d.getDay()];
    return String(s == null ? "" : s)
      .replace(/\{날짜\}/g, dateStamp(d.getTime()))
      .replace(/\{요일\}/g, wd);

  function startFromTemplate(tpl) {

    blocks = (tpl.blocks || []).map(function (t) {

      if (Array.isArray(t.items)) {

      }
      if (Array.isArray(t.head)) { b.head = t.head.slice(); b.rows = (t.rows || [t.head.map(function () { return ""; })]).map(function (r) { return r.slice(); }); }
      return b;
    });

  /* ▾ 안에 든 것 · 자리를 바꾸는 세 가지 길 */
  var sideMenuOpen = false;

    (settings.templates || []).slice(0, 6).forEach(function (tpl) {

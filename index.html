<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="글·사진·링크·파일을 블로그처럼 이어 쓰고, 내 구글 드라이브 폴더에 마크다운으로 쌓는 개인지식운영체제 PKOS (Personal Knowledge Operation System) 의 기록 도구" />
<meta name="theme-color" content="#2f5fd6" />
<!-- 글꼴 · 프리텐다드. 업노트가 서 있는 «군더더기 없는 고딕» 자리다.
     ⚠️ 지금까지는 이름만 적어 두어서, 이 글꼴이 «깔려 있는 기기» 에서만 떴고
        나머지는 맑은 고딕으로 떨어져 화면이 기기마다 달라 보였다. 받아 와서 맞춘다.
     못 받아 와도(오프라인·차단) 아래 시스템 글꼴로 그대로 떨어진다 · 글이 안 보이는 일은 없다. -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="기록장" />
<title>개인지식운영체제 · PKOS</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<!-- 폴더·파일 고르기 창(구글 Picker). 좁은 권한에서 «밖에 있는 파일» 을 집어 오는 유일한 통로다. -->
<script src="https://apis.google.com/js/api.js" async defer></script>
<style>
  /* =========================================================
     모양 토큰 · 「프리셋」은 이 값들만 갈아 끼운다

     ⚠️ 프리셋마다 화면 CSS 를 따로 쓰지 마세요.
        그러면 기능을 하나 고칠 때마다 프리셋 수만큼 고쳐야 합니다.
        새 화면을 만들 때도 색·굵기·모서리는 반드시 아래 토큰으로 쓰세요.
        그래야 프리셋은 저절로 따라옵니다.
     ========================================================= */
  /* =========================================================
     보는 것을 정하는 축 넷 · 서로 섞이지 않게 갈라 둔다.

       data-theme  모양   글꼴 · 모서리 · 테두리 굵기 · 돌기 · 여백
       data-mode   밝기   (없음)=기기 따름 · light=밝게 · dark=어둡게
       data-size   글자   (없음)=보통 · big=크게 · huge=아주 크게
       (색감은 아직 모양에 붙어 있다. 다음 묶음에서 가른다)

     ⚠️ 한 축을 고쳐도 다른 축이 안 흔들려야 한다. 그래야 «일관적» 이다.
        그래서 화면 CSS 는 하나뿐이고, 축들은 «토큰 값» 만 바꾼다.
     ========================================================= */
  :root {
    /* 글자 크기 배율. 화면 CSS 의 모든 font-size 가 이 값을 곱해 쓴다.
       ⚠️ 12px 아래로는 내려가지 않게 해 두었다. 그 밑은 읽으라고 둔 글자가 아니다. */
    --fs: 1.5;
    /* 획 굵기 · 크기와 함께 움직여야 «읽힌다» 가 된다 */
    --fw-body: 600; --fw-title: 800;

    --bg: #f5f7fb; --panel: #fff; --ink: #1b2130; --ink-soft: #667085;
    --brand: #2f5fd6; --brand-dark: #24499f; --brand-soft: #eaf0ff;
    --line: #e3e8f2; --line-soft: #eef1f7;
    /* 딱딱한 그림자(블록·블록놀이가 쓰는 «찍힌» 그림자)의 색.
       모양이 이 값을 «가리키기만» 하므로, 색감을 바꾸면 그림자도 따라온다. */
    --hard: #1b2130;
    --danger: #d64545; --ok: #1a9e5f; --warn: #b07a00;
    /* 알림 띠 · 뜻(주의/됨)은 그대로 두고 색만 프리셋이 고를 수 있게 한다 */
    --warn-bg: #fff8e6; --warn-line: #f0dca8; --warn-ink: #6b4e00;
    --ok-bg: #eaf7f0; --ok-line: #b9e3cd; --ok-ink: #0f5c39;
    --pin-bg: #fff4d6;
    --shadow: 0 1px 3px rgba(20,30,60,.06), 0 8px 24px rgba(20,30,60,.06);

    /* 글꼴 */
    --font-body: "Pretendard Variable", "Pretendard", -apple-system, BlinkMacSystemFont,
                 "Apple SD Gothic Neo", "Segoe UI", "Malgun Gothic", "맑은 고딕", system-ui, sans-serif;
    --font-title: var(--font-body);
    --title-spacing: -.3px;

    /* 선·모서리 */
    --bw: 1px;                 /* 테두리 굵기 */
    --radius: 14px;            /* 카드 */
    --r-btn: 10px;             /* 단추 */
    --r-btn-sm: 8px;
    --r-inp: 10px;             /* 입력칸 */
    --r-pill: 999px;           /* 둥근 딱지(배지·태그·칩) */
    --r-block: 12px;           /* 에디터 블록 */

    /* 기록 카드.
       ⚠️ --entry-bg: var(--c-soft) 처럼 쓰면 안 된다. 안쪽 var() 는 «선언한 곳(html)» 에서 풀려서
          카드마다 다른 --c-soft 를 못 본다. 그래서 «덮개» 를 걷는 방식으로 한다. 
          카드 바탕은 언제나 유형 색이고, 기본 프리셋은 그 위를 종이색으로 덮어 가린다. */
    --veil: var(--panel);      /* 종이색 덮개. transparent 로 바꾸면 유형 색이 드러난다 */
    --entry-pt: 16px;          /* 위쪽 여백 (돌기가 있으면 넓어진다) */
    --accent-w: 3px;           /* 위쪽 색줄 */
    --accent-l: 0px;           /* 왼쪽 색줄 */
    --stud: none;              /* 레고 돌기 · 브릭 계열 프리셋만 block */
    --stud-w: 82px;            /* 돌기 줄 너비 */
    --stud-h: 11px;            /* 돌기 지름 */
    --stud-step: 21px;         /* 돌기 사이 간격 */

    /* 유형 색 여섯 자리. 유형은 사용자가 더 만들 수 있어서 «차례»로 돌려 쓴다.
       기본 프리셋은 여섯 자리가 모두 같은 파랑 · 지금 화면 그대로다. */
    --t1: #2f5fd6; --t1s: #eaf0ff;
    --t2: #2f5fd6; --t2s: #eaf0ff;
    --t3: #2f5fd6; --t3s: #eaf0ff;
    --t4: #2f5fd6; --t4s: #eaf0ff;
    --t5: #2f5fd6; --t5s: #eaf0ff;
    --t6: #2f5fd6; --t6s: #eaf0ff;
  }

  /* =========================================================
     모양은 «레고» 하나 · **색은 한 톨도 없다.**
     색은 아래 «색감» 이 맡는다. 색감 여섯이 이 한 모양 위에서 갈아입는다.
     예전에는 일곱이었다 (메모지·블록·공책·블록놀이·문서·설계도·기본).
     일곱을 고르게 하니 고르는 일 자체가 짐이었다. 이 도구의 정체성은 하나다 ·
     납작한 색면 · 둥근 모서리 · 돌기 · 둥근 제목 글꼴 · 잘 읽히는 고딕 본문.
     ⚠️ 여기에 색을 적고 싶어지면, 그건 색감에 적어야 하는 것이다.
     ========================================================= */
  [data-theme="lego"] {
    /* 그림자는 «있는 줄 모르게» · 종이가 살짝 떠 있는 정도 */
    --shadow: 0 1px 2px rgba(20,20,20,.04);
    --font-title: var(--font-body); --title-spacing: 0px;
    --bw: 1px;                   /* 테두리는 머리카락만큼 */
    --radius: 10px; --r-btn: 8px; --r-btn-sm: 7px; --r-inp: 8px; --r-pill: 999px; --r-block: 8px;
    --veil: var(--panel);        /* 기록 카드는 흰 종이다 · 색은 배지에만 */
    --entry-pt: 16px;
    --accent-w: 0px;             /* 위쪽 색줄 없음 */
    --stud: none;                /* 돌기 없음 */
  }
  /* 머리띠 · 조용한 판. 글이 주인공이고 머리띠는 자리만 잡아 준다.
     ⚠️ 예전에는 강조색을 통째로 깔았다. 색면이 크면 화면 전체가 그 색 이야기가 되어,
        정작 읽어야 할 글이 뒤로 밀린다. 색은 «지금 고른 것» 에만 쓴다. */
  [data-theme="lego"] header.top { background: var(--panel); border-bottom: 1px solid var(--line); }
  [data-theme="lego"] .logo { color: var(--ink); font-weight: var(--fw-title); }
  [data-theme="lego"] .logo small { color: var(--ink-soft); }
  [data-theme="lego"] .logo .logomark { color: var(--brand); }
  [data-theme="lego"] header.top .acct { color: var(--ink-soft); }
  [data-theme="lego"] header.top .syncpill { color: var(--ink-soft); }
  [data-theme="lego"] header.top .syncpill.busy { color: var(--brand); }
  /* 왼쪽 기둥은 옅은 바탕, 읽는 자리는 흰 종이 · 둘이 갈려야 눈이 쉰다 */
  [data-theme="lego"] body { background: var(--bg); }
  [data-theme="lego"] #sideNav { background: var(--bg); border-right: 1px solid var(--line); }
  [data-theme="lego"] .layout { background: var(--panel); }
  [data-theme="lego"] #sideNav { background: var(--bg); }
  /* 카드 사이를 띄우는 대신 «줄» 로 가른다 · 업노트의 목록처럼 글이 이어져 읽힌다 */
  [data-theme="lego"] .composer { border-color: var(--line-soft); }
  [data-theme="lego"] .banner { border-radius: var(--r-btn); }
  [data-theme="lego"] .chip { font-weight: var(--fw-body); }
  [data-theme="lego"] .btn { font-weight: var(--fw-body); }
  [data-theme="lego"] .sidenew { font-size: calc(14.5px * var(--fs)); padding: 10px; font-weight: var(--fw-title); }
  /* ---------- 선 아이콘 · 그림글자 대신 ----------
     currentColor 를 쓰므로 어느 색감·밝기에서도 글자와 같은 색으로 선다. */
  .bico { width: calc(19px * var(--fs)); height: calc(19px * var(--fs)); flex: 0 0 auto;
          fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .top-inner .btn.sm { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; }
  .vbtn .bico { width: calc(16px * var(--fs)); height: calc(16px * var(--fs)); vertical-align: -3px; }
  .vbtn { display: inline-flex; align-items: center; gap: 5px; }
  .logomark { width: calc(21px * var(--fs)); height: calc(21px * var(--fs)); flex: 0 0 auto;
              fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  /* 키보드로 다니는 사람에게도 «지금 어디» 가 보여야 한다 */
  .btn:focus-visible, .siderow:focus-visible, .vbtn:focus-visible, .burgerbtn:focus-visible,
  .chip:focus-visible, .tonebtn:focus-visible, .pickbtn:focus-visible {
    outline: 2.5px solid var(--brand); outline-offset: 2px;
  }
  [data-theme="lego"] header.top .btn:focus-visible,
  [data-theme="lego"] .burgerbtn:focus-visible { outline-color: var(--panel); }

  /* 머리띠 위 단추 · 평소엔 글자만, 올리면 테두리가 뜬다 */
  [data-theme="lego"] header.top .btn.sm { border-color: transparent; background: transparent; color: var(--ink-soft); }
  [data-theme="lego"] header.top .btn.sm:hover { border-color: var(--line); background: var(--bg); color: var(--brand); }
  [data-theme="lego"] header.top .btn.primary {
    background: var(--brand); color: #fff; border-color: var(--brand); font-weight: 600;
  }
  [data-theme="lego"] header.top .btn.primary:hover { background: var(--brand-dark); color: #fff; }
  @media (max-width: 720px) {
  }

  /* =========================================================
     왼쪽 · 폴더 구조
     PC 에서는 늘 보이는 왼쪽 기둥, 폰에서는 줄 셋(☰)으로 여는 서랍.
     같은 것을 자리만 달리해 보여 준다 · 배우는 것이 하나여야 한다.
     ========================================================= */
  /* =========================================================
     3단 · 업노트의 자리 나눔 · 왼쪽 기둥 │ 가운데 목록 │ 오른쪽 편집
     ⚠️ 세 칸이 각자 스크롤해야 한다. 한 덩어리로 굴리면 목록을 훑는 동안
        쓰던 칸이 화면 밖으로 사라져서, «어디에 쓰고 있었지» 가 된다.
     좁아지면 두 칸(기둥+한 덩어리)으로, 더 좁아지면 한 칸으로 접힌다.
     ========================================================= */
  /* 칸 너비는 «값» 으로 빼 둔다 · 경계를 끌면 이 값 하나만 바뀐다.
     사람이 정한 값은 .layout 에 직접 붙으므로(인라인) 아래 어떤 규칙보다 세다. */
  .layout { display: grid; position: relative;
            grid-template-columns: var(--col-nav, 264px) minmax(0, 1fr);
            max-width: 1290px; margin: 0 auto; }
  .listcol { display: none; }
  @media (min-width: 1180px) {
    .layout { grid-template-columns: var(--col-nav, 248px) var(--col-list, 352px) minmax(0, 1fr);
              max-width: none; margin: 0; }
    .listcol { display: block; border-right: 1px solid var(--line); background: var(--bg);
               position: sticky; top: var(--top-h, 66px); align-self: start;
               height: calc(100vh - var(--top-h, 66px)); overflow-y: auto; padding: 0 12px 24px; }
    /* ⚠️ 오른쪽 칸은 이미 «남은 자리 전부» 인데, 그 안에서 다시 860px 로
       가둬 두었다. 넓은 화면에서 글 왼쪽·오른쪽에 흰 판이 넓게 남아
       «화면이 비어 있다» 가 됐다. 칸을 받았으면 칸을 쓴다.
       ⚠️ 그런데 칸을 다 주었더니 이번엔 글줄이 1920px 화면에서 한 줄 217자가
          됐다. 눈이 줄 끝에서 다음 줄 머리를 못 찾는다 (읽기 좋은 줄은 45~90자).
          그래서 «칸» 이 아니라 «줄» 에 자를 댄다 · 종이는 칸 끝까지 그대로 서고,
          남는 폭은 여백으로 돌린다. 판이 끊겨 빈 자리로 보이는 일이 없다.
          1000px 을 넘을 때만 걸린다 · 보통 너비에서는 예전 그대로 꽉 찬다. */
    .layout > .wrap { max-width: none; margin: 0;
                      padding: 0 max(clamp(24px, 3.2vw, 72px), calc((100% - 1000px) / 2)) 80px;
                      position: sticky; top: var(--top-h, 66px); align-self: start;
                      height: calc(100vh - var(--top-h, 66px)); overflow-y: auto; }
    #sideNav { max-height: calc(100vh - var(--top-h, 66px)); }
    /* 가운데 칸은 좁다 · 줄이 많은 것은 접거나 줄인다 */
    .listcol .toolbar { margin: 16px 0 8px; gap: 6px; }
    .listcol .toolbar h2 { font-size: calc(14.5px * var(--fs)); }
    .listcol .toolbar .viewswitch, .listcol #btnCompile { display: none; }
    .listcol .filters { gap: 5px; }
    .listcol footer.site { padding: 18px 0 8px; font-size: calc(11.5px * var(--fs)); }
    /* 목록 한 줄 · 제목 · 미리보기 두 줄 · 날짜. 그 이상은 오른쪽에서 본다 */
    .listcol #list { display: block !important; }
    .listcol .entry { margin-bottom: 6px; padding: 11px 12px; border-radius: 8px; box-shadow: none; }
    .listcol .entry .crumbs, .listcol .entry .rel, .listcol .entry .foot,
    .listcol .entry .morebtn, .listcol .entry .tags,
    .listcol .entry .head .badge, .listcol .entry .head .pinbtn { display: none; }
    /* 제목이 먼저 읽혀야 한다 · 가운데 칸에서도 한 눈에 잡히는 크기로.
       ⚠️ 키우고 나니 긴 제목이 네 줄까지 흘러 카드가 251px 이 됐다.
          미리보기가 두 줄이면 제목도 두 줄이다 · 줄 수가 들쭉날쭉하면 목록이 아니다. */
    .listcol .entry .head h3 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
                               overflow: hidden; font-size: calc(16.5px * var(--fs)); line-height: 1.4;
                               font-weight: 700; }
    .listcol .entry .head .when { font-size: calc(11.5px * var(--fs)); margin-top: 4px; }
    /* 미리보기는 «딱 두 줄» · 높이로 자르면 셋째 줄이 반쯤 잘려 보인다 */
    .listcol .entry .content { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
                               overflow: hidden; max-height: none; font-size: calc(12.5px * var(--fs));
                               color: var(--ink-soft); margin-top: 5px; line-height: 1.55; }
    /* ⚠️ 가운데 칸은 352px 이다. 거르개 칩을 그대로 두면 다섯 줄을 먹어서
       기록이 한 편도 안 보인 채로 화면이 끝난다. 태그는 왼쪽 기둥에 이미 있다. */
    .listcol #tagFilters { display: none; }
    .listcol #typeFilters { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; }
    .listcol #typeFilters::-webkit-scrollbar { height: 0; }
    .listcol #typeFilters .chip { flex: 0 0 auto; }
    .listcol .entry .content::after { display: none; }
    .listcol .entry .content p { margin: 0; }
    .listcol .entry .content h4, .listcol .entry .content figure, .listcol .entry .content .gallery,
    .listcol .entry .content blockquote, .listcol .entry .content .codeblock,
    .listcol .entry .content .tscroll, .listcol .entry .content details { display: none; }
    /* ⚠️ 소제목·사진·인용·코드·표는 감추면서 «삽입한 페이지» 만 빠뜨렸다.
       보통 카드가 135~160px 인데 삽입이 붙은 카드는 311px · 두 배 넘게 먹었다.
       가운데 칸의 규칙은 「제목 · 두 줄 · 날짜」다. 삽입도 한 줄로 접는다.
       진짜 페이지는 오른쪽 칸(전체 보기)에서 그대로 뜬다. */
    .listcol .entry .content .embedbox { display: none; }
    .listcol .entry .content .embedline { display: block; }
    /* ⚠️ 예전에는 ⋯ 를 숨겨 두고 마우스를 얹어야 나타나게 했다. 깔끔하긴 했는데
       «지우는 길이 어디 있냐» 는 말을 들었다. 손가락으로 쓰는 기기에는 «얹기» 가 없다.
       늘 세워 두되 흐리게 · 얹으면 진해진다. */
    .listcol .entry .dots { opacity: .55; }
    .listcol .entry:hover .dots, .listcol .entry .dots:focus-visible { opacity: 1; }
    /* 지금 오른쪽에서 보고 있는 줄 · 어디를 열어 두었는지 눈에 보여야 한다 */
    .listcol .entry.sel { background: var(--brand-soft); border-color: var(--brand); }
    .listcol .entry.sel .head h3 { color: var(--brand-dark); font-weight: 700; }
    /* 오른쪽 칸에서는 작성칸이 종이처럼 · 테두리를 없앤다 */
    .layout > .wrap .composer { border: none; box-shadow: none; margin-top: 8px; padding: 8px 0 0; }
    .layout > .wrap .banner { margin-top: 14px; }
  }
  #sideNav { background: var(--panel); border-right: 1px solid var(--line-soft); padding: 16px 12px 20px;
             align-self: start; position: sticky; top: var(--top-h, 66px);
             max-height: calc(100vh - var(--top-h, 66px) - 12px); overflow: auto; }
  #sideNav .sidehead { display: flex; align-items: center; gap: 8px; padding: 2px 8px 10px;
                       font-family: var(--font-title); font-size: calc(16px * var(--fs)); letter-spacing: var(--title-spacing); }
  #sideNav .sidehead svg { flex: 0 0 auto; }
  #sideNav .sidehead .x { margin-left: auto; display: none; background: none; border: none;
                          color: var(--ink-soft); font-size: calc(18px * var(--fs)); padding: 4px 8px; cursor: pointer; }
  .siderow { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
             background: none; border: none; font: inherit; color: var(--ink); cursor: pointer;
             padding: 9px 10px; border-radius: var(--r-btn); font-size: calc(14.5px * var(--fs)); }
  .siderow:hover { background: var(--brand-soft); }
  .siderow svg { flex: 0 0 auto; color: var(--ink-soft); }
  /* ▸ 접힘 손잡이 · 돌아가며 편다. 자식이 없으면 빈 칸으로 자리만 지킨다 */
  .sidetog { flex: 0 0 auto; width: 22px; height: 22px; display: flex; align-items: center;
             justify-content: center; border-radius: 6px; color: var(--ink-soft);
             transition: transform .15s ease; }
  .sidetog:hover { background: var(--line-soft); }
  .sidetog.open { transform: rotate(90deg); }
  .sidetog.none { visibility: hidden; }
  .siderow.on .sidetog { color: var(--brand); }
  .siderow .n { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .siderow .cnt { flex: 0 0 auto; font-size: calc(12px * var(--fs)); color: var(--ink-soft); }
  .siderow.on { background: var(--brand-soft); color: var(--brand-dark); font-weight: 700; }
  .siderow.on svg, .siderow.on .cnt { color: var(--brand); }
  .siderow.d1 { padding-left: 26px; } .siderow.d2 { padding-left: 42px; } .siderow.d3 { padding-left: 58px; }
  /* 구역 이름 · 폴더·태그·휴지통을 눈으로 갈라 준다 (업노트의 사이드바 구조) */
  /* 구역 이름 = 접기 손잡이. 태그가 곧 폴더인 사람은 폴더가 열댓 개라
     칸마다 ▸ 를 다는 것으로는 안 된다 · 구역째로 접혀야 한다. */
  .sidecap { display: flex; align-items: center; gap: 5px; width: 100%; text-align: left;
             background: none; border: none; font-family: inherit; cursor: pointer;
             font-size: calc(11.5px * var(--fs)); font-weight: 700; letter-spacing: .04em;
             color: var(--ink-soft); padding: 14px 8px 5px; }
  .sidecap:hover { color: var(--brand); }
  .sidecap .cap-tw { display: inline-flex; align-items: center; justify-content: center; width: 13px;
                     opacity: .6; transition: transform .15s ease; }
  .sidecap .cap-tw svg { width: 9px; height: 9px; }
  .sidecap .cap-tw.open { transform: rotate(90deg); }
  .sidecap .n { flex: 0 1 auto; }
  .sidecap .cnt { margin-left: auto; font-weight: 500; opacity: .8; }
  .sidegap { height: 10px; }
  .smartrow, .quickrow, .tagrow {
    display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
    background: none; border: none; font: inherit; color: var(--ink); cursor: pointer;
    padding: 8px 10px; border-radius: var(--r-btn); font-size: calc(14px * var(--fs));
  }
  .smartrow:hover, .quickrow:hover, .tagrow:hover { background: var(--brand-soft); }
  .smartrow.on, .tagrow.on { background: var(--brand-soft); color: var(--brand-dark); font-weight: 700; }
  .smartrow .sico, .quickrow .sico, .tagrow .sico { flex: 0 0 auto; width: 18px; text-align: center;
                                                    color: var(--ink-soft); font-size: calc(13px * var(--fs)); }
  .smartrow.on .sico, .tagrow.on .sico { color: var(--brand); }
  .smartrow .n, .quickrow .n, .tagrow .n { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .smartrow .cnt, .tagrow .cnt { flex: 0 0 auto; font-size: calc(12px * var(--fs)); color: var(--ink-soft); }
  .quickrow { font-size: calc(13.5px * var(--fs)); padding: 7px 10px; }
  .sidemore { display: block; width: 100%; text-align: left; background: none; border: none; cursor: pointer;
              color: var(--ink-soft); font-size: calc(12.5px * var(--fs)); padding: 6px 10px 2px; font-family: inherit; }
  .sidemore:hover { color: var(--brand); }
  .sidenew { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
             margin-top: 14px; background: var(--brand); color: var(--panel); border: none; cursor: pointer;
             font-family: var(--font-title); letter-spacing: var(--title-spacing);
             font-size: calc(16px * var(--fs)); border-radius: var(--r-btn); padding: 12px; }
  .sidenew:hover { background: var(--brand-dark); }
  /* ＋ 새 기록 옆에 붙은 ▾ · 열에 아홉은 그냥 왼쪽을 누른다.
     자리를 바꾸는 일은 드무니 ▾ 뒤에 접어 둔다. 자주 안 쓰는 것을 앞에 세우지 않는다. */
  .sidenewrow { display: flex; gap: 2px; margin-top: 14px; }
  .sidenewrow .sidenew { margin-top: 0; border-radius: var(--r-btn) 0 0 var(--r-btn); flex: 1 1 auto; }
  .sidenewmore { flex: 0 0 auto; width: 42px; background: var(--brand-dark); color: var(--panel);
                 border: none; cursor: pointer; border-radius: 0 var(--r-btn) var(--r-btn) 0;
                 font-size: calc(13px * var(--fs)); }
  .sidenewmore:hover { filter: brightness(1.14); }
  .sidemenu { margin: 6px 0 0; border: 1px solid var(--line); border-radius: var(--r-btn);
              background: var(--panel); overflow: hidden; }
  .sidemenu button { display: block; width: 100%; text-align: left; background: none; border: none;
                     font: inherit; color: var(--ink); cursor: pointer; padding: 10px 12px;
                     font-size: calc(13.5px * var(--fs)); line-height: 1.5; }
  .sidemenu button:hover { background: var(--brand-soft); color: var(--brand-dark); }
  .sidemenu button small { display: block; color: var(--ink-soft); font-size: calc(11.5px * var(--fs)); }
  .sidemenu button:hover small { color: inherit; }
  .sidemenu .sep { height: 1px; background: var(--line-soft); }
  .sidemenu .note { padding: 9px 12px; font-size: calc(11.5px * var(--fs)); color: var(--ink-soft);
                    line-height: 1.65; background: var(--bg); }
  /* 지금 «여기에 쓴다» 는 자리 · 보고 있는 자리(on)와 눈으로 구분되어야 한다 */
  .siderow.desk { box-shadow: inset 3px 0 0 var(--brand); }
  /* 앱만 기억하고 있는 자리 · 드라이브에서는 안 보인다 */
  .siderow.gone { opacity: .5; }
  .siderow.gone .n { text-decoration: line-through; text-decoration-thickness: 1px; }
  .siderow .pin { flex: 0 0 auto; font-size: calc(11px * var(--fs)); color: var(--brand); font-weight: 700; }

  /* 작성칸 접기 · 폴더를 볼 때는 목록이 위로 올라온다 */
  .cfold { display: none; }
  /* ⚠️ 이름을 «collapsed» 로 쓰면 안 된다. 그 이름은 이미 «접힌 본문의 페이드»(.collapsed::after)
     가 쓰고 있어서, 작성칸을 접는 순간 그 70px 짜리 투명 덮개가 «＋ 새 기록» 위에 얹혔다.
     눈에는 멀쩡한 단추가 보이는데 눌러도 아무 일이 안 일어났다.
     클래스 이름은 «무엇처럼 보이나» 가 아니라 «누가 이미 쓰고 있나» 로 정해야 한다. */
  .composer.cfolded { padding-top: 14px; padding-bottom: 14px; }
  .composer.cfolded > *:not(.cfold) { display: none; }
  .composer.cfolded .cfold { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .cfoldbtn { display: flex; align-items: center; gap: 8px; background: var(--brand); color: var(--panel);
              border: none; cursor: pointer; padding: 11px 20px; border-radius: var(--r-btn);
              font-family: var(--font-title); letter-spacing: var(--title-spacing);
              font-size: calc(16px * var(--fs)); }
  .cfoldbtn:hover { background: var(--brand-dark); }
  .cfoldwhere { font-size: calc(13px * var(--fs)); color: var(--ink-soft); }
  .cfoldwhere b { color: var(--ink); }

  /* 이 기록이 갈 자리 · 작성칸 맨 위 한 줄. 쓰기 전에 어디로 가는지 늘 보인다 */
  .deskline { display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
              font-size: calc(13px * var(--fs)); color: var(--ink-soft);
              background: var(--bg); border: 1px solid var(--line-soft);
              border-radius: var(--r-btn); padding: 9px 12px; margin: 0 0 12px; }
  .deskline b { color: var(--ink); }
  .deskline .spacer { flex: 1 1 auto; }
  /* 줄 셋(☰) · 어디서나 «폴더 구조를 열고 닫는» 단추다.
     PC 에서는 기둥을 접었다 펴고, 폰에서는 서랍을 연다. 한 단추, 한 뜻. */
  .burgerbtn { display: flex; flex-direction: column; justify-content: center; align-items: center;
               gap: 4.5px; width: 40px; height: 40px; flex: 0 0 auto; cursor: pointer;
               background: var(--panel); border: var(--bw) solid var(--line); border-radius: var(--r-btn-sm); }
  .burgerbtn i { display: block; width: 17px; height: 2.5px; border-radius: 2px; background: var(--ink); }
  [data-theme="lego"] .burgerbtn { background: transparent; border-color: transparent; }
  [data-theme="lego"] .burgerbtn:hover { background: var(--bg); border-color: var(--line); }
  [data-theme="lego"] .burgerbtn i { background: var(--ink-soft); }
  /* ☰ 는 «세 단» 으로 돈다 · 누를 때마다 한 겹씩 걷힌다.
       0 · 기둥 │ 목록 │ 쓰는 자리   (다 편 자리)
       1 ·      목록 │ 쓰는 자리   (기둥을 접는다)
       2 ·             쓰는 자리   (쓰는 것만 남는다)
     ⚠️ 칸을 감출 때 grid-template-columns 도 «같이» 줄여야 한다.
        칸만 display:none 하면 그 자리가 빈 흰 판으로 남는다. 실제로 그랬다. */
  @media (min-width: 1021px) {
    .layout[data-nav="1"] #sideNav, .layout[data-nav="2"] #sideNav { display: none; }
    .layout[data-nav="2"] .listcol { display: none; }
    .layout[data-nav="1"] { grid-template-columns: minmax(0, 1fr); }
    .layout[data-nav="2"] { grid-template-columns: minmax(0, 1fr); }
    .layout[data-nav="1"] .listcol, .layout[data-nav="2"] .listcol { grid-column: 1; }
    .layout[data-nav="1"] > .wrap, .layout[data-nav="2"] > .wrap { grid-column: auto; grid-row: auto; }
  }
  @media (min-width: 1180px) {
    /* 기둥만 접힌 자리 · 목록과 쓰는 자리는 그대로 둘로 선다 */
    .layout[data-nav="1"] { grid-template-columns: var(--col-list, 352px) minmax(0, 1fr); }
  }
  /* ---------- 경계를 끄는 손잡이 ----------
     칸 너비는 사람마다 다르다 · 폴더 이름이 긴 사람은 기둥이 넓어야 하고,
     제목만 훑는 사람은 목록이 좁아도 된다. 정한 너비는 기기에 남는다.
     ⚠️ 손잡이는 «격자의 칸» 이 아니라 격자 위에 얹은 띠다. 칸으로 만들면
        칸을 감추고 펴는 세 단이 손잡이까지 세느라 어긋난다.
     두 번 누르면 처음 너비로 돌아간다 · 잘못 끌었을 때 되돌릴 길이 있어야 한다. */
  .colgrip { display: none; position: absolute; top: 0; bottom: 0; width: 11px;
             margin-left: -5px; z-index: 30; cursor: col-resize; touch-action: none;
             background: none; border: 0; padding: 0; }
  .colgrip::before { content: ""; position: absolute; left: 4px; top: 0; bottom: 0; width: 3px;
                     border-radius: 3px; background: transparent; transition: background .15s; }
  .colgrip:hover::before, .colgrip.dragging::before { background: var(--brand); }
  .colgrip:focus-visible::before { background: var(--brand); }
  body.colresizing { cursor: col-resize; user-select: none; }
  @media (min-width: 1021px) {
    .layout[data-nav="0"] > #gripNav { display: block; left: var(--col-nav, 264px); }
  }
  @media (min-width: 1180px) {
    .layout[data-nav="0"] > #gripNav { left: var(--col-nav, 248px); }
    .layout[data-nav="0"] > #gripList { display: block;
      left: calc(var(--col-nav, 248px) + var(--col-list, 352px)); }
    .layout[data-nav="1"] > #gripList { display: block; left: var(--col-list, 352px); }
  }
  /* ---------- 가운데 칸만 접기 ----------
     ☰ 는 «기둥 → 목록» 순서로 한 겹씩 걷는다. 그래서 「폴더 나무는 두고 목록만 치우고 싶다」
     는 자리가 없었다. 이건 그 자리다 · 목록 머리줄의 ‹ 로 접고, 남는 세로 띠로 편다.
     접은 것은 기기에 남는다 · 늘 접어 두는 사람에게 매번 다시 접게 하면 안 된다. */
  .listfold { display: none; background: none; border: 0; padding: 2px 6px; cursor: pointer;
              color: var(--ink-soft); font-size: calc(17px * var(--fs)); line-height: 1; border-radius: 6px; }
  .listfold:hover { background: var(--brand-soft); color: var(--brand-dark); }
  .listrail { display: none; background: var(--panel); border: 0; border-right: 1px solid var(--line);
              cursor: pointer; color: var(--ink-soft); padding: 12px 0; align-items: center;
              flex-direction: column; gap: 10px; font-family: inherit; }
  .listrail:hover { background: var(--brand-soft); color: var(--brand-dark); }
  .listrail .lr-ar { font-size: calc(17px * var(--fs)); line-height: 1; }
  .listrail .lr-t { writing-mode: vertical-rl; font-size: calc(12px * var(--fs)); letter-spacing: 1px; }
  @media (min-width: 1180px) {
    .listfold { display: inline-flex; }
    /* 접힌 자리 · 목록이 있던 칸을 34px 짜리 띠로 갈아 끼운다 */
    .layout[data-listcol="off"] .listcol { display: none; }
    .layout[data-listcol="off"] > #gripList { display: none; }
    .layout[data-listcol="off"] > #listRail { display: flex; grid-column: 2; grid-row: 1;
      position: sticky; top: var(--top-h, 66px); align-self: start; height: calc(100vh - var(--top-h, 66px)); }
    .layout[data-nav="0"][data-listcol="off"] { grid-template-columns: var(--col-nav, 248px) 34px minmax(0, 1fr); }
    .layout[data-nav="1"][data-listcol="off"] { grid-template-columns: 34px minmax(0, 1fr); }
    .layout[data-nav="1"][data-listcol="off"] > #listRail { grid-column: 1; }
  }
  /* 3단이 안 되는 너비 · 목록은 쓰는 자리 «아래» 에 있다. 접으면 한 줄짜리 띠만 남는다 */
  @media (max-width: 1179px) {
    .layout[data-listcol="off"] .listcol { display: none; }
    .layout[data-listcol="off"] > #listRail { display: flex; flex-direction: row; justify-content: center;
      grid-column: 2; grid-row: 2; border-right: 0; border-top: 1px solid var(--line);
      padding: 10px 0; margin: 0 clamp(16px, 2.6vw, 40px) 40px; border-radius: 10px; gap: 8px; }
    .layout[data-listcol="off"] > #listRail .lr-ar { transform: rotate(90deg); }
    .layout[data-listcol="off"] > #listRail .lr-t { writing-mode: horizontal-tb; letter-spacing: 0; }
  }
  @media (max-width: 1020px) {
    .layout[data-listcol="off"] > #listRail { margin: 0 16px 40px; }
  }

  /* ---------- 의견 보내기 · 오른쪽 아래 ----------
     ⚠️ 만든 사람은 「어디가 불편한지」 를 모른다. 쓰는 사람은 「어디에 말해야 하는지」 를 모른다.
        그 사이를 한 단추로 잇는다 · 쓰다가 그 자리에서 바로 적어 보낼 수 있어야 한다.
     보낸 것은 만든 사람의 구글 시트 한 장에 쌓인다 (설정 → 의견 받기 에서 주소를 넣는다). */
  .fbbtn { position: fixed; right: 18px; bottom: 18px; z-index: 56;
           display: inline-flex; align-items: center; gap: 7px;
           background: var(--brand); color: #fff; border: 0; cursor: pointer;
           padding: 11px 16px; border-radius: 999px; font-family: var(--font-title);
           font-size: calc(13.5px * var(--fs)); font-weight: 600; letter-spacing: var(--title-spacing);
           box-shadow: 0 6px 20px rgba(15,20,35,.22); transition: .15s; }
  .fbbtn:hover { background: var(--brand-dark); box-shadow: 0 8px 26px rgba(15,20,35,.3); }
  .fbbtn .fbi { font-size: calc(15px * var(--fs)); line-height: 1; }
  /* 집중해서 쓰는 동안에는 비켜 준다 */
  body.focusing .fbbtn { display: none; }
  @media (max-width: 1020px) {
    /* 아래 바를 가리면 안 된다 · 바 높이는 --dockh 한 곳에만 적혀 있다 */
    .fbbtn { right: 12px; bottom: calc(var(--dockh, 74px) + 12px + env(safe-area-inset-bottom, 0px));
             padding: 10px 13px; }
    .fbbtn .fbl { display: none; }        /* 좁으면 아이콘만 · 자리를 뺏지 않는다 */
  }
  .fbkinds { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
  .fbkind { border: var(--bw) solid var(--line); background: var(--panel); color: var(--ink);
            padding: 7px 13px; border-radius: 999px; cursor: pointer; font-family: inherit;
            font-size: calc(13.5px * var(--fs)); }
  .fbkind:hover { border-color: var(--brand); color: var(--brand); }
  .fbkind.on { background: var(--brand-soft); border-color: var(--brand); color: var(--brand-dark); font-weight: 600; }
  .fbmeta { font-size: calc(12px * var(--fs)); color: var(--ink-soft); line-height: 1.6;
            background: var(--bg); border-radius: 8px; padding: 9px 11px; margin-top: 2px; }
  .fbsent { margin-top: 14px; border-top: 1px solid var(--line-soft); padding-top: 12px; }
  .fbsent h4 { margin: 0 0 7px; font-size: calc(13px * var(--fs)); color: var(--ink-soft); font-weight: 600; }
  .fbrow { display: flex; gap: 8px; align-items: baseline; padding: 5px 0;
           border-bottom: 1px solid var(--line-soft); font-size: calc(12.5px * var(--fs)); }
  .fbrow:last-child { border-bottom: 0; }
  .fbrow .fbk { flex: 0 0 auto; color: var(--brand-dark); font-weight: 600; }
  .fbrow .fbt { flex: 1 1 auto; min-width: 0; color: var(--ink);
                overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fbrow .fbw { flex: 0 0 auto; color: var(--ink-soft); }
  .fbrow .fbq { flex: 0 0 auto; color: var(--warn-ink); }

  #drawerScrim { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 59; }
  #drawerScrim.hidden { display: none; }

  @media (max-width: 1179px) {
    /* 3단이 안 되는 너비 · 가운데 칸을 오른쪽 칸 «아래» 로 되돌린다.
       한 덩어리로 이어 붙어야 좁은 화면에서 자리가 안 낀다. */
    .layout { grid-template-columns: var(--col-nav, 264px) minmax(0, 1fr); }
    /* ⚠️ 목록에만 «둘째 칸» 을 못 박아 두었더니, 뒤따르는 쓰는 칸이 갈 데를 못 찾고
       첫째 칸(기둥 자리) 둘째 줄로 떨어졌다. 기둥 옆이 통째로 빈 판이 된 까닭이다.
       둘 다 둘째 칸에, 위아래로 이어 붙인다. */
    /* ⚠️ 목록을 위, 쓰는 자리를 아래에 두었더니 글 한 줄 적으려고 목록을
       통째로 1830px 지나쳐야 했다. ☰ 를 두 번 눌러 목록을 접으면 되지만
       그건 «아는 사람만» 하는 일이다. 폰에서 하듯 쓰는 자리를 위로 올린다 ·
       접혀 있을 때는 「＋ 새 기록」 한 줄이라 목록을 거의 안 밀어낸다. */
    .listcol { display: block; grid-column: 2; grid-row: 2; border-right: none; background: transparent;
               max-width: none; margin: 0; padding: 0 clamp(16px, 2.6vw, 40px) 80px; }
    .layout > .wrap { grid-column: 2; grid-row: 1; align-self: start; max-width: none; margin: 0;
                      padding-left: clamp(16px, 2.6vw, 40px); padding-right: clamp(16px, 2.6vw, 40px); }
    /* ⚠️ 기둥이 첫 줄에만 서면 첫 줄 높이가 기둥 키(822px)로 못 박힌다.
       작성칸은 접혀 있을 때 81px 이라, 그 아래 634px 이 통째로 빈 판이 됐다.
       기둥은 두 줄에 걸친다 · 줄 높이는 «그 줄에 든 것» 이 정해야 한다. */
    /* ⚠️ -1 은 «명시한 격자» 의 끝이다. 여기는 줄을 안 적어 둔 격자(암시적)라
       1 / -1 이 «한 줄» 로 접혀 아무 소용이 없었다 · span 으로 적어야 한다. */
    #sideNav { grid-column: 1; grid-row: 1 / span 2; }
    .layout > .wrap { padding-bottom: 0; }
    .layout > .wrap footer.site { display: none; }
  }
  @media (max-width: 1020px) {
    .layout { display: block; }
    .listcol { padding: 0 16px 80px; }
    /* ⚠️ 폰에서 기록 한 편을 보기까지 700px 을 굴려야 했다.
       보기 바꾸기·엮어내기·태그 칩이 목록 «위» 를 넉 줄이나 먹고 있었기 때문이다.
       셋 다 다른 자리에 이미 있다 · 보기와 엮어내기는 아래 바 ⋯ 안에,
       태그는 서랍 안에. 같은 것을 두 번 놓느라 화면을 잃을 이유가 없다. */
    .listcol .toolbar .viewswitch, .listcol #btnCompile { display: none; }
    .listcol #tagFilters { display: none; }
    .listcol #typeFilters { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px;
                            scrollbar-width: none; }
    .listcol #typeFilters::-webkit-scrollbar { height: 0; }
    .listcol #typeFilters .chip { flex: 0 0 auto; }
    .listcol .toolbar { margin: 14px 0 8px; }
    /* 서랍 · 평소엔 왼쪽 밖에 숨어 있다가 줄 셋을 누르면 나온다.
       ⚠️ align-self 를 되돌려야 한다. 기둥일 때 쓴 start 가 남아 있으면
          고정(fixed) 요소가 위아래로 안 늘어나 서랍이 반토막이 된다. */
    #sideNav { position: fixed; left: 0; top: 0; bottom: 0; align-self: auto;
               max-height: none; width: 292px; z-index: 60;
               border-right: none; border-radius: 0 var(--radius) var(--radius) 0;
               box-shadow: 8px 0 32px rgba(0,0,0,.18);
               transform: translateX(-105%); transition: transform .18s ease; }
    #sideNav.open { transform: none; }
    #sideNav .sidehead .x { display: block; }
    /* ⚠️ 손가락은 화살표가 아니다. 길찾기 줄이 높이 19px, 태그가 26px,
       고정 단추가 28px 이었다 · 옆줄을 누르거나 아무것도 안 눌린다.
       글자 크기는 그대로 두고 «누를 수 있는 자리» 만 넓힌다 (최소 34px). */
    .entry .crumbs { gap: 2px; }
    .entry .crumb { min-height: 34px; padding: 0 6px; display: inline-flex; align-items: center; }
    .entry .tag.pick { min-height: 34px; padding: 0 12px; display: inline-flex; align-items: center; }
    .entry .pinbtn { min-height: 34px; padding: 0 12px; display: inline-flex; align-items: center; }
    .entry .tags { gap: 6px; }
    .entry .dots { min-width: 34px; min-height: 34px; }
  }

  /* ---------- 빈 화면 · 브릭 셋과 단추 하나 ---------- */
  .emptybricks { display: flex; gap: 8px; justify-content: center; margin-bottom: 10px; }
  .emptybricks i { width: 46px; height: 30px; border-radius: 8px; position: relative; display: block; }
  .emptybricks i::before { content: ""; position: absolute; top: -8px; left: 8px; width: 13px; height: 13px;
                           border-radius: 50%; background: inherit; box-shadow: 17px 0 0 0; }
  .emptytitle { font-family: var(--font-title); letter-spacing: var(--title-spacing);
                font-size: calc(21px * var(--fs)); color: var(--ink); margin: 4px 0 14px; }
  .emptybtn { background: var(--brand); color: var(--panel); border: none; cursor: pointer;
              font-family: var(--font-title); letter-spacing: var(--title-spacing);
              font-size: calc(18px * var(--fs)); border-radius: 14px; padding: 15px 30px;
              box-shadow: 0 5px 16px rgba(0,0,0,.18); }
  .emptybtn:hover { background: var(--brand-dark); }

    --t5: #E3AFC0; --t5s: #3A252C; --t6: #C2B6E0; --t6s: #2C2740;
  }

    --line: #2B3242; --line-soft: #232936; --hard: #05070B;

    --ok-bg: #10321F; --ok-line: #1E5C3C; --ok-ink: #97E0BB; --pin-bg: #3A2F12;
    --t1: #86D0A6; --t1s: #17301F; --t2: #7D9DFF; --t2s: #232C44;
    --t3: #DFC582; --t3s: #332C18; --t4: #EFA277; --t4s: #33241A;
    --t5: #EC93B8; --t5s: #331F29; --t6: #A99BF0; --t6s: #26224A;

  [data-tone="clean"][data-mode="dark"] {

    --line: #37393D; --line-soft: #2A2C2F; --hard: #08090A;
    --warn-bg: #2B2718; --warn-line: #4C4423; --warn-ink: #E0CE96;
    --ok-bg: #1B2A20; --ok-line: #33513E; --ok-ink: #A8CDB4; --pin-bg: #2E2A1E;

    --t3: #CDBB8C; --t3s: #2C2921; --t4: #CDAE96; --t4s: #2C2622;
    --t5: #C4A2AF; --t5s: #2B2427; --t6: #ADA8C6; --t6s: #26242E;
  }
  [data-tone="blue"][data-mode="dark"] {
    --bg: #10161C; --panel: #182028; --ink: #DCE6EF; --ink-soft: #8FA2B3;
    --brand: #5FB3E0; --brand-dark: #4593BC; --brand-soft: #1B2B37;
    --line: #2C3945; --line-soft: #1E2833; --hard: #05080B;
    --warn-bg: #22303B; --warn-line: #3C5062; --warn-ink: #B9CFE0;
    --ok-bg: #162C22; --ok-line: #2C513E; --ok-ink: #9CCBB0; --pin-bg: #1D2A34;
    --t1: #7CC49B; --t1s: #1A2B22; --t2: #6FB4DE; --t2s: #172833;
    --t3: #D2BB78; --t3s: #2B2718; --t4: #DFA277; --t4s: #2F241B;
    --t5: #D28FAA; --t5s: #2D1F26; --t6: #A79BDC; --t6s: #232040;
  }
  [data-tone="forest"][data-mode="dark"] {
    --bg: #141812; --panel: #1C211A; --ink: #E6EDE2; --ink-soft: #9AA495;
    --brand: #8FCB96; --brand-dark: #6EAE77; --brand-soft: #22301F;
    --line: #3A422F; --line-soft: #272D22; --hard: #080A07;
    --warn-bg: #2C2913; --warn-line: #4C4523; --warn-ink: #DECB92;
    --ok-bg: #172B1C; --ok-line: #2E5238; --ok-ink: #A3CCA9; --pin-bg: #2C2E16;
    --t1: #9FD6A6; --t1s: #1F2E20; --t2: #93BEDE; --t2s: #1C2833;
    --t3: #DCC585; --t3s: #2D2818; --t4: #DFA57C; --t4s: #2F241B;
    --t5: #DA94B2; --t5s: #2D1F27; --t6: #A79CDA; --t6s: #242140;
  }

  /* ---------- 글자 크기 ----------
     디자인 시안들이 «본문 최소 20px» 를 말하는 것은 «멀리서 보는 슬라이드» 라서다.
     손에 든 화면은 그럴 필요가 없다. 대신 **눈이 편한 사람마다 다르다** 는 것이 사실이라,
     고를 수 있게 둔다. 모양·색은 그대로고 크기만 바뀐다. */
  /* ⚠️ 세 칸을 통째로 1.5배 올렸다 (1 → 1.5 · 1.13 → 1.7 · 1.28 → 1.92).
     «가독성» 은 크기 하나로만 오지 않는다 · 획도 같이 굵어야 한다.
     그래서 몸글은 500 → 600, 제목·단추는 700 → 800 으로 올린다 (--fw-*).
     칸이 좁아 글이 답답하면 경계를 끌어 칸을 넓히면 된다 · 그 손잡이가 있다. */
  :root[data-size="big"]  { --fs: 1.7; }
  :root[data-size="huge"] { --fs: 1.92; }

  /* 밝기·글자 크기를 고르는 줄 · 모양 카드와 같은 결로 */
  .pickrow2 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .pickbtn { display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
             padding: 11px 12px; text-align: left; cursor: pointer;
             border: var(--bw) solid var(--line); border-radius: var(--r-btn);
             background: var(--panel); color: var(--ink); }
  .pickbtn:hover { border-color: var(--brand); }
  .pickbtn.on { border-color: var(--brand); box-shadow: inset 0 0 0 1px var(--brand); }
  .pickico { font-size: calc(19px * var(--fs)); line-height: 1.2; }
  .picklabel { font-weight: 700; font-size: calc(13.5px * var(--fs)); }
  .pickwhy { font-size: calc(12px * var(--fs)); color: var(--ink-soft); line-height: 1.5; }
  @media (max-width: 560px) { .pickrow2 { grid-template-columns: 1fr; } }

  /* 색감 고르기 · 견본이 «그 색감의 진짜 값» 으로 칠해진다.
     단추마다 data-tone 이 붙어 있어서, 안쪽 var() 가 그 색감에서 풀린다. */
  .tonerow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .tonebtn { display: flex; align-items: center; gap: 9px; padding: 9px 11px; text-align: left;
             cursor: pointer; border: var(--bw) solid var(--line); border-radius: var(--r-btn);
             background: var(--panel); color: var(--ink); }
  .tonebtn:hover { border-color: var(--brand); }
  .tonebtn.on { border-color: var(--brand); box-shadow: inset 0 0 0 1px var(--brand); }
  .toneswatch { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; flex: 0 0 auto;
                width: 30px; height: 30px; border-radius: 7px; overflow: hidden;
                border: 1px solid var(--line-soft); }
  .toneswatch i { display: block; }
  .tonename { display: flex; flex-direction: column; min-width: 0; }
  .tonename strong { font-size: calc(13px * var(--fs)); }
  .tonename span { font-size: calc(12px * var(--fs)); color: var(--ink-soft); line-height: 1.45; }
  @media (max-width: 560px) { .tonerow { grid-template-columns: 1fr 1fr; } }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: var(--font-body);
    font-size: calc(15px * var(--fs)); line-height: 1.62; -webkit-text-size-adjust: 100%;
    font-weight: var(--fw-body);
  }
  /* 제목 자리는 한 겹 더 굵게 · 무엇이 제목인지 크기만으로는 안 갈린다 */
  h1, h2, h3, h4, .logo, .entry .head h3, .entry h3, .sidehead, .listcol .toolbar h2 {
    font-weight: var(--fw-title);
  }
  /* 누르는 것과 고르는 것도 · 작은 글씨일수록 획이 얇으면 먼저 안 읽힌다 */
  .btn, .chip, .tag, .siderow, .pickbtn, .dockbtn .dl, .vbtn, .crumb {
    font-weight: var(--fw-body);
  }
  .btn.primary, .chip.on, .siderow.on, .entry .head .badge { font-weight: var(--fw-title); }
  /* 적는 칸도 같이 · 쓰는 동안 읽히는 글이 제일 오래 보는 글이다 */
  .inp, textarea.inp, input.inp, #blocks textarea { font-weight: var(--fw-body); }
  a { color: var(--brand); }
  button { font: inherit; cursor: pointer; }
  input, textarea, select { font: inherit; color: inherit; }
  .hidden { display: none !important; }
  .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: calc(12.5px * var(--fs)); word-break: break-all; }
  .spacer { flex: 1 1 auto; }

  .wrap { max-width: 1000px; margin: 0 auto; padding: 0 16px 80px; }

  /* ---------- 상단 바 ---------- */
  header.top { position: sticky; top: 0; z-index: 40; background: var(--panel); border-bottom: 1px solid var(--line); }
  /* flex-wrap 이 없으면 단추가 화면 밖으로 밀려난다. 폰에서 실제로 그랬다. */
  .top-inner { max-width: 1000px; margin: 0 auto; padding: 9px 16px; display: flex; align-items: center;
               gap: 10px; flex-wrap: wrap; }
  /* ⚠️ 3단이 되면서 아래 칸들은 화면 끝까지 서는데 머리띠만 가운데 1000px 에 갇혀 있었다.
     그래서 왼쪽 위·오른쪽 위에 빈 자리가 남아 «머리띠만 떠 있는» 꼴이 됐다.
     칸이 끝까지 서면 머리띠도 끝까지 서야 한다. */
  @media (min-width: 1180px) {
    .top-inner { max-width: none; margin: 0; padding-left: 18px; padding-right: 18px; }
  }
  /* ＋ 새 기록 · 머리띠에서 가장 눈에 띄는 자리 (업노트의 New Note) */
  /* ⚠️ 둘을 1px 띄워 두었더니 테두리가 두 겹으로 서고, 모서리 굵기도 sm 단추와
     안 맞아 ▾ 만 사방이 둥근 채로 따로 떠 있었다. 붙여 세우고, 사이는
     «밝은 선 하나» 로만 가른다 · 한 단추로 읽혀야 한다.
     이 규칙은 .btn.sm / .btn.primary «앞» 에 산다. 무게(specificity)가 같으면
     뒤에 오는 쪽이 이겨서 도로 제자리로 돌아간다 · 한 겹 더 얹어 눌러 둔다. */
  .topnew { display: inline-flex; align-items: stretch; flex: 0 0 auto; }
  .topnew > .btn { border-radius: 0; margin: 0; }
  .topnew > .btn:first-child { border-radius: var(--r-btn-sm) 0 0 var(--r-btn-sm); }
  .topnew > .btn.tnmore { border-radius: 0 var(--r-btn-sm) var(--r-btn-sm) 0;
                    display: inline-flex; align-items: center; justify-content: center;
                    padding: 5px 9px; min-width: 28px; line-height: 1;
                    font-size: calc(11px * var(--fs));
                    margin-left: calc(var(--bw) * -1);
                    /* 가름선은 테두리색 대신 «안쪽 그림자» 로 긋는다.
                       테두리색은 색감(테마)이 다시 덮어써서 번번이 졌다. */
                    box-shadow: inset 1px 0 0 rgba(255, 255, 255, .5); }
  .logo { font-weight: 800; font-size: calc(16.5px * var(--fs)); letter-spacing: var(--title-spacing); display: flex; align-items: center; gap: 7px;
          font-family: var(--font-title); }
  .logo small { font-weight: 500; font-size: calc(12px * var(--fs)); color: var(--ink-soft); letter-spacing: 0; }
  /* 이름표가 «홈으로» 단추가 됐다 · 단추처럼 보이면 안 된다. 누를 수 있다는 것만 알려 준다 */
  button.logo { background: none; border: 0; padding: 0; margin: 0; cursor: pointer;
                color: inherit; font-family: inherit; text-align: left; }
  button.logo:hover { color: var(--brand-dark); }
  button.logo:hover .logomark { color: var(--brand); }
  button.logo:focus-visible { outline: 2px solid var(--brand); outline-offset: 3px; border-radius: 6px; }
  /* 좁은 화면에서는 머리줄 단추를 그림글자만 남긴다. 한 줄에 들어가야 목록이 위로 올라온다. */
  @media (max-width: 560px) {
    .logo small { display: none; }
    .top-inner { gap: 6px; }
    .top-inner .lbl { display: none; }
    /* 폰에서는 아래 바에 ＋ 가 이미 있다 · 머리띠에 또 둘 자리가 없다 */
    .topnew { display: none; }
    .top-inner .btn.sm { padding: 8px 9px; }
    .logo { font-size: calc(15px * var(--fs)); }
  }
  .acct { font-size: calc(12.5px * var(--fs)); color: var(--ink-soft); max-width: 190px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* 검색을 머리띠로 올렸다 · 매일 쓰는 것은 밖에, 가끔 쓰는 것은 ⋯ 안에 */
  .topsearch { flex: 1 1 150px; max-width: 320px; min-width: 0; border-radius: 99px;
               padding: 8px 14px; font-size: calc(13.5px * var(--fs)); }
  [data-theme="lego"] header.top .topsearch { border-color: transparent; }

  /* ---------- 떠 있는 작은 메뉴 · 세 자리가 같은 모양을 쓴다 ---------- */
  .dots { background: none; border: 1px solid transparent; color: var(--ink-soft); cursor: pointer;
          border-radius: 8px; padding: 0 7px; font-size: calc(17px * var(--fs)); line-height: 1.5;
          font-family: inherit; }
  .dots:hover { border-color: var(--line); color: var(--brand); background: var(--panel); }
  .menupop { position: fixed; z-index: 200; min-width: 184px; max-width: 260px; background: var(--panel);
             border: 1px solid var(--line); border-radius: var(--r-btn); padding: 5px;
             box-shadow: 0 12px 34px rgba(0,0,0,.18); }
  .menupop button { display: block; width: 100%; text-align: left; background: none; border: none;
                    font: inherit; color: var(--ink); cursor: pointer; padding: 9px 11px;
                    border-radius: 8px; font-size: calc(13.5px * var(--fs)); line-height: 1.45; }
  .menupop button:hover { background: var(--brand-soft); color: var(--brand-dark); }
  .menupop button small { display: block; color: var(--ink-soft); font-size: calc(11.5px * var(--fs)); margin-top: 1px; }
  .menupop button:hover small { color: inherit; }
  .menupop button.danger { color: var(--danger); }
  .menupop button.danger:hover { background: var(--warn-bg); color: var(--danger); }
  .menupop .sep { height: 1px; background: var(--line-soft); margin: 4px 2px; }

  /* 작성칸 머리줄 · 제목과 집중 단추 */
  .chead { display: flex; align-items: center; gap: 8px; }
  .chead h2 { margin: 0; }

  /* ---------- 집중 모드 · 적는 칸만 남긴다 ---------- */
  /* ⚠️ 예전에는 «가운데 칸» 을 안 감췄다. 안의 것(머리줄·거르개·목록·꼬리)만 감추니
     빈 칸 하나가 화면 높이만큼 그대로 서 있었고, 적는 칸은 그 아래로 밀려
     집중을 켜면 흰 화면만 보였다. 칸째로 감춘다 · 손잡이와 가림막도 같이. */
  body.focusing header.top,
  body.focusing #sideNav,
  body.focusing #drawerScrim,
  body.focusing .colgrip,
  body.focusing .listcol,
  body.focusing #banner,
  body.focusing .toolbar,
  body.focusing .filters,
  body.focusing #list,
  body.focusing footer.site,
  body.focusing .dock { display: none !important; }
  body.focusing .layout { grid-template-columns: minmax(0, 1fr); max-width: none; margin: 0; }
  /* ⚠️ 넓은 화면에서 오른쪽 칸은 «화면에 붙어 스스로 구르는 칸» 이다 (position: sticky ·
     height: 100vh - 머리띠). 머리띠를 감춘 채로 그 값을 그대로 두면 66px 만큼 빈 자리가
     생기고 칸이 화면보다 길어진다. 집중일 때는 그냥 보통 쪽으로 되돌린다. */
  body.focusing .layout > .wrap,
  body.focusing .wrap { position: static; height: auto; max-height: none; overflow: visible;
                        max-width: 820px; margin: 0 auto; padding: 28px 20px 96px; }
  body.focusing .composer { border: none; box-shadow: none; background: transparent; }
  body.focusing #btnFocus { border-color: var(--brand); color: var(--brand); }

  /* 제목을 누르면 열린다 · 카드에서 가장 많이 하는 일이 가장 가까운 자리에 */
  .titlebtn { cursor: pointer; }
  .titlebtn:hover { text-decoration: underline; text-underline-offset: 3px; }
  .titlebtn:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 3px; }

  /* ---------- 폰 아래 고정 바 ---------- */
  .dock { display: none; }
  @media (max-width: 1020px) {
    /* 아래 바 높이는 한 곳에만 적는다 · 두 곳에 적으면 반드시 어긋난다 */
    :root { --dockh: 74px; }
    .dock { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 55;
            background: var(--panel); border-top: 1px solid var(--line);
            padding: 5px 6px calc(5px + env(safe-area-inset-bottom, 0px)); }
    .dockbtn { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 2px;
               background: none; border: none; cursor: pointer; color: var(--ink-soft);
               padding: 6px 2px; border-radius: 10px; font-family: inherit; overflow: hidden; }
    .dockbtn:hover, .dockbtn:active { background: var(--brand-soft); color: var(--brand-dark); }
    .dockbtn .di { font-size: calc(18px * var(--fs)); line-height: 1.1; }
    /* ⚠️ 글자를 아주 크게 해 두면 이름 넉 줄이 390px 에 안 들어간다.
       아래 바는 «누르는 자리» 가 먼저다 · 이름은 자리가 없으면 줄여서라도 칸을 지킨다. */
    .dockbtn .dl { font-size: min(calc(11px * var(--fs)), 13px); max-width: 100%;
                   overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* 아래 바가 목록 끝과 «넣기 줄» 을 가리면 안 된다 */
    .wrap { padding-bottom: 128px; }
    #sideNav { padding-bottom: 76px; }
  }

  .btn {
    border: var(--bw) solid var(--line); background: var(--panel); color: var(--ink);
    padding: 8px 14px; border-radius: var(--r-btn); font-weight: 600; font-size: calc(14px * var(--fs)); transition: .15s; white-space: nowrap;
    font-family: var(--font-title); letter-spacing: var(--title-spacing);
  }
  .btn:hover { border-color: var(--brand); color: var(--brand); }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  .btn.primary:hover { background: var(--brand-dark); border-color: var(--brand-dark); color: #fff; }
  .btn.ghost { background: transparent; }
  .btn.danger:hover { border-color: var(--danger); color: var(--danger); }
  /* 되돌릴 수 없는 단추 · 평소에도 빨갛게 서 있어야 한다.
     확인 창에서 «완전히 삭제» 가 다른 단추와 같은 얼굴이면 손이 먼저 간다. */
  .btn.dangerbtn { color: var(--danger); border-color: var(--danger); background: transparent; }
  .btn.dangerbtn:hover { background: var(--warn-bg); color: var(--danger); border-color: var(--danger); }
  #btnDeleteEntry { color: var(--danger); }
  #btnDeleteEntry:hover { border-color: var(--danger); color: var(--danger); background: var(--warn-bg); }
  .btn.sm { padding: 5px 10px; font-size: calc(13px * var(--fs)); border-radius: var(--r-btn-sm); }
  .btn.xs { padding: 2px 7px; font-size: calc(12px * var(--fs)); border-radius: var(--r-btn-sm); font-weight: 500; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }

  .card { background: var(--panel); border: var(--bw) solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
  /* 목록 카드 · 사이 간격을 좁히고 테두리를 옅게. 글이 줄줄이 이어져 읽히게 */
  [data-theme="lego"] .entry { margin-bottom: 10px; border-color: var(--line-soft); }
  [data-theme="lego"] .entry:hover { border-color: var(--line); }
  /* ⚠️ 색감이 제목 획을 도로 얇게 눌러 두고 있었다 · 굵기는 한 곳(--fw-title)에서 정한다 */
  [data-theme="lego"] .entry .head h3 { font-weight: var(--fw-title); }

  /* ---------- 배너 ---------- */
  .banner { margin: 16px 0; padding: 12px 14px; border-radius: 12px; font-size: calc(13.5px * var(--fs));
            display: flex; gap: 10px; align-items: center; flex-wrap: wrap; border: 1px solid var(--line); background: var(--panel); }
  .banner.warn { background: var(--warn-bg); border-color: var(--warn-line); color: var(--warn-ink); }
  .banner.ok { background: var(--ok-bg); border-color: var(--ok-line); color: var(--ok-ink); }
  /* 드라이브에서 안 보이게 된 기록. 카드 «안» 에 들어가므로 배너보다 좁다 */
  .banner.gone { margin: 8px 0 0; padding: 8px 11px; font-size: calc(12.5px * var(--fs));
                 background: var(--warn-bg); border-color: var(--warn-line); color: var(--warn-ink); }
  /* 폴더 «밖» 으로 나갔지만 멀쩡히 읽히는 기록. 이건 사고가 아니라 사실 안내다 ·
     노란 경고를 띄우면 고장난 줄 안다. 같은 크기, 조용한 색으로 적는다. */
  .banner.away { margin: 8px 0 0; padding: 8px 11px; font-size: calc(12.5px * var(--fs));
                 background: var(--bg); border-color: var(--line); color: var(--ink-soft); }
  .banner .grow { flex: 1 1 240px; }
  .banner.draft { background: var(--brand-soft); border-color: var(--brand); color: var(--brand);
                  font-weight: 600; margin: 16px 0 -6px; padding: 10px 14px; }
  .banner a { color: inherit; }

  /* ---------- 입력 공통 ---------- */
  .inp { width: 100%; padding: 9px 12px; border: var(--bw) solid var(--line); border-radius: var(--r-inp); background: var(--bg); outline: none; }
  .inp:focus { border-color: var(--brand); background: var(--panel); }
  textarea.inp { resize: vertical; line-height: 1.75; }
  .field { margin-bottom: 14px; }
  .field > label { display: block; font-size: calc(13px * var(--fs)); font-weight: 700; margin-bottom: 5px; }
  .desc { font-size: calc(12.5px * var(--fs)); color: var(--ink-soft); margin: 4px 0 0; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border: var(--bw) solid var(--line); background: var(--panel); color: var(--ink-soft);
          padding: 6px 12px; border-radius: var(--r-pill); font-size: calc(13px * var(--fs)); font-weight: 600;
          font-family: var(--font-title); }
  .chip.on { background: var(--c-soft, var(--brand-soft)); border-color: var(--c, var(--brand)); color: var(--c, var(--brand)); }

  /* 폴더 고르기 목록 */
  .picklist { display: flex; flex-direction: column; gap: 4px; max-height: 300px; overflow-y: auto;
              border: var(--bw) solid var(--line); border-radius: var(--r-inp); padding: 6px; background: var(--bg); }
  .pickrow { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; font: inherit;
             color: var(--ink); background: var(--panel); border: var(--bw) solid var(--line-soft);
             border-radius: var(--r-btn-sm); padding: 8px 10px; }
  .pickrow:hover { border-color: var(--brand); color: var(--brand); }
  .pickrow .fname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ---------- 폴더 정리 방식 고르기 ---------- */
  .modegrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 8px; }
  @media (max-width: 640px) { .modegrid { grid-template-columns: 1fr; } }
  .modecard { text-align: left; border: var(--bw) solid var(--line); background: var(--panel); color: var(--ink);
              border-radius: var(--r-btn); padding: 11px 12px; display: flex; flex-direction: column; gap: 7px; font: inherit; }
  .modecard.on { border-color: var(--brand); box-shadow: 0 0 0 2px var(--brand-soft); }
  .modecard .desc { margin: 0; }
  .modehead { display: flex; align-items: baseline; gap: 7px; }
  .modehead strong { font-size: calc(14.5px * var(--fs)); font-family: var(--font-title); }
  /* 폴더 그림 · 글자로 그린 나무보다 훨씬 빨리 읽힌다 */
  .ftree { background: var(--bg); border: var(--bw) solid var(--line-soft); border-radius: 9px;
           padding: 9px 10px; display: flex; flex-direction: column; gap: 3px; overflow-x: auto; }
  .frow { display: flex; align-items: center; gap: 6px; font-size: calc(12px * var(--fs)); white-space: nowrap; line-height: 1.5; }
  .frow svg { flex: 0 0 auto; }
  .frow .fname { overflow: hidden; text-overflow: ellipsis; }
  .fnote { font-size: calc(12px * var(--fs)); color: var(--ink-soft); margin-left: 4px; }

  /* 목록 보기를 디렉토리처럼 */
  .lfolder { display: flex; align-items: center; gap: 7px; width: 100%; text-align: left; font: inherit;
             color: var(--ink); background: var(--bg); border: 0; border-bottom: var(--bw) solid var(--line);
             padding: 9px 12px; font-family: var(--font-title); }
  .lfolder:hover { color: var(--brand); }
  .ltwist { width: 12px; color: var(--ink-soft); }
  .lfname { font-weight: 700; font-size: calc(14px * var(--fs)); }
  .lwrap { display: block; }
  .lrow.lin { padding-left: 34px; }
  /* 연결 펼침 · 잇는 것은 편집·관계망에서, 여기서는 «보기» 만 */
  .linkbtn { border: var(--bw) solid var(--line); background: var(--panel); border-radius: var(--r-pill);
             padding: 1px 8px; font: inherit; font-size: calc(12px * var(--fs)); color: var(--ink-soft); cursor: pointer; }
  .linkbtn:hover, .linkbtn.on { border-color: var(--brand); color: var(--brand); background: var(--brand-soft); }
  .linkpanel { display: flex; flex-direction: column; gap: 6px; padding: 9px 12px 11px;
               background: var(--bg); border-bottom: var(--bw) solid var(--line-soft); }
  .linkpanel.lin { padding-left: 34px; }
  .linkgroup { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
  .linklabel { font-size: calc(12px * var(--fs)); color: var(--ink-soft); flex: 0 0 auto; }
  .linkchip { border: var(--bw) solid var(--line); background: var(--panel); color: var(--ink);
              border-radius: var(--r-btn-sm); padding: 2px 9px; font: inherit; font-size: calc(12.5px * var(--fs)); }
  .linkchip:hover { border-color: var(--brand); color: var(--brand); }
  .linkwhy { color: var(--ink-soft); font-size: calc(12px * var(--fs)); }
  .linkhint { font-size: calc(12px * var(--fs)); color: var(--ink-soft); }

  /* ---------- 길찾기 줄 ---------- */
  .crumbs { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; margin: 0 0 6px; line-height: 1.4; }
  .crumb { border: 0; background: none; padding: 0; font: inherit; font-size: calc(12px * var(--fs)); color: var(--ink-soft);
           text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
  .crumb:hover { color: var(--brand); }
  .crumb.here { text-decoration: none; color: var(--ink); font-weight: 700; cursor: default; }
  .crumbsep { font-size: calc(12px * var(--fs)); color: var(--ink-soft); opacity: .6; }

  /* ---------- 모양 고르기 ---------- */
  .themegrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 8px; }
  @media (max-width: 860px) { .themegrid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 560px) { .themegrid { grid-template-columns: 1fr; } }
  /* 「아이답게 → 정밀하게」 축. 목록 순서가 곧 이 축이라는 것을 한 줄로 알려 준다. */
  .themeaxis { display: flex; align-items: center; gap: 9px; margin: 10px 0 2px;
               font-size: calc(12px * var(--fs)); color: var(--ink-soft); }
  .themeaxis .axisline { flex: 1 1 auto; height: 2px; border-radius: 2px;
                         background: linear-gradient(90deg, var(--t5), var(--t2)); }
  .themecard { text-align: left; border: var(--bw) solid var(--line); background: var(--panel);
               border-radius: var(--r-btn); padding: 10px; display: flex; flex-direction: column; gap: 7px;
               color: var(--ink); font: inherit; }
  .themecard.on { border-color: var(--brand); box-shadow: 0 0 0 2px var(--brand-soft); }
  .themecard .desc { margin: 0; }
  .themename { display: flex; align-items: baseline; gap: 7px; }
  .themename strong { font-size: calc(14.5px * var(--fs)); }
  .themename span { font-size: calc(12px * var(--fs)); color: var(--ink-soft); }
  /* 미리보기 조각 · 그 프리셋의 토큰을 그대로 쓴다. 따로 색을 적어 두지 않는다. */
  .themeswatch { background: var(--bg); border-radius: 8px; padding: 10px; overflow: hidden; }
  .themeswatch .minicard { position: relative; border: var(--bw) solid var(--line);
                           background-color: var(--c-soft); background-image: linear-gradient(var(--veil), var(--veil));
                           border-radius: var(--radius); box-shadow: var(--shadow);
                           border-top: var(--accent-w) solid var(--c); 
                           border-left-width: var(--accent-l); border-left-style: solid; border-left-color: var(--c);
                           padding: var(--entry-pt) 10px 9px; display: flex; flex-direction: column; gap: 5px; }
  .themeswatch .minicard::before {
    content: ""; display: var(--stud); position: absolute; left: 10px; top: 6px; width: 50px; height: 9px;
    background-image: radial-gradient(circle at 4.5px 4.5px, var(--c) 0 4px, transparent 4.5px);
    background-size: 17px 9px; background-repeat: repeat-x; }
  .themeswatch .minititle { font-family: var(--font-title); font-weight: 700; font-size: calc(13px * var(--fs)); color: var(--ink);
                            letter-spacing: var(--title-spacing); }
  .themeswatch .miniline { height: 5px; border-radius: 3px; background: var(--line-soft); }
  .themeswatch .miniline.short { width: 55%; }
  .themeswatch .minirow { display: flex; gap: 4px; align-items: center; }

  /* ---------- 에디터 ---------- */
  .composer { padding: 18px; margin: 16px 0; }
  .composer h2 { margin: 0 0 12px; font-size: calc(16px * var(--fs)); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 700px) { .grid2 { grid-template-columns: 1fr; } }

  /* ---------- 종이 편집기 · 넣기 줄 ----------
     넣기 줄은 종이 위에 붙어 다닌다(sticky). 길게 쓰다가도 손이 닿는 자리에 있어야 한다. */
  .edbar { position: sticky; top: 0; z-index: 5; display: flex; gap: 6px 10px; flex-wrap: wrap; align-items: center;
           padding: 8px 10px; border: 1px dashed var(--line); border-radius: 12px; background: var(--bg); margin-bottom: 8px; }
  .edgrp { display: inline-flex; gap: 4px; flex-wrap: wrap; align-items: center; padding-right: 8px; border-right: 1px solid var(--line); }
  .edgrp.roles { border-right: 0; }
  .edbar .btn { background: var(--panel); }
  .edbar [data-add] { display: inline-flex; align-items: center; gap: 5px; }
  .edbar [data-add] svg { flex: 0 0 auto; opacity: .8; }
  .edbar [data-add]:hover svg { opacity: 1; }
  .edbar .fb { min-width: 36px; padding: 5px 8px; }
  .edbar .fb b { font-weight: 900; }
  /* 접어 둔 갈래 · 「⋯ 더」 를 누르면 제자리에서 펴진다 */
  .edbar .addx { display: none; }
  .edbar.open .addx { display: inline-flex; }
  .edbar.hover { border-color: var(--brand); background: var(--brand-soft); }
  .hlwrap { position: relative; display: inline-flex; }
  .hlpal { display: none; position: absolute; top: 100%; left: 0; z-index: 6; gap: 4px; padding: 6px;
           background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); }
  .hlwrap.open .hlpal { display: flex; }
  .edbar .role { font-weight: 700; }
  .edbar .role[data-add="mine"] { color: var(--brand); }
  .edbar .role[data-add="ai"] { color: var(--warn-ink); }
  /* 폰 · 넣기 줄이 여섯 줄을 먹으면 고르는 자리가 아니라 벽이 된다(실측 394px).
     한 줄로 세우고 옆으로 민다 · 업노트가 폰에서 그렇게 한다. 접어 둔 것도 다 보인다. */
  @media (max-width: 560px) {
    .edbar { flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; gap: 4px; padding: 6px 8px;
             scrollbar-width: none; }
    .edbar::-webkit-scrollbar { display: none; }
    .edgrp { flex-wrap: nowrap; padding-right: 6px; }
    .edbar .btn.sm { padding: 5px 7px; white-space: nowrap; flex: 0 0 auto; }
    .edbar .addx { display: inline-flex; }
    .edbar #btnAddMore { display: none; }
    .hlpal { position: fixed; left: 8px; top: auto; }
  }
  .addhint { width: 100%; font-size: calc(12px * var(--fs)); color: var(--ink-soft); margin-top: 2px; }

  /* ---------- 종이 ---------- */
  .paper { position: relative; min-height: 280px; padding: 14px 16px 18px; border: var(--bw) solid var(--line-soft);
           border-radius: var(--r-block); background: var(--panel); line-height: 1.75; font-weight: var(--fw-body);
           outline: none; caret-color: var(--brand); word-break: break-word; }
  .paper:focus-within { border-color: var(--brand); }
  .paper.blank::before { content: attr(data-ph); position: absolute; left: 16px; right: 16px; top: 14px;
                         color: var(--ink-soft); opacity: .65; pointer-events: none; line-height: 1.7; }
  .paper > * { margin: 0 0 6px; }
  .paper p { min-height: 1.75em; }
  .paper h3.ph { font-size: calc(18px * var(--fs)); font-weight: var(--fw-title); margin: 14px 0 6px; line-height: 1.4; }
  .paper .wl { color: var(--brand); background: var(--brand-soft); border-radius: 4px; padding: 0 3px; }
  .paper .mdlink { color: var(--brand); text-decoration: underline; }
  .paper mark { background: var(--brand-soft); color: inherit; padding: 0 2px; border-radius: 3px; }
  .paper code { font-family: ui-monospace, Consolas, monospace; font-size: .92em; background: var(--bg);
                border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; }
  .paper ul.pl, .paper ol.pl { padding-left: 26px; }
  .paper ul ul, .paper ol ol, .paper ul ol, .paper ol ul { margin: 2px 0 0; padding-left: 22px; }
  .paper ul.ptodo { list-style: none; padding-left: 0; }
  .paper li.ti { position: relative; padding-left: 30px; min-height: 1.75em; }
  .paper .tchk { position: absolute; left: 2px; top: .42em; width: 18px; height: 18px; border: 2px solid var(--ink-soft);
                 border-radius: 5px; background: var(--panel); cursor: pointer; user-select: none; }
  .paper li.ti[data-done="1"] { color: var(--ink-soft); text-decoration: line-through; }
  .paper li.ti[data-done="1"] .tchk { background: var(--brand); border-color: var(--brand); }
  .paper li.ti[data-done="1"] .tchk::after { content: ""; position: absolute; left: 5px; top: 1px; width: 5px; height: 9px;
                                              border: solid var(--panel); border-width: 0 2.5px 2.5px 0; transform: rotate(45deg); }
  .paper blockquote.pq { margin: 8px 0; padding: 6px 12px 6px 14px; border-left: 4px solid var(--brand);
                         background: var(--bg); border-radius: 0 10px 10px 0; }
  .paper .pq .qbody p { margin: 0; min-height: 1.6em; }
  .paper .qlabel { display: flex; align-items: center; gap: 6px; font-size: calc(12px * var(--fs)); font-weight: 700;
                   color: var(--ink-soft); margin-bottom: 4px; user-select: none; font-style: normal; }
  .paper .qsrc { flex: 1 1 140px; min-width: 0; font: inherit; font-size: calc(12.5px * var(--fs)); font-weight: 500; padding: 2px 8px;
                 border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); }
  .paper .qmenu { border: 0; background: transparent; color: var(--ink-soft); cursor: pointer; font-size: calc(14px * var(--fs)); padding: 0 4px; }
  .paper .qmenu:hover { color: var(--brand); }
  .paper .pq[data-role="mine"] { border-left-color: var(--brand); background: var(--brand-soft); }
  .paper .pq[data-role="mine"] .qlabel { color: var(--brand); }
  .paper .pq[data-role="source"] { border-left-color: var(--ink-soft); font-style: italic; }
  .paper .pq[data-role="ai"] { border-left-color: var(--warn); border-left-style: dashed; background: var(--warn-bg); }
  .paper .pq[data-role="ai"] .qlabel { color: var(--warn-ink); }
  .paper hr { border: none; border-top: 2px dashed var(--line); margin: 14px 0; }
  /* 덩어리 · 사진·파일·링크·삽입·표·코드·접이식 */
  .paper .atom { position: relative; margin: 10px 0; padding: 8px 12px 10px; border: var(--bw) solid var(--line);
                 border-radius: var(--r-block); background: var(--bg); cursor: default; font-style: normal; }
  .paper .atom.sel { outline: 3px solid var(--brand); outline-offset: 1px; }
  .paper .atom.dragging { opacity: .4; }
  .paper > .dropbefore { box-shadow: 0 -3px 0 0 var(--brand); }
  .paper > .dropafter { box-shadow: 0 3px 0 0 var(--brand); }
  .paper .abar { display: flex; align-items: center; gap: 4px; margin-bottom: 6px; opacity: .6; }
  .paper .atom:hover .abar, .paper .atom.sel .abar { opacity: 1; }
  .paper .akind { font-size: calc(12px * var(--fs)); font-weight: 700; color: var(--ink-soft); cursor: grab; user-select: none; }
  .paper .abtn { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 2px 8px; cursor: pointer;
                 font: inherit; font-size: calc(12px * var(--fs)); color: var(--ink); line-height: 1.5; }
  .paper .abtn:hover { border-color: var(--brand); color: var(--brand); }
  .paper .abtn.danger:hover { border-color: var(--danger); color: var(--danger); }
  .paper .abtn.amask { margin-top: 6px; }
  .paper .pimg { display: block; max-width: 100%; max-height: 460px; border-radius: 10px; cursor: zoom-in; background: var(--line-soft); }
  .paper .atom video { max-width: 100%; max-height: 420px; border-radius: 10px; display: block; }
  .paper .atom audio { width: 100%; display: block; }
  .paper .amedia { display: flex; gap: 10px; align-items: center; min-width: 0; }
  .paper .aficon { width: 56px; height: 56px; flex: 0 0 auto; border-radius: 10px; background: var(--line-soft);
                   display: flex; align-items: center; justify-content: center; font-size: calc(26px * var(--fs)); }
  .paper .afname { flex: 1 1 auto; min-width: 0; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .paper .ameta { margin-top: 6px; }
  .paper .acap { margin-bottom: 3px; }
  .paper .savedname { font-family: ui-monospace, Consolas, monospace; font-size: calc(12px * var(--fs)); color: var(--brand);
                      display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .paper .origname { font-size: calc(12px * var(--fs)); color: var(--ink-soft); display: block;
                     white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .paper .atom .inp { background: var(--panel); }
  .paper .atom .tedit { width: 100%; }
  /* 읽는 쪽 · 출처 갈래 인용 */
  .content .qtag, .vpaper .qtag { display: block; font-style: normal; font-size: calc(12px * var(--fs)); font-weight: 700;
                                   color: var(--ink-soft); margin-bottom: 2px; }
  .content blockquote.rmine, .vpaper blockquote.rmine { border-left-color: var(--brand); background: var(--brand-soft);
                                   padding: 6px 10px; border-radius: 0 8px 8px 0; font-style: normal; color: var(--ink); }
  .content blockquote.rmine .qtag, .vpaper blockquote.rmine .qtag { color: var(--brand); }
  .content blockquote.rsource, .vpaper blockquote.rsource { border-left-color: var(--ink-soft); }
  .aibox { border: 1px dashed var(--warn-line); background: var(--warn-bg); border-radius: 10px; margin: 8px 0; }
  .aibox > summary { cursor: pointer; padding: 8px 12px; font-weight: 700; font-size: calc(13px * var(--fs)); color: var(--warn-ink); }
  .aibox > blockquote { margin: 0 12px 10px; border-left: 3px dashed var(--warn); color: var(--ink); font-style: normal; }
  .inboxline { margin-top: 6px; color: var(--ink-soft); }
  .badge.inboxbadge { background: var(--warn-bg); color: var(--warn-ink); border: 1px solid var(--warn-line); }

  .composer-actions { display: flex; gap: 8px; align-items: center; margin-top: 16px; flex-wrap: wrap; }
  .savehint { font-size: calc(12px * var(--fs)); color: var(--ink-soft); }

  /* ---------- 목록 ---------- */
  .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 24px 0 10px; }
  .toolbar h2 { margin: 0; font-size: calc(16px * var(--fs)); }
  .count { font-size: calc(13px * var(--fs)); color: var(--ink-soft); }
  .search { flex: 0 1 300px; }
  .filters { margin-bottom: 14px; }
  .tagfilters { margin: -8px 0 14px; align-items: center; }
  .flabel { font-size: calc(12px * var(--fs)); color: var(--ink-soft); font-weight: 700; padding-right: 2px; align-self: center; }
  /* 태그가 스무 개를 넘으면 눈으로 훑는 것은 «찾기» 가 아니다. 그때만 나오는 칸 */
  .tagfind { flex: 0 1 160px; padding: 5px 10px; font-size: calc(13px * var(--fs)); border-radius: 99px; }

  /* 서식 단추 줄 · 적는 칸 바로 아래. 기호를 외우게 하지 않는다 */
  .fmtbar { display: flex; gap: 4px; margin-top: 5px; flex-wrap: wrap; }
  .fmtbtn { min-width: 30px; padding: 4px 8px; border: 1px solid var(--line); background: var(--panel);
            color: var(--ink); border-radius: 7px; cursor: pointer; font-size: calc(13px * var(--fs)); line-height: 1.4; }
  .fmtbtn:hover { border-color: var(--brand); color: var(--brand); }
  .fmtsep { width: 1px; align-self: stretch; background: var(--line); margin: 0 3px; }
  .hlbtn { width: 22px; height: 26px; border: 1px solid var(--line); border-radius: 6px; cursor: pointer; padding: 0; }
  .hlbtn:hover { border-color: var(--ink); transform: translateY(-1px); }
  /* 보이는 쪽 서식 · 형광펜은 색감을 따라간다 */
  .content mark, .vpaper mark { background: var(--brand-soft); color: inherit; padding: 0 2px; border-radius: 3px; }
  .content code, .vpaper code { font-family: ui-monospace, Consolas, monospace;
                               font-size: .92em; background: var(--bg); border: 1px solid var(--line);
                               border-radius: 5px; padding: 1px 5px; }
  .content .codeblock code, .vpaper .codeblock code { background: none; border: none; padding: 0; }

  /* ---------- 줄이 여럿인 블록 (할 일 · 목록) ---------- */
  .lines { display: flex; flex-direction: column; gap: 4px; }
  .linerow { display: flex; align-items: center; gap: 8px; }
  .linechk { flex: 0 0 auto; width: 17px; height: 17px; accent-color: var(--brand); cursor: pointer; }
  .linebul { flex: 0 0 auto; width: 17px; text-align: center; color: var(--ink-soft);
             font-size: calc(13px * var(--fs)); font-variant-numeric: tabular-nums; }
  .lineinp { flex: 1 1 auto; width: auto; }
  .linerow .btn.xs { flex: 0 0 auto; opacity: .45; }
  .linerow:hover .btn.xs { opacity: 1; }

  /* 보이는 쪽 · 목록에서 «바로» 체크된다. 그게 이 블록의 전부다 */
  .todolist { list-style: none; margin: 10px 0; padding: 0; display: flex; flex-direction: column; gap: 5px; }
  .todolist li { display: flex; align-items: flex-start; gap: 9px; line-height: 1.65; }
  .todolist input[type=checkbox] { flex: 0 0 auto; width: 17px; height: 17px; margin-top: 3px;
                                   accent-color: var(--brand); cursor: pointer; }
  .todolist li.done .t { color: var(--ink-soft); text-decoration: line-through; }
  .todolist .todocount { display: block; color: var(--ink-soft); font-size: calc(12px * var(--fs)); margin-top: 2px; }
  .todolist .todocount.alldone { color: var(--ok); font-weight: 700; }
  .bullets { margin: 10px 0; padding-left: 22px; line-height: 1.7; }
  .bullets li.d1 { margin-left: 20px; list-style-type: circle; }
  .bullets li.d2 { margin-left: 40px; list-style-type: square; }

  /* ---------- 표 ---------- */
  .tablewrap { overflow-x: auto; }
  table.tedit { border-collapse: collapse; width: 100%; }
  table.tedit th, table.tedit td { padding: 2px; }
  table.tedit .tcell { width: 100%; min-width: 96px; padding: 6px 8px; font-size: calc(13.5px * var(--fs)); }
  table.tedit th .tcell { font-weight: 700; }
  table.tedit .tctl { width: 1%; white-space: nowrap; opacity: .45; }
  table.tedit tr:hover .tctl { opacity: 1; }
  /* 보이는 쪽 · 좁은 화면에서는 표만 옆으로 밀린다 (쪽 전체가 밀리면 안 된다) */
  .tscroll { overflow-x: auto; margin: 12px 0; }
  table.shown { border-collapse: collapse; width: 100%; font-size: calc(13.5px * var(--fs)); }
  table.shown th, table.shown td { border: 1px solid var(--line); padding: 8px 11px; text-align: left; line-height: 1.6; }
  table.shown th { background: var(--brand-soft); color: var(--brand-dark); font-weight: 700; }
  table.shown tr:nth-child(even) td { background: var(--bg); }

  /* ---------- 접이식 ---------- */
  .foldbox { border: 1px solid var(--line); border-radius: 10px; margin: 12px 0; background: var(--panel); }
  .foldbox > summary { cursor: pointer; padding: 10px 13px; font-weight: 700; list-style: none;
                       display: flex; align-items: center; gap: 8px; border-radius: 10px; }
  .foldbox > summary::-webkit-details-marker { display: none; }
  .foldbox > summary::before { content: "▸"; color: var(--ink-soft); transition: transform .15s ease; }
  .foldbox[open] > summary::before { transform: rotate(90deg); }
  .foldbox > summary:hover { background: var(--brand-soft); color: var(--brand-dark); }
  .foldbody { padding: 2px 14px 12px; white-space: pre-wrap; line-height: 1.75; }

  /* 코드 · 글과 확실히 갈라 보이게. 언어 딱지는 오른쪽 위 */
  .codeblock { position: relative; background: var(--bg); border: 1px solid var(--line);
               border-radius: 10px; padding: 12px 14px; margin: 12px 0; overflow-x: auto; }
  .codeblock code { font-family: ui-monospace, Consolas, monospace; font-size: calc(13px * var(--fs));
                    line-height: 1.6; white-space: pre; color: var(--ink); }
  .codelang { position: absolute; top: 6px; right: 10px; font-size: calc(11px * var(--fs));
              color: var(--ink-soft); letter-spacing: .04em; text-transform: lowercase; }
  .chip.tagchip { font-size: calc(12.5px * var(--fs)); padding: 5px 11px; }
  .chip.ghostchip { border-style: dashed; }
  .chip.clearchip { border-color: var(--danger); color: var(--danger); }
  .tag.pick { cursor: pointer; }
  .tag.pick:hover { border-color: var(--brand); color: var(--brand); }
  .tag.pick.on { background: var(--brand-soft); border-color: var(--brand); color: var(--brand); }

  /* 기록마다 색 줄을 둬서 어디서 끊기는지 한눈에 보이게 한다.
     색은 «유형 색»(--c) 이다. 프리셋이 여섯 자리를 정하고, 카드마다 제 자리 색을 물려받는다. */
  .entry { position: relative; padding: var(--entry-pt) 18px 16px; margin-bottom: 12px;
           background-color: var(--c-soft, var(--panel));
           background-image: linear-gradient(var(--veil), var(--veil));
           border-top: var(--accent-w) solid var(--c, var(--brand));
           border-left-width: var(--accent-l); border-left-style: solid; border-left-color: var(--c, var(--brand)); }
  /* 레고 돌기 · brick 프리셋에서만 나온다 (--stud: block).
     따로 요소를 만들지 않는다. 요소를 만들면 프리셋마다 그리는 코드가 갈라진다. */
  .entry::before {
    content: ""; display: var(--stud); position: absolute; left: 17px; top: 8px;
    width: var(--stud-w); height: var(--stud-h); pointer-events: none;
    background-image: radial-gradient(circle at calc(var(--stud-h) / 2) calc(var(--stud-h) / 2),
                      var(--c, var(--brand)) 0 calc(var(--stud-h) / 2 - .5px), transparent calc(var(--stud-h) / 2));
    background-size: var(--stud-step) var(--stud-h); background-repeat: repeat-x;
  }
  /* 유형 배지 바로 뒤에 제목이 붙고, 길면 그 자리에서 줄만 바뀐다 */
  .entry .head { display: block; }
  .entry .head .badge { display: inline; margin-right: 7px; white-space: nowrap; }
  .entry .head h3 { display: inline; font-size: calc(19px * var(--fs)); line-height: 1.45; font-weight: 700; }
  .entry .head .when { display: block; margin-top: 6px; }
  /* 📌 맨 위 고정 */
  .pinbtn { border: var(--bw) solid var(--line); background: var(--panel); color: var(--ink-soft);
            font-size: calc(12px * var(--fs)); font-weight: 700; padding: 2px 9px; border-radius: var(--r-pill);
            margin-left: 8px; vertical-align: middle; white-space: nowrap; }
  .pinbtn:hover { border-color: var(--brand); color: var(--brand); }
  .pinbtn.on { background: var(--pin-bg); border-color: var(--warn); color: var(--warn); }

  .entry.pinned { border-top-color: var(--warn); border-left-color: var(--warn); }
  .badge { font-size: calc(12px * var(--fs)); font-weight: 700; padding: 2px 9px; border-radius: var(--r-pill);
           background: var(--c-soft, var(--brand-soft)); color: var(--c, var(--brand)); white-space: nowrap;
           font-family: var(--font-title); }
  .entry h3 { margin: 0; font-size: calc(19px * var(--fs)); flex: 1 1 auto; min-width: 0;
              font-family: var(--font-title); letter-spacing: var(--title-spacing); }
  .when { font-size: calc(12px * var(--fs)); color: var(--ink-soft); white-space: nowrap; }
  .tags { margin: 7px 0 0; display: flex; gap: 5px; flex-wrap: wrap; }
  .tag { font-size: calc(12px * var(--fs)); color: var(--ink-soft); background: var(--bg); border: var(--bw) solid var(--line); padding: 1px 8px; border-radius: var(--r-pill); }
  .content { margin-top: 10px; }
  .content > * { margin: 0 0 8px; }
  .content p { white-space: pre-wrap; word-break: break-word; font-size: calc(14.3px * var(--fs)); }
  .content h4 { font-size: calc(15px * var(--fs)); margin-top: 14px; }
  .content blockquote { margin: 0 0 8px; padding: 4px 0 4px 12px; border-left: 3px solid var(--brand); color: var(--ink-soft); font-style: italic; white-space: pre-wrap; }
  .content hr { border: none; border-top: 1px solid var(--line); margin: 12px 0; }
  .content figure { margin: 0 0 10px; }
  .content figure img { max-width: 100%; max-height: 420px; border-radius: 10px; display: block; border: 1px solid var(--line); }
  .content figcaption { font-size: calc(12.5px * var(--fs)); color: var(--ink-soft); margin-top: 4px; }
  .content .fileline, .content .linkline {
    display: inline-block; vertical-align: top; font-size: calc(13px * var(--fs));
    border: 1px solid var(--line); border-radius: 9px; padding: 5px 10px; background: var(--bg);
    text-decoration: none; color: var(--ink); max-width: 100%;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .content .fileline:hover, .content .linkline:hover { border-color: var(--brand); color: var(--brand); }
  .collapsed { max-height: 320px; overflow: hidden; position: relative; }
  .collapsed::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 70px;
                      background: linear-gradient(transparent, var(--panel)); }
  .morebtn { display: block; width: 100%; margin-top: 4px; }

  .foot { display: flex; gap: 6px; align-items: center; margin-top: 13px; padding-top: 11px; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .sync-dot { font-size: calc(12px * var(--fs)); color: var(--ink-soft); }
  .sync-dot.ok { color: var(--ok); }
  .sync-dot.pending { color: var(--warn); }

  .empty { text-align: center; padding: 46px 20px; color: var(--ink-soft); font-size: calc(14px * var(--fs)); }
  .empty .big { font-size: calc(40px * var(--fs)); display: block; margin-bottom: 10px; }

  /* ---------- 토스트/진행 ---------- */
  #toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(20px);

    /* 실측해 둔 것을 여기 한 줄로 적는다. 안 적으면 «앱이 고장났다» 가 된다. */
    box.appendChild(el("div", "note",
      "⚠️ 이미 있는 폴더를 고르면 «앞으로 쓰는 것» 만 그 안에 담깁니다. " +
      "폴더에 원래 있던 파일은 이 앱 권한으로는 안 보입니다 · 그건 설정 → 가져오기로 따로 끌어옵니다."));
    return box;
  }
  /* 새 폴더를 만들어 그 자리로 삼는다.
     고르기 창은 폴더를 «만들지» 못한다. 만들기는 우리가 맡는다 ·
     앱이 만든 폴더라 권한이 저절로 따라오고, 안에 든 것도 다 보인다. */
  function createDeskFolder() {
    if (!connected || !folder.id) { toast("드라이브에 연결한 뒤에 폴더를 만들 수 있습니다."); return; }
    var name = window.prompt("새로 만들 폴더 이름 (「" + (folder.name || "연결한 폴더") + "」 안에 만듭니다)", "");
    if (!name || !name.trim()) return;
    var clean = safeName(name, 60);
    toast("폴더를 만드는 중…");
    ensureNamedFolder(clean, folder.id)
      .then(function (id) {
        setDesk({ id: id, name: clean, path: [clean] });
        filterPath = [clean];
        render();
        openComposer();
      })
      .catch(function (e) { toast("폴더를 못 만들었습니다: " + errText(e)); });
  }
  function pickDeskFolder() {
    if (!connected) { toast("드라이브에 연결한 뒤에 고를 수 있습니다."); return; }
    openFolderBrowser(function (f) {
      /* 고른 폴더가 연결 폴더 «안» 인지 «밖» 인지는 알 길이 없다. 길은 이름 하나로 둔다.
         밖이어도 상관없다 · 이 앱이 만든 파일은 어디에 두든 이 앱이 다시 찾는다. */
      setDesk({ id: f.id, name: f.name, path: [f.name] });
      filterPath = [];
      render();
      openComposer();
      toast2("「" + f.name + "」 에 원래 있던 파일은 여기 목록에 안 나옵니다.");
    });
  }

  /* ---- 작성칸 접기·펴기 ----
     이 도구는 쓰는 도구다. 그런데 화면 맨 위를 작성칸이 한 장 반 먹고 있어서,
     왼쪽에서 폴더를 눌러도 «아무 일도 안 일어난 것» 처럼 보였다.
     좁혀진 목록이 안 보이는 자리에 있었을 뿐이다. 그래서 볼 때는 접고, 쓸 때는 편다. */
  /* 폰·2단에서는 목록부터 보여 준다 · 업노트도 «노트 목록» 에서 시작한다.
     쓸 것이 있으면 ＋ 를 누른다. 3단에서는 오른쪽 칸이 늘 편집기라 접지 않는다. */
  var composerFolded = false;
  function composerBusy() {
    // 고쳐 쓰는 중이거나 쓰다 만 것이 있으면 절대 접지 않는다. 접는 순간 사라진 줄 안다.
    if (editingId) return true;
    if (hasContent()) return true;
    var t = $("title"), g = $("tags");
    return !!(t && t.value.trim()) || !!(g && g.value.trim());
  }
  function applyComposerFold() {
    var c = $("composer");
    if (c) c.classList.toggle("cfolded", composerFolded);
    /* 폰에서 «쓰는 중» 이면 아래 바가 물러난다 · 바닥은 하나뿐이라 둘이 나눠 가질 수 없다 */
    document.body.classList.toggle("writing", !composerFolded && !threePane());
    var w = $("cfoldWhere");
    if (w) {
      w.innerHTML = "";
      w.appendChild(document.createTextNode("📍 "));
      w.appendChild(el("b", null, deskLabel(desk)));
      w.appendChild(document.createTextNode(" 에 씁니다"));
    }
  }
  function foldComposer() {
    /* ⚠️ 3단에서는 접지 않는다. 오른쪽 칸이 늘 «쓰는 자리» 이기 때문에,
       접어 봤자 목록이 올라올 자리가 없다 (목록은 이미 가운데 칸에 따로 서 있다). */
    if (threePane()) return;
    if (composerBusy()) return;
    composerFolded = true;
    applyComposerFold();
  }
  function openComposer() {
    composerFolded = false;
    applyComposerFold();
    renderDeskLine();
    if (!scrollEditorTop()) {
      var c = $("composer");
      if (c) c.scrollIntoView({ behavior: "smooth", block: "start" });
    }
    var t = $("title");
    if (t) setTimeout(function () { t.focus(); }, 240);
  }
  /* 세 칸이 서 있는가 · 화면 너비 하나로 정한다 (CSS 와 같은 자를 쓴다) */
  function threePane() { return window.matchMedia("(min-width: 1180px)").matches; }
  /* 기록 하나를 «연다» · 자리가 있으면 오른쪽 칸에서, 없으면 전체 보기 창으로 */
  function openEntry(n) {
    if (n.trashed) { openViewer(n); return; }   // 휴지통 것은 고치는 자리가 아니다
    if (threePane()) { loadIntoComposer(n); return; }
    openViewer(n);
  }
  function gotoList() {
    if (threePane()) {
      var col = $("listcol");
      if (col) col.scrollTo({ top: 0, behavior: "smooth" });
      return;
    }
    var tb = document.querySelector(".toolbar");
    if (tb) tb.scrollIntoView({ behavior: "smooth", block: "start" });
  }
  /* 오른쪽 칸을 맨 위로 · 3단에서는 쪽이 아니라 «그 칸» 이 굴러야 한다 */
  function scrollEditorTop() {
    var w = document.querySelector(".layout > .wrap");
    if (threePane() && w) { w.scrollTo({ top: 0, behavior: "smooth" }); return true; }
    return false;
  }
  /* 이 기록이 갈 자리 · 작성칸 맨 위 한 줄. 저장한 뒤에 알면 늦다 */
  function renderDeskLine() {
    var host = $("deskLine");
    if (!host) return;
    host.innerHTML = "";
    host.classList.remove("hidden");
    if (editingId) {
      // 고쳐 쓰는 중에는 자리를 안 건드린다 · 이미 어딘가에 살고 있는 글이다
      host.appendChild(document.createTextNode("✏️ 이미 저장된 기록을 고치는 중입니다 · 있던 자리 그대로 둡니다."));
      return;
    }
    host.appendChild(document.createTextNode("📍 이 기록이 갈 자리 · "));
    host.appendChild(el("b", null, deskLabel(desk)));
    host.appendChild(el("span", "spacer"));
    var b = el("button", "btn xs", "자리 바꾸기");
    b.type = "button";
    b.addEventListener("click", function (e) {
      e.stopPropagation();
      var t = $("topNewMore");
      if (t && getComputedStyle(t).display !== "none") { t.click(); return; }
      var d = $("dockMore");
      if (d) d.click();
    });
    host.appendChild(b);
  }
  /* ☰ 한 단추가 두 자리에서 같은 뜻으로 돈다 · «한 겹씩 걷는다».
     PC · 누를 때마다 세 단으로 돈다 (지금 몇 단인지는 기기에 남는다)
        0 · 기둥 │ 목록 │ 쓰는 자리   1 · 목록 │ 쓰는 자리   2 · 쓰는 자리만
     폰 · 서랍을 연다 (서랍은 남길 것이 없다 · 늘 닫힌 채로 시작)
     ⚠️ 열고/끄는 두 단만 있을 때는 «목록만 치우고 싶다» 를 할 수가 없었다.
        한 단추에 한 뜻이되, 그 뜻이 «한 겹 걷기» 면 세 단이 자연스럽다. */
  var NAV_STAGES = [
    { n: 0, label: "기둥 · 목록 · 쓰는 자리", tip: "폴더 구조를 접습니다" },
    { n: 1, label: "목록 · 쓰는 자리",        tip: "기록 목록도 접습니다" },
    { n: 2, label: "쓰는 자리만",             tip: "다시 다 폅니다" }
  ];
  var navStage = (function () {
    var v = localStorage.getItem("pkos.navStage.v1");
    if (v !== null) { v = parseInt(v, 10); return (v >= 0 && v <= 2) ? v : 0; }
    // 예전에 «접어 두었던» 사람은 그 자리(1단)에서 이어 쓴다
    return localStorage.getItem("pkos.sideFolded.v1") === "1" ? 1 : 0;
  })();
  function applyNavStage() {
    var l = document.querySelector(".layout");
    if (l) l.setAttribute("data-nav", String(navStage));
    var btn = $("btnDrawer");
    if (btn) {
      var st = NAV_STAGES[navStage];
      btn.setAttribute("aria-label", "지금 · " + st.label + " · 누르면 " + st.tip);
      btn.title = "지금 · " + st.label + " · 누르면 " + st.tip;
    }
  }

  /* ---- 가운데 칸만 접기 ----
     ☰ 는 «기둥 → 목록» 순서로 걷는 손잡이라, 「폴더 나무는 두고 목록만」 이 안 됐다.
     이건 그것만 하는 손잡이다 · ☰ 의 단수와 따로 논다. 접은 것은 기기에 남는다. */
  var listFolded = localStorage.getItem("pkos.listFold.v1") === "1";
  function applyListFold() {
    var l = document.querySelector(".layout");
    if (l) {
      if (listFolded) l.setAttribute("data-listcol", "off");
      else l.removeAttribute("data-listcol");
    }
    var b = $("btnListFold");
    if (b) { b.title = "기록 목록 접기"; b.setAttribute("aria-label", "기록 목록 접기"); }
  }
  function setListFold(on) {
    listFolded = !!on;
    try { localStorage.setItem("pkos.listFold.v1", listFolded ? "1" : "0"); } catch (e) {}
    applyListFold();
  }
  /* ---- 머리띠 높이를 재서 알려 준다 ----
     ⚠️ 칸들이 «100vh - 66px» 로 못 박혀 있었다. 글자 크기를 올리자 머리띠가
        76px 이 되어, 칸이 화면보다 10px 길어졌다 · 쪽 전체에 굴림 막대가 서고
        붙박이(sticky) 자리도 그만큼 어긋나 칸이 머리띠 밑으로 밀려 들어갔다.
        높이는 «글자 크기·색감·화면 너비» 를 따라 움직인다 · 재서 쓴다. */
  (function watchTopHeight() {
    var head = document.querySelector("header.top");
    if (!head) return;
    function paint() {
      var h = Math.round(head.getBoundingClientRect().height);
      if (h > 0) document.documentElement.style.setProperty("--top-h", h + "px");
    }
    paint();
    if (window.ResizeObserver) new ResizeObserver(paint).observe(head);
    else window.addEventListener("resize", paint);
    window.addEventListener("load", paint);
  })();

  /* ---- 경계를 끌어 칸 너비 바꾸기 ----
     ⚠️ 너비는 .layout 에 직접 붙인다(인라인). 무늬(CSS)에 적힌 기본값보다 세야
        사람이 정한 것이 이긴다. 값 하나만 바뀌고 격자가 알아서 다시 선다.
     ⚠️ 끄는 동안에는 pointer capture 를 쥔다. 안 쥐면 손이 옆 칸으로 넘어가는
        순간 그 칸이 «지나간다» 를 받아 글이 끌려 잡히거나 손잡이를 놓쳐 버린다. */
  var COLS = {
    nav:  { key: "--col-nav",  min: 180, max: 460, wide: 248, narrow: 264 },
    list: { key: "--col-list", min: 250, max: 680, wide: 352, narrow: 352 }
  };
  function colDefault(which) {
    var c = COLS[which];
    return window.matchMedia("(min-width: 1180px)").matches ? c.wide : c.narrow;
  }
  var colW = safeParse(localStorage.getItem("pkos.colW.v1")) || {};
  function applyColW() {
    var l = document.querySelector(".layout");
    if (!l) return;
    Object.keys(COLS).forEach(function (k) {
      var v = colW[k];
      if (v == null) l.style.removeProperty(COLS[k].key);
      else l.style.setProperty(COLS[k].key, Math.round(v) + "px");
    });
  }
  function saveColW() {
    try { localStorage.setItem("pkos.colW.v1", JSON.stringify(colW)); } catch (e) {}
  }
  (function wireGrips() {
    ["nav", "list"].forEach(function (which) {
      var grip = $(which === "nav" ? "gripNav" : "gripList");
      if (!grip) return;
      var c = COLS[which], startX = 0, startW = 0, dragging = false;

      grip.addEventListener("pointerdown", function (e) {
        if (e.button !== 0) return;
        e.preventDefault();
        dragging = true;
        startX = e.clientX;
        startW = colW[which] != null ? colW[which] : colDefault(which);
        /* ⚠️ 손가락을 «쥐는» 것은 실패할 수 있다 (마우스가 아닌 입력, 이미 놓인 손).
           안 감싸면 그 예외가 그대로 새어 나가 콘솔에 오류로 남는다. 쥐기는
           편의일 뿐이라, 못 쥐어도 끄는 것 자체는 그대로 되어야 한다. */
        try { grip.setPointerCapture(e.pointerId); } catch (err) {}
        grip.classList.add("dragging");
        document.body.classList.add("colresizing");
      });
      grip.addEventListener("pointermove", function (e) {
        if (!dragging) return;
        var w = startW + (e.clientX - startX);
        colW[which] = Math.max(c.min, Math.min(c.max, w));
        applyColW();
      });
      function stop(e) {
        if (!dragging) return;
        dragging = false;
        try { grip.releasePointerCapture(e.pointerId); } catch (err) {}
        grip.classList.remove("dragging");
        document.body.classList.remove("colresizing");
        saveColW();
      }
      grip.addEventListener("pointerup", stop);
      grip.addEventListener("pointercancel", stop);

      /* 두 번 누르면 처음 너비로 · 잘못 끌었을 때 되돌릴 길 */
      grip.addEventListener("dblclick", function () {
        delete colW[which];
        applyColW(); saveColW();
        toast((which === "nav" ? "기둥" : "목록") + " 너비를 처음으로 되돌렸습니다.");
      });
      /* 손이 아니라 자판으로도 · ←→ 로 16px 씩, Home 으로 되돌림 */
      grip.addEventListener("keydown", function (e) {
        var step = e.shiftKey ? 48 : 16, now = colW[which] != null ? colW[which] : colDefault(which);
        if (e.key === "ArrowLeft")  { colW[which] = Math.max(c.min, now - step); }
        else if (e.key === "ArrowRight") { colW[which] = Math.min(c.max, now + step); }
        else if (e.key === "Home") { delete colW[which]; }
        else return;
        e.preventDefault();
        applyColW(); saveColW();
      });
    });
    applyColW();
  })();

  (function wireDrawer() {
    var btn = $("btnDrawer"), scrim = $("drawerScrim");
    if (btn) btn.addEventListener("click", function () {
      if (window.matchMedia("(max-width: 1020px)").matches) {
        $("sideNav").classList.add("open");
        scrim.classList.remove("hidden");
        return;
      }
      navStage = (navStage + 1) % 3;
      try { localStorage.setItem("pkos.navStage.v1", String(navStage)); } catch (e) {}
      applyNavStage();
      toast("화면 · " + NAV_STAGES[navStage].label);
    });
    if (scrim) scrim.addEventListener("click", closeDrawer);
    applyNavStage();

    var fold = $("btnListFold"), rail = $("listRail");
    if (fold) fold.addEventListener("click", function () { setListFold(true); toast("기록 목록을 접었습니다 · 옆의 띠로 다시 폅니다."); });
    if (rail) rail.addEventListener("click", function () { setListFold(false); });
    applyListFold();
  })();

  function render() {
    invalidateLinks();
    renderFilters();
    renderViewSwitch();
    var host = $("list");
    host.innerHTML = "";
    host.className = "";
    renderSideNav();   // 왼쪽 폴더 구조도 같은 눈으로 그린다
    renderDeskLine();  // 「이 기록이 갈 자리」 도 같은 눈으로
    applyComposerFold();
    var shown = entries.filter(matches);
    // 고정한 기록을 맨 위로. 나머지 순서(최신순)는 그대로 둔다
    shown.sort(function (a, b) { return (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0); });
    /* 가운데 칸 제목 · 지금 무엇을 보고 있는지 그 자리에 적는다.
       업노트에서 이 자리는 «지금 연 노트북 이름» 이다. */
    var lt = $("listTitle");
    if (lt) {
      lt.textContent =
        smartView === "trash" ? "🗑 휴지통" :
        smartView === "todo" ? "☑ 할 일" :
        smartView === "untagged" ? "🏷 분류 없음" :
        smartView === "inbox" ? "📥 미정리함" :
        filterPath.length ? "📁 " + filterPath[filterPath.length - 1] :
        filterTags.length ? "# " + filterTags.join(" · ") :
        filterPinned ? "📌 고정" : "📚 모든 기록";
    }
    var liveN = liveEntries().length;
    $("countText").textContent = liveN
      ? (shown.length === liveN ? liveN + "개" : shown.length + " / " + liveN + "개") : "";

    /* 휴지통 안내 · ⚠️ 비우는 길이 없으면 버린 것이 색인에 영영 쌓인다.
       그리고 «드라이브 파일은 아직 그대로» 라는 사실을 여기서 말해 주지 않으면,
       버렸으니 지워졌겠거니 하고 넘어가게 된다. */
    if (smartView === "trash") {
      var tb = el("div", "banner");
      tb.style.margin = "0 0 12px";
      tb.appendChild(el("span", "grow",
        shown.length
          ? "버린 기록 " + shown.length + "편입니다. 드라이브의 파일은 아직 그대로 있습니다 · 완전히 삭제할 때 함께 정리됩니다."
          : "휴지통이 비어 있습니다."));
      if (shown.length) {
        var eb = el("button", "btn sm danger", "휴지통 비우기");
        eb.type = "button";
        eb.addEventListener("click", function () {
          var ids = entries.filter(function (n) { return n.trashed; }).map(function (n) { return n.id; });
          confirmModal("휴지통을 비울까요?",
            ids.length + "편을 완전히 지웁니다.\n\n이건 되돌릴 수 없습니다." +
            (connected ? "\n드라이브의 .md 파일과 첨부 자료도 함께 휴지통으로 이동합니다." : "\n이 기기에서 삭제됩니다."),
            function () { ids.forEach(purgeNow); saveLocal(); render();
              if (connected) saveIndex().catch(function () {});
              toast(ids.length + "편을 완전히 지웠습니다."); },
            "모두 지우기");
        });
        tb.appendChild(eb);
      }
      host.appendChild(tb);
    }

    if (!shown.length) {
      var e = el("div", "empty");
      if (entries.length) { e.appendChild(el("span", "big", "🔍")); e.appendChild(document.createTextNode("조건에 맞는 기록이 없습니다.")); }
      else {
        /* 빈 화면 · 브릭 셋과 단추 하나. 설명은 안 붙인다 · 단추가 곧 설명이다 */
        var bricks = el("div", "emptybricks");
        ["var(--brand)", "var(--t3)", "var(--t1)"].forEach(function (c) {
          var i = document.createElement("i");
          i.style.background = c; i.style.color = c;   // 돌기(그림자)가 몸통 색을 따라온다
          bricks.appendChild(i);
        });
        e.appendChild(bricks);
        e.appendChild(el("div", "emptytitle", "블록 하나로 시작하는 기록"));
        var go = el("button", "emptybtn", "✍️ 첫 기록 남기기");
        go.type = "button";
        go.addEventListener("click", function () {
          window.scrollTo({ top: 0, behavior: "smooth" });
          var t = $("title"); if (t) t.focus();
        });
        e.appendChild(go);
      }
      host.appendChild(e);
      return;
    }

    // ---- 목록식: 제목만 한 줄씩 ----
    if (settings.viewMode === "list") {
      /* 목록 보기 = «디렉토리». 지금 정리 방식대로 폴더에 담아 보여 준다.
         드라이브를 열었을 때와 같은 모양이라, 어디에 무엇이 있는지 화면과 드라이브가 어긋나지 않는다. */
      var table = el("div", "card listview");
      var groups = {}, order = [];
      shown.forEach(function (n) {
        listFoldersOf(n).forEach(function (key) {
          if (!groups[key]) { groups[key] = []; order.push(key); }
          groups[key].push(n);
        });
      });
      /* 폴더 이름이 날짜로 시작하므로 «내림차순» 이라야 최신이 위로 온다.
         목록의 다른 보기들이 전부 최신순인데 여기만 뒤집히면 «어제 것이 사라졌다» 고 여긴다. */
      order.sort(function (a, b) {
        if (a === "") return -1;            // 폴더 없는 것(맨 위에 놓이는 글)이 먼저
        if (b === "") return 1;
        return b.localeCompare(a, "ko");
      });
      order.forEach(function (key) {
        var list = groups[key];
        if (key !== "") {
          /* 처음에는 «접어» 둔다. 폴더가 여럿이면 펴 둔 채로는 한 화면에 안 들어와
             무엇이 있는지 도리어 안 보인다. 눌러야 그 안이 열린다. */
          var open = listOpen[key] === true;
          var fr = el("button", "lfolder");
          fr.type = "button";
          fr.appendChild(el("span", "ltwist", open ? "▾" : "▸"));
          fr.appendChild(fileIconSvg("folder"));
          fr.appendChild(el("span", "lfname", key + "/"));
          fr.appendChild(el("span", "spacer"));
          fr.appendChild(el("span", "lmeta", "기록 " + list.length + "편"));
          fr.addEventListener("click", function () { listOpen[key] = !open; render(); });
          table.appendChild(fr);
          if (!open) return;
        }
        list.forEach(function (n) { table.appendChild(listRow(n, key !== "")); });
      });
      host.appendChild(table);
      return;
    }

    if (settings.viewMode === "grid") host.className = "gridview";
    else host.className = "";

    shown.forEach(function (n) {
      var t = typeOf(n.type);
      var card = paintType(el("article", "card entry" + (editingId === n.id ? " sel" : "")), n.type);
      card.setAttribute("data-eid", n.id);

      if (n.pinned) card.classList.add("pinned");

      var head = el("div", "head");
      if (crumbsOf(n).length) card.appendChild(buildCrumbs(n));
      if (n._missing || n._away) card.appendChild(missingNote(n));
      head.appendChild(el("span", "badge", t.icon + " " + t.label));
      if (!n.trashed && isInbox(n)) head.appendChild(el("span", "badge inboxbadge", "📥 미정리"));
      /* 제목을 누르면 열린다 · 가장 많이 하는 일(읽기)이 가장 가까운 자리에 있어야 한다.
         전에는 제목이 왼쪽 위, 여는 단추가 오른쪽 아래로 «대각선으로 가장 먼» 자리였다. */
      var h3 = el("h3");
      /* ⚠️ <button> 으로 만들면 안 된다. 단추는 «쪼갤 수 없는 한 덩어리» 라서
         긴 제목이 줄바꿈을 못 하고 폰에서 화면 밖으로 밀려난다 (실제로 39px 넘쳤다).
         글처럼 흐르면서 눌리기도 해야 하므로 span 에 역할만 준다. */
      var tbtn = el("span", "titlebtn", n.title || "(제목 없음)");
      tbtn.setAttribute("role", "button");
      tbtn.setAttribute("tabindex", "0");
      tbtn.title = "전체 보기";
      /* 3단일 때는 «고르면 오른쪽에서 열린다» · 그것이 3단의 전부다.
         2단·폰에서는 열 오른쪽 칸이 없으므로 전체 보기 창을 띄운다. */
      tbtn.addEventListener("click", function () { openEntry(n); });
      tbtn.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openEntry(n); }
      });
      h3.appendChild(tbtn);
      head.appendChild(h3);
      /* 나머지는 한 겹 안으로 · 위험한 것(삭제)이 편집 바로 옆에 늘 나와 있으면 안 된다.
         ⚠️ 그런데 «한 겹 안» 이 너무 깊었다. 가운데 칸에서는 ⋯ 이 아예 안 보이다가
            마우스를 얹어야 나타나서, 지우는 길이 없는 줄 알았다는 말을 들었다.
            그래서 ⋯ 는 늘 보이게 두고(아래 CSS), 카드 아무 데서나 오른쪽 단추로도 열린다. */
      var dots = dotsBtn("이 기록으로 할 일");
      function entryMenuItems() {
        var items = n.trashed
          ? [{ label: "📖 전체 보기", run: function () { openViewer(n); } },
             { label: "↩ 되돌리기", run: function () { restoreEntry(n.id); } },
             "-",
             { label: "🗑️ 완전히 삭제", danger: true, note: "드라이브 파일까지 · 되돌릴 수 없습니다", run: function () { purgeEntry(n.id); } }]
          : [{ label: "📖 전체 보기", run: function () { openViewer(n); } },
             { label: "✏️ 편집", run: function () { loadIntoComposer(n); } },
             { label: n.pinned ? "📌 고정 풀기" : "📌 맨 위에 고정", run: function () { togglePin(n); } },
             { label: "🔗 링크로 공유", run: function () { openShareModal(n); } },
             "-",
             { label: "🗑️ 삭제", danger: true, note: "휴지통으로 · 되돌릴 수 있습니다", run: function () { removeEntry(n.id); } },
             /* 두 걸음이 기본이지만, 「지금 바로 파일째 지우고 싶다」 는 길도 열어 둔다.
                누르면 무엇이 지워지는지 적힌 확인 창이 반드시 한 번 뜬다 (purgeEntry). */
             { label: "🗑️ 완전히 삭제", danger: true, note: "드라이브 파일까지 · 되돌릴 수 없습니다", run: function () { purgeEntry(n.id); } }];
        if (!n.trashed && isInbox(n)) {
          items.splice(2, 0, { label: "✅ 정리 끝", note: (n.tags || []).length ? "미정리함에서 뺍니다" : "태그를 하나 붙여야 나갑니다 · 편집으로 갑니다",
            run: function () {
              if (!(n.tags || []).length) { loadIntoComposer(n); toast("태그를 하나 붙이고 저장하면 미정리함에서 나갑니다."); return; }
              n.inbox = false; n.updatedAt = Date.now(); n._dirty = true;
              saveLocal(); render();
              if (connected) syncPending();
            } });
        }
        return items;
      }
      dots.addEventListener("click", function (e) {
        e.stopPropagation();
        openMenu(dots, entryMenuItems());
      });
      head.appendChild(dots);
      // 카드 위에서 오른쪽 단추 · 폴더 창에서 하던 그 손버릇 그대로
      card.addEventListener("contextmenu", function (e) {
        e.preventDefault(); e.stopPropagation();
        openMenuAt(e.clientX, e.clientY, entryMenuItems());
      });
      var line2 = el("span", "when");
      line2.appendChild(document.createTextNode(formatDate(n.createdAt)));
      var pin = el("button", "pinbtn" + (n.pinned ? " on" : ""), n.pinned ? "📌 고정됨" : "📌 고정");
      pin.type = "button";
      pin.title = n.pinned ? "맨 위 고정을 풉니다" : "이 기록을 목록 맨 위에 둡니다";
      pin.addEventListener("click", function () { togglePin(n); });
      line2.appendChild(pin);
      head.appendChild(line2);
      card.appendChild(head);

      if ((n.tags || []).length) {
        var tg = el("div", "tags");
        n.tags.forEach(function (x) {
          // 태그를 누르면 그 태그로 바로 좁혀 본다
          var on = filterTags.indexOf(x) >= 0;
          var chip = el("button", "tag pick" + (on ? " on" : ""), "#" + x);
          chip.type = "button";
          chip.title = on ? "이 태그 필터 끄기" : "이 태그만 모아 보기";
          chip.addEventListener("click", function () {
            if (on) filterTags = filterTags.filter(function (y) { return y !== x; });
            else filterTags = filterTags.concat([x]);
            render();
            window.scrollTo({ top: 0, behavior: "smooth" });
          });
          tg.appendChild(chip);
        });
        card.appendChild(tg);
      }

      var body = el("div", "content" + (expanded[n.id] ? "" : " collapsed"));
      renderContent(n, body, { mediaFirst: true });   // 보드에서는 사진·산출물·코드가 위로
      card.appendChild(body);

      var more = el("button", "btn sm ghost morebtn", expanded[n.id] ? "접기 ▲" : "더 보기 ▼");
      more.addEventListener("click", function () { expanded[n.id] = !expanded[n.id]; render(); });
      card.appendChild(more);
      setTimeout(function () {
        if (!expanded[n.id] && body.scrollHeight <= 320) { more.classList.add("hidden"); body.classList.remove("collapsed"); }
      }, 0);

      // 연결 · 나가는 링크와 들어오는 백링크
      var outs = outLinks(n), ins = backLinks(n);
      if (outs.length || ins.length) {
        var rel = el("div", "rel");
        rel.appendChild(el("div", "relhead", "🔗 연결 · 나감 " + outs.length + " · 들어옴 " + ins.length));
        var chips = el("div", "relchips");
        outs.forEach(function (l) {
          var c = el("button", "relchip out" + (l.to ? "" : " missing"), l.title + (l.label ? " · " + l.label : ""));
          c.type = "button";
          c.title = l.to ? "이동" : "아직 없는 기록 · 눌러서 만들기";
          c.addEventListener("click", function () { if (l.to) gotoEntry(l.to); else startNewFromLink(l.title); });
          chips.appendChild(c);
        });
        ins.forEach(function (x) {
          var c = el("button", "relchip in", x.entry.title + (x.label ? " · " + x.label : ""));
          c.type = "button";
          c.addEventListener("click", function () { gotoEntry(x.entry.id); });
          chips.appendChild(c);
        });
        rel.appendChild(chips);
        card.appendChild(rel);
      }

      var foot = el("div", "foot");
      var pending = (n.blocks || []).filter(function (b) { return (b.kind === "image" || b.kind === "file") && !b.fileId; }).length;
      var saved = n.mdId && !pending;
      var syncIcon = saved ? "☁" : (connected ? "⏳" : "💾");
      var syncText = saved ? "드라이브 저장됨" : (connected ? "업로드 대기" : "이 기기에만 저장");
      var sd = el("span", "sync-dot " + (saved ? "ok" : "pending"));
      sd.appendChild(el("span", "sdico", syncIcon));
      sd.appendChild(el("span", "sdtxt", " " + syncText));   // 바둑판에서는 아이콘만 남긴다
      sd.title = syncIcon + " " + syncText;
      foot.appendChild(sd);
      foot.appendChild(el("span", "spacer"));
      // 문서·PDF·.md·폴더는 모두 「전체 보기」 안에 모아 두었다

      /* ⚠️ 단추 셋을 여기 늘어놓던 자리다. 제목 옆 ⋯ 로 옮겼다 ·
         카드가 길수록 제목(왼쪽 위)과 단추(오른쪽 아래)가 멀어져서,
         한 편 열어 보는 데에도 눈과 손이 화면을 가로질러야 했다.
         휴지통에서만은 «되돌리기» 를 밖에 둔다. 거기 들어온 사람은 그것 하러 온 것이다. */
      if (n.trashed) {
        var bR = el("button", "btn sm", "↩ 되돌리기");
        bR.addEventListener("click", function () { restoreEntry(n.id); });
        foot.appendChild(bR);
      }
      card.appendChild(foot);

      host.appendChild(card);
    });
  }

  /* =========================================================
     11-8. 폴더에서 가져오기 · 색인에 없는 .md 를 찾아 목록에 넣는다
     ========================================================= */
  var LIST_PAGE_MAX = 5000;   // 한 폴더에서 받아 올 파일 수 상한

  function listChildren(parentId) {
    var q = "'" + parentId + "' in parents and trashed=false";
    var base = "https://www.googleapis.com/drive/v3/files?q=" + encodeURIComponent(q) +
      "&fields=nextPageToken,files(id,name,mimeType,size,createdTime,modifiedTime,webViewLink)" +
      "&pageSize=1000&supportsAllDrives=true&includeItemsFromAllDrives=true";
    var out = [];
    /* 한 폴더에 1000개가 넘게 들어 있으면 구글이 쪽으로 나눠 준다.
       쪽을 안 넘기면 1001번째부터는 «없는 것» 이 된다. 십 년치 폴더에서는 실제로 넘는다. */
    function page(token) {
      return driveJson(base + (token ? "&pageToken=" + encodeURIComponent(token) : ""))
        .then(function (j) {
          out = out.concat(j.files || []);
          if (j.nextPageToken && out.length < LIST_PAGE_MAX) return page(j.nextPageToken);
        });
    }
    return page("").then(function () { return out; }).catch(function () { return out; });
  }
  /* 연결 폴더 아래를 깊이까지 훑는다.
     학년·학기·과목처럼 여러 겹으로 정리해 두어도 찾아낸다.
     드라이브 요청이 폭주하지 않도록 «깊이»와 «폴더 수»에 상한을 둔다. */
  var SCAN_DEPTH = 10;         // 연결 폴더 아래로 10단계까지
  var SCAN_FOLDER_MAX = 3000;  // 훑을 폴더 수 상한
  var SCAN_PARALLEL = 4;       // 동시에 물어볼 폴더 수

  function scanFolder(onStep) {
    var files = [], dirs = [], seen = {}, visited = 0, truncated = false;

    // 한 단계(같은 깊이의 폴더들)를 훑고, 그 아래 단계를 다시 훑는다
    function walk(level) {
      if (!level.length) return Promise.resolve();
      var nextLevel = [], queue = level.slice();

      function worker() {
        if (!queue.length) return Promise.resolve();
        if (visited >= SCAN_FOLDER_MAX) { truncated = true; return Promise.resolve(); }
        var dir = queue.shift();
        visited++;
        if (onStep) onStep(visited, files.length);
        return listChildren(dir.id).then(function (kids) {
          kids.forEach(function (k) {
            if (k.mimeType === "application/vnd.google-apps.folder") {
              if (!seen[k.id]) {
                seen[k.id] = 1;
                var sub = { id: k.id, name: k.name, depth: dir.depth + 1, path: dir.path.concat([k.name]) };
                nextLevel.push(sub);
                /* ⚠️ 폴더도 따로 적어 둔다. 파일만 모으면 «빈 폴더» 가 통째로 사라진다.
                   손으로 만들어 아직 아무것도 안 넣은 폴더가 딱 그 경우다. */
                dirs.push({ id: k.id, name: k.name, path: sub.path });
              }
              return;
            }
            k._parent = dir.id; k._parentName = dir.name;
            k._path = dir.path;                 // 연결 폴더부터 여기까지 거쳐 온 폴더 이름들
            files.push(k);
          });
        }).then(worker);
      }

      var runners = [];
      for (var i = 0; i < SCAN_PARALLEL; i++) runners.push(worker());
      return Promise.all(runners).then(function () {
        var deeper = nextLevel.filter(function (d) { return d.depth <= SCAN_DEPTH; });
        if (nextLevel.length > deeper.length) truncated = true;   // 더 깊은 곳이 남았다
        if (!deeper.length || visited >= SCAN_FOLDER_MAX) return;
        return walk(deeper);
      });
    }

    return walk([{ id: folder.id, name: folder.name, depth: 0, path: [] }]).then(function () {
      /* 고르기 창에서 방금 고른 것들을 합친다.
         ⚠️ 고른 파일은 대개 위 훑기에도 잡히지만, 연결한 폴더 «밖» 에서 고른 것은 안 잡힌다.
            그걸 빠뜨리면 «분명히 골랐는데 없다» 가 된다. */
      grantedExtra.forEach(function (g) {
        if (!files.some(function (f) { return f.id === g.id; })) files.push(g);
      });
      return { files: files, dirs: dirs, folders: visited, truncated: truncated };
    });
  }

  /* =========================================================

      srcPath: (f._path || []).slice(),   // 연결 폴더부터 여기까지 · 길찾기 줄이 이걸로 선다
      /* ⚠️ 여기에 folderId 를 넣으면 안 된다. 이 앱에서 folderId 는
         «이 기록이 가진 폴더» 라는 뜻이고, 지우기·공유·옮기기가 전부 그리로 향한다.
         가져온 자료가 있던 곳은 «남의 폴더» 다. 십삼 년치가 통째로 들어 있는 곳이다.
         거기에 folderId 를 걸면 기록 한 편을 지웠을 때 그 폴더가 통째로 휴지통에 간다.
         그래서 «원본이 있던 곳» 은 이름을 달리해 따로 적고, 길 안내에만 쓴다. */
      srcFolderId: deep ? f._parent : null,
      srcFolderName: deep ? f._parentName : null,
      _imported: true
    };
  }

  function importFromFolder(status) {
    if (!connected || !folder.id) { toast("먼저 드라이브에 연결해 주세요."); return Promise.resolve(0); }
    var known = {};
    entries.forEach(function (n) {
      if (n.mdId) known[n.mdId] = 1;
      if (n.docId) known[n.docId] = 1;
      if (n.htmlId) known[n.htmlId] = 1;
      if (n.srcId) known[n.srcId] = 1;
      (n.blocks || []).forEach(function (b) { if (b.fileId) known[b.fileId] = 1; });
    });
    var byEntryId = {};
    entries.forEach(function (n) { byEntryId[n.id] = 1; });

    var addedMd = 0, addedFile = 0, skipped = 0, relearned = 0;

    // 자료를 세울 때 붙일 기록 유형 · 「자료」 가 있으면 그것을, 없으면 맨 앞 것을
    function materialTypeKey() {
      var key = settings.types[0] ? settings.types[0].key : "";
      settings.types.forEach(function (t) {
        if (t.key === "material" || t.label === "자료") key = t.key;
      });
      return key;
    }

    // ① 글(.md) 한 편을 읽어 색인에 세운다
    function readMd(f, files) {
      return fetchText(f.id).then(function (text) {
        if (!text) { skipped++; return; }
        var parsed = parseFrontMatter(text);
        var fm = parsed.fm;
        if (fm.id && byEntryId[fm.id]) { skipped++; return; }  // 이미 있는 기록

        var title = unquote(fm.title) ||
          (/^#\s+(.*)$/m.exec(parsed.body) || [])[1] ||
          stemOf(f.name);
        var typeKey = settings.types[0] ? settings.types[0].key : "";
        var wanted = unquote(fm.type);
        settings.types.forEach(function (t) { if (t.label === wanted) typeKey = t.key; });

        var siblings = files.filter(function (x) { return x._parent === f._parent && x.id !== f.id; });
        var created = Date.parse(fm.created || f.createdTime) || Date.now();
        var updated = Date.parse(fm.updated || f.modifiedTime) || created;

        var n = {
          id: fm.id && !byEntryId[fm.id] ? fm.id : uid("k_"),
          type: typeKey,
          title: title,
          tags: parseListValue(fm.tags),
          blocks: bodyToBlocks(parsed.body, siblings),
          relations: [],
          createdAt: created,
          updatedAt: updated,
          mdId: f.id,
          mdName: f.name,
          /* ⚠️ 이 글은 «밖에서 온 남의 파일» 이다. 앱이 만든 것이 아니다.
             srcId 를 안 적으면 앱은 이걸 제 것으로 여겨, 목록에서 한 편 뺐을 때
             십삼 년 동안 있던 원본까지 휴지통으로 보내고, 저장할 때마다 이름도 제 규칙으로 되돌린다.
             자료(entryFromFile)와 똑같이 «밖에서 온 것» 이라고 적어 둔다. */
          srcId: f.id,
          srcPath: (f._path || []).slice(),
          // 위 entryFromFile 과 같은 이유 · 남의 폴더에 folderId 를 걸면 안 된다
          srcFolderId: (f._parent !== folder.id) ? f._parent : null,
          srcFolderName: (f._parent !== folder.id) ? f._parentName : null,
          _imported: true
        };
        /* ⚠️ 지운 표시(tombstone)를 걷는다.
           사람이 「폴더 훑어서 가져오기」 를 누른 것은 «이걸 돌려놓아라» 는 뜻이다.
           표시를 그대로 두면, 색인을 다시 합칠 때(mergeEntries) 방금 가져온 것이
           도로 지워진다. 화면에는 «들어왔다가 새로고침 한 번에 사라지는» 것으로 보인다. */
        tombstones = tombstones.filter(function (t) { return t.id !== n.id; });
        byEntryId[n.id] = 1;
        entries.push(n);
        addedMd++;
      });
    }

    /* ② 글이 아닌 자료 · 몇 개를 무슨 갈래로 넣을지 먼저 보여 주고 물어본다.
       십 년치 폴더에서는 수천 개가 나올 수 있어서, 말없이 넣으면 안 된다. */
    function askThenAddMaterials(rest) {
      if (!rest.length) return Promise.resolve();

      var counts = {}, kinds = [];
      rest.forEach(function (f) {
        var k = kindLabel(f);
        if (!counts[k]) { counts[k] = 0; kinds.push(k); }
        counts[k]++;
      });
      kinds.sort(function (a, b) { return counts[b] - counts[a]; });

      var take = rest;
      var over = rest.length > IMPORT_MAX;
      if (over) {
        // 넘칠 때는 «최근에 고친 것» 부터 넣는다. 나머지는 한 번 더 누르면 이어서 들어온다.
        take = rest.slice().sort(function (a, b) {
          return (Date.parse(b.modifiedTime) || 0) - (Date.parse(a.modifiedTime) || 0);
        }).slice(0, IMPORT_MAX);
      }

      var text = "글이 아닌 자료가 " + rest.length + "개 있습니다.\n\n" +
        kinds.map(function (k) { return "· " + k + " " + counts[k] + "개"; }).join("\n") +
        "\n\n하나를 기록 한 편으로 세워 목록에 넣습니다. 거쳐 온 폴더 이름이 태그로 붙습니다.\n" +
        "원본은 옮기지도 고치지도 않습니다. 색인이 가리키기만 합니다.\n" +
        "잘못 들어와도 목록에서 지우면 그만입니다. 드라이브의 파일은 그대로 남습니다." +
        (over ? "\n\n⚠️ 한 번에 " + IMPORT_MAX + "개까지만 넣습니다. 최근에 고친 것부터 들어가고,\n" +
                "나머지 " + (rest.length - IMPORT_MAX) + "개는 한 번 더 누르면 이어서 들어옵니다." : "");

      return new Promise(function (resolve) {
        confirmModal("🗂️ 자료도 함께 가져올까요?", text, function () {
          if (status) status.textContent = "자료 " + take.length + "개를 세우는 중…";
          var typeKey = materialTypeKey();
          take.forEach(function (f) {
            var n = entryFromFile(f, typeKey);
            byEntryId[n.id] = 1;
            entries.push(n);
            addedFile++;
          });
          resolve();
        }, "가져오기", resolve);
      });
    }

    function finish(scan) {
      var total = addedMd + addedFile;
      var moved = relearned ? " · 자리가 바뀐 " + relearned + "편은 다시 잡았습니다" : "";
      if (!total) {
        if (status) status.textContent = "폴더 " + scan.folders + "곳을 훑었습니다. 새로 가져올 것이 없습니다." +
          moved + (skipped ? " (건너뜀 " + skipped + ")" : "");
        // 새로 들어온 것이 없어도 자리를 고쳤으면 색인은 다시 써야 한다
        if (!relearned) return 0;
        saveLocal(); render();
        return saveIndex().then(function () { return 0; });
      }
      entries.sort(function (a, b) { return (b.createdAt || 0) - (a.createdAt || 0); });
      invalidateLinks(); saveLocal(); render();
      var parts = [];
      if (addedMd) parts.push("글 " + addedMd + "편");
      if (addedFile) parts.push("자료 " + addedFile + "개");
      if (relearned) parts.push("자리를 다시 잡은 " + relearned + "편");
      if (status) status.textContent = parts.join(" · ") + " 를 색인에 넣었습니다. 저장하는 중…";
      return saveIndex().then(function () {
        if (status) status.textContent = parts.join(" · ") + " 를 가져왔습니다.";
        return total;
      });
    }

    if (status) status.textContent = "폴더를 훑는 중…";
    return scanFolder(function (dirs, found) {
      if (status) status.textContent = "폴더를 훑는 중… " + dirs + "곳 · 파일 " + found + "개";
    }).then(function (scan) {
      var files = scan.files;
      /* 새로 가져오기 전에, 이미 아는 것들의 «자리» 부터 다시 잡는다.
         아래 known[f.id] 로 건너뛰기 때문에, 여기서 안 보면 옮긴 것을 볼 기회가 영영 없다. */
      relearned = relearnPlaces(scan);
      if (scan.truncated) {
        toast("폴더 " + scan.folders + "곳까지만 훑었습니다 (" + SCAN_DEPTH + "단계·" + SCAN_FOLDER_MAX + "곳 한도).");
        toast2("더 깊거나 많은 곳에 있는 파일은, 그 폴더를 직접 연결해서 한 번 더 가져오세요.");
      }
      /* ⚠️ 「태그가 곧 폴더」 설정은 태그 폴더마다 «.md 바로가기» 를 놓는다.
         이름이 진짜 글과 똑같아서 안 거르면 매번 다시 읽으려 든다.
         바로가기를 읽으면 본문이 빈 채로 와서, 끝없이 «글 N편을 읽는 중» 만 뜬다. */
      var mds = files.filter(function (f) {
        return !known[f.id] && /\.md$/i.test(f.name || "") &&
          f.mimeType !== "application/vnd.google-apps.shortcut";
      });
      if (status) {
        status.textContent = "폴더 " + scan.folders + "곳에서 파일 " + files.length + "개를 봤습니다" +
          (mds.length ? " · 글 " + mds.length + "편을 읽는 중…" : "…");
      }

      return mds.reduce(function (p, f) {
        return p.then(function () { return readMd(f, files); });
      }, Promise.resolve()).then(function () {
        /* 글에 딸려 온 사진·첨부는 이미 그 글의 일부다. 여기서 다시 세우면 같은 것이 두 번 들어간다.
           그래서 «글을 다 읽은 뒤에» 남은 것을 고른다. 순서가 뒤바뀌면 안 된다. */
        entries.forEach(function (n) {
          (n.blocks || []).forEach(function (b) { if (b.fileId) known[b.fileId] = 1; });
        });
        var rest = files.filter(function (f) { return !known[f.id] && isImportable(f); });
        return askThenAddMaterials(rest);
      }).then(function () { return finish(scan); });
    }).catch(function (e) {
      if (status) status.textContent = "가져오기 실패: " + e.message;
      return 0;
    });
  }

  /* 링크 주소에서 도메인만 뽑는다 (링크 미리보기·태그에 쓴다) */
  function hostOf(u) {
    try { return new URL(u).hostname.replace(/^www\./, ""); } catch (e) { return ""; }
  }
  var toast2 = function (msg) { setTimeout(function () { toast(msg); }, 3000); };

  /* =========================================================
     11-9. 밖에서 들어온 것 받기 · 웹 캡처 · 공유
     들어오는 길이 두 갈래다.
       ① 📱 안드로이드 «공유» 시트 → 서비스 워커가 받아 캐시에 두고 여기서 꺼낸다
       ② 💻 즐겨찾기 한 줄(북마클릿) → 주소 뒤 #capture= 에 담겨 온다
     둘 다 «쓰던 글에 이어 붙인다». 덮어쓰지 않는다.
     ========================================================= */
  var SHARE_CACHE = "trace-share-inbox";

  function urlHost(u) {
    try { return new URL(u).hostname.replace(/^www\./, ""); } catch (e) { return ""; }
  }

  // 받은 것(제목·주소·본문)을 블록으로 바꿔 이어 붙인다
  function absorbShared(s) {
    var title = String(s.title || "").trim();
    var url = String(s.url || "").trim();
    var text = String(s.text || "").trim();

    // 안드로이드 앱 상당수가 주소를 text 에 섞어 보낸다. 거기서 뽑아낸다.
    if (!url) {
      var m = /https?:\/\/[^\s]+/.exec(text);
      if (m) { url = m[0]; text = text.replace(m[0], "").trim(); }
    }
    if (text && url && text === url) text = "";

    var made = [];
    if (url) made.push(newBlock("link", { url: url, label: title || urlHost(url) || url }));
    if (text) made.push(newBlock("quote", { text: text }));
    if (!url && !text && title) made.push(newBlock("text", { text: title }));

    if (made.length) {
      insertBlocks(made);
    }
    // 제목 칸이 비어 있을 때만 채운다. 쓰던 제목을 밀어내지 않는다.
    var tf = $("title");
    if (tf && !tf.value.trim() && title) { tf.value = title; touchDraft(); }
    return made.length;
  }

  // 서비스 워커가 캐시에 넣어 둔 공유 꾸러미를 꺼낸다
  function pullSharedFromCache() {
    if (!self.caches) return Promise.resolve(0);
    var cache = null;
    return caches.open(SHARE_CACHE)
      .then(function (c) { cache = c; return c.match("/__share__/meta"); })
      .then(function (res) {
        if (!res) return 0;
        return res.json().then(function (meta) {
          var n = absorbShared(meta);
          var list = meta.files || [];
          return list.reduce(function (chain, f) {
            return chain.then(function () {
              return cache.match("/__share__/" + f.key).then(function (r) {
                if (!r) return;
                return r.blob().then(function (blob) {
                  return acceptFiles([new File([blob], f.name, { type: f.type || blob.type })])
                    .then(function () { n++; });
                });
              });
            });
          }, Promise.resolve()).then(function () { return n; });
        });
      })
      .then(function (n) {
        return caches.delete(SHARE_CACHE).catch(function () {}).then(function () { return n; });
      })
      .catch(function () { return 0; });
  }

  // 즐겨찾기 한 줄이 주소 뒤에 붙여 보낸 것
  function pullSharedFromHash() {
    var m = /[#&]capture=([^&]+)/.exec(location.hash || "");
    if (!m) return 0;
    var got = 0;
    try { got = absorbShared(JSON.parse(decodeURIComponent(m[1]))); } catch (e) { got = 0; }
    history.replaceState(null, "", location.pathname + location.search);
    return got;
  }

  function intakeShared() {
    var fromHash = pullSharedFromHash();
    if (fromHash) {
      toast("웹에서 가져온 " + fromHash + "개를 넣었습니다. 이어서 쓰고 «기록 저장» 을 누르세요.");
      touchDraft();
      return;
    }
    if (!/[?&]share=1/.test(location.search)) return;
    history.replaceState(null, "", location.pathname);
    pullSharedFromCache().then(function (n) {
      if (!n) { toast("공유된 내용을 찾지 못했습니다."); return; }
      toast("공유한 " + n + "개를 넣었습니다. 이어서 쓰고 «기록 저장» 을 누르세요.");
      touchDraft();
      var box = $("blocks");
      if (box && box.lastElementChild) box.lastElementChild.scrollIntoView({ behavior: "smooth", block: "center" });
    });
  }

  /* «즐겨찾기 한 줄». 지금 이 앱 주소가 그대로 박힌다.
     ⚠️ 지금은 아무 데서도 안 부른다. 설정의 「웹 캡처」 칸을 뻐기 때문이다.
        받는 쪽(intakeShared)은 그대로 살아 있으므로, 이 한 줄만 다시 어딘가에 내주면
        그날로 되살아난다. 그래서 지우지 않고 둔다. */
  function bookmarkletCode() {
    var appUrl = location.origin + location.pathname;
    return "javascript:(function(){" +
      "var s=(window.getSelection?String(getSelection()):'').slice(0,4000);" +
      "var d={title:document.title,url:location.href,text:s};" +
      "window.open('" + appUrl + "#capture='+encodeURIComponent(JSON.stringify(d)),'_blank');" +
      "})()";
  }

  /* =========================================================
     12-0. 도움말 · 연결·백링크·관계망이 뭔지 설명
     ========================================================= */
  function openHelp(tab) {
    closeModal();
    var active = tab || "link";
    var bg = el("div", "modal-bg");
    var m = el("div", "card modal"); m.style.maxWidth = "620px";

    var head = el("div", "mhead");
    head.appendChild(el("h3", null, "❔ 연결 사용법"));
    head.appendChild(el("span", "spacer"));
    var x = el("button", "btn sm ghost", "✕"); x.addEventListener("click", closeModal);
    head.appendChild(x);
    m.appendChild(head);

    var tabs = el("div", "tabs");
    var body = el("div", "mbody");
    var TABS = [["link", "① 연결이란"], ["how", "② 잇는 법"], ["back", "③ 백링크"], ["graph", "④ 관계망"]];
    TABS.forEach(function (t) {
      var b = el("button", "tab" + (active === t[0] ? " on" : ""), t[1]);
      b.addEventListener("click", function () { active = t[0]; paint(); });
      tabs.appendChild(b);
    });
    m.appendChild(tabs); m.appendChild(body);

    var foot = el("div", "mfoot");
    foot.appendChild(el("span", "spacer"));
    var ok = el("button", "btn primary", "알겠습니다");
    ok.addEventListener("click", closeModal);
    foot.appendChild(ok);
    m.appendChild(foot);

    bg.appendChild(m);
    bg.addEventListener("click", function (e) { if (e.target === bg) closeModal(); });
    $("modalHost").appendChild(bg);
    modalEl = bg;

    function block(title, lines) {
      var d = el("div", "help-block");
      if (title) d.appendChild(el("h4", null, title));
      lines.forEach(function (l) {
        if (typeof l === "string") d.appendChild(el("p", null, l));
        else d.appendChild(l);
      });
      body.appendChild(d);
      return d;
    }
    function example(text) { return el("div", "help-ex", text); }

    function paint() {
      Array.prototype.forEach.call(tabs.children, function (b, i) {
        b.className = "tab" + (TABS[i][0] === active ? " on" : "");
      });
      body.innerHTML = "";

      if (active === "link") {
        block("연결이 왜 필요한가요?", [
          "기록이 쌓이면 검색만으로는 부족해집니다. 「지난달 그 수업에서 배운 걸 이번 수업에 썼는데, 그게 뭐였더라」 같은 게 안 잡히거든요.",
          "그래서 기록끼리 실을 매어 둡니다. 나중에 하나를 열면 관련된 것들이 따라 나옵니다.",
          example("물의 상태변화 수업  →  온도계 사용법  →  실험 준비 체크리스트")
        ]);
        block("두 가지 방법이 있습니다", [
          "① 글을 쓰다가 자연스럽게 · 문장 안에서 다른 기록을 언급하기",
          "② 나중에 몰아서 · 관계망 화면에서 점과 점을 이어주기",
          "둘 다 결과는 같습니다. 편한 쪽으로 하시면 됩니다."
        ]);

      } else if (active === "how") {
        block("① 글 쓰다가 잇기", [
          "내용 칸에 대괄호 두 개를 칩니다.",
          example("[[  ← 이렇게 치면 기존 기록 목록이 뜹니다"),
          "목록에서 고르면 이렇게 들어갑니다.",
          example("얼음 실험을 했다. [[온도계 사용법]] 을 먼저 보여줄 걸 그랬다."),

          "· 정보 창의 「🔗 다른 기록과 잇기」 → 상대 점을 누르면 연결이 만들어집니다",
          "· 연결 옆 ✕ 로 끊을 수 있습니다 (글 속 [[링크]]는 글을 고쳐야 합니다)",

        ]);
        block("드라이브에도 남습니다", [

  // 연결에 붙일 설명을 묻는다 (취소하면 null)
  var REL_PRESETS = ["여기서 배움", "근거가 됨", "이어지는 이야기", "반대 사례", "같은 주제", "참고 자료"];

  /* =========================================================
     12-1. 관계망 (기록끼리 어떻게 이어져 있는지)
     ========================================================= */
  var TYPE_COLORS = ["#2f5fd6", "#1a9e5f", "#d98324", "#a34fc4", "#d64545", "#0f9aa8", "#8a6d3b", "#5b6bd6"];
  function typeColor(key) {
    var i = 0;
    for (var k = 0; k < settings.types.length; k++) if (settings.types[k].key === key) { i = k; break; }
    return TYPE_COLORS[i % TYPE_COLORS.length];
  }

  /* ---------- 📛 밖에서 넣은 파일 이름 정리 ----------
     드라이브 폴더에 «앱을 안 거치고» 넣은 자료들 · IMG_4821.jpg, 최종본.hwp, 무제.pptx · 
     이름만 봐서는 언제 무엇인지 알 수 없다. 12년치를 끌어오려면 여기가 먼저다.

     하는 일은 «앞에 붙이기» 다. 원래 이름을 지우지 않는다.
       IMG_4821.jpg  →  2026-08-20_수업설계_IMG_4821.jpg
     날짜는 드라이브가 기억하는 «만든 날», 가운데는 «그 파일이 들어 있는 폴더 이름».
     제목을 직접 적으면 원래 이름 대신 그것이 들어간다.

     ⚠️ 파일 ID 는 그대로 두고 이름만 바꾼다. 안에 든 것은 손대지 않는다. */

  var RENAME_DATE_RE = /^\d{4}-\d{2}-\d{2}/;   // 이미 날짜로 시작하면 정리된 것으로 본다

  function looksOrganized(name) {
    return RENAME_DATE_RE.test(String(name || ""));
  }
  function isAppFile(name) {
    var n = String(name || "");
    return n === INDEX_NAME || n === SETTINGS_NAME ||
           OLD_INDEX_NAMES.indexOf(n) >= 0 || OLD_SETTINGS_NAMES.indexOf(n) >= 0;
  }

  function openRenameStudio() {
    if (!connected || !folder.id) { toast("드라이브에 연결한 뒤에 쓸 수 있습니다."); return; }
    closeModal();

    var rows = [];       // { file, checked, titleInput, nameCell }
    var bg = el("div", "modal-bg");
    bg.style.zIndex = "178";
    var m = el("div", "card modal"); m.style.maxWidth = "min(860px, 96vw)";

    var head = el("div", "mhead");
    head.appendChild(el("h3", null, "📛 밖에서 넣은 파일 이름 정리"));
    head.appendChild(el("span", "spacer"));
    var x = el("button", "btn sm ghost", "✕"); x.addEventListener("click", closeModal);
    head.appendChild(x);
    m.appendChild(head);

    var body = el("div", "mbody");
    body.appendChild(el("p", "crophint",
      "이름 앞에 날짜와 폴더 이름을 붙입니다. 원래 이름은 지우지 않습니다."));
    var status = el("div", "desc");
    body.appendChild(status);
    var listBox = el("div", "renamebox");
    body.appendChild(listBox);
    m.appendChild(body);

    var foot = el("div", "mfoot");
    var count = el("span", "desc"); count.style.margin = "0";
    foot.appendChild(count);
    foot.appendChild(el("span", "spacer"));
    var allBtn = el("button", "btn sm", "전부 고르기");
    allBtn.addEventListener("click", function () {
      var on = rows.some(function (r) { return !r.checked; });
      rows.forEach(function (r) { r.checked = on; r.box.checked = on; });
      syncCount();
    });
    var go = el("button", "btn primary", "이름 바꾸기");
    go.addEventListener("click", runRename);
    foot.appendChild(allBtn); foot.appendChild(go);
    m.appendChild(foot);

    bg.appendChild(m);
    bg.addEventListener("click", function (e) { if (e.target === bg) closeModal(); });
    $("modalHost").appendChild(bg);
    modalEl = bg;

    function proposed(r) {
      var f = r.file;
      var day = localDay(f.createdTime) || dateStamp();
      var where = safeName(f._parentName === folder.name ? "" : (f._parentName || ""), 24);
      var title = safeName(r.titleInput.value.trim(), 40) || safeName(stemOf(f.name), 40) || "자료";
      var parts = [day, where, title].filter(Boolean);
      return parts.join("_").replace(/_{2,}/g, "_") + extOf(f.name);
    }
    function syncRow(r) {
      r.nameCell.textContent = proposed(r);
    }
    function syncCount() {
      var n = rows.filter(function (r) { return r.checked; }).length;
      count.textContent = "찾은 파일 " + rows.length + "개 · 고른 것 " + n + "개";
      go.textContent = n ? "이름 바꾸기 (" + n + "개)" : "이름 바꾸기";
      go.disabled = !n;
    }

    function draw(files) {
      listBox.innerHTML = "";
      rows = [];
      if (!files.length) {
        listBox.appendChild(el("p", "desc",
          "정리할 파일이 없습니다. 폴더 안의 자료가 모두 날짜로 시작하고 있습니다."));
        syncCount();
        return;
      }
      files.forEach(function (f) {
        var row = el("div", "renamerow");

        var box = el("input"); box.type = "checkbox"; box.checked = true;
        row.appendChild(box);

        var mid = el("div", "renamemid");
        var was = el("div", "renamewas", f.name);
        was.title = f.name;
        mid.appendChild(was);

        var meta = el("div", "renamemeta",
          (localDay(f.createdTime) || "날짜 모름") +
          (f._parentName && f._parentName !== folder.name ? " · " + f._parentName + "/" : "") +
          (f.size ? " · " + humanSize(Number(f.size)) : ""));
        mid.appendChild(meta);

        var line = el("div", "renameline");
        line.appendChild(el("span", "renamearrow", "→"));
        var nameCell = el("span", "renamenew", "");
        line.appendChild(nameCell);
        mid.appendChild(line);

        var ti = el("input", "inp");
        ti.placeholder = "이 자료의 제목 (비우면 원래 이름을 씁니다)";
        mid.appendChild(ti);

        row.appendChild(mid);
        listBox.appendChild(row);

        var r = { file: f, checked: true, titleInput: ti, nameCell: nameCell, box: box };
        rows.push(r);
        ti.addEventListener("input", function () { syncRow(r); });
        box.addEventListener("change", function () { r.checked = box.checked; syncCount(); });
        syncRow(r);
      });
      syncCount();
    }

    function runRename() {
      var todo = rows.filter(function (r) { return r.checked; });
      if (!todo.length) return;
      go.disabled = true;
      var done = 0, failed = 0;
      todo.reduce(function (chain, r) {
        return chain.then(function () {
          var want = proposed(r);
          status.textContent = "바꾸는 중… " + (done + 1) + "/" + todo.length + "  " + want;
          return uniqueName(want, r.file._parent)
            .then(function (finalName) { return renameFile(r.file.id, finalName); })
            .then(function (ok) {
              if (ok) { done++; r.box.checked = false; r.checked = false; r.nameCell.textContent = "✔ 바꿨습니다"; }
              else failed++;
            })
            .catch(function () { failed++; });
        });
      }, Promise.resolve()).then(function () {
        status.textContent = done + "개를 바꿨습니다." + (failed ? "  " + failed + "개는 실패했습니다." : "");
        toast(done + "개의 이름을 바꿨습니다." + (failed ? " (" + failed + "개 실패)" : ""));
        syncCount();
        go.disabled = false;
      });
    }

    /* ⚠️ 좁은 권한에서는 «손으로 넣은 파일» 이 안 잡힌다. 그런데 이 창이 다루는 것이
       바로 그 파일들이다. 그래서 여기에 고르기 창을 함께 둔다. 한 번 고르면 그 뒤로는 잡힌다. */
    function loadTargets() {
      status.textContent = "드라이브 폴더를 훑는 중…";
      return scanFolder(function (n) { status.textContent = "폴더 " + n + "곳을 훑는 중…"; })
        .then(function (scan) {
          var targets = (scan.files || []).filter(function (f) {
            if (f.mimeType === "application/vnd.google-apps.folder") return false;
            if (isAppFile(f.name)) return false;
            if (looksOrganized(f.name)) return false;
            return true;
          });
          status.textContent = targets.length
            ? ("정리할 수 있는 파일 " + targets.length + "개를 찾았습니다.")
            : "정리할 파일이 안 보입니다. 손으로 넣어 둔 파일이라면 「드라이브에서 파일 고르기」로 한 번 골라 주세요.";
          draw(targets);
        })
        .catch(function (e) {
          status.textContent = "폴더를 훑지 못했습니다: " + errText(e);
        });
    }
    foot.insertBefore(pickMoreBtn("📂 드라이브에서 파일 고르기", loadTargets), allBtn);
    loadTargets();
  }

  /* ---------- 🗂 폴더 구조 · 드라이브가 지금 어떻게 생겼는지 ----------
     탐색기처럼 위에서 아래로 펼쳐 보여 준다. ▸ 를 눌러 접었다 편다.
     그리는 것은 «지금 설정대로 저장하면 드라이브가 이렇게 된다» 이다.
     그래서 폴더 정리 방식을 바꾸면 이 그림도 그 자리에서 바뀐다. */

  // 기록 한 편이 만드는 «글 파일»들 (.md · 구글 문서 · HTML)
  function entryDocFiles(n) {
    var md = n.mdName || mdName(n);
    var out = [{ type: "file", icon: "📝", name: md, entry: n, ord: 0, pending: !n.mdId }];
    if (settings.alsoGdoc) out.push({ type: "file", icon: "📄", name: stemOf(md), entry: n, ord: 1, pending: !n.docId, docId: n.docId });
    if (settings.alsoHtml) out.push({ type: "file", icon: "🌐", name: stemOf(md) + ".html", entry: n, ord: 2, pending: !n.htmlId, fileId: n.htmlId });
    return out;
  }
  // 기록 한 편에 붙은 사진·파일들
  function entryAttachFiles(n) {
    var order = 0, out = [];
    (n.blocks || []).forEach(function (b) {
      if (b.kind !== "image" && b.kind !== "file") return;
      order++;
      out.push({
        type: "file", icon: fileIcon(b.mime, b.original),
        name: b.name || attachName(n, order, b.original || "file", b),
        size: b.size, fileId: b.fileId, pending: !b.fileId, entry: n, ord: 10 + order
      });
    });
    return out;
  }

  /* 드라이브를 «실제로 훑은 결과» 로 나무를 세운다.
     buildDriveTree() 가 색인으로 그린 예상도라면, 이쪽은 지금 드라이브에 있는 그대로다.
     손으로 만든 폴더·앱이 모르는 파일이 여기서는 보인다. */
  function buildLiveTree(scan) {
    var root = { type: "folder", name: (folder.name || "내 폴더"), children: [], isRoot: true, live: true };
    function walkTo(path) {
      var here = root;
      path.forEach(function (name) {
        var found = null;
        for (var i = 0; i < here.children.length; i++) {
          if (here.children[i].type === "folder" && here.children[i].name === name) { found = here.children[i]; break; }
        }
        if (!found) { found = { type: "folder", name: name, children: [] }; here.children.push(found); }
        here = found;
      });
      return here;
    }
    // 빈 폴더까지 보이도록 «지나간 폴더» 를 먼저 다 세운다
    (scan.dirs || []).forEach(function (d) { walkTo(d.path); });
    (scan.files || []).forEach(function (f) {
      var here = walkTo(f._path || []);
      here.children.push({
        type: "file", name: f.name, size: Number(f.size || 0),
        icon: /^image\//.test(f.mimeType || "") ? "img"
            : (/audio|video/.test(f.mimeType || "") ? "media"
            : (/\.md$/i.test(f.name) ? "md" : "file"))
      });
    });
    (function sortTree(node) {
      node.children.sort(function (a, b) {
        if (a.type !== b.type) return a.type === "folder" ? -1 : 1;
        return a.name.localeCompare(b.name, "ko");
      });
      node.children.forEach(function (c) { if (c.type === "folder") sortTree(c); });
    })(root);
    return root;
  }

  function buildDriveTree() {
    var mode = settings.folderMode;
    var root = { type: "folder", name: (folder.name || "내 폴더"), children: [], isRoot: true };

    function sub(name) {
      for (var i = 0; i < root.children.length; i++) {
        if (root.children[i].type === "folder" && root.children[i].name === name) return root.children[i];
      }
      var f = { type: "folder", name: name, children: [] };
      root.children.push(f);
      return f;
    }

    entries.forEach(function (n) {
      var docs = entryDocFiles(n), atts = entryAttachFiles(n);

      if (mode === "flat") { root.children = root.children.concat(docs, atts); return; }

      if (mode === "materials") {
        root.children = root.children.concat(docs);
        if (atts.length) sub(settings.materialsFolderName || "자료").children.push.apply(
          sub(settings.materialsFolderName || "자료").children, atts);
        return;
      }
      if (mode === "monthly") {
        var mf = sub(dateStamp(n.createdAt).slice(0, 7));
        mf.children = mf.children.concat(docs, atts);
        return;
      }
      if (mode === "tag") {
        var tf = sub(primaryTagFolder(n));
        tf.children = tf.children.concat(docs, atts);
        // 두 번째 태그부터는 바로가기(표지판)만 놓인다
        var tags = (n.tags || []).filter(Boolean).map(function (t) { return safeName(String(t), 60); });
        tags.slice(1).filter(function (t, i, a) { return a.indexOf(t) === i; }).forEach(function (t) {
          sub(t).children.push({
            type: "file", icon: "🔗", shortcut: true, ord: 0,
            name: n.mdName || mdName(n), entry: n, pending: !n.mdId
          });
        });
        return;
      }
      // 기록마다 폴더 하나
      var ef = sub(n.folderName || entryFolderName(n));
      ef.children = ef.children.concat(docs, atts);
    });

    root.children.push({ type: "file", icon: "🗃️", name: INDEX_NAME, system: true });
    root.children.push({ type: "file", icon: "🗃️", name: SETTINGS_NAME, system: true });

    sortChildren(root);

  /* 폴더 먼저. 그다음은 «한 기록의 파일끼리 붙여 두는 것» 이 제일 중요하다.
     이름순으로 늘어놓으면 글과 그 글의 사진이 서로 떨어져 무엇이 한 벌인지 안 보인다.
     그래서 최근 기록부터, 그 안에서는 글 → 구글문서 → HTML → 사진·파일 차례로. */
  function sortChildren(node) {
    var dateish = function (s) { return /^\d{4}-\d{2}/.test(s); };
    node.children.sort(function (a, b) {
      if ((a.type === "folder") !== (b.type === "folder")) return a.type === "folder" ? -1 : 1;
      if (a.type === "folder") {
        if (dateish(a.name) && dateish(b.name)) return b.name.localeCompare(a.name);
        return a.name.localeCompare(b.name, "ko");
      }
      if (!!a.system !== !!b.system) return a.system ? 1 : -1;      // 색인 파일은 맨 아래
      if (a.entry && b.entry) {
        if (a.entry.id !== b.entry.id) {
          return String(b.entry.createdAt || "").localeCompare(String(a.entry.createdAt || ""));
        }
        return (a.ord || 0) - (b.ord || 0);
      }
      return a.name.localeCompare(b.name, "ko");
    });
    node.children.forEach(function (c) { if (c.type === "folder") sortChildren(c); });
  }

    var showTags = false, showLabels = true, query = "";

          edges.push({ a: byId[n.id], b: byId[l.to], kind: "link", label: l.label || "", via: l.via });

          });

    /* ---- 물리 계산 ---- */
    function tick() {
      var w = canvas.clientWidth, h = canvas.clientHeight, cx = w / 2, cy = h / 2;

    /* ---- 그리기 ---- */
    var scale = 1, panX = 0, panY = 0, dragNode = null, panning = false;
    var lastPt = null, downPt = null, moved = 0;

    // 캔버스 픽셀 크기가 화면 크기와 어긋나면 그림이 눌리고 클릭 위치도 틀어진다
    function resize() {

      var w = Math.round(canvas.clientWidth * dpr), h = Math.round(canvas.clientHeight * dpr);

    }
    function draw() {
      resize();   // 모달 크기가 뒤늦게 잡히는 경우까지 매 프레임 확인

      function radiusOf(n) { return (n.kind === "tag" ? 4 : 6) + Math.min(9, n.deg * 1.3); }
      // 선택한 점과 이웃을 강조
      var near = {};

          var dn = el("button", "btn xs", "↓"); dn.disabled = i === draft.types.length - 1;
          dn.addEventListener("click", function () { var x = draft.types[i + 1]; draft.types[i + 1] = t; draft.types[i] = x; paintList(); });

    /* 📛 파일 이름 · 조각 다섯을 켜고 끈다.
       예전에는 프리셋 스물하나가 든 목록에 «직접 만들기» 칸과 토큰 단추 열하나가 붙어 있었다.
       이름 규칙을 조립하러 이 화면에 오는 사람은 없다. 무엇이 이름에 들어갈지만 정하면 된다.
       고른 것은 그대로 남는다 · 설정에 규칙 문자열로 적히기 때문이다. */
    function previewRow(label, value) {
      var r = el("div");
      r.style.cssText = "display:flex;gap:10px;align-items:baseline;";
      var l = el("span", null, label);
      l.style.cssText = "min-width:64px;flex:0 0 auto;opacity:.75;";
      r.appendChild(l);
      r.appendChild(el("span", null, value));
      return r;
    }
    function makeNameField() {
      var f = el("div", "field");
      f.appendChild(el("label", null, "파일 이름에 무엇을 넣을까요?"));
      var on = namePartsOf(draft);
      var rows = el("div");
      var pv = el("div", "preview");
      f.appendChild(rows); f.appendChild(pv);

      function paintRows() {
        rows.innerHTML = "";
        /* 글 이름에 들어갈 수 있는 것은 날짜·태그·제목 셋뿐이다 (자료 제목·번호는 사진·파일에만).
           그 셋을 다 끄면 글은 지을 이름이 없어 모두 «무제.md» 가 된다. 그래서 마지막 하나는
           «셋 가운데서» 잠근다. 다섯 가운데서 세면, 자료 제목만 남겨 놓고 셋을 다 끌 수 있어
           앱이 몰래 {제목} 을 도로 세우고, 다시 열면 끈 것이 켜져 있게 된다. */
        var liveMd = NAME_PARTS.filter(function (p) { return p.md && on[p.key]; }).length;
        NAME_PARTS.forEach(function (p) {
          var lab = el("label");
          lab.style.cssText = "display:flex;gap:9px;align-items:center;margin:7px 0;font-size:calc(13.5px * var(--fs));";
          var cb = el("input"); cb.type = "checkbox"; cb.checked = !!on[p.key];
          cb.style.cssText = "width:17px;height:17px;flex:0 0 auto;";
          // 하나만 남았으면 그것까지는 못 끈다. 말로 막지 않고 «못 누르게» 해서 보인다
          cb.disabled = !!on[p.key] && p.md && liveMd === 1;
          cb.addEventListener("change", function () {
            on[p.key] = cb.checked;
            var made = patternsFromParts(on);
            draft.mdPattern = made.mdPattern;
            draft.filePattern = made.filePattern;
            paintRows(); paintPreview();
          });
          lab.appendChild(cb);
          var nm = el("span", null, p.label);
          nm.style.cssText = "min-width:64px;font-weight:600;";
          lab.appendChild(nm);
          var ex = el("span", "mono", p.sample);
          ex.style.cssText = "color:var(--ink-soft);min-width:110px;";
          lab.appendChild(ex);
          if (!p.md) {
            var only = el("span", null, "사진·파일에만");
            only.style.cssText = "font-size:calc(11.5px * var(--fs));color:var(--ink-soft);";
            lab.appendChild(only);
          }
          rows.appendChild(lab);
        });
      }
      function paintPreview() {
        pv.innerHTML = "";
        pv.appendChild(previewRow("글", patternPreview(draft.mdPattern, true)));
        pv.appendChild(previewRow("사진·파일", patternPreview(draft.filePattern, false)));
      }
      paintRows(); paintPreview();
      return f;
    }

    /* 조각 밖의 규칙(«{폴더명}_{유형}_{원본이름}» 같은 것)을 쓰고 있는 사람.
       ⚠️ 말없이 갈아 치우면 다음 저장부터 파일 이름이 통째로 달라진다.
          지금 쓰는 것을 그대로 보여 주고, 바꿀지는 사람이 정한다. */
    function makeOldNameField() {
      var f = el("div", "field");
      f.appendChild(el("label", null, "지금 쓰는 이름 규칙"));

      f.appendChild(previewRow("사진·파일", draft.filePattern));
      var pv = el("div", "preview");
      pv.appendChild(previewRow("글", patternPreview(draft.mdPattern, true)));
      pv.appendChild(previewRow("사진·파일", patternPreview(draft.filePattern, false)));
      f.appendChild(pv);
      var btn = el("button", "btn sm", "간단한 방식으로 바꾸기");
      btn.type = "button";
      btn.addEventListener("click", function () {
        var made = patternsFromParts(namePartsOf(draft));
        draft.mdPattern = made.mdPattern;
        draft.filePattern = made.filePattern;
        paint();
      });
      f.appendChild(el("p", "desc", "⚠️ 바꾸면 앞으로 저장되는 이름이 달라집니다. 이미 있는 파일은 그대로입니다."));
      f.appendChild(btn);
      return f;
    }

    function paintNaming() {

       ["alsoHtml", "🌐 HTML 파일로도 저장", "브라우저로 열어 보거나 그대로 웹에 올릴 수 있습니다."]

  // 화면 아무 데서나 Ctrl+V 로 이미지 붙여넣기 (글 칸에 커서가 없어도)
  document.addEventListener("paste", function (e) {
    var t = e.target;
    if (t && (t.tagName === "TEXTAREA" || t.tagName === "INPUT")) return;  // 글 칸은 각자 처리
    if (e.defaultPrevented || (paper && t && paper.contains(t))) return;    // 종이는 제 손으로 받는다 · 두 번 넣지 않게
    if (modalEl) return;
    var items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    var files = [];
    for (var i = 0; i < items.length; i++) {
      if (items[i].kind === "file") { var f = items[i].getAsFile(); if (f) files.push(f); }
    }
    if (!files.length) return;
    e.preventDefault();
    acceptFiles(files);
  });

  // 화면 어디에 놓아도 첨부되도록 (파일을 끌어올 때만 반응)
  var dragDepth = 0;
  function draggingFiles(e) {
    var t = e.dataTransfer && e.dataTransfer.types;
    if (!t) return false;
    for (var i = 0; i < t.length; i++) if (t[i] === "Files") return true;
    return false;
  }
  function showDrop(on) {
    $("dropOverlay").classList.toggle("hidden", !on);
    $("addbar").classList.toggle("hover", on);
  }
  window.addEventListener("dragenter", function (e) {
    if (!draggingFiles(e)) return;
    e.preventDefault(); dragDepth++; showDrop(true);
  });
  window.addEventListener("dragover", function (e) {
    if (!draggingFiles(e)) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = "copy";
  });
  window.addEventListener("dragleave", function (e) {
    if (!draggingFiles(e)) return;
    dragDepth = Math.max(0, dragDepth - 1);
    if (!dragDepth) showDrop(false);
  });
  window.addEventListener("drop", function (e) {
    dragDepth = 0; showDrop(false);
    if (!e.dataTransfer || !e.dataTransfer.files || !e.dataTransfer.files.length) return;
    e.preventDefault();
    /* 종이 위에 놓았으면 «놓은 그 자리» 에 들어간다. 종이 밖이면 커서 자리(없으면 맨 끝) */
    if (paper && paper.contains(e.target)) {
      var pr = document.caretRangeFromPoint ? document.caretRangeFromPoint(e.clientX, e.clientY) : null;
      if (pr) { paper.focus({ preventScroll: true }); var ps = window.getSelection(); ps.removeAllRanges(); ps.addRange(pr); }
    }
    acceptFiles(e.dataTransfer.files);
  });

    if (scrim) scrim.classList.remove("hidden");
  });
  /* 폰에서는 보기 줄을 감췄다 · 대신 «다음 보기로 넘긴다». 넷뿐이라 돌려 쓰면 된다 */
  function viewLabelNow() {
    var v = VIEW_MODES.filter(function (x) { return !x.modal && x.key === settings.viewMode; })[0];
    return "지금 · " + (v ? v.label : "나열");
  }
  function cycleView() {
    var list = VIEW_MODES.filter(function (x) { return !x.modal; });
    var i = 0;
    list.forEach(function (x, k) { if (x.key === settings.viewMode) i = k; });
    settings.viewMode = list[(i + 1) % list.length].key;
    saveSettingsLocal();
    render();
    toast("보기 · " + list[(i + 1) % list.length].label);
  }
  $("dockMore").addEventListener("click", function (e) {
    e.stopPropagation();
    openMenu($("dockMore"), [
      { label: "📋 양식으로 시작", note: (settings.templates || []).map(function (t) { return t.name; }).join(" · ") || "설정에서 만듭니다",
        run: function () { var t = (settings.templates || [])[0]; if (t) startFromTemplate(t); else toast("아직 만들어 둔 양식이 없습니다."); } },
      { label: "📂 새 폴더 만들어 쓰기…", run: function () { createDeskFolder(); } },
      { label: "🏠 기본 자리에 쓰기", run: function () { setDesk(null); renderSideNav(); renderDeskLine(); } },
      "-",
      { label: "👁 보기 바꾸기", note: viewLabelNow(), run: function () { cycleView(); } },
      { label: "🗂 폴더 구조", run: function () { $("btnMap").click(); } },
      { label: "🕸️ 관계망", run: function () { $("btnGraph").click(); } },
      { label: "📚 엮어내기", run: function () { $("btnCompile").click(); } },
      "-"
    ].concat(topMenuItems()));
  });
  $("search").addEventListener("input", function () { searchQ = this.value.trim(); render(); });
  $("btnCompile").addEventListener("click", openCompile);
  document.addEventListener("keydown", function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); saveEntry(); }
    /* 되돌리기 · Ctrl+Z, 다시 하기 · Ctrl+Shift+Z (Ctrl+Y 도 받는다).
       ⚠️ 제목·태그 칸이나 덩어리 안 입력칸에서는 손대지 않는다 · 거기는 브라우저가 더 잘한다.
          종이 위에서만 우리 것을 쓴다 · 사진·녹음까지 같이 되돌리려면 그래야 한다. */
    if ((e.ctrlKey || e.metaKey) && !e.altKey && /^[zyZY]$/.test(e.key)) {
      var t = e.target;
      var inField = !!(t && t.closest && t.closest("input, textarea"));
      var inLayer = !!(t && t.closest && t.closest(".modal-bg, .viewer, .lightbox"));
      var onPaper = !!(paper && t && (t === paper || (paper.contains && paper.contains(t))));
      /* ⚠️ 사진 단추를 누른 «직후» 는 초점이 종이가 아니라 단추나 몸통에 있다.
         거기서 Ctrl+Z 가 안 먹으면 「사진 넣고 바로 되돌리기」 가 안 된다 · 그때가 제일 급한데.
         칸 안(입력칸)과 뜬 창만 비켜 가고, 나머지 자리에서는 종이를 되돌린다. */
      var loose = !inField && !inLayer && !composerFolded &&
                  (!t || t === document || t === document.body || t === document.documentElement ||
                   (t.closest && !!t.closest(".composer")));
      if (!inField && !inLayer && (onPaper || loose)) {
        e.preventDefault();
        var redo = (e.key === "y" || e.key === "Y") || e.shiftKey;
        if (redo) redoPaper(); else undoPaper();
        return;
      }
    }
    if (e.key === "Escape" && document.querySelector(".lightbox")) return;  // 사진 창이 먼저 닫힌다
    if (e.key === "Escape" && modalEl) closeModal();
    else if (e.key === "Escape" && viewerEl) closeViewer();
  });

  /* ---------- 모바일 ↔ PC 자동 동기화 ----------
     휴대폰에서 쓰고 PC로 돌아오면(=탭이 다시 보이면) 알아서 최신을 끌어옵니다. */
  var lastSyncAt = 0, syncing = false;
  function setSyncPill(text, busy) {
    var p = $("syncPill");
    p.textContent = text || "";
    p.className = "syncpill" + (busy ? " busy" : "");
  }
  function syncedAgo() {
    if (!connected) return "";
    if (!lastSyncAt) return "";
    var s = Math.round((Date.now() - lastSyncAt) / 1000);
    if (s < 60) return "☁ 방금 동기화";
    if (s < 3600) return "☁ " + Math.round(s / 60) + "분 전 동기화";
    return "☁ " + Math.round(s / 3600) + "시간 전 동기화";
  }
  function autoSync(force) {
    if (!connected || syncing) return Promise.resolve();
    if (!force && Date.now() - lastSyncAt < 20000) return Promise.resolve();
    if (!navigator.onLine) { setSyncPill("⚠ 오프라인"); return Promise.resolve(); }
    syncing = true;
    setSyncPill("↻ 동기화 중…", true);
    return loadIndex()
      .then(function (remote) {
        absorbIndex(remote);
        saveLocal(); render();
        return syncPending();
      })
      .then(function () {
        lastSyncAt = Date.now(); syncing = false; setSyncPill(syncedAgo());
      })
      .catch(function () {
        syncing = false; setSyncPill("⚠ 동기화 실패");
      });
  }
  document.addEventListener("visibilitychange", function () { if (!document.hidden) autoSync(); });
  window.addEventListener("focus", function () { autoSync(); });
  window.addEventListener("online", function () { autoSync(true); });
  setInterval(function () { if (!syncing) setSyncPill(syncedAgo()); }, 30000);

  /* =========================================================
     14. 시작
     ========================================================= */
  /* 고른 모양을 먼저 입힌다. 그려 놓고 나중에 입히면 첫 화면이 한 번 «번쩍» 한다. */
  applyTheme(settings.theme || "base");

  renderTypeChips();
  initPaper();
  renderBlocks();
  render();
  updateChrome();

  /* 처음 온 사람에게 모양을 묻던 창은 걷어냈다. 모양은 레고 하나라 물을 것이 없다.
     색감·밝기·글자는 설정 → 모양에 있다. */

  rehydratePending();   // 지난번에 못 올린 사진·파일 되살리기
  restoreDraft();   // 쓰다 만 내용 되살리기
  intakeShared();   // 밖에서 «공유»·«웹 캡처» 로 보낸 것 받기 (쓰던 글 뒤에 이어 붙는다)

  /* ---------- 앱으로 설치 (PWA) ----------
     서비스 워커는 index.html 을 캐시하지 않는다. 고치면 바로 반영돼야 하기 때문. */
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () { /* 설치 안 돼도 앱은 그대로 쓴다 */ });
    });
  }
  (function () {
    var btn = $("btnInstall");
    if (!btn) return;
    var prompt = null;
    // 이미 앱으로 열려 있으면 버튼을 보일 이유가 없다
    var standalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
    window.addEventListener("beforeinstallprompt", function (e) {
      if (standalone) return;
      e.preventDefault();
      prompt = e;
      btn.style.display = "";
    });
    btn.addEventListener("click", function () {
      if (!prompt) return;
      prompt.prompt();
      prompt.userChoice.then(function () { prompt = null; btn.style.display = "none"; });
    });
    window.addEventListener("appinstalled", function () {
      prompt = null; btn.style.display = "none";
      toast("앱으로 설치했습니다. 바탕화면에서 열 수 있습니다.");
    });
  })();

  /* 넣기 줄에 «가는 선» 아이콘을 붙인다.
     그림글자(이모지)는 기기마다 다른 그림이 나오고 색도 우리 색을 안 따라온다.
     선 아이콘은 글자와 같은 색으로 서서, 어느 색감·밝기에도 어울린다. */
  (function () {
    Array.prototype.forEach.call(document.querySelectorAll("#addbar [data-add]"), function (b) {
      if (b.querySelector("svg") || b.classList.contains("noico")) return;
      var label = b.textContent.trim();
      b.textContent = "";
      b.appendChild(fileIconSvg(b.getAttribute("data-add")));
      b.appendChild(el("span", "addlabel2", label));
    });
  })();

  // 기기에 맞는 버튼 이름
  (function () {
    var b = document.querySelector('[data-add="capture"]');
    // 글자만 바꾼다. 앞의 선 아이콘은 그대로 두어야 한다.
    if (b && isTouchDevice()) {
      var lab = b.querySelector(".addlabel2");
      if (lab) lab.textContent = "캡처·촬영"; else b.textContent = "캡처·촬영";
    }
  })();

  // 화면을 돌리거나 창을 줄이면 머리줄 글자도 그에 맞춘다
  (function () {
    var was = window.innerWidth <= 560, t = null;
    window.addEventListener("resize", function () {
      clearTimeout(t);
      t = setTimeout(function () {
        var now = window.innerWidth <= 560;
        if (now !== was) { was = now; updateChrome(); }
      }, 150);
    });
  })();

  if (clientId && folder.id && localStorage.getItem(LS.connected) === "1") {
    /* 지난번 토큰이 아직 살아 있으면 그대로 이어 쓴다.
       구글에 다시 물어보지 않으니 새로고침해도 «로그인 화면» 이 안 뜬다. */
    var kept = loadToken();
    if (kept) { accessToken = kept; userEmail = localStorage.getItem(LS.email) || ""; }

    var wait = setInterval(function () {
      if (!kept && !gisReady()) return;
      clearInterval(wait);
      (kept ? Promise.resolve(kept) : requestToken(false)).then(ensureAccount)
        .then(function () { return verifyFolder(folder.id); })
        .then(function (f) {
          folder = { id: f.id, name: f.name, link: f.link };
          connected = true; updateChrome();
          return loadSettingsRemote();
        })
        .then(function (rs) {
          if (rs) { settings = normalizeSettings(rs); saveSettingsLocal(); renderTypeChips(); }
          return loadIndex();
        })
        .then(function (remote) {
          absorbIndex(remote);
          saveLocal(); render(); updateChrome();
          return syncPending();
        })
        .then(function () { lastSyncAt = Date.now(); setSyncPill(syncedAgo()); })
        .catch(function () {
          /* 예전에는 여기서 아무 말 없이 끝났다. 그래서 «그냥 로그아웃» 처럼 보였다.
             이제는 «한 번 눌러 다시 연결» 띠를 띄운다. */
          needReconnect = true;
          clearToken();
          updateChrome();
        });
    }, 300);
    setTimeout(function () {
      clearInterval(wait);
      if (!connected) { needReconnect = true; updateChrome(); }
    }, 8000);
  }
})();
</script>
</body>
</html>

           background: #1b2130; color: #fff; padding: 11px 18px; border-radius: 10px; font-size: calc(14px * var(--fs));
           opacity: 0; pointer-events: none; transition: .22s; z-index: 210; max-width: 90vw; box-shadow: 0 8px 30px rgba(0,0,0,.25); }
           /* 210 인 이유: 「전체 보기」(140)·사진 창(160)·공유 창(170) 위에서도 알림이 보여야 한다 */
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #progress { position: fixed; left: 0; top: 0; height: 3px; background: var(--brand); width: 0; transition: width .3s; z-index: 200; }

  /* ---------- 모달 ---------- */
  .modal-bg { position: fixed; inset: 0; background: rgba(15,20,35,.55); z-index: 90;
              display: flex; align-items: center; justify-content: center; padding: 16px; }
  .modal { max-width: 620px; width: 100%; max-height: 88vh; display: flex; flex-direction: column; }
  .modal .mhead { display: flex; align-items: center; gap: 8px; padding: 15px 18px; border-bottom: 1px solid var(--line);
                  flex: 0 0 auto; }
  .modal .mhead h3 { margin: 0; font-size: calc(17px * var(--fs)); }
  /* ⚠️ min-height: 0 이 없으면 몸통이 «내용만큼» 자리를 차지하겠다고 버틴다.
     그러면 바닥줄이 창 밖으로 밀려나 목록 위에 겹쳐 보인다 (엮어내기 창이 그랬다).
     flex 안에서 스크롤 되는 칸은 반드시 이 둘을 함께 줘야 한다. */
  .modal .mbody { padding: 18px; overflow: auto; flex: 1 1 auto; min-height: 0; }
  .modal .mfoot { display: flex; gap: 8px; padding: 13px 18px; border-top: 1px solid var(--line); align-items: center;
                  flex: 0 0 auto; flex-wrap: wrap; }
  .tabs { display: flex; gap: 4px; padding: 10px 18px 0; flex-wrap: wrap; }
  .tab { border: none; background: transparent; color: var(--ink-soft); font-weight: 700; font-size: calc(13.5px * var(--fs));
         padding: 7px 12px; border-radius: 9px 9px 0 0; border-bottom: 2px solid transparent; }
  .tab.on { color: var(--brand); border-bottom-color: var(--brand); background: var(--brand-soft); }

  .typerow { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
  .typerow .ic { width: 52px; text-align: center; flex: 0 0 auto; }
  .typerow .nm { flex: 1 1 auto; }
  .tokens { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 6px; }
  .token { font-size: calc(12px * var(--fs)); border: 1px solid var(--line); background: var(--bg); border-radius: 7px; padding: 2px 8px; font-family: ui-monospace, Consolas, monospace; }
  .preview { margin-top: 8px; padding: 9px 11px; border-radius: 9px; background: var(--brand-soft); font-family: ui-monospace, Consolas, monospace; font-size: calc(12.5px * var(--fs)); word-break: break-all; color: var(--brand); }

  .steps { font-size: calc(13px * var(--fs)); color: var(--ink-soft); padding-left: 18px; margin: 8px 0 0; }
  .steps li { margin-bottom: 4px; }

  /* ---------- 위키링크 [[제목]] ---------- */
  .wikilink {
    color: var(--brand); text-decoration: none; border-bottom: 1px solid transparent;
    background: var(--brand-soft); padding: 0 4px; border-radius: 5px; cursor: pointer;
  }
  .wikilink:hover { border-bottom-color: var(--brand); }
  .wikilink.missing { color: var(--warn); background: transparent; border: 1px dashed var(--warn); opacity: .85; }
  /* [[ 기록 고르기와 / 넣기 메뉴가 같은 옷을 입는다 */
  #wikiPop, #slashPop {
    position: absolute; z-index: 60; min-width: 220px; max-width: 340px; max-height: 260px; overflow: auto;
    background: var(--panel); border: 1px solid var(--brand); border-radius: 10px;
    box-shadow: var(--shadow); padding: 4px;
  }
  #wikiPop .wp, #slashPop .wp {
    display: block; width: 100%; text-align: left; border: none; background: transparent; color: var(--ink);
    padding: 7px 9px; border-radius: 7px; font-size: calc(13.5px * var(--fs)); font-family: inherit;
  }
  #wikiPop .wp.on, #wikiPop .wp:hover, #slashPop .wp.on, #slashPop .wp:hover { background: var(--brand-soft); color: var(--brand); }
  #wikiPop .wp small { display: block; color: var(--ink-soft); font-size: calc(12px * var(--fs)); }
  #wikiPop .wp.on small, #wikiPop .wp:hover small { color: inherit; }
  #wikiPop .cap, #slashPop .cap { font-size: calc(12px * var(--fs)); color: var(--ink-soft); padding: 5px 9px 3px; }

  /* ---------- 연결(백링크) 줄 ---------- */
  .rel { margin-top: 11px; padding-top: 10px; border-top: 1px dashed var(--line); }
  .rel .relhead { font-size: calc(12px * var(--fs)); color: var(--ink-soft); font-weight: 700; margin-bottom: 6px; }
  .rel .relchips { display: flex; gap: 5px; flex-wrap: wrap; }
  .relchip {
    font-size: calc(12.5px * var(--fs)); border: 1px solid var(--line); background: var(--bg); color: var(--ink);
    border-radius: 999px; padding: 3px 10px; cursor: pointer; max-width: 100%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .relchip:hover { border-color: var(--brand); color: var(--brand); }
  .relchip.out::before { content: "→ "; color: var(--ink-soft); }
  .relchip.in::before { content: "← "; color: var(--ink-soft); }
  .relchip.missing { border-style: dashed; color: var(--warn); }
  .entry.flash { animation: flash 1.4s ease-out; }
  @keyframes flash { 0% { box-shadow: 0 0 0 3px var(--brand); } 100% { box-shadow: var(--shadow); } }

  /* ---------- 관계망 ---------- */
  .graphmodal { max-width: min(1100px, 96vw); height: min(86vh, 820px); }
  .graphmodal .mbody { padding: 0; flex: 1 1 auto; position: relative; overflow: hidden; }
  #graphCanvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #graphCanvas.grabbing { cursor: grabbing; }
  .graphtools {
    position: absolute; left: 10px; top: 10px; display: flex; gap: 6px; flex-wrap: wrap;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 6px; box-shadow: var(--shadow);
    max-width: calc(100% - 20px);
  }
  .graphtools .inp { width: 150px; padding: 5px 9px; }
  .graphlegend {
    position: absolute; right: 10px; bottom: 10px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 8px 10px; box-shadow: var(--shadow); font-size: calc(12px * var(--fs)); max-width: 190px;
  }
  .graphlegend .lg { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; }
  .graphlegend .dot { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; }
  .graphempty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
                text-align: center; color: var(--ink-soft); font-size: calc(14px * var(--fs)); padding: 30px; }

  /* ---------- 영상·소리 미리보기 ---------- */
  .media video, .media audio { width: 200px; border-radius: 8px; background: #000; }
  .media audio { background: transparent; }
  .content video { max-width: 100%; max-height: 360px; border-radius: 10px; background: #000; display: block; border: 1px solid var(--line); }
  .content audio { width: 100%; max-width: 420px; display: block; }
  .driveframe { width: 100%; aspect-ratio: 16/9; border: 1px solid var(--line); border-radius: 10px; background: #000; }
  .playbtn {
    display: flex; align-items: center; gap: 10px; width: 100%; max-width: 420px;
    border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 12px 14px;
    color: var(--ink); font-size: calc(13.5px * var(--fs)); text-align: left;
  }
  .playbtn:hover { border-color: var(--brand); color: var(--brand); }
  .playbtn .pi { font-size: calc(26px * var(--fs)); line-height: 1; }
  .playbtn small { display: block; color: var(--ink-soft); font-size: calc(12px * var(--fs)); }

  /* ---------- 사진 여러 장 · 슬라이드 ---------- */
  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; margin: 0 0 10px; }
  .gallery button { padding: 0; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--bg); position: relative; aspect-ratio: 1; }
  .gallery button:hover { border-color: var(--brand); }
  .gallery img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .gallery .more { position: absolute; inset: 0; background: rgba(15,20,35,.62); color: #fff;
                   display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: calc(17px * var(--fs)); }
  .galcap { font-size: calc(12px * var(--fs)); color: var(--ink-soft); margin: -4px 0 10px; }

  /* 사진 창은 무엇보다 위에. (전체 보기가 140 이라 130 이면 그 뒤에 깔린다) */
  .lightbox { position: fixed; inset: 0; z-index: 160; background: rgba(8,10,18,.94);
              display: flex; flex-direction: column; touch-action: none; }
  .lb-fail { color: #f3c6c6; font-size: calc(14px * var(--fs)); text-align: center; padding: 20px; line-height: 1.7; }
  .lb-top { display: flex; align-items: center; gap: 10px; padding: 12px 14px; color: #e8ecf4; font-size: calc(13.5px * var(--fs)); }
  .lb-top .spacer { flex: 1 1 auto; }
  .lb-count { font-variant-numeric: tabular-nums; opacity: .8; }
  .lb-btn { background: rgba(255,255,255,.12); border: none; color: #fff; border-radius: 9px;
            padding: 8px 12px; font-size: calc(14px * var(--fs)); font-weight: 700; }
  .lb-btn:hover { background: rgba(255,255,255,.24); }
  .lb-stage { flex: 1 1 auto; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .lb-stage img { max-width: 94%; max-height: 100%; object-fit: contain; border-radius: 6px; user-select: none; -webkit-user-drag: none; }
  .lb-nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,.14);
            border: none; color: #fff; font-size: calc(26px * var(--fs)); width: 46px; height: 66px; border-radius: 10px; }
  .lb-nav:hover { background: rgba(255,255,255,.28); }
  .lb-nav.prev { left: 10px; } .lb-nav.next { right: 10px; }
  .lb-nav:disabled { opacity: .2; }
  .lb-cap { padding: 10px 16px 16px; color: #cbd5e1; font-size: calc(13px * var(--fs)); text-align: center; min-height: 20px; }
  .lb-strip { display: flex; gap: 6px; padding: 0 12px 14px; overflow-x: auto; justify-content: center; }
  .lb-strip img { width: 54px; height: 54px; object-fit: cover; border-radius: 7px; opacity: .45; cursor: pointer; border: 2px solid transparent; }
  .lb-strip img.on { opacity: 1; border-color: #7d9dff; }
  @media (max-width: 700px) { .lb-nav { width: 38px; height: 56px; font-size: calc(22px * var(--fs)); } .lb-strip { display: none; } }

  /* ---------- 코드 삽입 ---------- */
  /* 삽입한 페이지는 모서리를 끌어 크기를 바꿀 수 있게 한다 */
  .embedbox { position: relative; width: 100%; margin: 0 0 6px; padding-bottom: 15px;
              resize: vertical; overflow: hidden; min-height: 120px;
              border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
  .embedbox > iframe.embedframe { width: 100%; height: 100%; border: none; border-radius: 10px 10px 0 0; display: block; }
  .embedhint { font-size: calc(12px * var(--fs)); color: var(--ink-soft); margin: -2px 0 10px; }
  /* 보드(카드)에서는 삽입한 페이지가 미리보기를 다 차지하지 않게 줄여 둔다.
     원래 크기로 보려면 「전체 보기」에서. */
  #list .entry .content .embedbox { max-height: 170px; }
  #list .entry .content .embedhint { display: none; }
  /* ⚠️ 카드 안 미리보기는 «보기만» 하는 자리다. 안에서 또 굴러가면
     목록을 넘기려던 손가락이 남의 페이지를 굴리고, 카드마다 굴림 막대가
     하나씩 더 서서 화면이 시끄러워진다. 굴림을 끄고 손도 안 타게 둔다.
     크게 보고 만지는 것은 「전체 보기」에서 한다. */
  .embedbox.still { resize: none; overflow: hidden; padding-bottom: 0; }
  .embedbox.still > iframe.embedframe { border-radius: 10px; pointer-events: none; }
  /* 좁은 칸에서 삽입한 페이지를 대신하는 한 줄 · 넓은 자리에서는 진짜가 뜨므로 숨는다 */
  .embedline { display: none; font-size: calc(12.5px * var(--fs)); color: var(--ink-soft);
               border: 1px dashed var(--line); border-radius: 8px; padding: 5px 9px; }
  .embedframe { width: 100%; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); display: block; }
  .block.embed textarea { font-size: calc(12.5px * var(--fs)); }


  /* ---------- 엮어내기 (고른 기록 → 한 권) ---------- */
  .picklist { max-height: 300px; overflow: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
  .pickrow { display: flex; align-items: center; gap: 8px; padding: 8px 11px; border-bottom: 1px solid var(--line-soft);
             font-size: calc(13.5px * var(--fs)); cursor: pointer; }
  .pickrow:last-child { border-bottom: none; }
  .pickrow:hover { background: var(--panel); }
  .pickrow input { width: 17px; height: 17px; flex: 0 0 auto; }
  .pickrow .pico { flex: 0 0 auto; }
  .pickrow .pttl { flex: 1 1 auto; min-width: 0; font-weight: 600;
                   white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pickrow .pmeta { flex: 0 0 auto; font-size: calc(12px * var(--fs)); color: var(--ink-soft); }
  .optrow { display: flex; align-items: flex-start; gap: 9px; padding: 7px 2px; cursor: pointer; font-size: calc(13.5px * var(--fs)); }
  .optrow input { width: 17px; height: 17px; margin-top: 2px; flex: 0 0 auto; }
  .optrow small { display: block; color: var(--ink-soft); font-size: calc(12px * var(--fs)); font-weight: 400; margin-top: 1px; }

  /* ---------- 링크 미리보기 ---------- */
  .linkcard { display: flex; gap: 10px; align-items: center; max-width: 100%;
              border: 1px solid var(--line); border-radius: 11px; padding: 8px 11px;
              background: var(--bg); text-decoration: none; color: var(--ink); margin: 0 0 8px; }
  .linkcard:hover { border-color: var(--brand); }
  .linkcard .lc-ico { width: 30px; height: 30px; flex: 0 0 auto; border-radius: 7px;
                      object-fit: contain; background: var(--panel); padding: 3px; }
  .linkcard .lc-body { min-width: 0; flex: 1 1 auto; }
  .linkcard .lc-title { font-size: calc(13.5px * var(--fs)); font-weight: 700; line-height: 1.4;
                        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .linkcard .lc-host { font-size: calc(12px * var(--fs)); color: var(--ink-soft);
                       white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .linkcard .lc-thumb { width: 92px; height: 58px; flex: 0 0 auto; border-radius: 8px;
                        object-fit: cover; background: var(--line-soft); }
  @media (max-width: 700px) { .linkcard .lc-thumb { width: 68px; height: 44px; } }

  /* ---------- 전체 보기 (한 편을 통째로 읽는 화면) ---------- */
  .viewer { position: fixed; inset: 0; z-index: 140; background: var(--bg); display: flex; flex-direction: column; }
  .vtop { display: flex; align-items: center; gap: 7px; flex-wrap: wrap;
          padding: 10px 14px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .vtop .spacer { flex: 1 1 auto; }
  .vscroll { flex: 1 1 auto; overflow: auto; }
  .vpaper { max-width: 800px; margin: 24px auto 64px; background: var(--panel);
            border: 1px solid var(--line); border-radius: 14px; padding: 36px 40px; box-shadow: var(--shadow); }
  .vpaper h1 { margin: 8px 0 10px; font-size: calc(26px * var(--fs)); line-height: 1.35; }
  .vmeta { font-size: calc(13px * var(--fs)); color: var(--ink-soft); }
  .vpaper .content { max-height: none; overflow: visible; font-size: calc(15.5px * var(--fs)); }
  .vpaper .content::after { display: none; }
  .vpaper .content figure img { max-height: none; }
  .vrel { margin-top: 26px; padding-top: 16px; border-top: 1px solid var(--line); }
  .vrel h4 { margin: 0 0 8px; font-size: calc(14px * var(--fs)); color: var(--ink-soft); }
  @media (max-width: 700px) { .vpaper { margin: 12px; padding: 22px 18px; } .vpaper h1 { font-size: calc(21px * var(--fs)); } }

  /* 인쇄 = PDF 저장. 전체 보기 화면만 종이에 남긴다 */
  @media print {
    body > *:not(#modalHost) { display: none !important; }
    #modalHost .viewer { position: static; background: #fff; }
    .vtop { display: none !important; }
    .vscroll { overflow: visible; }
    .vpaper { max-width: none; margin: 0; padding: 0; border: none; border-radius: 0; box-shadow: none; background: #fff; }
    .vpaper .content figure img { max-height: 420px; }
    .embedbox, .embedhint, .content video, .content audio { display: none !important; }
  }

  /* ---------- 보기 방식 전환 ---------- */
  .viewswitch { display: flex; gap: 2px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 2px; }
  .vbtn { border: none; background: transparent; color: var(--ink-soft); font-size: calc(12.5px * var(--fs)); font-weight: 700;
          padding: 6px 10px; border-radius: 8px; white-space: nowrap; }
  .vbtn.on { background: var(--panel); color: var(--brand); box-shadow: 0 1px 2px rgba(20,30,60,.08); }

  /* 바둑판 · 카드 길이를 하나로 맞춘다 */
  #list.gridview { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
                   gap: 12px; align-items: stretch; }
  #list.gridview .entry { margin-bottom: 0; height: 340px; display: flex; flex-direction: column; overflow: hidden; }
  #list.gridview .head, #list.gridview .tags { flex: 0 0 auto; }
  /* 내용은 남는 높이만큼만 차지하고, 넘치면 아래로 흐리게 잘린다 */
  #list.gridview .content { flex: 1 1 auto; min-height: 0; max-height: none; overflow: hidden; position: relative; }
  #list.gridview .content.collapsed::after { display: none; }
  #list.gridview .content::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0;
                                   height: 44px; background: linear-gradient(transparent, var(--panel)); pointer-events: none; }
  #list.gridview .foot { flex: 0 0 auto; margin-top: 0; flex-wrap: nowrap; gap: 5px; }
  #list.gridview .foot .sdtxt { display: none; }        /* 좁으니 저장 상태는 아이콘만 (툴팁에 전체) */
  #list.gridview .foot .btn { padding: 7px 9px; font-size: calc(13px * var(--fs)); white-space: nowrap; }
  #list.gridview .morebtn { display: none; }
  #list.gridview .content figure img { max-height: 150px; }
  #list.gridview .rel { display: none; }
  @media (max-width: 700px) { #list.gridview { grid-template-columns: 1fr 1fr; gap: 8px; }
    #list.gridview .entry { padding: 11px; height: 290px; }
    #list.gridview .head h3 { font-size: calc(14.5px * var(--fs)); } }

  /* 목록 */
  .listview { padding: 4px; }
  .lrow { display: flex; align-items: center; gap: 9px; padding: 9px 10px; border-radius: 9px; }
  .lrow:hover { background: var(--bg); }
  /* 줄 사이 선 · 줄이 .lwrap 으로 한 겹 싸여 있어서 형제 선택자를 그에 맞춘다 */
  .lwrap + .lwrap > .lrow { border-top: var(--bw) solid var(--line-soft); }
  .lico { flex: 0 0 auto; font-size: calc(15px * var(--fs)); }
  .ltitle { flex: 1 1 auto; min-width: 0; text-align: left; border: none; background: transparent;
            color: var(--ink); font-size: calc(14.5px * var(--fs)); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ltitle:hover { color: var(--brand); }
  .lmeta { flex: 0 0 auto; font-size: calc(12px * var(--fs)); color: var(--ink-soft); }
  .lwhen { flex: 0 0 auto; font-size: calc(12px * var(--fs)); color: var(--ink-soft); width: 78px; text-align: right; }
  @media (max-width: 700px) { .lmeta { display: none; } .lwhen { width: 62px; } }

  /* ---------- 관계망 정보 패널 ---------- */
  .graphpanel {
    position: absolute; right: 10px; top: 10px; width: 260px; max-height: calc(100% - 20px); overflow: auto;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 12px;
  }
  .gp-head { display: flex; align-items: center; gap: 6px; margin-bottom: 7px; }
  .gp-title { margin: 0 0 2px; font-size: calc(15px * var(--fs)); }
  .gp-when { font-size: calc(12px * var(--fs)); color: var(--ink-soft); margin-bottom: 8px; }
  .gp-preview { font-size: calc(12.5px * var(--fs)); color: var(--ink-soft); margin: 0 0 10px; }
  .gp-sec { border-top: 1px solid var(--line-soft); padding-top: 8px; margin-bottom: 8px; }
  .gp-lab { font-size: calc(12px * var(--fs)); font-weight: 700; color: var(--ink-soft); margin-bottom: 5px; }
  .gp-none { font-size: calc(12px * var(--fs)); color: var(--ink-soft); opacity: .7; padding: 2px 0 4px; }
  .gp-row { display: flex; align-items: center; gap: 4px; margin-bottom: 3px; }
  .gp-go { flex: 1 1 auto; min-width: 0; text-align: left; border: none; background: var(--bg); color: var(--ink);
           font-size: calc(12.5px * var(--fs)); padding: 5px 8px; border-radius: 7px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .gp-go:hover { background: var(--brand-soft); color: var(--brand); }
  .gp-via { font-size: calc(12px * var(--fs)); color: var(--ink-soft); flex: 0 0 auto; }
  .gp-acts { display: flex; gap: 6px; flex-wrap: wrap; border-top: 1px solid var(--line-soft); padding-top: 9px; }
  .gp-acts .btn { flex: 1 1 auto; }
  .graphhint {
    position: absolute; left: 50%; transform: translateX(-50%); top: 10px; z-index: 5;
    background: #1a9e5f; color: #fff; font-size: calc(12.5px * var(--fs)); font-weight: 600;
    padding: 9px 14px; border-radius: 999px; box-shadow: 0 6px 18px rgba(0,0,0,.2); max-width: 92%; text-align: center;
  }
  @media (max-width: 700px) {
    .graphpanel { right: 6px; left: 6px; width: auto; top: auto; bottom: 6px; max-height: 46%; }
    .graphhint { top: auto; bottom: 8px; font-size: calc(12px * var(--fs)); }
  }

  /* ---------- 도움말 ---------- */
  .help-block { margin-bottom: 20px; }
  .help-block h4 { margin: 0 0 7px; font-size: calc(15px * var(--fs)); }
  .help-block p { margin: 0 0 7px; font-size: calc(13.8px * var(--fs)); line-height: 1.72; }
  .help-ex {
    background: var(--bg); border: 1px solid var(--line); border-left: 3px solid var(--brand);
    border-radius: 8px; padding: 10px 12px; margin: 8px 0 10px; white-space: pre-wrap;
    font-family: ui-monospace, Consolas, monospace; font-size: calc(12.5px * var(--fs)); line-height: 1.7; color: var(--ink);
  }

  /* ---------- 전체 화면 드래그&드롭 ---------- */
  .dropoverlay { position: fixed; inset: 0; z-index: 120; background: rgba(47,95,214,.18);
                 backdrop-filter: blur(2px); display: flex; align-items: center; justify-content: center; pointer-events: none; }
  .dropcard { background: var(--panel); border: 3px dashed var(--brand); color: var(--brand);
              border-radius: 18px; padding: 34px 46px; font-size: calc(18px * var(--fs)); font-weight: 800; text-align: center; line-height: 1.7;
              box-shadow: 0 20px 60px rgba(20,30,60,.25); }

  /* ---------- 화면 캡처 · 영역 선택 ---------- */
  .cropwrap { position: relative; display: inline-block; line-height: 0; touch-action: none;
              border-radius: 10px; overflow: hidden; border: 1px solid var(--line); cursor: crosshair; }
  .cropwrap img { display: block; max-width: 100%; max-height: 58vh; width: auto; height: auto;
                  user-select: none; -webkit-user-drag: none; }
  .cropshade { position: absolute; inset: 0; background: rgba(10,15,30,.55); pointer-events: none; }
  .cropsel { position: absolute; border: 2px solid #fff; box-shadow: 0 0 0 9999px rgba(10,15,30,.55);
             pointer-events: none; border-radius: 2px; }
  .cropsel::after { content: ""; position: absolute; inset: -2px; border: 1px dashed var(--brand); }
  .cropsize { position: absolute; left: 0; top: -22px; font-size: calc(12px * var(--fs)); font-weight: 700; color: #fff;
              background: var(--brand); padding: 1px 7px; border-radius: 6px; white-space: nowrap; }
  .crophint { font-size: calc(12.5px * var(--fs)); color: var(--ink-soft); margin: 10px 0 0; }
  .modebar { display: flex; gap: 6px; justify-content: center; margin: 0 0 12px; flex-wrap: wrap; }

  /* 손 메모 판 · 손가락으로 그릴 때 화면이 같이 밀리면 안 된다 */
  /* 사진 가리기 화면 · 여러 장을 한자리에서 */
  .maskbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 0 0 8px; }
  .maskstrip { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 10px; }
  .maskthumb { position: relative; flex: none; padding: 0; border: 2px solid transparent;
               border-radius: 9px; background: none; cursor: pointer; line-height: 0; }
  .maskthumb.on { border-color: var(--brand); }
  .maskthumb img { width: 74px; height: 74px; object-fit: cover; border-radius: 7px;
                   background: var(--bg); display: block; }
  .maskdone { position: absolute; right: 3px; bottom: 3px; background: var(--brand); color: #fff;
              font-size: calc(12px * var(--fs)); font-weight: 700; border-radius: 20px; padding: 1px 6px; line-height: 1.5; }
  .maskstage { position: relative; display: inline-block; line-height: 0; max-width: 100%; }
  .maskpad { display: block; max-width: 100%; max-height: 48vh; width: auto; height: auto;
             border-radius: 10px; border: 1px solid var(--line); touch-action: none; cursor: crosshair; }
  .maskghost { position: absolute; display: none; border-radius: 50%; pointer-events: none;
               border: 2px solid #fff; box-shadow: 0 0 0 2px rgba(47,95,214,.85), 0 0 0 9999px rgba(0,0,0,0); }
  .sizedot { display: inline-block; border-radius: 50%; background: currentColor; vertical-align: middle; }

  /* 공유 전 사진 확인 · 「가리는 걸 깜빡했다」를 막는 마지막 관문 */
  .sharephotos { display: flex; gap: 6px; overflow-x: auto; padding: 6px 0 2px; }
  .sharephoto { flex: none; }
  .sharephoto img { width: 92px; height: 92px; object-fit: cover; border-radius: 8px;
                    border: 1px solid var(--line); cursor: zoom-in; display: block; background: var(--bg); }
  .checkline { display: flex; align-items: center; gap: 7px; margin-top: 8px; font-size: calc(13.5px * var(--fs));
               font-weight: 700; cursor: pointer; }
  .checkline input { width: 17px; height: 17px; }
  .sharesep { font-size: calc(12.5px * var(--fs)); font-weight: 700; color: var(--ink-soft);
              border-top: 1px solid var(--line); padding-top: 12px; margin-top: 6px; }

  /* 밖에서 넣은 파일 이름 정리 */
  .renamebox { border: 1px solid var(--line); border-radius: 10px; background: var(--bg);
               max-height: min(52vh, 440px); min-height: 140px; overflow: auto; margin: 10px 0 2px; }
  .renamerow { display: flex; gap: 10px; align-items: flex-start; padding: 11px 12px;
               border-bottom: 1px solid var(--line); }
  .renamerow:last-child { border-bottom: 0; }
  .renamerow > input[type=checkbox] { width: 17px; height: 17px; margin-top: 3px; flex: none; }
  .renamemid { flex: 1; min-width: 0; }
  .renamewas { font-size: calc(13.5px * var(--fs)); color: var(--ink-soft); text-decoration: line-through;
               overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .renamemeta { font-size: calc(12px * var(--fs)); color: var(--ink-soft); margin-top: 1px; }
  .renameline { display: flex; gap: 6px; align-items: baseline; margin: 4px 0 6px; }
  .renamearrow { color: var(--brand); font-weight: 800; flex: none; }
  .renamenew { font-weight: 700; font-size: calc(13.5px * var(--fs)); word-break: break-all;
               font-family: ui-monospace, Consolas, monospace; }

  /* 폴더 구조 · 탐색기처럼 위에서 아래로 */
  /* 창이 낮아도 트리가 뭉개지지 않게 최소 높이를 준다. 모자라면 모달 쪽이 스크롤한다. */
  .treebox { border: 1px solid var(--line); border-radius: 10px; background: var(--bg);
             max-height: min(58vh, 480px); min-height: 180px; overflow: auto; margin: 0 0 2px; padding: 6px 0; }
  .trow { display: flex; align-items: center; gap: 6px; padding: 4px 10px 4px 8px;
          font-size: calc(13.5px * var(--fs)); line-height: 1.45; white-space: nowrap; border-radius: 6px; }
  .trow.tfolder, .trow.tclick { cursor: pointer; }
  .trow.tfolder:hover, .trow.tclick:hover { background: var(--panel); }
  .trow.tfolder .tname { font-weight: 700; }
  .trow.tpending .tname { color: var(--ink-soft); }
  .tcaret { width: 12px; flex: none; color: var(--ink-soft); font-size: calc(12px * var(--fs)); text-align: center; }
  .ticon { flex: none; }
  .tname { overflow: hidden; text-overflow: ellipsis; }
  .tmeta { margin-left: auto; padding-left: 12px; flex: none;
           font-size: calc(12px * var(--fs)); color: var(--ink-soft); font-variant-numeric: tabular-nums; }

  /* 녹음 화면 · 숫자와 막대가 «지금 담기고 있다» 를 말해 준다 */
  .voiceclock { font-size: calc(40px * var(--fs)); font-weight: 800; letter-spacing: 1px; margin: 4px 0 10px;
                font-variant-numeric: tabular-nums; }
  .voicemeter { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden;
                margin: 0 auto 10px; max-width: 420px; }
  .voicebar { height: 100%; width: 0; background: var(--brand); border-radius: 99px; transition: width .08s linear; }

  .drawwrap { width: 100%; display: flex; justify-content: center; }
  .drawpad { display: block; margin: 0 auto; background: #fff; border: 1px solid var(--line);
             border-radius: 10px; touch-action: none; cursor: crosshair; }

  /* 웹캠 미리보기 · 규칙이 없으면 1920x1080 원본이 그대로 나와 모달을 뚫는다 */
  .camview { display: block; width: 100%; height: auto; max-width: 100%; max-height: 58vh;
             object-fit: contain; background: #000; border-radius: 10px; border: 1px solid var(--line); }
  @media (max-width: 700px) { .camview { max-height: 52vh; } }

  /* ---------- 선택 시트 (사진 넣는 방법 고르기) ---------- */
  .sheet .mbody { padding: 14px 18px 18px; }
  .sheetbtn {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    padding: 14px 16px; border-radius: 12px; margin-bottom: 8px; font-weight: 700; font-size: calc(15px * var(--fs));
  }
  .sheetbtn:hover { border-color: var(--brand); color: var(--brand); }
  .sheetbtn .em { font-size: calc(24px * var(--fs)); line-height: 1; flex: 0 0 auto; }
  .sheetbtn small { display: block; font-weight: 500; font-size: calc(12.5px * var(--fs)); color: var(--ink-soft); margin-top: 2px; }
  .sheetbtn:hover small { color: inherit; }
  .sheetnote { font-size: calc(12.5px * var(--fs)); color: var(--ink-soft); background: var(--bg);
               border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin: 0 0 12px; }
  .sheettoggle { display: flex; align-items: center; gap: 8px; font-size: calc(13.5px * var(--fs)); padding: 4px 2px; }

  /* ---------- 동기화 표시 ---------- */
  .syncpill { font-size: calc(12px * var(--fs)); color: var(--ink-soft); white-space: nowrap; }
  .syncpill.busy { color: var(--brand); }

  /* ---------- 모바일 ---------- */
  @media (max-width: 700px) {
    /* iOS 가 입력칸에서 자동 확대하지 않도록 16px 이상 유지 */
    .inp, input, textarea, select { font-size: calc(16px * var(--fs)); }
    .wrap { padding: 0 12px 96px; }
    .top-inner { padding: 8px 12px; gap: 7px; }
    .acct { display: none; }
    .btn { padding: 9px 13px; }
    .btn.sm { padding: 8px 11px; font-size: calc(13.5px * var(--fs)); }
    .btn.xs { padding: 6px 10px; font-size: calc(13px * var(--fs)); }
    .composer, .entry { padding: 14px; }
    .grid2 { gap: 8px; }
    /* ⚠️ bottom 을 0 으로 두면 폰 아래 고정 바 «밑» 으로 숨는다.
       이 규칙이 1020px 블록보다 뒤에 있어서 거기 적어 둔 62px 을 덮어썼다.
       한 값을 두 곳에 적으면 이렇게 어긋난다 · 그래서 여기에도 같이 적는다. */
    /* ⚠️ 둘 다 바닥에 붙이려다 46px 이 물렸다. sticky 를 74px 위로 올려 보았지만
       «부모 상자» 안에서만 움직여서 그 값을 못 지켰다.
       자리를 나눠 쓰는 것이 아니라 «때를 나누는» 것이 맞다 ·
       쓰는 동안에는 넣기 줄이 바닥을 갖고, 아래 바는 물러난다 (body.writing). */
    .addbar { position: sticky; bottom: 0; z-index: 56; background: var(--panel);
              box-shadow: 0 -6px 18px rgba(20,30,60,.08); }
    body.writing .dock { display: none; }
    body.writing .wrap { padding-bottom: 24px; }
    /* ⚠️ 아래 바가 물러난 자리를 «넣기 줄» 이 가져간다 (sticky · 같은 층 56).
       그 위에 동그란 의견 단추를 얹으면 사진·캡처 단추를 가린다.
       지금 급한 일은 쓰는 것이다 · 의견은 다 쓰고 접은 뒤에 남겨도 늦지 않다.
       ⚠️ 이 규칙은 «넣기 줄이 바닥을 갖는 너비» 에만 걸어야 한다. 1020px 에 걸면
          아래 바가 그대로 서 있는 태블릿에서도 단추가 통째로 사라진다. */
    body.writing .fbbtn { display: none; }
    .addbar .btn { flex: 1 1 30%; text-align: center; }
    .addhint { font-size: calc(12px * var(--fs)); }
    .bhead .btn.xs { min-width: 40px; }
    .media .thumb, .media .ficon { width: 72px; height: 72px; }
    /* 검색은 머리띠로 올라갔다 · 폰에서는 머리띠 둘째 줄을 통째로 쓴다 */
    .top-inner .topsearch { order: 9; flex: 1 1 100%; max-width: none; }
    .modal-bg { padding: 0; align-items: flex-end; }
    .modal { max-width: none; max-height: 92vh; border-radius: 16px 16px 0 0; }
    .graphmodal { height: 92vh; max-width: none; }
    .graphtools .inp { width: 110px; }
    .graphlegend { display: none; }
    .modal .mhead, .modal .mfoot { padding: 13px 14px; }
    .modal .mbody { padding: 14px; }
    .tabs { padding: 8px 12px 0; }
    .tab { padding: 8px 10px; font-size: calc(13px * var(--fs)); }
    .typerow { flex-wrap: wrap; }
    .typerow .nm { flex: 1 1 120px; }
    .cropwrap { max-width: 100%; }
    .dropcard { padding: 24px 28px; font-size: calc(16px * var(--fs)); }
  }

  footer.site { text-align: center; color: var(--ink-soft); font-size: calc(12.5px * var(--fs)); padding: 30px 0 10px; }
  footer.site a { color: var(--ink-soft); }
  /* 태그가 «나중에 이어 주는 실» 이라는 것을 적는 자리 */
  .taghint { margin: 7px 0 0; font-size: calc(12.5px * var(--fs)); line-height: 1.7; color: var(--ink-soft); }
  .taghint b { color: var(--ink); }
</style>
</head>
<body>

<div id="progress"></div>

<header class="top">
  <div class="top-inner">
    <!-- 줄 셋 · 폰에서만 보인다. 누르면 폴더 구조 서랍이 왼쪽에서 나온다 -->
    <button id="btnDrawer" class="burgerbtn" aria-label="폴더 구조 열기"><i></i><i></i><i></i></button>
    <!-- 로고도 그림글자 대신 브릭 한 조각 · 이 도구의 정체성이다 -->
    <button type="button" id="btnHome" class="logo" title="홈으로 · 좁혀 본 것과 검색을 풀고 모든 기록을 봅니다"><svg class="logomark" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="9.5" width="18" height="10" rx="2.5"/><path d="M7 9.5V6.8h4v2.7M13 9.5V6.8h4v2.7"/></svg> 개인지식운영체제 <small>PKOS · Personal Knowledge Operation System</small></button>
    <div class="spacer"></div>
    <!-- 검색은 매일 쓴다. 목록 줄에 묻어 두면 «어디 있더라» 가 된다 -->
    <input id="search" class="inp topsearch" type="search" placeholder="🔍 제목·내용·태그 검색" />
    <span id="syncPill" class="syncpill"></span>
    <span id="acct" class="acct"></span>
    <!-- 그림글자 대신 선 아이콘 · 이모지는 색이 우리 색을 안 따라와서 판 위에서 안 읽힌다 -->
    <span id="topExtras" class="hidden"><button id="btnHelp" class="btn sm" title="연결·백링크·관계망 사용법"><svg class="bico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.4 9.3a2.7 2.7 0 1 1 3.6 2.6c-.8.3-1 .9-1 1.9"/><circle cx="12" cy="17" r=".6" fill="currentColor" stroke="none"/></svg></button>
    <button id="btnInstall" class="btn sm" style="display:none" title="이 기록장을 내 컴퓨터에 앱으로 설치합니다"><svg class="bico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v10"/><path d="m7.5 10.5 4.5 4 4.5-4"/><path d="M5 19.5h14"/></svg><span class="lbl"> 앱으로 설치</span></button>
    <button id="btnMap" class="btn sm" title="폴더 구조"><svg class="bico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20v-14h6l2 2.5h10V20Z"/></svg><span class="lbl"> 폴더 구조</span></button>
    <button id="btnGraph" class="btn sm" title="관계망"><svg class="bico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5.5" r="2.4"/><circle cx="5.5" cy="17.5" r="2.4"/><circle cx="18.5" cy="17.5" r="2.4"/><path d="M10.9 7.6 6.7 15.4M13.1 7.6l4.2 7.8M7.9 17.5h8.2"/></svg><span class="lbl"> 관계망</span></button>
    <button id="btnSettings" class="btn sm" title="설정"><svg class="bico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7.5h9"/><circle cx="16.5" cy="7.5" r="2.4"/><path d="M20 16.5h-9"/><circle cx="7.5" cy="16.5" r="2.4"/></svg><span class="lbl"> 설정</span></button></span>
    <button id="btnMore" class="btn sm" title="설정·도움말·앱 설치">⋯</button>
    <!-- ⚠️ 「＋ 새 기록」 은 머리띠에 산다. 기둥 맨 아래에 두었더니 폴더가 열댓 개인
         사람에게는 화면 밖으로 밀려나 «어떻게 쓰냐» 가 됐다. 가장 자주 누르는 단추는
         목록 길이에 밀리지 않는 자리에 있어야 한다 (업노트도 머리띠에 둔다). -->
    <span id="topNewWrap" class="topnew">
      <button id="topNew" class="btn sm primary">＋ 새 기록</button>
      <button id="topNewMore" class="btn sm primary tnmore" aria-label="양식·다른 폴더">▾</button>
    </span>
    <button id="btnLogin" class="btn sm primary">구글 로그인</button>
  </div>
</header>

<!-- 왼쪽 · 폴더 구조. PC 에서는 늘 보이고, 폰에서는 줄 셋(☰)으로 여는 서랍이 된다 -->
<div class="layout">
<aside id="sideNav" aria-label="폴더 구조"></aside>
<div id="drawerScrim" class="hidden"></div>
<!-- 경계를 끄는 손잡이 둘 · 끌면 칸 너비가, 두 번 누르면 처음 너비로 -->
<button type="button" id="gripNav" class="colgrip" aria-label="폴더 구조 칸 너비 · 끌어서 조절, 두 번 누르면 되돌림"></button>
<button type="button" id="gripList" class="colgrip" aria-label="기록 목록 칸 너비 · 끌어서 조절, 두 번 누르면 되돌림"></button>

<!-- 접었을 때 남는 세로 띠 · 펴는 길이 눈에 보여야 접어도 무섭지 않다 -->
<button type="button" id="listRail" class="listrail" title="기록 목록 펴기" aria-label="기록 목록 펴기">
  <span class="lr-ar">›</span><span class="lr-t">기록 목록</span>
</button>

<!-- 가운데 칸 · 기록 목록. 업노트의 «노트 목록» 자리다 -->
<div id="listcol" class="listcol">
  <div class="toolbar">
    <h2 id="listTitle">📚 기록</h2>
    <span class="count" id="countText"></span>
    <span class="spacer"></span>
    <div class="viewswitch" id="viewSwitch"></div>
    <button id="btnCompile" class="btn sm" title="고른 기록을 한 권으로 묶어 내려받습니다">📚 엮어내기</button>
    <button type="button" id="btnListFold" class="listfold" title="기록 목록 접기" aria-label="기록 목록 접기">‹</button>
  </div>
  <div class="chips filters" id="typeFilters"></div>
  <div class="chips filters tagfilters" id="tagFilters"></div>
  <div id="list"></div>
  <footer class="site">
    개인지식운영체제 · PKOS &nbsp;|&nbsp; <a href="privacy.html">개인정보처리방침</a>
  </footer>
</div>

<div class="wrap">

  <div id="banner" class="banner warn"></div>

  <!-- ================= 에디터 ================= -->
  <div id="draftBar" class="banner draft hidden"></div>

  <section class="card composer" id="composer">
    <!-- 접혔을 때 남는 한 줄. 폴더를 보는 동안은 이것만 보인다 -->
    <div class="cfold">
      <button type="button" class="cfoldbtn" id="btnUnfold">＋ 새 기록</button>
      <span class="cfoldwhere" id="cfoldWhere"></span>
    </div>
    <div class="chead">
      <h2 id="composerTitle">✍️ 새 기록</h2>
      <span class="spacer"></span>
      <!-- 고치는 중일 때만 선다 · 새로 쓰는 중에는 지울 것이 없다 -->
      <button id="btnDeleteEntry" class="btn sm ghost danger hidden" title="이 기록을 지웁니다">🗑️ 삭제</button>
      <button id="btnFocus" class="btn sm ghost" title="쓰는 데만 집중합니다 (Esc 로 나오기)">🎯 집중</button>
    </div>
    <!-- 이 기록이 갈 자리. 쓰기 전에 보여야 한다 · 쓰고 나서 알면 늦다 -->
    <div id="deskLine" class="deskline hidden"></div>

    <div class="chips" id="typeChips" style="margin-bottom:12px;"></div>

    <!-- ⚠️ 태그가 제목보다 «먼저» 온다.
         이 앱에서 첫 태그는 그냥 딱지가 아니라 «폴더 이름» 이고, 파일 이름도 그것으로 시작한다.
         제목부터 적게 해 두면 자리를 정하기 전에 이름부터 짓게 되어,
         「배움」 을 제목으로 「질문」 을 태그로 적고 나서 왜 폴더가 따로 생겼는지 모르게 된다.
         자리를 먼저 정하고 이름을 붙이는 순서로 놓는다. -->
    <div class="grid2">
      <div class="field" style="margin-bottom:12px;">
        <label for="tags">① 태그</label>
        <input id="tags" class="inp" placeholder="수업, 에듀테크, 회고" />
        <p class="taghint" id="tagHint">
          같은 태그 끼리 모아 볼 수 있습니다.
        </p>
        <!-- 급할 때는 분류 없이 남긴다. 태그가 없거나 이 칸을 켜 두면 «미정리함» 에 모인다 -->
        <label class="checkline inboxline"><input type="checkbox" id="inboxChk" /> <span>📥 나중에 정리 · 미정리함에 둡니다</span></label>
      </div>
      <div class="field" style="margin-bottom:12px;">
        <label for="title">② 제목</label>
        <input id="title" class="inp" placeholder="무엇에 대한 기록인가요?" />
        <p class="taghint" id="nameHint"></p>
      </div>
    </div>

    <div class="field">
      <label>내용</label>
      <div id="maskBar" class="maskbar hidden">
        <button id="btnMaskAll" class="btn sm">🔲 사진 가리기</button>
        <span class="addhint" id="maskBarHint"></span>
      </div>
      <!-- 넣기 줄 · 종이 위에 붙어 다닌다. 서식 │ 줄 갈래 │ 자료 │ 출처 갈래.
           ⚠️ 자주 안 쓰는 것은 addx 로 접어 둔다 · 폰에서 넣기 줄이 벽이 되면 안 된다. -->
      <div class="edbar" id="addbar">
        <div class="edgrp">
          <!-- 사진·녹음처럼 «코드가 넣은 것» 도 함께 되돌린다 (브라우저 기본 되돌리기는 못 한다) -->
          <button id="btnUndo" type="button" class="btn sm fb noico" title="되돌리기 (Ctrl+Z)" disabled>↶</button>
          <button id="btnRedo" type="button" class="btn sm fb noico" title="다시 하기 (Ctrl+Shift+Z)" disabled>↷</button>
          <button class="btn sm fb noico" data-fmt="b" title="굵게 (Ctrl+B)"><b>가</b></button>
          <button class="btn sm fb noico" data-fmt="i" title="기울임 (Ctrl+I)"><i>가</i></button>
          <button class="btn sm fb noico addx" data-fmt="s" title="취소선"><s>가</s></button>
          <span class="hlwrap"><button id="btnHl" class="btn sm fb noico" type="button" title="형광펜 · 고른 글자에 칠합니다">🖍</button><span class="hlpal" id="hlPal"></span></span>
          <button class="btn sm fb noico addx" data-fmt="c" title="코드로">코드</button>
        </div>
        <div class="edgrp">
          <button class="btn sm" data-add="heading">소제목</button>
          <button class="btn sm" data-add="todo">할 일</button>
          <button class="btn sm" data-add="list">목록</button>
          <button class="btn sm addx" data-add="olist">1. 목록</button>
          <button class="btn sm addx" data-add="quote">인용</button>
          <button class="btn sm addx" data-add="table">표</button>
          <button class="btn sm addx" data-add="code">코드</button>
          <button class="btn sm addx" data-add="fold">접이식</button>
          <button class="btn sm addx" data-add="divider">구분선</button>
        </div>
        <div class="edgrp">
          <button class="btn sm" data-add="image">사진</button>
          <button class="btn sm" data-add="capture">캡처</button>
          <button class="btn sm" data-add="file">파일·영상</button>
          <button class="btn sm" data-add="link">링크</button>
          <button class="btn sm addx" data-add="embed">코드 삽입</button>
          <button class="btn sm addx" data-add="draw">손 메모</button>
          <button class="btn sm addx" data-add="voice">녹음</button>
        </div>
        <div class="edgrp roles">
          <button class="btn sm role noico" data-add="mine" title="내 생각 · 남의 자료와 구분해 둡니다">💭 내 생각</button>
          <button class="btn sm role noico" data-add="source" title="강사 말·책·논문·웹에서 옮긴 것 · 출처를 함께 적습니다">📚 자료 인용</button>
          <button class="btn sm role noico" data-add="ai" title="AI 가 답한 것 · 읽을 때는 접혀 있고, AI 에 다시 건넬 때는 빠집니다">🤖 AI 답변</button>
        </div>
        <button id="btnAddMore" class="btn sm noico" title="취소선·코드·번호 목록·인용·표·접이식·구분선·코드 삽입·손 메모·녹음">⋯ 더</button>
      </div>
      <!-- 종이 · 여기에 이어 쓴다. 사진·파일은 커서 자리에 덩어리로 박힌다.
           id 는 그대로 blocks 다 · 밖에서 «마지막 것으로 굴려 보기» 를 이 id 로 한다. -->
      <div id="blocks" class="paper blank" contenteditable="true" spellcheck="false"
           data-ph="여기에 쓰세요. 쓰다가 사진·파일을 붙여넣거나 끌어다 놓으면 그 자리에 들어갑니다. / 를 치면 넣을 것을 고르고, [[ 를 치면 다른 기록과 이어집니다."></div>
      <input type="file" id="fileInput" multiple class="hidden" />

  function createFolderAndPick(onPick) {

    var name = window.prompt("새로 만들 폴더 이름 (내 드라이브 맨 위에 만듭니다)", "교직 기록");

  /* ---- 밖에서 넣은 파일에 권한 얻기 ----
     좁은 권한에서는 «사람이 고른 것» 에만 권한이 생긴다.
     ⚠️ 폴더를 골라도 그 «안에 이미 있던 것» 까지는 권한이 안 퍼진다(실측).
        그래서 밖에서 가져오는 자리마다 이 창을 붙여 둔다.
     한 번 고른 파일은 그 뒤로는 목록에 저절로 잡힌다. 매번 고를 필요는 없다. */
  var grantedExtra = [];      // 이번 판에 골라서 권한이 생긴 것들

  function pickDriveFiles(onDone) {
    var why = pickerBlockedReason();

    var b = new google.picker.PickerBuilder()
      .setOAuthToken(accessToken)
      .setDeveloperKey(OWNER_API_KEY)
      .setAppId(OWNER_PROJECT_NUMBER)
      .enableFeature(google.picker.Feature.MULTISELECT_ENABLED)
      .setTitle("가져올 파일을 고르세요 · 여러 개 고를 수 있습니다")
      .setCallback(function (data) {

        var got = (data.docs || [])
          .filter(function (d) { return d.mimeType !== "application/vnd.google-apps.folder"; })
          .map(function (d) {
            return {

        got.forEach(function (g) {

        });

    /* 연결한 폴더 안을 먼저 보여 준다. 대개 거기에 있다.

        .setIncludeFolders(true).setParent(folder.id));

  /* 「드라이브에서 고르기」 단추. 세 자리(가져오기·이름 정리·폴더 구조)에서 같이 쓴다. */

  /* 모양 미리보기 조각들(themeAxis·themeSwatch)은 모양이 하나가 되면서 걷어냈다 */
  function saveSettingsLocal() { localStorage.setItem(LS.settings, JSON.stringify(settings)); }

  /* ---- 아직 업로드하지 않은 첨부는 IndexedDB 에 둔다 ----
     사진 한 장이 base64 로 수 MB 라, localStorage(보통 5MB)에 담으면
     휴대폰에서 금방 한도를 넘겨 기록이 통째로 날아갑니다.            */
  var idbOK = true;
  function idb() {
    return new Promise(function (res, rej) {
      if (!idbOK || !window.indexedDB) { rej(new Error("no-idb")); return; }
      // ⚠️ 이름은 옛것(pkems)으로 둔다. 여기엔 «아직 못 올린 사진·파일»이 들어 있어서,
      //    이름을 바꾸면 그것들이 통째로 사라진다. 화면에 보이지 않는 이름이라 그대로 둔다.
      var r = indexedDB.open("pkems", 1);
      r.onupgradeneeded = function () { r.result.createObjectStore("pending"); };
      r.onsuccess = function () { res(r.result); };
      r.onerror = function () { idbOK = false; rej(r.error); };
    });
  }
  function idbRun(mode, fn) {
    return idb().then(function (db) {
      return new Promise(function (res, rej) {
        var tx = db.transaction("pending", mode);
        var out = fn(tx.objectStore("pending"));
        tx.oncomplete = function () { res(out && out.result !== undefined ? out.result : out); };
        tx.onerror = function () { rej(tx.error); };
      });
    });
  }
  function idbPut(k, v) { return idbRun("readwrite", function (s) { s.put(v, k); }).catch(function () { idbOK = false; }); }
  function idbDel(k) { return idbRun("readwrite", function (s) { s.delete(k); }).catch(function () {}); }
  function idbAll() {
    return idb().then(function (db) {
      return new Promise(function (res) {
        var out = {}, tx = db.transaction("pending", "readonly");
        var req = tx.objectStore("pending").openCursor();
        req.onsuccess = function () {
          var c = req.result;
          if (c) { out[c.key] = c.value; c.continue(); } else res(out);
        };
        req.onerror = function () { res(out); };
      });
    }).catch(function () { return {}; });
  }
  // 저장 전에 대기 중인 첨부 본문을 IndexedDB 로 옮긴다
  function stashPending() {
    if (!idbOK) return Promise.resolve();
    var jobs = [];
    entries.forEach(function (n) {
      (n.blocks || []).forEach(function (b) {
        // 아직 못 올린 것 + 가려서 다시 올려야 하는 것, 둘 다 본문을 지켜야 한다
        if ((b.kind === "image" || b.kind === "file") && b.blob && (!b.fileId || b._remask)) {
          jobs.push(idbPut(b.id, b.blob));
        }
      });
    });
    return Promise.all(jobs);
  }
  function saveLocal() {
    stashPending();
    try {
      // 파일 본문(Blob)은 IndexedDB 에 있으므로 localStorage 에는 넣지 않는다
      localStorage.setItem(LS.entries, JSON.stringify(entries, function (k, v) {
        if (k === "blob" || k === "dataUrl") return undefined;
        return v;
      }));
      localStorage.setItem(LS.tombs, JSON.stringify(tombstones));
    } catch (e) {
      /* 기록이 수천 편이 되면 브라우저가 내주는 자리(5MB 남짓)를 넘어선다.
         전에는 «드라이브에 연결하면 해결됩니다» 라고 했는데, 그건 사실이 아니다.
         연결해도 이 기기의 자리는 그대로다. 대신 **드라이브에는 그대로 있으니**
         새로고침하면 거기서 다시 받아온다. 그 사실을 그대로 말한다. */
      toast("이 기기에 다 담지 못했습니다. 드라이브에는 그대로 있습니다.");
      toast2("새로고침하면 드라이브에서 다시 받아옵니다.");
    }
  }
  // 새로고침 후 아직 못 올린 첨부 본문을 되살린다
  function rehydratePending() {
    return idbAll().then(function (map) {
      var used = {}, changed = false;
      entries.forEach(function (n) {
        (n.blocks || []).forEach(function (b) {
          if ((b.kind === "image" || b.kind === "file") && (!b.fileId || b._remask)) {
            used[b.id] = 1;
            if (!b.blob && map[b.id]) {
              // 예전 버전은 base64 문자열로 저장했으므로 Blob 으로 바꿔 준다
              var v = map[b.id];
              if (typeof v === "string") v = dataUrlToBlob(v);
              if (v instanceof Blob) { b.blob = v; changed = true; }
              else idbDel(b.id);   // 못 쓰는 값이면 버린다
            }
          }
        });
      });
      // 작성 중인 임시본의 파일도 지우면 안 된다
      var d = safeParse(localStorage.getItem(LS.draft));
      if (d && d.blocks) d.blocks.forEach(function (b) { used[b.id] = 1; });
      Object.keys(map).forEach(function (k) { if (!used[k]) idbDel(k); });
      if (changed) render();
    });
  }
  function dataUrlToBlob(u) {
    try {
      var mime = mimeOfDataUrl(u);
      var bin = atob(b64of(u));
      var arr = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      return new Blob([arr], { type: mime });
    } catch (e) { return null; }
  }

  // 예전 버전(본문+첨부 분리)을 블록 구조로 변환
  function migrate(list) {
    return (list || []).map(function (n) {
      if (n.blocks) return n;
      var bl = [];
      if (n.body) bl.push({ id: uid(), kind: "text", text: n.body });
      (n.files || []).forEach(function (f) {
        bl.push({
          id: uid(), kind: /^image\//.test(f.mime || "") ? "image" : "file",
          original: f.original, mime: f.mime, size: f.size, name: f.name,
          fileId: f.fileId || null, caption: "",
          // 아주 옛 버전은 base64 로 들고 있었다 → Blob 으로 바꿔 준다
          blob: (!f.fileId && f.dataUrl) ? dataUrlToBlob(f.dataUrl) : null
        });
      });
      (n.links || []).forEach(function (l) { bl.push({ id: uid(), kind: "link", url: l.url, label: l.label }); });
      [["상황 (Context)", n.context], ["배운 점 (Insight)", n.insight], ["다음 행동 (Action)", n.action], ["출처 (Source)", n.source]]
        .forEach(function (p) {
          if (!p[1]) return;
          bl.push({ id: uid(), kind: "heading", text: p[0] });
          bl.push({ id: uid(), kind: "text", text: p[1] });
        });
      n.blocks = bl;
      return n;
    });
  }

  /* =========================================================
     3. 구글 인증
     ========================================================= */
  function gisReady() { return typeof google !== "undefined" && google.accounts && google.accounts.oauth2; }
  function initTokenClient() {
    if (!clientId || !gisReady()) return false;
    tokenClient = google.accounts.oauth2.initTokenClient({ client_id: clientId, scope: SCOPE, callback: function () {} });
    return true;
  }

  /* ---- 토큰을 브라우저에 보관한다 ----
     구글이 주는 토큰은 1시간짜리다. 예전에는 자바스크립트 변수에만 담아서
     «새로고침 = 로그아웃» 이었다. 특히 폰에서 앱으로 설치해 쓰면
     조용히 다시 받는 길(계정 쿠키)이 막혀 있어서 매번 풀렸다.
     이제 만료시각까지 담아 두고, 남은 시간이 있으면 그대로 이어 쓴다.
     ⚠️ 로그아웃하면 반드시 지운다. 이건 드라이브를 열 수 있는 열쇠다. */
  function saveToken(tok, expiresIn) {
    try {
      var life = Number(expiresIn || 3600);
      localStorage.setItem(LS.token, JSON.stringify({ t: tok, exp: Date.now() + (life - 120) * 1000 }));
    } catch (e) { /* 저장 못 해도 이번 판은 쓸 수 있다 */ }
  }
  function loadToken() {
    var s = safeParse(localStorage.getItem(LS.token));
    return (s && s.t && s.exp > Date.now()) ? s.t : null;
  }
  function clearToken() {
    accessToken = null;
    try { localStorage.removeItem(LS.token); } catch (e) {}
  }
  function rememberEmail() {
    try { if (userEmail) localStorage.setItem(LS.email, userEmail); } catch (e) {}
  }

  function requestToken(interactive) {
    return new Promise(function (resolve, reject) {
      if (!tokenClient && !initTokenClient()) { reject(new Error("구글 로그인 준비 중입니다. 잠시 후 다시 눌러 주세요.")); return; }
      tokenClient.callback = function (r) {
        if (r && r.error) { reject(new Error(r.error_description || r.error)); return; }
        accessToken = r.access_token;
        saveToken(r.access_token, r.expires_in);
        needReconnect = false;
        resolve(accessToken);
      };
      var cfg = { prompt: interactive ? "consent" : "" };
      // 전에 쓰던 계정을 알려 주면 «계정 고르기» 화면을 건너뛴다 (조용히 받을 확률도 올라간다)
      var hint = localStorage.getItem(LS.email);
      if (hint) cfg.hint = hint;
      try { tokenClient.requestAccessToken(cfg); }
      catch (e) { reject(e); }
    });
  }

  /* ---- 「방금 눌렀는가」 를 기억한다 ----
     구글 토큰 라이브러리는 «조용히 받기» 라는 길이 없다. 부르면 무조건 팝업을 연다.
     사용자가 아무것도 안 눌렀는데 팝업을 열면 브라우저가 «내가 안 시킨 창» 으로 보고 막는다.
     ← 폰에서 로그인이 풀린 것처럼 보이던 진짜 이유가 이것이다.
     그래서 «최근에 누른 적이 있을 때만» 부르고, 아니면 «다시 연결» 띠로 넘긴다. */
  var lastGestureAt = 0;
  ["pointerdown", "keydown", "touchstart"].forEach(function (ev) {
    document.addEventListener(ev, function () { lastGestureAt = Date.now(); }, true);
  });
  function canOpenPopup() { return Date.now() - lastGestureAt < 60000; }

  /* 조용히 다시 받아 본다. 실패하면 «다시 연결» 띠를 띄우고 조용히 물러난다.
     예전에는 실패해도 아무 말이 없어서 «그냥 로그아웃된 것»처럼 보였다. */
  function renewQuietly() {
    if (!canOpenPopup()) {
      needReconnect = true; clearToken(); updateChrome();
      return Promise.reject(new Error("연결이 풀렸습니다. 위쪽 [다시 연결] 을 눌러 주세요."));
    }
    return requestToken(false).catch(function (e) {
      needReconnect = true;
      clearToken();
      updateChrome();
      throw e;
    });
  }

  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  // 구글이 «잠깐 쉬어라»(429·5xx·사용량 초과) 라고 하면 기다렸다 다시 건다
  function shouldBackoff(res) {
    if (res.status === 429 || res.status >= 500) return true;
    return false;
  }
  function driveFetch(url, opts, tried) {
    opts = opts || {};
    opts.headers = opts.headers || {};
    opts.headers["Authorization"] = "Bearer " + accessToken;
    tried = tried || 0;
    return fetch(url, opts).then(function (res) {
      if (res.status === 401 && tried === 0) {
        return renewQuietly().then(function () { return driveFetch(url, opts, 1); });
      }
      if (shouldBackoff(res) && tried < 4) {
        return sleep(Math.min(8000, 500 * Math.pow(2, tried)) + Math.random() * 400)
          .then(function () { return driveFetch(url, opts, tried + 1); });
      }
      return res;
    });
  }
  function driveJson(url, opts) {
    return driveFetch(url, opts).then(function (r) {
      return r.json().then(function (j) {
        if (!r.ok) throw new Error((j && j.error && j.error.message) || ("HTTP " + r.status));
        return j;
      });
    });
  }
  /* 「다시 연결」 한 번 눌러 되살리기.
     조용히 받아 보고, 안 되면 그때만 구글 화면을 띄운다. */
  function reconnect() {
    needReconnect = false; updateChrome();
    return requestToken(false)
      .catch(function () { return requestToken(true); })
      .then(function () { return connect(); })
      .catch(function (e) {
        needReconnect = true; updateChrome();
        toast("다시 연결하지 못했습니다: " + errText(e));
      });
  }
  function ensureAccount() {
    return driveFetch("https://www.googleapis.com/oauth2/v3/userinfo")
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (i) { if (i && i.email) { userEmail = i.email; rememberEmail(); } })
      .catch(function () {});
  }

  /* =========================================================
     4. 드라이브 기본 동작
     ========================================================= */
  function parseFolderId(input) {
    var s = String(input || "").trim();
    if (!s) return "";
    var m = /\/folders\/([A-Za-z0-9_-]+)/.exec(s); if (m) return m[1];
    m = /[?&]id=([A-Za-z0-9_-]+)/.exec(s); if (m) return m[1];
    m = /\/d\/([A-Za-z0-9_-]+)/.exec(s); if (m) return m[1];
    if (/^[A-Za-z0-9_-]{10,}$/.test(s)) return s;
    return "";
  }
  function verifyFolder(id) {
    return driveJson("https://www.googleapis.com/drive/v3/files/" + encodeURIComponent(id) +
      "?fields=id,name,mimeType,webViewLink&supportsAllDrives=true").then(function (f) {
        if (f.mimeType !== "application/vnd.google-apps.folder") throw new Error("폴더가 아닙니다. 폴더 링크를 넣어 주세요.");
        return { id: f.id, name: f.name, link: f.webViewLink };
      });
  }
  function qEsc(s) { return String(s).replace(/\\/g, "\\\\").replace(/'/g, "\\'"); }

  function findInFolder(name, parentId) {
    var q = "name='" + qEsc(name) + "' and '" + parentId + "' in parents and trashed=false";
    return driveJson("https://www.googleapis.com/drive/v3/files?q=" + encodeURIComponent(q) +
      "&fields=files(id,name)&supportsAllDrives=true&includeItemsFromAllDrives=true")
      .then(function (j) { return (j.files && j.files.length) ? j.files[0].id : null; });
  }
  function createFolder(name, parentId) {
    return driveJson("https://www.googleapis.com/drive/v3/files?fields=id,name&supportsAllDrives=true", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: name, mimeType: "application/vnd.google-apps.folder", parents: [parentId] })
    });
  }
  // 이름이 같은 폴더가 있으면 재사용하고, 없으면 만든다
  var folderCache = {};
  function ensureNamedFolder(name, parentId) {
    var key = parentId + "/" + name;
    if (folderCache[key]) return Promise.resolve(folderCache[key]);
    return findInFolder(name, parentId).then(function (id) {
      if (id) { folderCache[key] = id; return id; }
      return createFolder(name, parentId).then(function (f) { folderCache[key] = f.id; return f.id; });
    });
  }
  // 이미 올라간 파일을 다른 폴더로 옮긴다
  function moveToParent(fileId, newParent) {
    if (!fileId || !newParent) return Promise.resolve();
    return driveJson("https://www.googleapis.com/drive/v3/files/" + fileId + "?fields=parents&supportsAllDrives=true")
      .then(function (f) {
        var prev = (f.parents || []).join(",");
        if (prev === newParent) return null;
        return driveJson("https://www.googleapis.com/drive/v3/files/" + fileId +

    return path.reduce(function (chain, nm) {

        .then(function (sub) { return { md: folder.id, file: sub }; });

    return driveJson("https://www.googleapis.com/drive/v3/files?fields=id&supportsAllDrives=true", {

        return blobToBase64(b.blob).then(function (b64) {
          return uploadFile(b.name, mime, b64, true, null, parentId);
        }).catch(function (e2) {
          // 두 번 다 실패했으면 «처음» 실패한 이유가 진짜 원인이다. 그걸 앞에 세운다.
          var first = errText(e), second = errText(e2);
          throw new Error(first + (second && second !== first ? " · 재시도도 실패: " + second : ""));
        });
      });
  }

  function trashFile(id) {
    if (!id) return Promise.resolve();
    return driveFetch("https://www.googleapis.com/drive/v3/files/" + id + "?supportsAllDrives=true", {
      method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ trashed: true })
    }).catch(function () {});
  }
  // 같은 폴더에 같은 이름이 있으면 -2, -3 … 을 붙인다
  function uniqueName(name, parentId) {
    var stem = stemOf(name), ext = extOf(name);
    var q = "'" + parentId + "' in parents and trashed=false and name contains '" + qEsc(stem) + "'";
    return driveJson("https://www.googleapis.com/drive/v3/files?q=" + encodeURIComponent(q) +
      "&fields=files(name)&pageSize=100&supportsAllDrives=true&includeItemsFromAllDrives=true")
      .then(function (j) {
        var used = {};
        (j.files || []).forEach(function (f) { used[f.name] = 1; });
        if (!used[name]) return name;
        var i = 2;
        while (used[stem + "-" + i + ext]) i++;
        return stem + "-" + i + ext;
      })
      .catch(function () { return name; });
  }

  /* =========================================================
     5. 파일 이름 규칙
     ========================================================= */
  // 연결된 드라이브 폴더 이름 (파일명 앞머리에 붙이는 용도)
  function folderLabel() { return safeName(folder.name, 30); }
  function subfolderLabel() {
    if (settings.folderMode === "materials") return safeName(settings.materialsFolderName, 30);
    if (settings.folderMode === "monthly") return dateStamp().slice(0, 7);
    if (settings.folderMode === "tag") {
      // 작성 중인 기록의 첫 태그. 파일 이름 미리보기에서도 이게 {하위폴더} 로 보인다.
      var raw = ($("tags") && $("tags").value) || "";
      var first = raw.split(",")[0].trim();
      return first ? safeName(first, 30) : NO_TAG_FOLDER;
    }
    return "";
  }

  function applyPattern(pattern, ctx) {
    var out = String(pattern || "").replace(/\{([^}]*)\}/g, function (m, k) {
      switch (k) {
        case "폴더명": return ctx.folder;
        case "하위폴더": return ctx.subfolder;
        case "날짜": return ctx.date;
        case "시간": return ctx.time;
        case "유형": return ctx.type;
        case "제목": return ctx.title;
        case "태그": return ctx.tag;             // 첫 태그. 없으면 빈칸 (구분자는 알아서 정리된다)
        case "자료제목": return ctx.caption;      // 이 사진·파일에 적어 둔 제목
        case "번호": return ctx.no;
        case "원본이름": return ctx.stem;
        case "확장자": return ctx.ext.replace(/^\./, "");
        default: return "";
      }
    });
    out = safeName(out, 110);
    // 빈 토큰 때문에 생긴 중복 구분자를 정리한다 (예: 폴더 미연결 시 "_2026-08-16_…")
    out = out.replace(/_{2,}/g, "_").replace(/^[_\s-]+/, "").replace(/[_\s-]+$/, "");
    return out || "무제";
  }
  /* 태그는 여러 개일 수 있다. 파일 이름에는 «첫 태그» 만 넣는다.
     전부 넣으면 이름이 걷잡을 수 없이 길어지고, 태그 순서를 바꾸면 이름도 바뀐다. */
  function firstTag(entry) {
    var t = (entry && entry.tags || []).filter(Boolean)[0];
    return t ? safeName(String(t), 24) : "";
  }
  function nameContext(entry, order, original, ext, caption) {
    return {
      folder: folderLabel(), subfolder: subfolderLabel(),
      date: dateStamp(entry.createdAt), time: timeStamp(entry.createdAt),
      type: typeOf(entry.type).label,
      title: safeName(entry.title, 40) || "무제",
      tag: firstTag(entry),
      caption: safeName(String(caption || ""), 40),
      no: pad2(order || 1),
      stem: safeName(stemOf(original || ""), 40),
      ext: ext || ""
    };
  }
  /* 사진·파일 이름.
     block 을 함께 주면 그 자료에 적어 둔 제목({자료제목})까지 이름에 들어간다. */
  function attachName(entry, order, original, block) {
    var ext = extOf(original);
    var ctx = nameContext(entry, order, original, ext, block && block.caption);
    if (!ctx.stem) ctx.stem = "파일";
    var name = applyPattern(settings.filePattern, ctx);
    if (settings.filePattern.indexOf("{확장자}") < 0) name += ext;
    return name;
  }
  function mdName(entry) {
    var ctx = nameContext(entry, 1, "", ".md");
    ctx.title = safeName(entry.title, 50) || "무제";
    return applyPattern(settings.mdPattern, ctx) + ".md";
  }
  function patternPreview(pattern, isMd) {
    var ctx = {
      folder: folderLabel() || "기록폴더", subfolder: subfolderLabel() || "자료",
      date: dateStamp(), time: timeStamp(),
      type: typeOf(currentType).label,
      title: safeName($("title") && $("title").value, 40) || "수업 회고",
      tag: safeName((($("tags") && $("tags").value) || "").split(",")[0].trim(), 24) || "수업설계",
      caption: isMd ? "" : "칠판 정리",
      no: "01", stem: "IMG_4821", ext: isMd ? ".md" : ".png"
    };
    var out = applyPattern(pattern, ctx);
    if (isMd) return out + ".md";
    return out + (pattern.indexOf("{확장자}") < 0 ? ".png" : "");
  }

  /* =========================================================
     5-2. 위키링크 [[제목]] · 백링크
     ========================================================= */
  // [[제목]] 또는 [[제목|보일 글자]]
  function wikiRe() { return /\[\[([^\[\]|]+?)(?:\|([^\[\]]*?))?\]\]/g; }
  function normTitle(s) { return String(s == null ? "" : s).trim().toLowerCase().replace(/\s+/g, " "); }
  function isTextBlock(b) { return b.kind === "text" || b.kind === "quote" || b.kind === "heading"; }

  var _linkCache = null;   // { byTitle, out, back } · 렌더 한 번당 한 번만 계산
  function invalidateLinks() { _linkCache = null; }

  function linkData() {
    if (_linkCache) return _linkCache;
    var byTitle = {}, out = {}, back = {};
    /* ⚠️ 휴지통에 든 기록은 연결에서도 «없는 것» 이라야 한다.
       안 그러면 지운 기록이 다른 기록의 백링크로 계속 남고,
       [[제목]] 도 그리로 이어져서 «지웠는데 왜 아직 있나» 가 된다. */
    var lv = liveEntries();
    lv.forEach(function (n) {
      var k = normTitle(n.title);
      if (k && !byTitle[k]) byTitle[k] = n;
    });
    var byId = {};
    lv.forEach(function (n) { byId[n.id] = n; });
    lv.forEach(function (n) {
      var seen = {}, list = [];
      // ① 글 안에 쓴 [[제목]]
      (n.blocks || []).forEach(function (b) {
        if (!isTextBlock(b)) return;
        var re = wikiRe(), m;
        while ((m = re.exec(b.text || ""))) {
          var target = (m[1] || "").trim();
          var k = normTitle(target);
          if (!k || seen[k]) continue;
          seen[k] = 1;
          list.push({ title: target, key: k, to: byTitle[k] ? byTitle[k].id : null, via: "text", label: "" });
        }
      });
      // ② 관계망에서 직접 이어준 연결 (설명이 붙을 수 있음)
      (n.relations || []).forEach(function (r) {
        var tgt = byId[r.to];
        if (!tgt) return;
        var k = normTitle(tgt.title);
        var already = null;
        for (var i = 0; i < list.length; i++) if (list[i].key === k) { already = list[i]; break; }
        if (already) {
          already.via = "both";
          if (r.label && !already.label) already.label = r.label;
          return;
        }
        seen[k] = 1;
        list.push({ title: tgt.title, key: k, to: tgt.id, via: "relation", label: r.label || "" });
      });
      out[n.id] = list;
      list.forEach(function (l) {
        if (!l.to || l.to === n.id) return;
        (back[l.to] = back[l.to] || []).push({ from: n.id, label: l.label || "" });
      });
    });
    _linkCache = { byTitle: byTitle, out: out, back: back };
    return _linkCache;
  }
  /* 목록 보기에서 이 기록이 놓일 «폴더 이름».
     정리 방식이 정하는 그대로다. 드라이브에 실제로 만들어지는 폴더와 같은 이름이어야
     화면과 드라이브가 어긋나지 않는다. */
  var listOpen = {};          // 목록 보기에서 접은 폴더
  var linkOpen = {};          // 목록 보기에서 «연결» 을 펼쳐 둔 기록
  /* 목록 보기 = «디렉토리» · 나무와 같은 자를 써야 한다.
     ⚠️ 전에는 여기서 정리 방식만 보고 폴더를 정했다. 그래서
        · 「부기」 자리를 골라 쓴 글이 목록 보기에서는 태그 이름 아래로 갔고
        · 태그가 여럿인 글은 첫 태그 폴더에만 나왔다
        같은 기록이 어느 보기냐에 따라 다른 폴더에 앉아 있었다. */
  function listFoldersOf(n) {
    if (settings.folderMode === "materials" && !(n.srcPath || []).length &&
        !(n.deskPath || []).length && !n.deskName) return [""];   // 글은 맨 위에 놓인다
    return placesOf(n).map(function (p) { return p.join(" / "); });
  }

  /* 목록 한 줄. 연결(🔗)을 눌러 «누구와 이어져 있는지» 그 자리에서 펼쳐 본다.
     잇는 것은 여전히 편집·관계망에서 하고, 여기서는 «보기» 만 한다. */
  function listRow(n, indented) {
    var t = typeOf(n.type);
    var wrap = el("div", "lwrap");
    var row = el("div", "lrow" + (indented ? " lin" : ""));
    row.setAttribute("data-eid", n.id);
    row.appendChild(el("span", "lico", t.icon));
    var ttl = el("button", "ltitle", n.title || "(제목 없음)");
    ttl.addEventListener("click", function () {
      settings.viewMode = "stream"; saveSettingsLocal(); expanded[n.id] = true; render(); gotoEntry(n.id);
    });
    row.appendChild(ttl);

    var outs = outLinks(n).filter(function (l) { return l.to; });
    var ins = backLinks(n);
    if (outs.length || ins.length) {
      var lk = el("button", "lmeta linkbtn" + (linkOpen[n.id] ? " on" : ""), "🔗 " + outs.length + "/" + ins.length);
      lk.type = "button";
      lk.title = "이어진 기록 보기 (나가는 " + outs.length + " · 들어오는 " + ins.length + ")";
      lk.addEventListener("click", function () { linkOpen[n.id] = !linkOpen[n.id]; render(); });
      row.appendChild(lk);
    }
    var att = (n.blocks || []).filter(function (b) { return b.kind === "image" || b.kind === "file"; }).length;
    if (att) row.appendChild(el("span", "lmeta", "📎 " + att));
    row.appendChild(el("span", "lwhen", formatDate(n.createdAt).slice(0, 10)));
    var bd = el("button", "btn xs danger", "✕");
    bd.addEventListener("click", function () { removeEntry(n.id); });
    row.appendChild(bd);
    wrap.appendChild(row);

    if (linkOpen[n.id]) {
      var panel = el("div", "linkpanel" + (indented ? " lin" : ""));
      /* ⚠️ 두 목록의 «생김새가 다르다».
         outLinks 는 { to, label } 이고, backLinks 는 { entry, label } 이다.
         한 가지로 뭉뚱그리면 들어오는 연결이 통째로 안 보인다. */
      function side(label, items, isBack) {
        if (!items.length) return;
        var g = el("div", "linkgroup");
        g.appendChild(el("span", "linklabel", label));
        items.forEach(function (l) {
          var to = isBack ? l.entry : entries.filter(function (e) { return e.id === l.to; })[0];
          if (!to) return;
          var b = el("button", "linkchip", (typeOf(to.type).icon || "") + " " + (to.title || "(제목 없음)"));
          b.type = "button";
          if (l.label) b.appendChild(el("span", "linkwhy", " · " + l.label));
          b.addEventListener("click", function () {
            settings.viewMode = "stream"; saveSettingsLocal(); expanded[to.id] = true; render(); gotoEntry(to.id);
          });
          g.appendChild(b);
        });
        panel.appendChild(g);
      }
      side("이 기록이 가리키는 것", outs, false);
      side("이 기록을 가리키는 것", ins, true);
      panel.appendChild(el("span", "linkhint", "잇거나 끊는 것은 «편집» 또는 «관계망» 에서 합니다."));
      wrap.appendChild(panel);
    }
    return wrap;
  }

  function outLinks(n) { return linkData().out[n.id] || []; }
  function backLinks(n) {
    var list = linkData().back[n.id] || [];
    return list.map(function (b) {
      var e = entries.filter(function (x) { return x.id === b.from; })[0];
      return e ? { entry: e, label: b.label || "" } : null;
    }).filter(Boolean);
  }
  // 관계망에서 만든 연결 추가·삭제
  function addRelation(fromId, toId, label) {
    if (!fromId || !toId || fromId === toId) return false;
    var n = entries.filter(function (x) { return x.id === fromId; })[0];
    if (!n) return false;
    n.relations = n.relations || [];
    var found = null;
    n.relations.forEach(function (r) { if (r.to === toId) found = r; });
    if (found) found.label = label || found.label;
    else n.relations.push({ to: toId, label: label || "" });
    n.updatedAt = Date.now(); n._dirty = true;
    invalidateLinks(); saveLocal(); render();
    if (connected) syncPending();
    return true;
  }
  function removeRelation(fromId, toId) {
    var n = entries.filter(function (x) { return x.id === fromId; })[0];
    if (!n || !n.relations) return;
    n.relations = n.relations.filter(function (r) { return r.to !== toId; });
    n.updatedAt = Date.now(); n._dirty = true;
    invalidateLinks(); saveLocal(); render();
    if (connected) syncPending();
  }
  function findByTitle(t) { return linkData().byTitle[normTitle(t)] || null; }

  // 목록에서 해당 기록으로 이동 + 잠깐 강조
  function gotoEntry(id) {
    closeModal();
    if (filterType !== "all" || searchQ || filterTags.length) {
      filterType = "all"; searchQ = ""; filterTags = []; filterPath = []; $("search").value = ""; render();
    }
    expanded[id] = true;
    render();
    setTimeout(function () {
      var card = document.querySelector('[data-eid="' + id + '"]');
      if (!card) return;
      card.scrollIntoView({ behavior: "smooth", block: "center" });
      card.classList.add("flash");
      setTimeout(function () { card.classList.remove("flash"); }, 1500);
    }, 30);
  }
  // 아직 없는 제목을 눌렀을 때 · 그 제목으로 새 기록 시작
  function startNewFromLink(title) {
    if (editingId || hasContent() || $("title").value.trim()) {
      if (!window.confirm("작성 중인 내용을 두고 「" + title + "」 새 기록을 시작할까요?")) return;
    }
    closeModal();
    resetComposer();
    $("title").value = title;
    addBlock("text");
    window.scrollTo({ top: 0, behavior: "smooth" });
    toast("「" + title + "」 기록을 새로 시작합니다.");
  }
  function wikiLinkEl(target, label) {
    var found = findByTitle(target);
    var a = el("a", "wikilink" + (found ? "" : " missing"), label || target);
    a.href = "javascript:void(0)";
    a.title = found ? "이동: " + found.title : "아직 없는 기록 · 눌러서 만들기";
    a.addEventListener("click", function (e) {
      e.preventDefault();
      if (found) gotoEntry(found.id); else startNewFromLink(target);
    });
    return a;
  }
  // 텍스트를 [[링크]] 가 살아 있는 노드들로 붙인다
  /* 글 안 서식 · 굵게 · 기울임 · 밑줄 · 취소선 · 형광펜 · 코드
     ⚠️ 저장하는 것은 «마크다운 그대로» 다. 서식은 보여 줄 때만 입힌다.
        그래야 드라이브에 남는 .md 가 옵시디언·깃허브에서도 그대로 읽힌다.
        형광펜(==노랑==)과 밑줄(<u>)만 마크다운 표준 밖이라 흔한 확장 표기를 따른다.
     한 번에 하나씩만 본다 · 겹쳐 쓰는 것(굵은 형광펜)까지 받으면 파서가 커진다. */
  var INLINE_RE = /(\*\*|__)(?=\S)([\s\S]*?\S)\1|(~~)(?=\S)([\s\S]*?\S)\3|(==)(?=\S)([\s\S]*?\S)\5|(`)([^`\n]+?)\6|(\*|_)(?=\S)([\s\S]*?\S)\8/;
  /* 색 있는 형광펜 · 마크다운에는 «색» 이라는 것이 없어서 <mark> 를 그대로 쓴다.
     ⚠️ HTML 을 통째로 해석하지 않는다. 여는 표가 «색 하나» 인 이 모양일 때만 알아본다.
        그래야 남이 보낸 글에 붙어 온 딴 표가 그대로 살아나는 일이 없다. */
  var MARK_RE = /<mark style="background:(#[0-9a-fA-F]{3,8})">([\s\S]*?)<\/mark>/;
  function appendInline(host, s) {
    s = String(s == null ? "" : s);
    var guard = 0;
    while (s && guard++ < 400) {
      var mk = MARK_RE.exec(s);
      var m0 = INLINE_RE.exec(s);
      // 둘 다 걸리면 앞에 있는 것부터 · 순서가 뒤집히면 조각이 어긋난다
      if (mk && (!m0 || mk.index <= m0.index)) {
        if (mk.index > 0) host.appendChild(document.createTextNode(s.slice(0, mk.index)));
        var mel = document.createElement("mark");
        mel.style.background = mk[1];
        appendInline(mel, mk[2]);
        host.appendChild(mel);
        s = s.slice(mk.index + mk[0].length);
        continue;
      }
      var m = m0;
      if (!m) break;
      if (m.index > 0) host.appendChild(document.createTextNode(s.slice(0, m.index)));
      var tag = "b", inner = "";
      if (m[1]) { tag = "b"; inner = m[2]; }
      else if (m[3]) { tag = "s"; inner = m[4]; }
      else if (m[5]) { tag = "mark"; inner = m[6]; }
      else if (m[7]) { tag = "code"; inner = m[8]; }
      else { tag = "i"; inner = m[10]; }
      var node = document.createElement(tag);
      if (tag === "code") node.textContent = inner;
      else appendInline(node, inner);          // 굵은 글 안의 기울임까지는 받는다
      host.appendChild(node);
      s = s.slice(m.index + m[0].length);
    }
    if (s) host.appendChild(document.createTextNode(s));
  }
  // [글자](https://…) 꼴 링크도 링크로 · 종이에서 웹 글을 붙여넣으면 이 꼴로 남는다
  function appendRichText(host, text) {
    var s = String(text == null ? "" : text);
    var re = /\[([^\[\]]+?)\]\((https?:\/\/[^\s)]+)\)/g, last = 0, m;
    while ((m = re.exec(s))) {
      if (m.index > last) appendWikiText(host, s.slice(last, m.index));
      var a = el("a", "mdlink", m[1]);
      a.href = m[2]; a.target = "_blank"; a.rel = "noopener noreferrer";
      host.appendChild(a);
      last = re.lastIndex;
    }
    if (last < s.length) appendWikiText(host, s.slice(last));
  }
  function appendWikiText(host, text) {
    var s = String(text == null ? "" : text);
    var re = wikiRe(), last = 0, m;
    while ((m = re.exec(s))) {
      if (m.index > last) appendInline(host, s.slice(last, m.index));
      var target = (m[1] || "").trim();
      var label = (m[2] != null && m[2].trim()) ? m[2].trim() : target;
      host.appendChild(wikiLinkEl(target, label));
      last = re.lastIndex;
    }
    if (last < s.length) appendInline(host, s.slice(last));
  }

  /* =========================================================
     6. 마크다운 생성

  /* ---------- 링크로 공유 ----------
     구글 문서에 «링크가 있는 사람 = 읽기» 권한을 얹고 그 주소를 준다.
     ⚠️ HTML 파일로는 안 된다. 드라이브는 2016년에 웹페이지로 열어주는 기능을 없앴다.

  /* 구글 문서를 «웹에 게시» / «게시 끄기».

        구글은 게시한 쪽(/pub)을 저장해 두었다가 내린 뒤에도 한동안 계속 내준다.
        그래서 우리가 할 수 있는 일이 셋이다 · 이 순서로 다 한다.
          ① 저절로 다시 게시되는 것을 먼저 끊는다 (publishAuto)
          ② 게시를 내린다
          ③ 정말 내려갔는지 «되읽어» 확인한다 — 「껐습니다」 는 틀리게 말하면 안 되는 말이다
        그래도 남는 것이 구글 쪽 저장본이다. 그것까지 없애려면 가리킬 문서 자체를
        없애는 수밖에 없다 (hard). 기록은 그대로 있고, 문서는 다시 만들 수 있다.
     ⚠️ 오류를 삼키면 안 된다. 못 껐는데 껐다고 말하는 쪽이 훨씬 나쁘다. */
  function unpublishDoc(docId, hard) {
    if (!docId) return Promise.resolve();
    var head = "https://www.googleapis.com/drive/v3/files/" + docId + "/revisions/head";
    return driveJson(head + "?fields=id", {
      method: "PATCH", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ publishAuto: false })
    }).catch(function () { /* 이 한 줄이 막혀도 아래 진짜 내리기는 해봐야 한다 */ })
      .then(function () {
        return driveJson(head + "?fields=id", {
          method: "PATCH", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ published: false, publishAuto: false, publishedOutsideDomain: false })
        });
      })
      .then(function () {

        }).catch(function (e) {

        });

  /* =========================================================
     🌐 웹 쪽으로 공유 · 사진·영상·녹음까지 한 쪽에

     왜 이렇게 하나:
       · 드라이브는 2016년부터 .html 을 «웹페이지» 로 안 열어 준다 (내려받기 화면만 뜬다)
       · 구글 문서(/pub)는 사진은 실어도 «영상·녹음» 은 못 싣는다
     그래서 읽는 쪽(view.html)을 이 앱과 같은 자리에 두고,
       · 글·제목·태그는 «주소 뒤(#)» 에 눌러 담아 보내고
       · 사진·영상·녹음은 드라이브에서 바로 불러오게 한다
     서버도, 새 열쇠(API 키)도 필요 없다.

     ⚠️ 이 길은 딸린 파일 하나하나를 «링크가 있는 사람 = 읽기» 로 엽니다.
        그래서 공유 창의 «사진 확인 관문» 을 반드시 지나야 합니다.
     ========================================================= */
  function bytesToB64url(bytes) {
    var bin = "", CH = 0x8000;
    for (var i = 0; i < bytes.length; i += CH) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
    }
    return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }
  /* ⚠️ view.html 의 decodePacket() 과 «짝» 이다. 한쪽을 고치면 다른 쪽도 고쳐야 한다.
     맨 앞 한 글자가 표시 · "1" 은 눌러 담은 것, "0" 은 그냥 담은 것. */
  function encodePacket(obj) {
    var bytes = new TextEncoder().encode(JSON.stringify(obj));
    if (typeof CompressionStream === "undefined") {
      return Promise.resolve("0" + bytesToB64url(bytes));
    }
    var cs = new CompressionStream("gzip");
    var w = cs.writable.getWriter();
    // 돌려주는 약속을 그냥 두면 «아무도 안 받은 거부» 가 되어 콘솔에 오류로 남는다
    var hush = function () {};
    w.write(bytes).catch(hush);
    w.close().catch(hush);
    return new Response(cs.readable).arrayBuffer().then(function (buf) {
      return "1" + bytesToB64url(new Uint8Array(buf));
    });
  }
  // 이 기록에서 «남에게 열어 줘야 하는» 드라이브 파일들
  function sharedFileIds(n) {
    var ids = [];
    (n.blocks || []).forEach(function (b) {
      if ((b.kind === "image" || b.kind === "file") && b.fileId && ids.indexOf(b.fileId) < 0) ids.push(b.fileId);
    });
    return ids;
  }
  function buildSharePacket(n) {
    var p = {
      v: 1,
      t: n.title || "",
      d: n.createdAt || Date.now(),
      g: (n.tags || []).slice(0, 12),
      th: settings.theme || "lego",
      tn: toneOf(settings.theme || "lego", settings.tone),   // 색감 · 받는 쪽도 같은 옷을 입는다
      b: []
    };
    (n.blocks || []).forEach(function (b) {
      if (b.kind === "text" || b.kind === "heading" || b.kind === "quote") {
        if (b.text && b.text.trim()) {
          var pb = { k: b.kind, x: b.text };
          if (b.kind === "quote" && b.role) { pb.r = b.role; if (b.src) pb.s = b.src; }   // 누가 말한 것인지 · 받는 쪽도 안다
          p.b.push(pb);
        }
      } else if (b.kind === "todo") {
        var ti = (b.items || []).filter(function (it) { return it.t && it.t.trim(); })
          .map(function (it) { return { x: it.t, c: it.done ? 1 : 0 }; });
        if (ti.length) p.b.push({ k: "todo", i: ti });
      } else if (b.kind === "list") {
        var li = (b.items || []).filter(function (it) { return it.t && it.t.trim(); })
          .map(function (it) { return { x: it.t, d: it.d || 0 }; });
        if (li.length) p.b.push({ k: "list", o: b.ordered ? 1 : 0, i: li });
      } else if (b.kind === "code") {
        if (b.text && b.text.trim()) p.b.push({ k: "code", x: b.text, g: b.lang || "" });
      } else if (b.kind === "table") {
        var rw = (b.rows || []).filter(function (r) {
          return (r || []).some(function (c) { return c && String(c).trim(); });
        });
        if (rw.length || (b.head || []).some(function (x) { return x && x.trim(); })) {
          p.b.push({ k: "table", h: (b.head || []).map(function (x) { return x || ""; }), r: rw });
        }
      } else if (b.kind === "fold") {
        if ((b.title && b.title.trim()) || (b.text && b.text.trim())) {
          p.b.push({ k: "fold", t: b.title || "", x: b.text || "", o: b.open ? 1 : 0 });
        }
      } else if (b.kind === "divider") {
        p.b.push({ k: "divider" });
      } else if (b.kind === "link") {

      } else if (b.kind === "image" && b.fileId) {

      } else if (b.kind === "file" && b.fileId) {

      }

    });

  function shareToAnyone(fileId) {

  function copyText(s) {

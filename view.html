<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#ffffff" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600&display=swap" />
<meta name="robots" content="noindex, nofollow" />
<title>기록 보기 · 개인지식운영체계</title>
<!-- 보내는 쪽(index.html)과 같은 글꼴로 서야 «같은 기록» 처럼 보인다 -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" />
<style>
  /* ─────────────────────────────────────────────────────────
     받는 사람이 보는 쪽. 로그인도 앱도 필요 없다.
     글은 주소 뒤(#)에 담겨 오고, 사진·영상·녹음은 드라이브에서 바로 불러온다.
     ⚠️ 이 파일은 index.html 과 «따로» 돈다. 여기 색 토큰을 고치면 저쪽도 같이 맞춰야 한다.
     ───────────────────────────────────────────────────────── */
  :root {
    --bg: #f5f7fb; --panel: #fff; --ink: #1b2130; --ink-soft: #667085;
    --brand: #2f5fd6; --line: #e3e8f2; --line-soft: #eef1f7;
    --font-body: "Pretendard Variable", "Pretendard", -apple-system, BlinkMacSystemFont,
                 "Apple SD Gothic Neo", "Segoe UI", "Malgun Gothic", system-ui, sans-serif;
    --font-title: var(--font-body);
    --radius: 14px; --bw: 1px;
    --shadow: 0 1px 3px rgba(20,30,60,.06), 0 8px 24px rgba(20,30,60,.06);
  }
  [data-theme="memo"], [data-theme="brick"], [data-theme="play"] {
    --bg: #FBF6EE; --panel: #FFFDF8; --ink: #26221E; --ink-soft: #6E6459;
    --brand: #A8483C; --line: #26221E; --line-soft: #E2D8C6;
    --font-title: "Gaegu", var(--font-body); --bw: 2.5px; --shadow: none;
  }
  [data-theme="brick"] { --radius: 8px; }
  [data-theme="play"] { --radius: 18px; --bw: 3.5px; --font-title: "Jua", var(--font-body); }
  [data-theme="note"] {
    --bg: #EFE7DA; --panel: #FFFCF5; --ink: #26221E; --ink-soft: #6E6459;
    --brand: #A8483C; --line: #DCD1BE; --line-soft: #EFE7DA;
    --font-title: "Gaegu", var(--font-body); --radius: 4px; --bw: 1.5px; --shadow: none;
  }
  [data-theme="paper"] {
    --bg: #F4F2ED; --panel: #fff; --ink: #1F1D1A; --ink-soft: #6B6660;
    --brand: #3A4A5C; --line: #DAD5CC; --line-soft: #EDEAE3;
    --font-body: "Gowun Batang", serif; --font-title: "Gowun Batang", serif;
    --radius: 2px; --shadow: none;
  }
  /* 레고 · 지금의 단 하나의 모양. 옛 블록들은 옛 링크를 위해 남겨 둔다 */
  [data-theme="lego"] {
    --bg: #FBF6EE; --panel: #FFFDF8; --ink: #26221E; --ink-soft: #6E6459;
    --brand: #A8483C; --line: #E2D8C6; --line-soft: #EFE7DA;
    --font-title: "Jua", var(--font-body); --radius: 20px; --bw: 1px;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.07);
  }
  [data-theme="draft"] {
    --bg: #EDF1F4; --panel: #fff; --ink: #16202B; --ink-soft: #5A6B7C;
    --brand: #0E6FA8; --line: #C6D2DC; --line-soft: #E6ECF1;
    --font-body: "IBM Plex Sans KR", sans-serif; --font-title: "IBM Plex Sans KR", sans-serif;
    --radius: 0px; --shadow: none;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #12161f; --panel: #1b202b; --ink: #e8ecf4; --ink-soft: #98a2b3;
            --brand: #7d9dff; --line: #2b3242; --line-soft: #232936;
            --shadow: 0 1px 3px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); }
    [data-theme="memo"], [data-theme="brick"], [data-theme="note"], [data-theme="play"],
    [data-theme="paper"], [data-theme="draft"], [data-theme="lego"] {
      --bg: #1C1917; --panel: #24201C; --ink: #F0E9DD; --ink-soft: #A79B8B;
      --brand: #E08A7C; --line: #4A423A; --line-soft: #332D27;
    }
  }
  /* =========================================================
     색감 여섯 · index.html 의 색감 블록을 그대로 옮겨 왔다.
     보낸 사람이 고른 색감(tn)이 주소에 실려 오면 받는 쪽도 같은 옷을 입는다.
     ⚠️ 손으로 고치지 말 것 · index.html 쪽과 같은 팔레트여야 한다.
        고칠 일이 있으면 색감만들기.mjs 로 찍어 양쪽에 같이 심는다.
     ========================================================= */
  /* 노션 · 흰 종이에 파랑 (index.html 과 같은 값) */
  [data-tone="notion"] {
    color-scheme: light;
    --bg: #ffffff; --panel: #ffffff; --ink: #37352f; --ink-soft: #787774;
    --brand: #2383e2; --brand-dark: #1b6fc2; --brand-soft: #e8f0fb;
    --line: #e9e9e7; --line-soft: #f1f1ef; --hard: #37352f;
    --warn-bg: #fbf3db; --warn-line: #f0e1b0; --warn-ink: #7a5400;
    --ok-bg: #edf3ec; --ok-line: #cfe3cc; --ok-ink: #2c5a34; --pin-bg: #fbf3db;
    --t1: #0f7b6c; --t1s: #edf3ec; --t2: #2383e2; --t2s: #e8f0fb;
    --t3: #cb912f; --t3s: #fbf3db; --t4: #d9730d; --t4s: #faebdd;
    --t5: #ad1a72; --t5s: #f9e6f0; --t6: #6940a5; --t6s: #f0e8f7;
    --shadow: none; --radius: 6px;
  }
  [data-tone="notion"][data-mode="dark"] {
    color-scheme: dark;
    --bg: #191919; --panel: #191919; --ink: #d4d4d4; --ink-soft: #9b9b9b;
    --brand: #529cca; --brand-dark: #6fb0dc; --brand-soft: #1f2d3a;
    --line: #2f2f2f; --line-soft: #262626; --hard: #000;
    --warn-bg: #2f2a1a; --warn-line: #4a4025; --warn-ink: #e0c26a;
    --ok-bg: #1b2b24; --ok-line: #2e4a3c; --ok-ink: #8fd1b5; --pin-bg: #2f2a1a;
    --t1: #4fb39f; --t1s: #1b2b27; --t2: #529cca; --t2s: #1f2d3a;
    --t3: #d7b35c; --t3s: #2f2a1a; --t4: #e39a5c; --t4s: #33261a;
    --t5: #d66fa8; --t5s: #33202b; --t6: #a688d6; --t6s: #2a2336;
  }
  /* 남색 · 참고 디자인의 옷 (index.html 과 같은 값) */
  [data-tone="star"] {
    color-scheme: light;
    --bg: #f4f5f8; --panel: #ffffff; --ink: #1b2130; --ink-soft: #6b7689;
    --brand: #8f7240; --brand-dark: #745a30; --brand-soft: #f3ecdd;
    --line: #e1e5ee; --line-soft: #edf0f5; --hard: #1b2130;
    --warn-bg: #fbf5e6; --warn-line: #ead9b0; --warn-ink: #6b4e00;
    --ok-bg: #e9f4ef; --ok-line: #bfdccd; --ok-ink: #1f5c3f; --pin-bg: #f6efdc;
    --t1: #3b5f9e; --t1s: #e6edf9; --t2: #8a6a2a; --t2s: #f5eddb;
    --t3: #6b5a9e; --t3s: #ece8f7; --t4: #2f7a68; --t4s: #e2f1ec;
    --t5: #a25a54; --t5s: #f8e6e3; --t6: #5f5b52; --t6s: #ecebe6;
  }
  [data-tone="star"][data-mode="dark"] {
    color-scheme: dark;
    --bg: #101928; --panel: #172235; --ink: #e6e8ec; --ink-soft: #92a0b6;
    --brand: #d9bf91; --brand-dark: #e7d0a8; --brand-soft: #2a2d36;
    --line: #263248; --line-soft: #1f2a3d; --hard: #05090f;
    --warn-bg: #1f2233; --warn-line: #3d3a34; --warn-ink: #d9bf91;
    --ok-bg: #16262c; --ok-line: #2a4a45; --ok-ink: #93c5b4; --pin-bg: #2a2a2e;
    --t1: #a9bde6; --t1s: #1e2a40; --t2: #d9be8b; --t2s: #2f2b22;
    --t3: #bbaddd; --t3s: #2a2739; --t4: #92c7bb; --t4s: #1c2f2c;
    --t5: #d5a5a0; --t5s: #2f2527; --t6: #c9c5bb; --t6s: #262932;
    --font-title: "Noto Serif KR", "Nanum Myeongjo", Georgia, serif; --shadow: none; --radius: 12px;
  }
  /* 크래프트 · 크림 종이에 붉은 흙 */
  [data-tone="craft"] {
    --bg: #FBF6EE; --panel: #FFFDF8; --ink: #26221E; --ink-soft: #685F54;
    --brand: #A8483C; --brand-dark: #7F352C; --brand-soft: #F6E2DC;
    --line: #DCD1BE; --line-soft: #E2D8C6; --hard: #26221E;
    --warn-bg: #FBF3E0; --warn-line: #E8D9B4; --warn-ink: #6B5320;
    --ok-bg: #EDF3E8; --ok-line: #CFDDC2; --ok-ink: #3F5A33; --pin-bg: #F7EBD2;
    --t1: #4F6B3E; --t1s: #DFEAC8; --t2: #3A5D85; --t2s: #D6E6F2;
    --t3: #7A5A12; --t3s: #FBE8BE; --t4: #8F5626; --t4s: #F7DFC4;
    --t5: #8E4A60; --t5s: #F8DCE2; --t6: #4C4370; --t6s: #E5DDF0;
  }
  /* 깔끔 · 흰 종이에 청록 */
  [data-tone="clean"] {
    --bg: #F6F7F8; --panel: #FFFFFF; --ink: #1A1D1F; --ink-soft: #6B7280;
    --brand: #0F8F84; --brand-dark: #0B6E66; --brand-soft: #E3F3F1;
    --line: #E5E7EA; --line-soft: #F0F1F3; --hard: #1A1D1F;
    --warn-bg: #FFF7E6; --warn-line: #F0DCA8; --warn-ink: #6B4E00;
    --ok-bg: #E9F6EF; --ok-line: #BCE2CE; --ok-ink: #10603C; --pin-bg: #FFF3D6;
    --t1: #2F7A55; --t1s: #E6F2EB; --t2: #2563C4; --t2s: #E7EFFB;
    --t3: #8A6414; --t3s: #F7EFDC; --t4: #A05226; --t4s: #FAEADF;
    --t5: #98436D; --t5s: #FAE6F0; --t6: #56499E; --t6s: #ECE9F8;
  }
  /* 볕 · 노란 종이에 빨강 */
  [data-tone="sunny"] {
    --bg: #FFF8E4; --panel: #FFFFFF; --ink: #2B2118; --ink-soft: #6C5D4B;
    --brand: #D8402F; --brand-dark: #B22F21; --brand-soft: #FFE0DB;
    --line: #E7D8B4; --line-soft: #F0E2C4; --hard: #2B2118;
    --warn-bg: #FFF3D4; --warn-line: #EFDCA6; --warn-ink: #6B5117;
    --ok-bg: #E9F6E4; --ok-line: #C6E2BC; --ok-ink: #33612F; --pin-bg: #FFEFC2;
    --t1: #2B6F2F; --t1s: #CDEBC6; --t2: #1F63B8; --t2s: #CFE3F8;
    --t3: #8C6300; --t3s: #FFEDB8; --t4: #A34615; --t4s: #FFDDC2;
    --t5: #A83567; --t5s: #FFD6E6; --t6: #6B44B0; --t6s: #E4D8F8;
  }
  /* 하늘 · 흰 종이에 파랑 */
  [data-tone="sky"] {
    --bg: #F5F7FB; --panel: #FFFFFF; --ink: #1B2130; --ink-soft: #5A6478;
    --brand: #2F5FD6; --brand-dark: #24499F; --brand-soft: #EAF0FF;
    --line: #E3E8F2; --line-soft: #EEF1F7; --hard: #1B2130;
    --warn-bg: #FFF8E6; --warn-line: #F0DCA8; --warn-ink: #6B4E00;
    --ok-bg: #EAF7F0; --ok-line: #B9E3CD; --ok-ink: #0F5C39; --pin-bg: #FFF4D6;
    --t1: #2F6D4A; --t1s: #E3F1E8; --t2: #2F5FD6; --t2s: #EAF0FF;
    --t3: #7A5A12; --t3s: #F7EEDA; --t4: #9A4E24; --t4s: #FBE9DE;
    --t5: #94406A; --t5s: #FBE4EE; --t6: #4F45A8; --t6s: #EAE7FA;
  }
  /* 먹 · 회백 종이에 먹 */
  [data-tone="ink"] {
    --bg: #F4F2ED; --panel: #FFFFFF; --ink: #1F1D1A; --ink-soft: #65605A;
    --brand: #3A4A5C; --brand-dark: #2A3745; --brand-soft: #E7EBF0;
    --line: #DAD5CC; --line-soft: #EDEAE3; --hard: #1F1D1A;
    --warn-bg: #F6F1E4; --warn-line: #E0D6BE; --warn-ink: #6B5A32;
    --ok-bg: #EBF0EB; --ok-line: #CBD8CB; --ok-ink: #3E5540; --pin-bg: #F2ECDC;
    --t1: #3F5C3F; --t1s: #E6EDE5; --t2: #37506A; --t2s: #E4EBF1;
    --t3: #6B5828; --t3s: #F0EADC; --t4: #6B4633; --t4s: #EFE5DE;
    --t5: #5E3B4A; --t5s: #EDE3E7; --t6: #454063; --t6s: #E7E5EF;
  }
  /* 청사진 · 청회 바탕에 청록 */
  [data-tone="blue"] {
    --bg: #EDF1F4; --panel: #FFFFFF; --ink: #16202B; --ink-soft: #54636F;
    --brand: #0E6FA8; --brand-dark: #0A5580; --brand-soft: #DCEDF8;
    --line: #C6D2DC; --line-soft: #E6ECF1; --hard: #16202B;
    --warn-bg: #EEF3F7; --warn-line: #C6D2DC; --warn-ink: #3E5468;
    --ok-bg: #E9F2EC; --ok-line: #C2D8CA; --ok-ink: #2E5741; --pin-bg: #E4EDF4;
    --t1: #2B764A; --t1s: #E2F0E8; --t2: #1B6FA8; --t2s: #DEEDF7;
    --t3: #816613; --t3s: #F4EEDC; --t4: #9C5328; --t4s: #F7E9DE;
    --t5: #9C3F63; --t5s: #F6E3EA; --t6: #55499B; --t6s: #E7E5F4;
  }
  /* 숲 · 연둣 종이에 짙은 초록 */
  [data-tone="forest"] {
    --bg: #F2F5EC; --panel: #FFFFFF; --ink: #1D241B; --ink-soft: #5A6455;
    --brand: #2F6B3C; --brand-dark: #22522D; --brand-soft: #E2EFE2;
    --line: #D6DECC; --line-soft: #E8EEE0; --hard: #1D241B;
    --warn-bg: #F7F2E0; --warn-line: #DFD6B4; --warn-ink: #63541F;
    --ok-bg: #E7F2E7; --ok-line: #C4DCC4; --ok-ink: #2E5537; --pin-bg: #EFF1D6;
    --t1: #2F6B3C; --t1s: #E0EFDF; --t2: #2F5F86; --t2s: #E2EDF5;
    --t3: #75620F; --t3s: #F5EFD8; --t4: #8A4E22; --t4s: #F6E7DA;
    --t5: #8A3D5E; --t5s: #F6E1EA; --t6: #4A4478; --t6s: #E8E5F3;

      --brand: #4FC5B7; --brand-dark: #35A99C; --brand-soft: #1B3330;
      --line: #2C3034; --line-soft: #24282B; --hard: #08090A;
      --warn-bg: #33290F; --warn-line: #5A4715; --warn-ink: #F0D78F;
      --ok-bg: #103021; --ok-line: #1E5C3C; --ok-ink: #97E0BB; --pin-bg: #3A2F12;
      --t1: #86D0A6; --t1s: #17301F; --t2: #8AB4F8; --t2s: #1E2A3D;

      --t5: #EC93B8; --t5s: #331F29; --t6: #A99BF0; --t6s: #26224A;
    }

      --brand: #E08A7C; --brand-dark: #C4705F; --brand-soft: #3A2B26;

      a.addEventListener("timeupdate", back);
      try { a.currentTime = 1e101; } catch (e) { a.removeEventListener("timeupdate", back); }
    }
    a.addEventListener("loadedmetadata", tryFix);
    if (a.readyState > 0) tryFix();
  }

  /* 녹음은 «우리 재생기» 를 먼저 쓴다. 길이를 고쳐 줄 수 있고, 좁은 화면에서 안 잘린다.
     드라이브가 파일을 안 내주면 그때 드라이브 재생기로 물러선다 (사진과 같은 방식). */
  function audioBlock(b) {
    var box = el("div");
    box.style.marginBottom = "18px";
    var a = el("audio", "audioplayer");
    a.controls = true; a.preload = "metadata"; a.src = driveMedia(b.f);
    fixAudioDuration(a);
    a.onerror = function () {
      var f = el("iframe", "player audio");
      f.src = drivePreview(b.f);
      f.setAttribute("allow", "autoplay");
      f.setAttribute("loading", "lazy");
      f.setAttribute("title", b.c || b.n || "녹음");
      a.replaceWith(f);
    };
    box.appendChild(a);
    var open = el("a", "imgfall", "드라이브에서 열어 보기");
    open.href = driveOpen(b.f); open.target = "_blank"; open.rel = "noopener noreferrer";
    box.appendChild(open);
    var cap0 = [b.c, b.n].filter(Boolean).join(" · ");
    if (cap0) box.appendChild(el("figcaption", null, cap0));
    return box;
  }

  function mediaBlock(b, kind) {
    if (kind === "audio") return audioBlock(b);
    var box = el("div");
    var f = el("iframe", "player " + kind);
    f.src = drivePreview(b.f);
    f.setAttribute("allow", "autoplay");
    f.setAttribute("allowfullscreen", "");
    f.setAttribute("loading", "lazy");
    f.setAttribute("title", b.c || b.n || (kind === "video" ? "영상" : "녹음"));
    box.appendChild(f);
    var cap = [b.c, b.n].filter(Boolean).join(" · ");
    if (cap) box.appendChild(el("figcaption", null, cap));
    box.style.marginBottom = "18px";
    return box;
  }
  function fileBlock(b) {
    var a = el("a", "fileline", "📎 " + (b.c || b.n || "파일") + (b.s ? "  ·  " + humanSize(b.s) : ""));
    a.href = driveOpen(b.f); a.target = "_blank"; a.rel = "noopener noreferrer";
    return a;
  }
  function linkBlock(b) {
    var a = el("a", "linkcard");
    a.href = b.u; a.target = "_blank"; a.rel = "noopener noreferrer";
    a.appendChild(el("b", null, b.l || b.u));
    var host = "";
    try { host = new URL(b.u).hostname.replace(/^www\./, ""); } catch (e) { host = b.u; }
    a.appendChild(el("span", null, host));
    return a;
  }

  function render(p) {
    if (p.th) { document.documentElement.setAttribute("data-theme", p.th); loadFont(p.th); }
    if (p.tn) document.documentElement.setAttribute("data-tone", p.tn);
    document.title = (p.t || "기록") + " · 개인지식운영체계";

    var w = document.getElementById("wrap");
    w.innerHTML = "";
    /* ⚠️ 이 다섯은 앱 쪽 buildSharePacket 과 «짝» 이다. 한쪽을 고치면 다른 쪽도 고쳐야 한다.
       보내는 쪽에만 담고 여기서 안 그리면, 받는 사람에게는 표가 통째로 없는 쪽이 간다.
       ★ 받는 쪽에서는 체크가 «읽는 것» 이다 · 누를 수 없게 둔다. 남의 기록이다. */
    function todoBlock(b) {
      var ul = el("ul", "todolist");
      (b.i || []).forEach(function (it) {
        var li = el("li", it.c ? "done" : null);
        li.appendChild(el("span", "chk", it.c ? "☑" : "☐"));
        li.appendChild(el("span", "t", it.x || ""));
        ul.appendChild(li);
      });
      return ul.children.length ? ul : null;
    }
    function listBlock(b) {
      var box = el(b.o ? "ol" : "ul", "bullets");
      (b.i || []).forEach(function (it) {
        var li = el("li", "d" + Math.max(0, Math.min(2, it.d || 0)), it.x || "");
        box.appendChild(li);
      });
      return box.children.length ? box : null;
    }
    function codeBlock(b) {
      var pre = el("pre", "codeblock");
      pre.appendChild(el("code", null, b.x || ""));
      if (b.g) pre.appendChild(el("span", "codelang", b.g));
      return pre;
    }
    function tableBlock(b) {
      var wrap = el("div", "tscroll");
      var t = el("table", "shown");
      if ((b.h || []).some(function (x) { return x && String(x).trim(); })) {
        var hr = el("tr");
        (b.h || []).forEach(function (x) { hr.appendChild(el("th", null, x || "")); });
        t.appendChild(hr);
      }
      (b.r || []).forEach(function (r) {
        var tr = el("tr");
        (r || []).forEach(function (c) { tr.appendChild(el("td", null, c || "")); });
        t.appendChild(tr);
      });
      if (!t.children.length) return null;
      wrap.appendChild(t);
      return wrap;
    }
    function foldBlock(b) {
      var d = el("details", "foldbox");
      if (b.o) d.open = true;
      d.appendChild(el("summary", null, b.t || "펼쳐 보기"));
      d.appendChild(el("div", "foldbody", b.x || ""));
      return d;
    }

    var paper = el("div", "paper");

    var meta = el("div", "meta");
    if (p.d) meta.appendChild(el("span", null, fmtDate(p.d)));
    (p.g || []).forEach(function (t) { meta.appendChild(el("span", "tag", "#" + t)); });
    paper.appendChild(meta);
    paper.appendChild(el("h1", null, p.t || "(제목 없음)"));

    (p.b || []).forEach(function (b) {
      var node = null;
      if (b.k === "text") node = el("p", null, b.x || "");
      else if (b.k === "heading") node = el("h2", null, b.x || "");
      else if (b.k === "quote") {
        // r · 출처 갈래(mine·source·ai) · s · 출처. AI 답변은 접혀서 열린다
        var QR = { mine: "💭 내 생각", source: "📚 자료 인용", ai: "🤖 AI 답변" };
        if (b.r === "ai") {
          node = el("details", "aibox");
          node.appendChild(el("summary", null, "🤖 AI 답변" + (b.s ? " · " + b.s : "") + " · 눌러서 펼치기"));
          var qb = el("blockquote"); qb.textContent = b.x || ""; node.appendChild(qb);
        } else {
          node = el("blockquote", b.r ? "r" + b.r : null);
          if (b.r && QR[b.r]) node.appendChild(el("span", "qtag", QR[b.r] + (b.s ? " · " + b.s : "")));
          node.appendChild(document.createTextNode(b.x || ""));
        }
      }
      else if (b.k === "todo") node = todoBlock(b);
      else if (b.k === "list") node = listBlock(b);
      else if (b.k === "code") node = codeBlock(b);
      else if (b.k === "table") node = tableBlock(b);
      else if (b.k === "fold") node = foldBlock(b);
      else if (b.k === "divider") node = el("hr");
      else if (b.k === "image") node = imageBlock(b);
      else if (b.k === "video") node = mediaBlock(b, "video");
      else if (b.k === "audio") node = mediaBlock(b, "audio");
      else if (b.k === "file") node = fileBlock(b);
      else if (b.k === "link") node = linkBlock(b);
      if (node) paper.appendChild(node);
    });

    w.appendChild(paper);

    /* ⚠️ 여기에 «개인지식운영체계이란?» 링크를 두었었다. 그 링크가 이 사본이 어디에 있는지를
       받는 사람에게 그대로 알려 준다. 이 앱은 구글 심사 전이라 로그인이 «평생 100명» 한도고,
       주소가 퍼지면 그 자리는 되돌릴 수 없다. 기록 하나를 보여 주자고 걸 만한 것이 아니다.
       그래서 링크는 두지 않는다. 무엇으로 만든 쪽인지만 적는다. */
    var foot = el("div", "foot");
    foot.appendChild(document.createTextNode("「개인지식운영체계」로 만든 쪽입니다. 보낸 사람이 공유를 끄면 더 열리지 않습니다."));
    w.appendChild(foot);
  }

  function boot() {
  var raw = location.hash.replace(/^#/, "");
  if (raw.indexOf("d=") === 0) raw = raw.slice(2);
  if (!raw) {
    oops("보여 줄 기록이 없습니다.", "링크가 잘린 것 같습니다. 보낸 사람에게 주소 전체를 다시 받아 주세요. (# 뒤가 길어서 잘리는 일이 있습니다)");
    return;
  }
  decodePacket(raw)
    .then(function (json) { return JSON.parse(json); })
    .then(function (p) {
      if (!p || typeof p !== "object") throw new Error("모양이 맞지 않습니다");
      render(p);
    })
    .catch(function (e) {
      oops("기록을 펴지 못했습니다.", (e && e.message ? e.message : "링크가 잘렸거나 손상된 것 같습니다.") +
        "\n보낸 사람에게 주소 전체를 다시 받아 주세요.");
    });
  }
  /* 주소의 # 만 바뀌면 브라우저는 쪽을 다시 읽지 않는다.
     링크 두 개를 이어서 열면 앞의 기록이 그대로 남아, 엉뚱한 것을 보게 된다. */
  window.addEventListener("hashchange", boot);
  boot();
})();
</script>
</body>
</html>

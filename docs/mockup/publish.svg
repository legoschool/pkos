<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="760" viewBox="0 0 1160 760" role="img" aria-label="공개할 내용만 따로 만듭니다 화면 설계 목업"><title>공개할 내용만 따로 만듭니다</title><style>text{font-family:Arial,'Malgun Gothic',sans-serif}</style><rect x="0" y="0" width="1160" height="760" rx="0" fill="#f6f6ef" stroke="none"/><rect x="0" y="0" width="216" height="760" rx="0" fill="#edf1e7" stroke="none"/><text x="26" y="55" font-size="22" fill="#234837" font-weight="700">지식운영체계</text><text x="26" y="81" font-size="12" fill="#627161" font-weight="400">내가 해온 일, 다음에 할 일</text><text x="28" y="146" font-size="15" fill="#536753" font-weight="400">작업실</text><text x="28" y="200" font-size="15" fill="#536753" font-weight="400">자료 모으기</text><text x="28" y="254" font-size="15" fill="#536753" font-weight="400">사업과 활동</text><text x="28" y="308" font-size="15" fill="#536753" font-weight="400">읽고 기록하기</text><text x="28" y="362" font-size="15" fill="#536753" font-weight="400">자료 연결</text><text x="28" y="416" font-size="15" fill="#536753" font-weight="400">AI와 읽기</text><rect x="16" y="442" width="183" height="44" rx="8" fill="#28583f" stroke="none"/><text x="28" y="470" font-size="15" fill="#fff" font-weight="700">공개 준비</text><text x="28" y="524" font-size="15" fill="#536753" font-weight="400">기능과 저장 상태</text><text x="26" y="685" font-size="13" fill="#647462" font-weight="400">화면 설계 목업</text><text x="26" y="709" font-size="12" fill="#647462" font-weight="400">모든 자료는 가상 예시</text><text x="250" y="54" font-size="13" fill="#657362" font-weight="400">교사 경험 기록 / 공개 준비</text><text x="250" y="104" font-size="28" fill="#233e33" font-weight="700">공개할 내용만 따로 만듭니다</text><text x="250" y="138" font-size="15" fill="#657362" font-weight="400">근거·개인정보·공개 범위를 확인한 버전에 승인을 붙입니다.</text><rect x="250" y="170" width="390" height="355" rx="12" fill="#fff" stroke="#dce3d7"/><text x="275" y="213" font-size="20" fill="#294936" font-weight="700">공개 범위 예시</text><text x="277" y="260" font-size="17" fill="#233e33" font-weight="400">선택  가상 사업 소개</text><text x="277" y="305" font-size="17" fill="#233e33" font-weight="400">선택 전  내 회고</text><text x="277" y="350" font-size="17" fill="#233e33" font-weight="400">제외  원본 첨부와 내부 위치</text><text x="277" y="395" font-size="17" fill="#233e33" font-weight="400">별도 확인  참여자 이름</text><rect x="275" y="444" width="220" height="42" rx="7" fill="#28583f" stroke="none"/><text x="291" y="472" font-size="15" fill="#fff" font-weight="400">가상 공개본 미리 보기</text><rect x="664" y="170" width="452" height="355" rx="12" fill="#fff" stroke="#dce3d7"/><text x="688" y="213" font-size="20" fill="#294936" font-weight="700">공개본 미리보기</text><rect x="688" y="240" width="130" height="28" rx="14" fill="#edf1e6" stroke="none"/><text x="700" y="259" font-size="12" fill="#526b50" font-weight="400">게시하지 않은 목업</text><text x="688" y="310" font-size="21" fill="#294936" font-weight="700">드론 수업에서 역할을 나눈 과정</text><text x="688" y="349" font-size="15" fill="#233e33" font-weight="400">가상 사례의 공개 소개 문장입니다.</text><text x="688" y="431" font-size="13" fill="#687462" font-weight="400">선택을 바꿔도 인터넷에 게시되지 않습니다.</text><rect x="250" y="549" width="866" height="137" rx="12" fill="#fff" stroke="#dce3d7"/><text x="275" y="588" font-size="20" fill="#294936" font-weight="700">승인은 내용 버전에 붙입니다</text><text x="275" y="626" font-size="16" fill="#233e33" font-weight="400">비공개 작성  →  근거 확인  →  개인정보 확인  →  관리자 승인  →  승인본 생성</text><text x="275" y="658" font-size="13" fill="#687462" font-weight="400">관리자 인증과 실제 승인 운영은 아직 설계 단계입니다.</text><text x="250" y="733" font-size="13" fill="#627161" font-weight="400">실제 저장·전송·승인·게시를 실행하지 않는 공개 목업입니다.</text></svg>

·양방향 동기화"},{"id":"personal-reading-export","name":"개인 서재 · 읽기용 웹문서","stage":"온라인 배포 · 로컬 검증","screen":"publish","purpose":"직접 고른 기록과 첨부를 다른 사람이 읽을 수 있는 오프라인 웹문서로 만듭니다.","available":"기록 선택·첨부 개별 선택·분류 정보 선택·미리보기·ZIP·목차·내부 링크·원본 바이트·모바일","remaining":"온라인 게시·계정별 접근 제한·배포본 갱신과 철회"}]};
const routes={home:'작업실',collect:'자료 모으기',projects:'사업과 활동',record:'읽고 기록하기',map:'자료 연결',ai:'AI와 읽기',publish:'공개 준비',status:'기능과 저장 상태'};
const $=s=>document.querySelector(s),esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const draft={note:'다음 수업에서는 촬영 전에 학생들이 지도를 먼저 그려 보게 하고 싶다. (가상 회고)',withNote:false,confirmed:false,answer:false};

const activity=(title,detail,tag='가상 수업')=>`<div class="row"><div>${badge(tag)}<h3>${title}</h3><div class="source">${detail}</div></div>${button('record','열기')}</div>`;
function home(){return head('어떤 경험을 다시 꺼내 볼까요?','자료를 찾고, 그때의 선택을 읽고, 다음에 바꿀 점을 남깁니다.','화면 흐름 시연')+`<section class="card hero"><span class="badge">이어 읽을 사업</span><h2>드론으로 우리 학교 지도 만들기</h2><p>한 사업 안에 수업 계획, 두 차례의 활동, 도구를 바꾼 이유를 모았습니다.</p><div class="actions">${button('projects','사업 기록 이어 보기',true)}${button('collect','자료부터 찾기')}</div></section><div class="grid three"><div class="card"><h3>흩어진 자료 모으기</h3><p class="muted">원래 위치와 읽은 범위를 확인합니다.</p>${button('collect','출처 목록 보기')}</div><div class="card"><h3>내 생각 남기기</h3><p class="muted">당시 글과 지금의 회고를 구분합니다.</p>${button('record','기록 화면 보기')}</div><div class="card"><h3>공개할 내용 고르기</h3><p class="muted">근거와 개인정보를 확인한 버전만 준비합니다.</p>${button('publish','공개 흐름 보기')}</div></div><section class="card"><h2>최근 활동</h2>${activity('첫 비행에서 촬영 높이를 조정하다','가상 학교 · 1차시 · 강의안과 활동 기록')}${activity('두 번째 수업에서 역할을 나누다','가상 학교 · 2차시 · 당시 글과 현재 회고')}</section>`}
function collect(){return head('자료의 원래 위치부터','파일을 찾은 것과 실제 내 활동을 확인한 것은 구분합니다.','가져오기 로컬 검증 · 외부 수집 준비')+`<section class="card"><label>찾고 싶은 주제<input id="topic" value="드론" placeholder="예: 드론, 자료개발"></label><button id="find-topic" class="primary">가상 자료 목록 보기</button><p id="topic-result" class="muted">샘플 목록은 드론 관련 가상 자료로 고정돼 있습니다.</p></section><section class="card"><h2>출처별 확인 상태</h2><div class="row"><div><h3>수업 계획서.pdf</h3><p class="source">PC · 원본 위치를 별도로 보관</p></div>${badge('본문 확인 예시')}</div><div class="row"><div><h3>첫 드론 수업을 마치고</h3><p class="source">블로그 · 작성일과 활동일을 구분</p></div>${badge('원문 연결 예시')}</div><div class="row"><div><h3>수업 촬영 영상</h3><p class="source">유튜브 · 영상 시각을 근거로 연결할 계획</p></div>${badge('수집 미완료',true)}</div><div class="row"><div><h3>사업 협의 메모</h3><p class="source">노션 · 연결과 접근 범위 확인 필요</p></div>${badge('연결 전',true)}</div></section><section class="card"><h2>같아 보여도 먼저 비교합니다</h2><p>같은 파일 사본은 위치를 함께 남기고, 같은 사업의 다른 차시는 활동으로 나눕니다. 원본을 자동으로 지우지 않습니다.</p><div class="flow"><span>원본 위치 확인</span><span>사본과 해시 대조</span><span>본문 변환</span><span>중복·수정본 검토</span></div></section>`}
function projects(){return head('사업 하나, 여러 번의 활동','공문·강의안·회고를 연결하고 연도와 활동 종류로 다시 찾습니다.','사업 화면은 샘플 단계')+`<div class="toolbar"><select id="year" aria-label="연도"><option value="all">전체 연도</option><option value="year-a">예시 연도 A</option><option value="year-b">예시 연도 B</option></select><select id="kind" aria-label="활동 종류"><option value="all">전체 활동 종류</option><option value="lesson">수업·강의</option><option value="tf">TF팀</option><option value="book">저서</option><option value="content">자료개발</option><option value="cooperation">민간 협력</option><option value="community">지딜</option></select></div><div id="project-list"></div><section class="card"><h2>확인할 내용은 비워 둡니다</h2><p>계획서를 찾았다고 수업 완료를 확정하지 않습니다. 실제 날짜, 맡은 역할, 함께한 사람마다 근거를 붙입니다.</p><p class="muted">프로필은 승인한 활동을 고른 뒤 마지막에 만듭니다.</p></section>`}
function record(){return head('그때의 자료, 지금의 생각','원문을 확인하면서 회고와 수정할 사실을 따로 남깁니다.','기록·변환은 로컬 검증')+`<div class="grid"><section class="card"><h2>원문과 변환 본문</h2>${badge('가상 활동 기록')}<div class="quote">첫 수업에서는 조종에 시간이 오래 걸렸다. 다음 차시에는 조종과 관찰 역할을 나누고 비행 구역을 먼저 확인했다.</div><p class="source">예시 출처 · 활동 기록 1쪽<br>가상 문장, 실제 선생님의 경험이 아닙니다.</p><div class="row"><span>원본 보존</span>${badge('설계 예시')}</div><div class="row"><span>다시 변환한 내용</span><button id="compare">변경 비교 시연</button></div><div id="comparison" class="empty" hidden>예시 변경: 문단 순서를 원문과 맞춥니다. 실제 파일을 바꾸지 않습니다.</div></section><section class="card"><h2>지금 돌아보면</h2><label for="reflection">다음에는 무엇을 바꾸고 싶나요?</label><textarea id="reflection">${esc(draft.note)}</textarea><p class="muted">입력은 이번 탭에서만 유지됩니다. 새로고침하면 초기화되며 서버로 보내지 않습니다.</p><button id="save-note" class="primary">목업에 반영</button><label>사실을 확인할 부분</label><div class="empty">활동일과 글 작성일, 함께한 사람의 역할을 근거와 맞춥니다.</div><div class="actions" style="margin-top:18px">${button('map','함께 볼 자료')}${button('ai','이 자료로 AI에 질문')}</div></section></div>`}
function map(){return head('왜 함께 읽는지 남깁니다','직접 연결한 이유와 계산으로 찾은 후보를 구분합니다.','자료 연결 로컬 검증')+`<section class="card"><h2>계획에서 다음 수업까지</h2><svg class="map" viewBox="0 0 820 340" role="img" aria-label="가상 계획서, 첫 수업, 회고, 다음 수업의 연결"><g stroke="#93a989" stroke-width="2"><path d="M180 170L390 80L650 170L390 270L180 170" fill="none"/><path d="M390 80L390 270" stroke-dasharray="6 6"/></g>${[[180,170,'수업 계획'],[390,80,'첫 수업 기록'],[650,170,'지금의 회고'],[390,270,'다음 수업']].map(([x,y,t])=>`<g><rect x="${x-86}" y="${y-26}" width="172" height="52" rx="12" fill="white" stroke="#6f8e74"/><text x="${x}" y="${y+6}" text-anchor="middle" fill="#213c33">${t}</text></g>`).join('')}</svg><p class="muted">실선은 직접 연결, 점선은 비교할 후보를 표현한 가상 지도입니다.</p><button id="show-reason">연결 이유 읽기</button><div id="reason" class="quote" hidden>첫 수업에서 시간이 부족했던 장면을 다음 수업의 역할 분담과 함께 읽으려고 연결했습니다. (가상 이유)</div></section>${button('record','자료로 돌아가기')}`}
function ai(){return head('읽힐 자료를 먼저 고릅니다','자료 범위를 확인하고 답변을 따로 검토한 뒤 내 기록에 남깁니다.','요청 모의 검증 · 실제 호출 대기')+`<div class="grid"><section class="card"><h2>질문 준비</h2><div class="checks"><label class="check"><input type="checkbox" checked disabled>가상 수업 기록 본문</label><label class="check"><input id="include-note" type="checkbox" ${draft.withNote?'checked':''}>현재 회고도 포함하는 예시</label></div><label>물어볼 내용<textarea id="question">두 번째 수업에서 바꿔 볼 점을 근거와 함께 정리해 줘.</textarea></label><button id="prepare-ai" class="primary">보낼 범위 미리 보기</button><div id="ai-scope" class="empty" hidden></div></section><section class="card"><h2>답변은 검토한 뒤 사용합니다</h2><p>실제 AI에 전송하지 않습니다. 버튼은 근거 확인 과정을 보여 주는 가상 답변만 표시합니다.</p><button id="sample-answer">가상 답변 보기</button><div id="answer" hidden><div class="quote">가상 제안: 조종과 관찰 역할을 나눈 이유를 다음 수업 계획에 기록해 보세요.<br><small>근거 예시: 가상 활동 기록 1쪽</small></div><p class="muted">인용이 있다는 사실만으로 해석이 맞는 것은 아닙니다. 원문과 대조합니다.</p>${button('record','원문과 비교')}</div></section></div><section class="card"><h2>RAG는 아직 설계 단계입니다</h2><p>질문과 관련된 내 기록을 찾고 쪽·문장·영상 시각으로 돌아가도록 구성합니다. 개인 기록과 공개 기록의 검색 범위를 분리합니다.</p></section>`}
function publish(){return head('공개할 내용만 따로 만듭니다','근거·개인정보·공개 범위를 확인한 버전에 승인을 붙입니다.','공개본 로컬 검증 · 관리자 승인은 설계')+`<div class="grid"><section class="card"><h2>공개 범위 예시</h2><div class="checks"><label class="check"><input type="checkbox" checked disabled>가상 사업 소개</label><label class="check"><input id="public-note" type="checkbox">회고도 포함</label><label class="check"><input type="checkbox" disabled>원본 첨부 (이 목업에는 없음)</label><label class="check"><input type="checkbox" disabled>함께한 사람의 실명 (별도 확인 필요)</label></div><p class="muted">비공개 배경 메모와 원본 위치는 공개본에서 제외합니다.</p><button id="public-preview" class="primary">가상 공개본 미리 보기</button></section><section class="card"><h2>공개본 미리보기</h2><div id="publication" class="preview"><span class="badge planned">게시하지 않은 목업</span><h3>드론 수업에서 역할을 나눈 과정</h3><p>가상 사례의 공개 소개 문장입니다.</p><div id="public-reflection" hidden></div></div><p class="muted">선택을 바꿔도 인터넷에 게시되지 않습니다.</p></section></div><section class="card"><h2>승인은 내용 버전에 붙입니다</h2><div class="flow"><span>비공개 작성</span><span>근거 확인</span><span>개인정보 확인</span><span>관리자 승인</span><span>승인본 생성</span></div><p style="margin-top:16px">승인 뒤 글이나 첨부가 바뀌면 다시 검토합니다. 철회할 때는 본문과 이전 첨부 주소도 확인합니다.</p></section>`}
function status(){return head('지금 되는 일과 남은 일','PC 저장, 클라우드 반영, 다른 기기 수신은 서로 다른 확인입니다.','실제 운영과 목업을 구분')+`<section class="card"><h2>저장 상태를 나누어 봅니다</h2><div class="grid three"><div><h3>PC에 보관</h3><p>로컬 저장·백업 흐름 검증</p></div><div><h3>Drive에 반영</h3><p>실제 계정 확인 전</p></div><div><h3>다른 기기에 도착</h3><p>실기기 확인 전</p></div></div></section><section class="card"><h2>전체 기능 상태</h2><p class="muted">${esc(catalogue.scope)}</p><div class="table-wrap"><table><thead><tr><th>기능</th><th>현재 상태</th><th>아직 남은 일</th></tr></thead><tbody>${catalogue.features.map(f=>`<tr><td><button data-go="${f.screen}">${esc(f.name)}</button></td><td>${esc(f.stage)}</td><td>${esc(f.remaining)}</td></tr>`).join('')}</tbody></table></div></section>`}
function toast(text){$('#toast').textContent=text;$('#toast').hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').hidden=true,3500)}
function render(){const route=location.hash.slice(1)||'home',active=Object.hasOwn(routes,route)?route:'home';$('nav').innerHTML=Object.entries(routes).map(([id,t])=>`<button data-go="${id}" ${id===active?'aria-current="page"':''}>${t}</button>`).join('');$('#main').innerHTML=({home,collect,projects,record,map,ai,publish,status}[active])()+`<div class="footer"><a href="https://pkem-research-test.legoschool.chatgpt.site/library/" target="_blank" rel="noopener">실제 나의지식서재 열기</a> · <a href="https://pkem-research-test.legoschool.chatgpt.site/library/guide.html" target="_blank" rel="noopener">사용 안내</a><br>개인 서재 온라인 앱에는 Excel을 포함한 문서 추출·실제 기록 3D 지도·PC 폴더 자동 백업·연결 폴더의 새 파일 확인·선택 기록 웹문서 내보내기를 연결했습니다. 이 화면은 조작 예시입니다.<br>화면 설계 목업 · ${catalogue.updated} · <a href="https://github.com/legoschool/pkos/blob/main/docs/product/FEATURES.md">구현 상태와 남은 범위</a><br>가상 자료만 포함합니다. 실제 로그인·동기화·RAG·공개 승인을 실행하는 서비스가 아닙니다.</div>`;if(innerWidth<=720){const current=$('nav [aria-current]');$('nav').scrollLeft=current.offsetLeft-$('nav').offsetLeft;}document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{location.hash=b.dataset.go});
 if(active==='collect')$('#find-topic').onclick=()=>{$('#topic-result').textContent=`‘${$('#topic').value||'드론'}’ 검색 조작 예시입니다. 실제 파일을 검색하지 않으며 아래 가상 목록은 바뀌지 않습니다.`};
 if(active==='record'){$('#reflection').oninput=e=>draft.note=e.target.value;$('#save-note').onclick=()=>toast('목업에 반영했습니다. 새로고침하면 초기화됩니다.');$('#compare').onclick=()=>$('#comparison').hidden=!$('#comparison').hidden;}
 if(active==='projects'){const filter=()=>{const y=$('#year').value,k=$('#kind').value;const items=[{y:'year-a',k:'lesson',t:'드론으로 우리 학교 지도 만들기',d:'가상 학교 · 1차시와 2차시를 같은 사업으로 연결'},{y:'year-b',k:'tf',t:'드론 수업 자료 함께 만들기',d:'가상 기관 · 역할과 근거를 확인할 후보'}].filter(x=>(y==='all'||x.y===y)&&(k==='all'||x.k===k));$('#project-list').innerHTML=items.length?items.map(x=>`<section class="card">${activity(x.t,x.d,x.k==='tf'?'가상 TF팀':'가상 수업')}</section>`).join(''):'<div class="empty">이 종류의 가상 예시는 아직 없습니다. 실적을 만들어 채우지 않습니다.</div>';$('#project-list').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>location.hash=b.dataset.go)};$('#year').onchange=filter;$('#kind').onchange=filter;filter();}
 if(active==='map')$('#show-reason').onclick=()=>$('#reason').hidden=!$('#reason').hidden;
 if(active==='ai'){$('#include-note').onchange=e=>draft.withNote=e.target.checked;$('#prepare-ai').onclick=()=>{$('#ai-scope').hidden=false;$('#ai-scope').textContent='시연 범위: 가상 본문'+(draft.withNote?' + 현재 회고':'')+'. 원본과 비공개 배경 메모 제외. 실제 전송 없음.'};$('#sample-answer').onclick=()=>$('#answer').hidden=false;}
 if(active==='publish')$('#public-preview').onclick=()=>{$('#public-reflection').hidden=!$('#public-note').checked;$('#public-reflection').textContent=draft.note;toast('가상 미리보기만 바꿨습니다. 게시하지 않았습니다.')};
}window.addEventListener('hashchange',()=>{render();$('#main').focus()});render();
</script></body></html>

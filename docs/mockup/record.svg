<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="760" viewBox="0 0 1160 760" role="img" aria-label="그때의 자료, 지금의 생각 화면 설계 목업"><title>그때의 자료, 지금의 생각</title><style>text{font-family:Arial,'Malgun Gothic',sans-serif}</style><rect x="0" y="0" width="1160" height="760" rx="0" fill="#f6f6ef" stroke="none"/><rect x="0" y="0" width="216" height="760" rx="0" fill="#edf1e7" stroke="none"/><text x="26" y="55" font-size="22" fill="#234837" font-weight="700">나의지식서재</text><text x="26" y="81" font-size="12" fill="#627161" font-weight="400">내가 해온 일, 다음에 할 일</text><text x="28" y="146" font-size="15" fill="#536753" font-weight="400">작업실</text><text x="28" y="200" font-size="15" fill="#536753" font-weight="400">자료 모으기</text><text x="28" y="254" font-size="15" fill="#536753" font-weight="400">사업과 활동</text><rect x="16" y="280" width="183" height="44" rx="8" fill="#28583f" stroke="none"/><text x="28" y="308" font-size="15" fill="#fff" font-weight="700">읽고 기록하기</text><text x="28" y="362" font-size="15" fill="#536753" font-weight="400">자료 연결</text><text x="28" y="416" font-size="15" fill="#536753" font-weight="400">AI와 읽기</text><text x="28" y="470" font-size="15" fill="#536753" font-weight="400">공개 준비</text><text x="28" y="524" font-size="15" fill="#536753" font-weight="400">기능과 저장 상태</text><text x="26" y="685" font-size="13" fill="#647462" font-weight="400">화면 설계 목업</text><text x="26" y="709" font-size="12" fill="#647462" font-weight="400">모든 자료는 가상 예시</text><text x="250" y="54" font-size="13" fill="#657362" font-weight="400">교사 경험 기록 / 읽고 기록하기</text><text x="250" y="104" font-size="28" fill="#233e33" font-weight="700">그때의 자료, 지금의 생각</text><text x="250" y="138" font-size="15" fill="#657362" font-weight="400">원문을 확인하면서 회고와 수정할 사실을 따로 남깁니다.</text><rect x="250" y="170" width="420" height="516" rx="12" fill="#fff" stroke="#dce3d7"/><rect x="691" y="170" width="425" height="516" rx="12" fill="#fff" stroke="#dce3d7"/><text x="275" y="211" font-size="20" fill="#294936" font-weight="700">원문과 변환 본문</text><rect x="275" y="228" width="130" height="28" rx="14" fill="#edf1e6" stroke="none"/><text x="287" y="247" font-size="12" fill="#526b50" font-weight="400">가상 활동 기록</text><rect x="275" y="278" width="369" height="167" rx="6" fill="#f3f6eb" stroke="none"/><text x="293" y="315" font-size="15" fill="#233e33" font-weight="400">첫 수업에서는 조종에 시간이 오래 걸렸다.</text><text x="293" y="348" font-size="15" fill="#233e33" font-weight="400">다음 차시에는 조종과 관찰 역할을 나누고</text><text x="293" y="381" font-size="15" fill="#233e33" font-weight="400">비행 구역을 먼저 확인했다.</text><text x="275" y="478" font-size="14" fill="#687462" font-weight="400">예시 출처 · 활동 기록 1쪽</text><text x="275" y="506" font-size="13" fill="#687462" font-weight="400">실제 선생님의 경험이 아닌 가상 문장입니다.</text><text x="275" y="565" font-size="15" fill="#233e33" font-weight="400">원본은 남기고 변환 결과를 비교합니다.</text><rect x="275" y="594" width="165" height="42" rx="12" fill="#fff" stroke="#dce3d7"/><text x="289" y="621" font-size="15" fill="#233e33" font-weight="400">변경 비교 시연</text><text x="715" y="211" font-size="20" fill="#294936" font-weight="700">지금 돌아보면</text><text x="715" y="254" font-size="16" fill="#233e33" font-weight="400">다음에는 무엇을 바꾸고 싶나요?</text><rect x="715" y="273" width="376" height="157" rx="6" fill="#fff" stroke="#b3c3b0"/><text x="731" y="311" font-size="15" fill="#233e33" font-weight="400">촬영 전에 학생들이 지도를 먼저 그려</text><text x="731" y="340" font-size="15" fill="#233e33" font-weight="400">보게 하고 싶다. (가상 회고)</text><text x="715" y="466" font-size="13" fill="#687462" font-weight="400">목업 입력은 서버로 보내지 않습니다.</text><rect x="715" y="490" width="158" height="42" rx="7" fill="#28583f" stroke="none"/><text x="731" y="518" font-size="15" fill="#fff" font-weight="400">목업에 반영</text><text x="715" y="582" font-size="16" fill="#233e33" font-weight="400">함께 볼 자료와 연결 이유</text><text x="715" y="615" font-size="14" fill="#687462" font-weight="400">계획 → 첫 수업 → 회고 → 다음 수업</text><text x="250" y="733" font-size="13" fill="#627161" font-weight="400">실제 저장·전송·승인·게시를 실행하지 않는 공개 목업입니다.</text></svg>

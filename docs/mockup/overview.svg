<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="760" viewBox="0 0 1160 760" role="img" aria-label="어떤 경험을 다시 꺼내 볼까요? 화면 설계 목업"><title>어떤 경험을 다시 꺼내 볼까요?</title><style>text{font-family:Arial,'Malgun Gothic',sans-serif}</style><rect x="0" y="0" width="1160" height="760" rx="0" fill="#f6f6ef" stroke="none"/><rect x="0" y="0" width="216" height="760" rx="0" fill="#edf1e7" stroke="none"/><text x="26" y="55" font-size="22" fill="#234837" font-weight="700">나의지식서재</text><text x="26" y="81" font-size="12" fill="#627161" font-weight="400">내가 해온 일, 다음에 할 일</text><rect x="16" y="118" width="183" height="44" rx="8" fill="#28583f" stroke="none"/><text x="28" y="146" font-size="15" fill="#fff" font-weight="700">작업실</text><text x="28" y="200" font-size="15" fill="#536753" font-weight="400">자료 모으기</text><text x="28" y="254" font-size="15" fill="#536753" font-weight="400">사업과 활동</text><text x="28" y="308" font-size="15" fill="#536753" font-weight="400">읽고 기록하기</text><text x="28" y="362" font-size="15" fill="#536753" font-weight="400">자료 연결</text><text x="28" y="416" font-size="15" fill="#536753" font-weight="400">AI와 읽기</text><text x="28" y="470" font-size="15" fill="#536753" font-weight="400">공개 준비</text><text x="28" y="524" font-size="15" fill="#536753" font-weight="400">기능과 저장 상태</text><text x="26" y="685" font-size="13" fill="#647462" font-weight="400">화면 설계 목업</text><text x="26" y="709" font-size="12" fill="#647462" font-weight="400">모든 자료는 가상 예시</text><text x="250" y="54" font-size="13" fill="#657362" font-weight="400">교사 경험 기록 / 작업실</text><text x="250" y="104" font-size="28" fill="#233e33" font-weight="700">어떤 경험을 다시 꺼내 볼까요?</text><text x="250" y="138" font-size="15" fill="#657362" font-weight="400">자료를 찾고, 그때의 선택을 읽고, 다음에 바꿀 점을 남깁니다.</text><rect x="250" y="170" width="866" height="185" rx="12" fill="#e7eddf" stroke="none"/><rect x="277" y="192" width="130" height="28" rx="14" fill="#edf1e6" stroke="none"/><text x="289" y="211" font-size="12" fill="#526b50" font-weight="400">이어 읽을 사업</text><text x="278" y="260" font-size="25" fill="#264534" font-weight="700">드론으로 우리 학교 지도 만들기</text><text x="278" y="292" font-size="16" fill="#5b6f57" font-weight="400">계획, 두 차례의 활동, 도구를 바꾼 이유를 한곳에 모았습니다.</text><rect x="278" y="307" width="195" height="34" rx="7" fill="#28583f" stroke="none"/><text x="291" y="330" font-size="15" fill="#fff" font-weight="400">사업 기록 이어 보기</text><rect x="250" y="377" width="274" height="120" rx="12" fill="#fff" stroke="#dce3d7"/><text x="273" y="414" font-size="18" fill="#294936" font-weight="700">흩어진 자료 모으기</text><text x="273" y="446" font-size="14" fill="#697663" font-weight="400">원래 위치와 읽은 범위</text><rect x="546" y="377" width="274" height="120" rx="12" fill="#fff" stroke="#dce3d7"/><text x="569" y="414" font-size="18" fill="#294936" font-weight="700">내 생각 남기기</text><text x="569" y="446" font-size="14" fill="#697663" font-weight="400">당시 글과 지금의 회고</text><rect x="842" y="377" width="274" height="120" rx="12" fill="#fff" stroke="#dce3d7"/><text x="865" y="414" font-size="18" fill="#294936" font-weight="700">공개할 내용 고르기</text><text x="865" y="446" font-size="14" fill="#697663" font-weight="400">확인한 버전만 준비</text><rect x="250" y="520" width="866" height="174" rx="12" fill="#fff" stroke="#dce3d7"/><text x="275" y="554" font-size="20" fill="#294936" font-weight="700">최근 활동</text><text x="275" y="596" font-size="17" fill="#233e33" font-weight="400">첫 비행에서 촬영 높이를 조정하다</text><text x="275" y="620" font-size="13" fill="#697663" font-weight="400">가상 학교 · 1차시 · 강의안과 활동 기록</text><text x="275" y="660" font-size="17" fill="#233e33" font-weight="400">두 번째 수업에서 역할을 나누다</text><rect x="916" y="575" width="130" height="28" rx="14" fill="#edf1e6" stroke="none"/><text x="928" y="594" font-size="12" fill="#526b50" font-weight="400">가상 수업</text><text x="250" y="733" font-size="13" fill="#627161" font-weight="400">실제 저장·전송·승인·게시를 실행하지 않는 공개 목업입니다.</text></svg>
